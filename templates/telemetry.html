<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetry · Site AUS-1</title>
<style>
__SITENAV_CSS__
:root { --ink:#1e2933; --muted:#5b6774; --line:#d5dbe2; --bg:#ffffff; --panel:#f5f7f9; --it:#1f5fbf; --ok:#1b7a3d; --bad:#b42318; --warn:#9a6700;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#8a5cc4; --grid:#eef1f4; --none:#d9dee4; --dark:#2b3440; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.5 "Inter","Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:#eef1f4; }
header.top { background:#fff; border-bottom:1px solid var(--line); padding:12px 24px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
header.top strong { font-size:16px; }
.wrap { display:grid; grid-template-columns:260px minmax(0,1fr); gap:16px; max-width:1400px; margin:16px auto; padding:0 16px; align-items:start; }
nav.tree { background:#fff; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:8px 0; position:sticky; top:8px; max-height:calc(100vh - 16px); overflow:auto; font-size:14px; }
nav.tree ul { list-style:none; margin:0; padding:0; }
nav.tree li ul { padding-left:14px; }
nav.tree a { display:block; padding:3px 12px; color:var(--ink); text-decoration:none; border-left:3px solid transparent; }
nav.tree a:hover { background:var(--panel); }
nav.tree a.on { background:#e8f0fc; color:var(--it); font-weight:600; border-left-color:var(--it); }
nav.tree a small { color:var(--muted); margin-left:4px; font-weight:400; }
nav.tree details > summary { cursor:pointer; padding:3px 12px; list-style:none; }
nav.tree details > summary::-webkit-details-marker { display:none; }
nav.tree details > summary::before { content:"▸"; display:inline-block; width:14px; color:var(--muted); }
nav.tree details[open] > summary::before { content:"▾"; }
nav.tree details > summary a { display:inline; padding:0; border:0; }
nav.tree ul.racks { display:grid; grid-template-columns:repeat(4,1fr); padding-left:14px; }
nav.tree ul.racks a { padding:2px 6px; font-variant-numeric:tabular-nums; }
nav.tree .sec { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:12px 12px 2px; font-weight:600; }
nav.tree ul.fam { display:flex; flex-wrap:wrap; gap:4px; padding:0 12px 4px; }
nav.tree ul.fam a, nav.tree ul.fam .planned { display:inline-block; font-size:13px; padding:2px 10px; border:1px solid var(--line); border-radius:14px; }
nav.tree ul.fam a.on { border-color:#bfd3f2; }
nav.tree ul.fam .planned { border-style:dashed; color:var(--muted); }
nav.tree .planned { color:var(--muted); cursor:default; } nav.tree .planned small { font-size:11px; margin-left:4px; }
nav.tree li > .planned { display:block; padding:3px 12px; }
nav.tree .famsec.off { display:none; }
main { background:var(--bg); padding:22px 28px; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); min-width:0; }
h1 { font-size:24px; margin:0 0 2px; }
.kind { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
.sub { color:var(--muted); margin:0 0 10px; } .note { font-size:13px; color:var(--muted); }
h2.sec { font-size:16px; margin:22px 0 6px; padding-bottom:3px; border-bottom:2px solid var(--ink); }
h3 { font-size:14px; margin:14px 0 6px; }
table { border-collapse:collapse; width:100%; font-size:14px; }
th { text-align:left; color:var(--muted); font-weight:600; padding:4px 10px 4px 0; vertical-align:top; border-bottom:1px solid var(--line); white-space:nowrap; }
td { padding:4px 10px 4px 0; vertical-align:top; border-top:1px solid #edf0f3; }
td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
main a { color:var(--it); }
code { font-size:13px; background:var(--panel); padding:0 4px; border-radius:3px; }
.tag { display:inline-block; font-size:12px; font-weight:600; padding:1px 8px; border-radius:10px; background:var(--panel); border:1px solid var(--line); white-space:nowrap; }
.tag.ok { color:var(--ok); border-color:#b7dfc4; background:#eef8f1; } .tag.bad { color:var(--bad); border-color:#f3c1bc; background:#fdf1f0; }
.tag.warn { color:var(--warn); border-color:#ecd59a; background:#fdf8e8; } .tag.it { color:var(--it); border-color:#bfd3f2; background:#e8f0fc; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin:12px 0; }
.tile { background:var(--panel); border-radius:8px; padding:10px 12px; }
.tile .k { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
.tile .v { font-size:24px; font-weight:700; line-height:1.25; } .tile .s { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
.tile a { text-decoration:none; }
.hallname { font-size:13px; font-weight:600; color:var(--muted); margin:10px 0 2px; }
.btns { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0; }
.btns button, button.b, main a.b { font:inherit; font-size:13px; border:1px solid var(--line); background:#fff; color:var(--ink); padding:4px 10px; border-radius:6px; cursor:pointer; }
main a.b { display:inline-block; text-decoration:none; padding:2px 8px; white-space:nowrap; }
.ctiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; margin:8px 0 14px; }
main a.ctile { display:block; color:inherit; text-decoration:none; border:1px solid transparent; }
main a.ctile:hover { border-color:var(--it); }
.ctile .k { font-size:14px; text-transform:none; letter-spacing:0; color:var(--ink); font-weight:700; }
.ctile .k span { font-weight:400; font-size:12px; }
.ctile .spark { height:34px; margin:4px 0 6px; } .ctile .spark svg { display:block; }
.kv { display:flex; justify-content:space-between; gap:8px; font-size:12px; line-height:1.45; }
.kv span { color:var(--muted); } .kv b { font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
.kv .tag { font-size:11px; padding:0 6px; margin-left:4px; }
.ctl input[type=number] { font:inherit; font-size:13px; width:92px; padding:2px 6px; border:1px solid var(--line); border-radius:6px; }
.btns button.on { background:#e8f0fc; color:var(--it); border-color:#bfd3f2; font-weight:600; }
.scroll { overflow-x:auto; }
.hm { position:relative; }
.hmgrid { display:grid; grid-template-columns:44px minmax(0,1fr); min-width:720px; }
.hmlabels div { height:13px; font-size:11px; line-height:13px; text-align:right; padding-right:6px; color:var(--ink); white-space:nowrap; }
.hmlabels div.hh { font-weight:600; color:var(--muted); }
.hm svg { display:block; width:100%; cursor:pointer; }
.hmticks { position:relative; height:18px; font-size:11px; color:var(--muted); }
.hmticks span { position:absolute; top:2px; transform:translateX(-50%); white-space:nowrap; }
.hmticks i { position:absolute; top:0; height:4px; border-left:1px solid var(--line); }
.tip { position:absolute; pointer-events:none; background:#fff; border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.12); display:none; white-space:nowrap; z-index:5; }
.tip b { display:block; }
.ramp { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin:6px 0; }
.ramp i { display:inline-block; width:120px; height:10px; border-radius:2px; }
.ramp i.none { width:14px; background:var(--none); } .ramp i.dark { width:14px; background:var(--dark); }
.gg { display:grid; grid-template-columns:70px repeat(4,minmax(60px,1fr)); gap:3px; max-width:560px; font-size:12px; }
.gg .h { color:var(--muted); font-size:11px; text-align:center; }
.gg .t { color:var(--ink); text-align:right; padding-right:6px; line-height:24px; font-variant-numeric:tabular-nums; }
.gg button { position:relative; height:24px; border:0; border-radius:3px; font:inherit; font-size:12px; cursor:pointer; color:#fff; text-shadow:0 0 2px rgba(0,0,0,.5); font-variant-numeric:tabular-nums; }
.gg button.lt { color:var(--ink); text-shadow:none; } .gg button.no { background:var(--dark); color:#9aa6b2; }
.gg button.on { outline:2px solid var(--ink); outline-offset:-2px; }
.gg button i { position:absolute; top:3px; right:3px; width:7px; height:7px; border-radius:50%; border:1px solid #fff; }
.gg button i.x { background:var(--bad); } .gg button i.s { background:#f2b84b; right:12px; }
.chart { position:relative; margin:4px 0 10px; } .chart svg { display:block; max-width:100%; height:auto; }
.chart h3 { margin:10px 0 2px; }
svg text { font:11px "Inter","Segoe UI",Helvetica,Arial,sans-serif; fill:var(--muted); }
.legend { display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--muted); margin:2px 0 6px; }
.legend i { display:inline-block; width:12px; height:3px; margin-right:5px; vertical-align:3px; border-radius:2px; }
.legend i.dash { height:0; border-top:2px dashed var(--ink); } .legend i.band { height:12px; vertical-align:-2px; background:#e3e7ec; }
.legend i.dot { width:8px; height:8px; border-radius:50%; vertical-align:-1px; }
input[type=range] { width:100%; max-width:560px; margin:4px 0; }
.ctl { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin:6px 0; font-size:13px; }
.ctl label { color:var(--muted); }
pre.scrape { background:#1e2933; color:#dfe6ee; font:12px/1.45 ui-monospace,Menlo,Consolas,monospace; padding:12px 14px; border-radius:8px; overflow-x:auto; margin:6px 0; max-height:420px; }
pre.scrape .c { color:#8fa3b5; }
.finding { background:#fdf1f0; border-left:3px solid var(--bad); padding:6px 10px; border-radius:4px; margin:8px 0; font-size:14px; }
.err { background:#fdf8e8; border-left:3px solid var(--warn); padding:6px 10px; border-radius:4px; margin:8px 0; }
.muted { color:var(--muted); }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
.labels th { width:150px; }
@media (max-width:860px) { .wrap { grid-template-columns:1fr; } nav.tree { position:static; max-height:40vh; } main { padding:16px 14px; } .tiles { grid-template-columns:repeat(2,1fr); } }
@media print { nav.tree, header.top { display:none; } .wrap { display:block; } .tip { display:none !important; } }
</style>
</head>
<body>
__SITENAV__
<header class="top">
  <div><strong>Telemetry</strong> <span class="note" id="hdr"></span></div>
  <span class="note">One-minute samples: GPUs in the published format of NVIDIA's open-source DCGM exporter, CDUs in the DMTF Redfish schema for cooling units, power in the manufacturers' published SNMP and Modbus point maps</span>
</header>
<div class="wrap">
  <nav class="tree" id="tree" aria-label="Telemetry views"></nav>
  <main id="main" aria-live="polite"></main>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  const B = JSON.parse(document.getElementById("data").textContent);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const START = Date.parse(B.window.start), HOURS = B.hours, HOUR = 3600000, MIN = 60000;
  const md = iso => { const [y, m, d] = iso.slice(0, 10).split("-"); return `${MON[+m - 1]} ${+d}`; };
  const at = iso => `${md(iso)} ${iso.slice(11, 16)} UTC`;
  const hourIso = h => new Date(START + h * HOUR).toISOString();
  const hourAt = h => at(hourIso(h));
  const hourOf = iso => Math.floor((Date.parse(iso) - START) / HOUR);
  const minOf = iso => Math.floor((Date.parse(iso) - START) / MIN);
  const num = (x, d = 0) => x == null || Number.isNaN(x) ? "–" : esc(Number(x).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d}));
  const unrle = r => { const out = []; for (const [v, c] of r) for (let i = 0; i < c; i++) out.push(v); return out; };
  const tag = (txt, cls) => `<span class="tag ${esc(cls || "")}">${esc(txt)}</span>`;
  const link = (h, txt) => `<a href="#${esc(h)}">${esc(txt)}</a>`;
  const rackOf = host => host.slice(0, 3).toUpperCase();
  const RACK = Object.fromEntries(B.racks.map(r => [r.rack, r]));
  const HALLS = ["HALL-A", "HALL-B"];
  const EV_HOST = {};
  B.events.forEach(e => (EV_HOST[e.host] = EV_HOST[e.host] || []).push(e));
  const WIN_HOST = {};
  B.windows.forEach(w => (WIN_HOST[w.host] = WIN_HOST[w.host] || []).push(w));
  const FIND_HOST = {};
  B.findings.forEach(f => f.hosts.forEach(h => (FIND_HOST[h] = FIND_HOST[h] || []).push(f)));
  const RAMP = ["#e6eefb", "#cde2fb", "#86b6ef", "#3987e5", "#1c5cab", "#123b6f"];
  const main = document.getElementById("main");
  document.getElementById("hdr").textContent = `Site AUS-1 · ${md(B.window.start)} to ${md(B.window.end)}, ${B.gpus.toLocaleString("en-US")} GPUs`;

  // ------------------------------------------------------------- data loading
  const memo = new Map();
  function getJson(url) {
    if (!memo.has(url)) {
      const p = (async () => {
        const r = await fetch(url);
        if (!r || !r.ok) throw new Error(`could not load ${url}`);
        return r.json();
      })().catch(e => { memo.delete(url); throw e; });
      memo.set(url, p);
    }
    return memo.get(url);
  }
  const loadRacks = () => getJson("data/racks.json");
  const loadRack = rack => getJson(`data/gpu/${encodeURIComponent(rack)}.json`).then(g => {
    if (!g.decoded) { g.decoded = true; for (const x of g.gpus) { x.clockA = unrle(x.clock); x.nA = unrle(x.n); x.thA = unrle(x.thermal_s); x.pwA = unrle(x.power_s); x.sbeA = unrle(x.sbe); } }
    return g;
  });
  const loadWindow = w => getJson("data/" + w.file.split("/").map(encodeURIComponent).join("/")).then(d => {
    if (!d.decoded) { d.decoded = true; for (const x of d.gpus) for (const k of ["fb", "tensor", "thermal_s", "power_s", "sbe_total", "remap_corr", "remap_unc", "pending", "xid"]) x[k + "A"] = unrle(x[k]); }
    return d;
  });
  const errBox = (e, what) => `<div class="err">Could not load ${esc(what)} (${esc(e && e.message ? e.message : e)}). The page's data folder is written by scripts/render_telemetry.py; open the page from the built site.</div>`;

  // ------------------------------------------------------------------ colour
  function hex2rgb(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
  const RAMP_RGB = RAMP.map(hex2rgb);
  function ramp(t) {           // 0..1 -> colour on the sequential ramp, quantized to 24 steps so runs merge
    t = Math.max(0, Math.min(1, t));
    const q = Math.round(t * 23) / 23, p = q * (RAMP_RGB.length - 1), i = Math.min(RAMP_RGB.length - 2, Math.floor(p)), f = p - i;
    const c = RAMP_RGB[i].map((a, k) => Math.round(a + (RAMP_RGB[i + 1][k] - a) * f));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  const light = t => t < 0.45;

  // metric definitions: heatmap reads racks.json rows; the rack grid reads one GPU's hourly series
  const METRICS = [
    {k: "temp", label: "Peak GPU temperature", unit: "°C", d: 0, rack: (r, h) => r.temp[h], gpu: (x, h) => x.temp[h], lo: 40, hi: 90},
    {k: "util", label: "Mean utilization", unit: "%", d: 0, rack: (r, h) => r.util[h], gpu: (x, h) => x.util[h], lo: 0, hi: 100},
    {k: "kwh", label: "GPU power", unit: "kWh/h", d: 1, rack: (r, h) => r.gpus[h] ? r.kwh[h] : null, gpu: (x, h) => x.power[h], gunit: "W", gd: 0, lo: 0, hi: null},
    {k: "thermal", label: "Thermal slowdown", unit: "s", d: 0, rack: (r, h) => r.gpus[h] ? r.thermal_s[h] : null, gpu: (x, h) => x.nA[h] ? x.thA[h] : null, lo: 0, hi: null},
    {k: "cap", label: "Time at power limit", unit: "%", d: 1, rack: (r, h) => r.gpus[h] ? 100 * r.power_s[h] / (r.gpus[h] * 3600) : null, gpu: (x, h) => x.nA[h] ? 100 * x.pwA[h] / (x.nA[h] * 60) : null, lo: 0, hi: 100},
    {k: "clock", label: "SM clock (loaded)", unit: "MHz", d: 0, rack: null, gpu: (x, h) => x.nA[h] ? x.clockA[h] : null, lo: 300, hi: 2050},
  ];
  const METRIC = Object.fromEntries(METRICS.map(m => [m.k, m]));
  let hmMetric = "temp", gridMetric = "temp";

  // --------------------------------------------------------------------- tree
  function tree() {
    let h = `<div class="sec">Device family</div><ul class="fam"><li><a href="#gpus" data-fam="gpu">GPUs</a></li><li><a href="#cdus" data-fam="cdu">CDUs</a></li><li><a href="#power" data-fam="power">Power</a></li>`
      + C.planned.map(p => `<li><span class="planned" title="${esc(p)} telemetry: planned">${esc(p)} <small>planned</small></span></li>`).join("") + `</ul>`;
    h += `<div class="famsec" data-fam="gpu"><div class="sec">GPUs</div><ul><li>${link("gpus", "Overview")}</li>`;
    for (const hall of HALLS) {
      const H = B.halls[hall], rs = B.racks.filter(r => r.hall === hall);
      h += `<li><details open><summary>${link("gpus", `${H.name} · ${H.model.replace("NVIDIA ", "")}`)} <small>${esc(rs.length)} racks</small></summary><ul class="racks">`
         + rs.map(r => `<li>${link(r.rack, r.rack)}</li>`).join("") + `</ul></details></li>`;
    }
    h += `</ul><div class="sec">Reference</div><ul><li>${link("fields", "Field reference")}</li><li>${link("agreements", "Agreement with the records")}</li></ul></div>`;
    h += `<div class="famsec" data-fam="cdu"><div class="sec">CDUs</div><ul><li>${link("cdus", "Overview")}</li>`;
    for (const hall of CDU_HALLS) {
      const H = C.halls[hall];
      h += `<li><details open><summary>${link("cdus", H.name)} <small>${esc(H.cdus.length)} CDUs</small></summary><ul>` + H.cdus.map(id => `<li>${link(id, id)}</li>`).join("") + `</ul></details></li>`;
    }
    for (const hall of CDU_PLANNED_HALLS) {
      const H = C.halls[hall];
      h += `<li><details><summary><span class="planned">${esc(H.name)}</span> <small>not in service</small></summary><ul>` + H.cdus.map(id => `<li><span class="planned" title="${esc(H.name)} is ${esc(H.state)}: no telemetry">${esc(id)} <small>${esc(H.state)}</small></span></li>`).join("") + `</ul></details></li>`;
    }
    h += `</ul><div class="sec">CDU reference</div><ul><li>${link("cdu-fields", "Redfish fields")}</li><li>${link("cdu-agreements", "Agreement with the records")}</li></ul></div>`;
    h += powerTree();
    document.getElementById("tree").innerHTML = h;
  }

  // ---------------------------------------------------------------- charts
  const CH = new Map();
  let chartSeq = 0;
  function nice(lo, hi) {
    if (hi <= lo) hi = lo + 1;
    const span = hi - lo, raw = span / 4, p = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => span / s <= 5) || p * 10;
    return {lo: Math.floor(lo / step) * step, hi: Math.ceil(hi / step) * step, step};
  }
  // o: {n, series:[{v, color, w, name}], unit, d, hlines:[{y,label}], bands:[{a,b,label}], marks:[{i,color,label}], xlab:(i)=>text, xtick:n, xminor:n, lo, hi, title}
  function chart(o) {
    const W = o.W || chartWidth(), H = o.H || 150, L = 46, R = 10, T = 12, Bm = 22, pw = W - L - R, ph = H - T - Bm, n = o.n;
    const vals = o.series.flatMap(s => s.v.filter(v => v != null)).concat((o.hlines || []).map(l => l.y));
    let lo = o.lo != null ? o.lo : Math.min(...vals), hi = o.hi != null ? o.hi : Math.max(...vals);
    if (!vals.length) { lo = 0; hi = 1; }
    if (o.lo == null && lo > 0 && lo < 0.3 * hi) lo = 0;
    const y0 = nice(lo, hi), Y = v => T + ph - (v - y0.lo) / (y0.hi - y0.lo) * ph, X = i => L + (i + 0.5) / n * pw;
    const id = "ch" + (++chartSeq);
    let s = `<svg viewBox="0 0 ${esc(W)} ${esc(H)}" width="${esc(W)}" height="${esc(H)}" data-ch="${id}" role="img" aria-label="${esc(o.title || "")}">`;
    for (const b of o.bands || []) s += `<rect x="${esc(X(b.a) - pw / n / 2)}" y="${esc(T)}" width="${esc(Math.max(1, (b.b - b.a) / n * pw))}" height="${esc(ph)}" fill="${esc(b.color || "#e3e7ec")}"><title>${esc(b.label)}</title></rect>`;
    for (let v = y0.lo; v <= y0.hi + 1e-9; v += y0.step) {
      s += `<line x1="${esc(L)}" x2="${esc(W - R)}" y1="${esc(Y(v))}" y2="${esc(Y(v))}" stroke="var(--grid)"/><text x="${esc(L - 6)}" y="${esc(Y(v) + 4)}" text-anchor="end">${num(v, y0.step < 1 ? 1 : 0)}</text>`;
    }
    const xt = o.xtick || 1;
    for (let i = 0; i < n; i += o.xminor || xt) {
      const lab = i % xt === 0;

  function cduMinuteUpdate() {

  function redfishAt(c, d, m) {
    const u = c.uri, v = k => d.v[k] ? d.v[k][m] : null, R = k => ({Reading: v(k)}), when = START + m * MIN;

      return o;
    };
    const pumps = [1, 2].map(p => ({"@odata.id": `${u}/Pumps/${p}`, "@odata.type": "#Pump.v1_0_0.Pump", Id: String(p), Name: `Pump ${p}`, PumpType: "Liquid",
      Status: {State: st(`Pumps/${p}`, "Status.State", "Enabled"), Health: st(`Pumps/${p}`, "Status.Health", "OK")},
      PumpSpeedPercent: R(`pump${p}_pct`), ServiceHours: d.service_hours_start ? r1(d.service_hours_start[p - 1] + d.run[p - 1][m] / 60) : null}));
    const dets = C.detectors.map(x => ({"@odata.id": `${u}/LeakDetection/LeakDetectors/${x.id}`, "@odata.type": "#LeakDetector.v1_0_0.LeakDetector", Id: String(x.id), Name: x.name, LeakDetectorType: x.type,
      DetectorState: st(`LeakDetection/LeakDetectors/${x.id}`, "DetectorState", "OK"), Status: {State: "Enabled", Health: "OK"}}));
    const redH = st("", "PumpRedundancy.Status.Health", "OK");
    const sv = (d.filter_serviced || []).filter(t => Date.parse(t) <= when).sort().pop() || null;
    const unit = {"@odata.id": u, "@odata.type": "#CoolingUnit.v1_6_0.CoolingUnit", Id: c.id, Name: `${c.id} row CDU`, EquipmentType: "CDU", Manufacturer: C.unit.manufacturer, Model: C.unit.model,
      Status: {State: st("", "Status.State", "Enabled"), Health: st("", "Status.Health", "OK"), HealthRollup: worst(redH, ...dets.map(x => x.DetectorState))},
      PumpRedundancy: [{RedundancyType: "NPlusM", MinNumNeeded: 1, MaxNumSupported: 2, RedundancyGroup: pumps.map(p => ({"@odata.id": p["@odata.id"]})), Status: {State: "Enabled", Health: redH}}],
      CoolingCapacityWatts: C.unit.capacity_kw * 1000, Coolant: {CoolantType: "Water", AdditiveName: "Propylene glycol", AdditivePercent: 25},

      Filters: {"@odata.id": `${u}/Filters`}, Reservoirs: {"@odata.id": `${u}/Reservoirs`}, LeakDetection: {"@odata.id": `${u}/LeakDetection`}, EnvironmentMetrics: {"@odata.id": `${u}/EnvironmentMetrics`}};
    const filt = {"@odata.id": `${u}/Filters/1`, "@odata.type": "#Filter.v1_0_0.Filter", Id: "1", Name: "Secondary loop filter", Status: {State: "Enabled", Health: "OK"}, Replaceable: true,
      ServicedDate: sv, ServiceHours: sv ? r1((when - Date.parse(sv)) / HOUR) : null, RatedServiceHours: C.unit.rated_service_hours};
    const resv = {"@odata.id": `${u}/Reservoirs/1`, "@odata.type": "#Reservoir.v1_0_0.Reservoir", Id: "1", Name: "Expansion tank", ReservoirType: "Reserve", Status: {State: "Enabled", Health: "OK"}, FluidLevelPercent: R("reservoir_pct")};
    const env = {"@odata.id": `${u}/EnvironmentMetrics`, "@odata.type": "#EnvironmentMetrics.v1_3_0.EnvironmentMetrics", Id: "EnvironmentMetrics", Name: "CDU environment metrics"};
    for (const f of C.fields.filter(f => f.resource === "EnvironmentMetrics")) env[f.property] = R(f.key);
    const sensors = {"@odata.id": `${u}/Sensors`, "@odata.type": "#SensorCollection.SensorCollection", Name: "Sensors",
      Members: C.fields.filter(f => f.resource.startsWith("Sensors/")).map(f => ({"@odata.id": `${u}/${f.resource}`, Reading: v(f.key), ReadingUnits: f.unit}))};
    return [["CoolingUnit", unit], ["PrimaryCoolantConnectors/1", conn("PrimaryCoolantConnectors/1", "Facility water (primary)")], ["SecondaryCoolantConnectors/1", conn("SecondaryCoolantConnectors/1", "Rack loop (secondary)")],
      ["Pumps/1", pumps[0]], ["Pumps/2", pumps[1]], ["Filters/1", filt], ["Reservoirs/1", resv], ["LeakDetection/LeakDetectors/1", dets[0]], ["LeakDetection/LeakDetectors/2", dets[1]], ["EnvironmentMetrics", env], ["Sensors", sensors]];

  function cduCsv() {

  function cduAgreements() {
    const agree = C.agreements.reduce((a, c) => a + c.checked - c.misses, 0), tot = C.agreements.reduce((a, c) => a + c.checked, 0);
    let h = `<div class="kind">CDU reference</div><h1>Agreement with the records</h1><p class="sub">The CDU telemetry is synthetic, so it is shaped never to contradict the records the other pages show: the CDU hourly record, the Redfish events, the maintenance and leak records, the GPU telemetry, and the energy meters. Each check reads only what the telemetry publishes and the existing records. ${num(agree)} of ${num(tot)} cases agree.</p>`;
    h += `<table><thead><tr><th>Check</th><th class="n">Agrees</th></tr></thead><tbody>` + C.agreements.map(a => `<tr><td>${esc(a.title)}</td><td class="n">${num(a.checked - a.misses)} of ${num(a.checked)} ${a.misses ? tag("does not reconcile", "bad") : tag("agrees", "ok")}</td></tr>`).join("") + `</tbody></table>`;
    if (C.misses.length) h += `<h2 class="sec">Disagreements</h2><p class="note">A disagreement means two records do not reconcile, not that anyone misled.</p><ul>` + C.misses.map(m => `<li>${esc(m)}</li>`).join("") + `</ul>`;
    h += `<p class="note">The same checks run on 60 generated months (scripts/render_telemetry.py --robustness 60); the report is reports/cdu_telemetry.md.</p>`;
    main.innerHTML = h;
  }

  // ------------------------------------------------------------------ power
  // Page data: B.power (scripts/render_telemetry.py prepare_power). Fetched: data/power/<id>.json (hourly, UPS, runs,
  // generators), data/power_minutes/<id>.json (every minute, UPS and generators), data/power_minutes/tapoff_hourly.json,
  // and data/power/windows/*.json (one-minute windows around every event, every device).
  const P = B.power;
  const PUPS = Object.fromEntries(P.ups.map(u => [u.id, u])), PRUN = Object.fromEntries(P.runs.map(r => [r.id, r])), PGEN = Object.fromEntries(P.gens.map(g => [g.id, g]));
  const PTAP = {};
  Object.entries(P.rack_feeds).forEach(([rack, fs]) => fs.forEach(f => { PTAP[f.tapoff] = {...f, rack}; }));
  const PF = {};
  Object.entries(P.fields).forEach(([fam, fs]) => { PF[fam] = Object.fromEntries(fs.map(f => [f.key, f])); });
  const PWIN = {};
  P.windows.forEach(w => (PWIN[w.device] = PWIN[w.device] || []).push(w));
  const SRC_NAME = Object.fromEntries(Object.entries(P.output_source).map(([k, v]) => [v, k]));
  const GST_NAME = Object.fromEntries(Object.entries(P.gen_states).map(([k, v]) => [v, k]));
  const PHALLS = Object.keys(P.halls);
  const famOf = id => PUPS[id] ? "ups" : PRUN[id] ? "busway" : PTAP[id] ? "tapoff" : PGEN[id] ? "generator" : null;
  const partnerRun = id => id.slice(0, -1) + (id.endsWith("A") ? "B" : "A");
  const pEvents = id => P.events.filter(e => e.device === id || (famOf(id) === "busway" && PRUN[id].tapoffs.includes(e.device)));
  const loadPw = id => getJson(`data/power/${encodeURIComponent(id)}.json`);
  const loadTapH = () => getJson("data/power_minutes/tapoff_hourly.json");
  function unpackSteps(arr, sc) {      // first value, then minute-to-minute steps; [n] is n minutes unchanged
    const out = [];
    let s = 0;
    for (const x of arr) {
      if (Array.isArray(x)) { for (let i = 0; i < x[0]; i++) out.push(s / sc); }
      else { s += x; out.push(s / sc); }
    }
    return out;
  }
  const loadPwMin = id => getJson(`data/power_minutes/${encodeURIComponent(id)}.json`).then(d => {
    if (!d.decoded) {
      d.decoded = true; d.v = {};
      const F = PF[d.family];
      for (const [k, arr] of Object.entries(d.fields)) d.v[k] = unpackSteps(arr, F[k] ? F[k].scale : 1);
      if (d.family === "ups") { d.v.load_pct = d.v.out_kw.map(x => Math.round(x * 1000 / d.rating_kw) / 10); d.v.out_hz = d.v.in_hz; }
    }
    return d;
  });
  const loadPwWin = w => getJson("data/power/" + w.file.split("/").map(encodeURIComponent).join("/")).then(d => {
    if (!d.decoded) {
      d.decoded = true; d.v = {};
      const F = PF[d.family] || {};
      for (const [k, arr] of Object.entries(d.fields)) d.v[k] = arr.map(x => x / (F[k] ? F[k].scale : 1));
      if (d.family === "ups") { const u = PUPS[d.device]; d.v.load_pct = d.v.out_kw.map(x => Math.round(x * 1000 / u.rating_kw) / 10); d.v.out_hz = d.v.in_hz; }
    }
    return d;
  });
  const pKind = k => tag({bypass: "bypass", battery: "on battery", module: "power module", breaker: "tap-off breaker", feed: "feed lost", test: "monthly test", outage: "utility outage", utility: "utility outage"}[k] || k,
    {bypass: "warn", battery: "bad", module: "bad", breaker: "warn", feed: "bad", test: "", outage: "bad", utility: "bad"}[k]);
  const PEVC = {bypass: "#fbeccb", battery: "#f8d9d5", module: "#f8d9d5", breaker: "#fbeccb", feed: "#f8d9d5", test: "#e3e7ec", outage: "#f8d9d5", utility: "#f8d9d5"};
  const devLink = id => id === "SITE" ? "Site" : famOf(id) ? link(id, id) : esc(id);
  const pctOf = (v, of) => of ? 100 * v / of : 0;
  const hasMinutes = id => !!PUPS[id] || !!PGEN[id];
  function pDetailHref(e) {
    const id = e.device === "SITE" ? "UPS-A1" : e.device;
    if (hasMinutes(id)) return `#${id}/${Math.max(0, e.m - 10)}`;
    return (PWIN[id] || []).some(w => { const a = minOf(w.from); return e.m >= a && e.m < a + w.minutes; }) ? `#${id}/${e.m}` : null;
  }
  function pEventsTable(evs, withDetail) {
    if (!evs.length) return `<p class="note">None this month.</p>`;
    return `<div class="scroll"><table><thead><tr><th>When (UTC)</th><th>Device</th><th>Event</th><th>Records</th>${withDetail ? "<th></th>" : ""}</tr></thead><tbody>` + evs.map(e => {
      const recs = refLinks(e.refs) + (e.finding ? `${e.refs.length ? ", " : ""}${tag(e.finding.id, "bad")}` : "");
      const href = withDetail ? pDetailHref(e) : null;
      return `<tr><td class="n">${esc(at(e.t))}${e.end ? ` to ${esc(at(e.end))}` : ""}</td><td>${devLink(e.device)}</td><td>${pKind(e.kind)} ${esc(e.text)}</td><td>${recs}</td>`
        + (withDetail ? `<td>${href ? `<a class="b" href="${esc(href)}">Minute detail</a>` : ""}</td>` : "") + `</tr>`;
    }).join("") + `</tbody></table></div>`;
  }
  const pBands = (evs, n) => evs.map(e => ({a: hourOf(e.t), b: e.end ? hourOf(e.end) + 1 : n, label: `${at(e.t)}: ${e.text}`, color: PEVC[e.kind]}));
  const lg = items => `<div class="legend">${items.map(([col, name, cls]) => `<span><i class="${esc(cls || "")}" style="${cls === "dash" ? "" : `background:${esc(col)}`}"></i>${esc(name)}</span>`).join("")}</div>`;
  const pLegend = `<div class="legend"><span><i class="band" style="background:${esc(PEVC.bypass)}"></i>bypass or tap-off breaker open</span><span><i class="band" style="background:${esc(PEVC.feed)}"></i>on battery, feed lost, module out, utility outage</span><span><i class="band"></i>generator test</span></div>`;
  const pAgreeTile = () => {
    const agree = P.agreements.reduce((a, c) => a + c.checked - c.misses, 0), tot = P.agreements.reduce((a, c) => a + c.checked, 0);
    return `<div class="tiles"><div class="tile"><div class="k">Agreement with the records</div><div class="v"><a href="#power-agreements">${num(agree)} of ${num(tot)}</a></div><div class="s">cases agree across ${esc(P.agreements.length)} checks: the racks' power in the GPU telemetry, the energy meters, the UPS, busway, EPMS, and generator records, and the CDU telemetry</div></div></div>`;
  };
  const kv = (k, v, t) => `<div class="kv"><span>${esc(k)}</span><b>${v}${t || ""}</b></div>`;

  // the one-line in miniature: utility and generators, the MV switchgear, each UPS, and the busway runs it feeds
  function oneLine() {
    const W = Math.max(720, chartWidth()), rowH = 26, hallH = 22, boxW = 112, x0 = 6, xBus = 196, xUps = 226, xRun = xUps + boxW + 24;
    const runW = Math.max(84, Math.min(118, Math.floor((W - xRun - 8) / 6) - 4));
    let y = 8, body = "";
    const rows = [];
    for (const hall of PHALLS) {
      const H = P.halls[hall];
      rows.push({hall: H.name + ` · ${H.racks} racks on busway`, y}); y += hallH;
      for (const u of H.ups.concat(H.mups)) { rows.push({ups: PUPS[u], y}); y += rowH; }
      y += 6;
    }
    const Ht = y + 4, mid = Ht / 2;
    const box = (x, yy, w, h, fill, text, href, title, dark) => `<a href="${esc(href || "#power")}"><rect x="${esc(x)}" y="${esc(yy)}" width="${esc(w)}" height="${esc(h)}" rx="4" fill="${esc(fill)}" stroke="#9aa6b2"><title>${esc(title || text)}</title></rect><text x="${esc(x + 6)}" y="${esc(yy + h / 2 + 4)}" style="fill:${dark ? "#fff" : "var(--ink)"};font-weight:600">${esc(text)}</text></a>`;
    body += box(x0, mid - 64, 150, 26, "#fff", "138 kV utility", "#power", "The utility service (WO-41009 records the 09-24 outage)");
    body += box(x0, mid - 30, 150, 26, "#fff", `${P.gens.length} generators (N+1)`, "#GEN-1", `${P.gens.length} × CAT C175-16, ${P.gen_rated_kw.toLocaleString("en-US")} kW each, 13.8 kV`);
    body += box(x0, mid + 8, 150, 26, "#fff", "MV-A / MV-B", "#power", "13.8 kV switchgear: utility mains and generator tie breakers");
    body += `<line x1="${esc(x0 + 150)}" x2="${esc(xBus)}" y1="${esc(mid + 21)}" y2="${esc(mid + 21)}" stroke="#7b8794"/><line x1="${esc(x0 + 75)}" x2="${esc(x0 + 75)}" y1="${esc(mid - 38)}" y2="${esc(mid + 8)}" stroke="#7b8794"/>`;
    const ups = rows.filter(r => r.ups);
    body += `<line x1="${esc(xBus)}" x2="${esc(xBus)}" y1="${esc(ups[0].y + 11)}" y2="${esc(ups[ups.length - 1].y + 11)}" stroke="#7b8794" stroke-width="2"/>`;
    for (const r of rows) {
      if (r.hall) { body += `<text x="${esc(xUps)}" y="${esc(r.y + 15)}" style="font-weight:600;fill:var(--muted)">${esc(r.hall)}</text>`; continue; }
      const u = r.ups, f = u.load_peak / 100, c = ramp(f / 0.9);
      body += `<line x1="${esc(xBus)}" x2="${esc(xUps)}" y1="${esc(r.y + 11)}" y2="${esc(r.y + 11)}" stroke="#7b8794"/>`;
      body += box(xUps, r.y, boxW, 22, c, `${u.id} ${num(u.load_peak)}%`, `#${u.id}`, `${u.id}: peak load ${u.load_peak}% of ${u.rating_kw} kW`, !light(f / 0.9));
      if (u.kind === "mech") { body += `<text x="${esc(xRun)}" y="${esc(r.y + 15)}">CDU pumps and thermal-wall fans (2N)</text>`; continue; }
      body += `<line x1="${esc(xUps + boxW)}" x2="${esc(xRun)}" y1="${esc(r.y + 11)}" y2="${esc(r.y + 11)}" stroke="#7b8794"/>`;
      u.runs.forEach((id, i) => {
        const rn = PRUN[id], g = rn.amps_peak / P.rating_a, x = xRun + i * (runW + 4), label = `${id.split("-").slice(2).join("-")}`;
        body += `<a href="#${esc(id)}"><rect x="${esc(x)}" y="${esc(r.y + 2)}" width="${esc(runW)}" height="18" rx="3" fill="${esc(ramp(g / 0.9))}" stroke="${rn.dead_min ? "var(--bad)" : "#c3ccd5"}" stroke-width="${rn.dead_min ? 2 : 1}"><title>${esc(id)}: peak ${esc(rn.amps_peak)} A of ${esc(P.rating_a)} A; racks ${esc(rn.racks.join(", "))}${rn.dead_min ? `; ${rn.dead_min} min without feed` : ""}</title></rect><text x="${esc(x + 4)}" y="${esc(r.y + 15)}" style="fill:${light(g / 0.9) ? "var(--ink)" : "#fff"}">${esc(label)}</text></a>`;
      });
    }
    return `<div class="scroll"><svg viewBox="0 0 ${esc(W)} ${esc(Ht)}" width="${esc(W)}" height="${esc(Ht)}" role="img" aria-label="One-line diagram in miniature">${body}</svg></div>`
      + `<div class="ramp"><span>0%</span><i style="background:linear-gradient(90deg,${esc(RAMP.join(","))})"></i><span>90% of rating</span><span>· UPS boxes: peak load of the UPS rating; busway cells: peak current of the 1,200 A rating; red outline: a run that lost its feed</span></div>`;
  }

  function powerOverview(seq) {
    let h = `<div class="kind">Power</div><h1>Power telemetry</h1><p class="sub">${esc(P.framing)} Every UPS (SNMPv3 through its network management card), every busway run and tap-off (Starline M70 meters, SNMP), and every generator (EMCP 4.4, Modbus TCP), read once a minute, ${esc(md(P.window.start))} to ${esc(md(P.window.end))}. Built from the bottom up: each rack's power splits across its A and B tap-offs, the tap-offs add up to their run, and the runs to their UPS. All names and readings are fictional.</p>`;
    h += `<h2 class="sec">One-line, coloured by the month's peak load</h2>` + oneLine();
    for (const hall of PHALLS) {
      const H = P.halls[hall];
      h += `<div class="hallname">${esc(H.name)} · ${esc(H.n)} × ${esc(PUPS[H.ups[0]].model)} · 4-make-3 · ${esc(H.state)}</div><div class="tiles">`
        + tile("IT load", `${num(H.avg_kw)} kW`, `hourly mean at the UPS outputs; peak hour ${num(H.peak_kw)} kW (${esc(hourAt(H.peak_hour))})`)
        + tile("Design load", `${num(H.design_kw)} kW`, `${num(H.n - 1)} of ${num(H.n)} UPSs at ${num(H.rating_kw)} kW: any one can fail`)
        + tile("One UPS out", `${num(H.one_down_pct, 1)}%`, `each other UPS's load at the month's peak if one fails (limit 100%)`)
        + `</div><div class="ctiles">` + H.ups.concat(H.mups).map(id => upsTile(PUPS[id], H)).join("") + `</div>`;
    }
    h += `<div class="hallname">Generators · ${esc(P.gens.length)} × CAT C175-16 with EMCP 4.4 · ${num(P.gen_rated_kw)} kW, 13.8 kV · N+1</div><div class="ctiles">` + P.gens.map(genTile).join("") + `</div>`;
    h += pAgreeTile();
    const evs = P.events.filter(e => e.kind !== "battery" && e.kind !== "outage");
    h += `<h2 class="sec">Events</h2><p class="note">Every state change the power records published, with the records that explain it. The utility outage put every UPS on battery for 11 to 14 seconds and started all ${esc(P.gens.length)} generators: those rows are on each device's own view. Record ids open the Incident Portal.</p>` + pEventsTable(evs, true);
    main.innerHTML = h;
    Promise.all(P.ups.map(u => loadPw(u.id).then(j => [u.id, j]))).then(rs => {
      if (seq !== current) return;
      for (const [id, j] of rs) { const el = document.getElementById("sp-" + id); if (el) el.innerHTML = spark(j.series.load_avg_pct); }
    }).catch(e => { if (seq === current) main.querySelectorAll(".ctile .spark").forEach(el => { el.innerHTML = `<span class="note">${esc(e && e.message ? e.message : e)}</span>`; }); });
  }
  function upsTile(u, H) {
    const ceil = u.kind === "it" ? 100 * (H.n - 1) / H.n : 50;
    return `<a class="tile ctile" href="#${esc(u.id)}"><div class="k">${esc(u.id)} <span>· ${esc(u.kind === "it" ? `${u.runs.length} busway runs` : "mechanical, 2N")}</span></div><div class="spark" id="sp-${esc(u.id)}" title="Load by hour"></div>`
      + kv("Load avg / peak", `${num(u.load_avg, 1)} / ${num(u.load_peak, 1)}%`, u.load_peak > ceil ? tag("over ceiling", "bad") : "")
      + kv(u.kind === "it" ? "Ceiling (4-make-3)" : "Ceiling (2N)", `${num(ceil)}% of ${num(u.rating_kw)} kW`)
      + kv("Output avg", `${num(u.out_avg_kw)} kW`)
      + kv("On bypass", `${num(u.bypass_min)} min`, u.bypass_min ? tag("maintenance", "warn") : "")
      + kv("On battery", `${num(u.battery_s)} s`, u.battery_s ? tag("outage", "bad") : "")
      + kv("Lowest battery charge", `${num(u.soc_min)}%`)
      + kv("Power module out", `${num(u.modules_lost_h)} h`, u.modules_lost_h ? tag("module", "bad") : "") + `</a>`;
  }
  function genTile(g) {
    const tests = g.runs.filter(r => r.kind === "test"), low = tests.some(r => r.pct_max < 30);
    return `<a class="tile ctile" href="#${esc(g.id)}"><div class="k">${esc(g.id)} <span>· ${esc(g.runs.length)} runs this month</span></div>`
      + kv("Monthly test peak", tests.length ? `${num(Math.max(...tests.map(r => r.pct_max)), 1)}% of rated` : "–", low ? tag("below 30%", "bad") : "")
      + kv("Running", `${num(g.run_min)} min`) + kv("Energy", `${num(g.mwh, 2)} MWh`)
      + kv("Fuel at month end", `${num(g.fuel_end, 1)}%`) + kv("Hour meter", `${num(g.hours_end, 1)} h`) + `</a>`;
  }

  // ------------------------------------------------------------- UPS
  function upsHeader(u) {
    const H = P.halls[u.hall];
    return `<div class="kind">${esc(H.name)} · ${esc(u.model)} · ${esc(u.kind === "it" ? "IT UPS, 4-make-3" : "mechanical UPS, 2N")}</div><h1>${esc(u.id)}</h1>`
      + `<p class="sub">${esc(u.modules)} ${u.kind === "it" ? "250 kW power cabinets" : "50 kW power modules"}, lithium-ion battery (5 minutes at full load). Read once a minute over SNMPv3 through the network management card (UPS-MIB and PowerNet-MIB)${u.kind === "it" ? "; each point also shown with its register in Schneider's published Galaxy VX Modbus map" : ""}. `
      + (u.kind === "it" ? `Feeds ${u.runs.map(r => link(r, r)).join(", ")}.` : `Feeds the hall's CDU pumps and thermal-wall fans.`)
      + ` <a href="../devices/#${esc(encodeURIComponent(u.id))}">Device card ↗</a></p>`;
  }
  function upsView(id, seq) {
    const u = PUPS[id], H = P.halls[u.hall], evs = pEvents(id);
    let h = upsHeader(u);
    const eff = u.in_mwh ? 100 * u.out_mwh / u.in_mwh : null;
    h += `<div class="tiles">` + tile("Load avg / peak", `${num(u.load_avg, 1)}%`, `peak ${num(u.load_peak, 1)}% of ${num(u.rating_kw)} kW; ceiling ${num(u.kind === "it" ? 100 * (H.n - 1) / H.n : 50)}%`)
      + tile("Energy out / in", `${num(u.out_mwh, 1)} MWh`, `in ${num(u.in_mwh, 1)} MWh: ${num(eff, 1)}% through the UPS`)
      + tile("On bypass", `${num(u.bypass_min)} min`, "maintenance bypass this month")
      + tile("On battery", `${num(u.battery_s)} s`, `lowest charge ${num(u.soc_min)}%`) + `</div>`;
    h += `<p><a class="b" href="#${esc(id)}/${esc(evs.length ? Math.max(0, evs[evs.length - 1].m - 10) : HOURS * 60 - 61)}">Minute detail and raw SNMP${u.kind === "it" ? " / Modbus" : ""} reads</a></p>`;
    h += `<h2 class="sec">The month, by hour</h2>` + pLegend + `<div id="pc">Loading data/power/${esc(id)}.json…</div>`;
    if (u.kind === "it") h += `<h2 class="sec">Busway runs fed</h2><div class="scroll"><table><thead><tr><th>Run</th><th>Racks</th><th class="n">Energy MWh</th><th class="n">Amps avg / peak</th><th class="n">If its partner feed failed</th></tr></thead><tbody>`
      + u.runs.map(r => { const x = PRUN[r]; return `<tr><td>${link(r, r)}</td><td>${x.racks.map(k => link(k, k)).join(" ")}</td><td class="n">${num(x.mwh, 1)}</td><td class="n">${num(x.amps_avg)} / ${num(x.amps_peak)} A</td><td class="n">${num(x.single_feed_peak_a)} A</td></tr>`; }).join("") + `</tbody></table></div>`;
    h += `<h2 class="sec">Events</h2>` + pEventsTable(evs, true);
    main.innerHTML = h;
    loadPw(id).then(j => { if (seq !== current) return;
      const S = j.series, n = j.hours, X = {...HX, n, bands: pBands(evs, n)};
      const ceil = u.kind === "it" ? 100 * (H.n - 1) / H.n : 50;
      document.getElementById("pc").innerHTML = chart({...X, title: "Load (% of rating)", unit: "%", d: 1, series: [{v: S.load_max_pct, color: "var(--s2)", name: "Load, hourly max", w: 1, op: 0.8}, {v: S.load_avg_pct, color: "var(--s1)", name: "Load, hourly mean", w: 1.8}], hlines: [{y: ceil, label: `ceiling ${num(ceil)}%${u.kind === "it" ? " (4-make-3)" : " (2N)"}`, color: "var(--warn)"}], lo: 0})
        + lg([["var(--s1)", "hourly mean"], ["var(--s2)", "hourly max"], ["", u.kind === "it" ? "4-make-3 ceiling: any one UPS can fail" : "2N ceiling", "dash"]])
        + chart({...X, title: "Energy in and out (kWh per hour)", unit: "kWh", d: 1, series: [{v: S.in_kwh, color: "var(--s2)", name: "Input"}, {v: S.out_kwh, color: "var(--s1)", name: "Output"}], lo: 0})
        + lg([["var(--s1)", "output (to the busway)"], ["var(--s2)", "input: output over efficiency plus the no-load loss, less the bypass saving, plus battery recharge"]])
        + chart({...X, title: "Output current, highest line (A)", unit: "A", d: 1, series: [{v: S.amps_max, color: "var(--s4)", name: "Output current"}], lo: 0})
        + chart({...X, title: "Battery charge, lowest each hour (%)", unit: "%", series: [{v: S.soc_min_pct, color: "var(--s3)", name: "Battery charge"}], lo: 0, hi: 100});
    }).catch(e => { if (seq === current) document.getElementById("pc").innerHTML = errBox(e, `data/power/${id}.json`); });
  }

  // minute detail for a UPS or generator: #UPS-A1/<minute>, #GEN-4/<minute>
  let pmCtx = null, pmRaw = "snmp";
  function pMinuteView(id, m, seq) {
    const fam = famOf(id);
    main.innerHTML = (fam === "ups" ? upsHeader(PUPS[id]) : genHeader(PGEN[id])) + `<p class="sub"><a href="#${esc(id)}">← The month by hour</a></p><div id="pm"><p class="note">Loading data/power_minutes/${esc(id)}.json (every minute of the month)…</p></div>`;
    loadPwMin(id).then(d => {

  function pwOpen(id, w, btn, cursor) {
    const box = document.getElementById("pw");
    main.querySelectorAll("#pw-btns button").forEach(b => b.classList.toggle("on", b === btn));
    box.innerHTML = `<p class="note">Loading ${esc(w.file)}…</p>`;
    loadPwWin(w).then(d => {
      if (!document.getElementById("pw")) return;
      pwCtx = {id, d, c: cursor != null ? cursor : Math.min(30, d.minutes - 1)};
      const fam = d.family, n = d.minutes, f0 = Date.parse(d.from);
      const evm = (d.states || []).map(s => ({i: s.m - d.m0, color: "var(--bad)", label: `${s.time.slice(11, 19)} ${s.point}: ${s.value}`}));
      const MX = {n, xlab: i => new Date(f0 + i * MIN).toISOString().slice(11, 16), xtick: 15, xminor: 5, hover: i => at(new Date(f0 + i * MIN).toISOString()), marks: evm, H: 130};
      let h = `<p class="note">${esc(d.device)}, ${esc(at(d.from))} for ${esc(n)} minutes. Red lines: the recorded state changes.</p><div class="ctl"><label for="pwm">Minute</label><b id="pwm-lab"></b></div><input type="range" id="pwm" min="0" max="${esc(n - 1)}" value="${esc(pwCtx.c)}" aria-label="Minute within the window">`;
      if (fam === "busway" || fam === "tapoff") {
        h += chart({...MX, title: "Current by line (A)", unit: "A", d: 1, series: [1, 2, 3].map((l, k) => ({v: d.v["a" + l], color: ["var(--s1)", "var(--s2)", "var(--s3)"][k], name: "Line " + l})), lo: 0})
          + chart({...MX, title: "Active power (kW)", unit: "kW", d: 1, series: [{v: d.v.kw, color: "var(--s4)", name: "kW"}], lo: 0});
        if (fam === "busway") h += chart({...MX, title: "Voltage line to line (V)", unit: "V", d: 1, series: [{v: d.v.v_ll, color: "var(--s1)", name: "V L-L"}]});
        else h += chart({...MX, title: "Breaker (1 closed, 0 open)", unit: "", series: [{v: d.v.brk, color: "var(--bad)", name: "Breaker"}], lo: 0, hi: 1});
      } else if (fam === "ups") {
        h += chart({...MX, title: "Output and input power (kW)", unit: "kW", d: 1, series: [{v: d.v.out_kw, color: "var(--s1)", name: "Output"}, {v: d.v.in_kw, color: "var(--s2)", name: "Input"}], lo: 0});
      } else {
        h += chart({...MX, title: "Generator real power (kW)", unit: "kW", d: 1, series: [{v: d.v.kw, color: "var(--s1)", name: "kW"}], lo: 0});
      }
      h += `<pre class="scrape" id="pw-raw" data-gl-skip></pre><p><button class="b" id="pwcsv">Download CSV (this window)</button> <span class="note" id="pwcsv-note"></span></p>`;
      box.innerHTML = h;
      pwUpdate();
    }).catch(e => { box.innerHTML = errBox(e, w.file); });
  }
  function pwUpdate() {
    const ctx = pwCtx, el = document.getElementById("pw-raw");
    if (!ctx || !el) return;
    const {d, c} = ctx, when = new Date(Date.parse(d.from) + c * MIN).toISOString(), fam = d.family;
    document.getElementById("pwm-lab").textContent = at(when);
    main.querySelectorAll("#pw svg[data-ch]").forEach(svg => { const ch = CH.get(svg.dataset.ch); if (ch && ch.n === d.minutes) { const px = ch.L + (c + 0.5) / ch.n * ch.pw, cur = svg.querySelector(".cur"); cur.setAttribute("x1", px); cur.setAttribute("x2", px); cur.style.display = ""; } });
    const F = P.fields[fam] || [];
    if (fam === "busway" || fam === "tapoff") {
      el.innerHTML = `<span class="c"># snmpget ${esc(d.device)} M70 CPM (STARLINE-CPM-MIB, enterprise 35774), ${esc(when)}</span>\n` + F.map(f => {
        const x = d.v[f.key] ? d.v[f.key][c] : null;
        const raw = x == null ? "" : f.key === "kw" ? Math.round(x * 1000) : f.key === "pf" ? Math.round(x * 1000) : f.key === "brk" ? (x ? 2 : 1) : Math.round(x * f.scale);
        const note = f.key === "kw" ? "W" : f.key === "pf" ? "thousandths" : f.key === "brk" ? "1 open, 2 closed (cpmAcBrkrCurrentStatus)" : f.scale === 1 ? f.unit : `${f.unit} x ${f.scale}`;
        return `.${esc(f.oid)} = INTEGER: ${esc(raw)}  <span class="c">-- ${esc(f.snmp)} (${esc(note)})</span>`;
      }).join("\n");
    } else {
      const keys = F.map(f => f.key).filter(k => d.v[k]);
      el.innerHTML = `<span class="c"># ${esc(d.device)} at ${esc(when)} (open the device's minute detail for the full raw read)</span>\n` + keys.map(k => `${esc(k.padEnd(12))} ${esc(d.v[k][c])}`).join("\n");
    }
  }
  main.addEventListener("input", e => { if (e.target.id === "pwm" && pwCtx) { pwCtx.c = +e.target.value; pwUpdate(); } });
  main.addEventListener("click", e => {
    if (!e.target.closest("#pwcsv") || !pwCtx) return;
    const {d} = pwCtx, keys = Object.keys(d.v), rows = [["minute_utc", ...keys]];
    for (let i = 0; i < d.minutes; i++) rows.push([new Date(Date.parse(d.from) + i * MIN).toISOString(), ...keys.map(k => d.v[k][i])]);
    saveCsv(rows, `${d.device}_${d.from.slice(0, 16).replace(/[-:]/g, "")}.csv`, document.getElementById("pwcsv-note"));
  });

  // ------------------------------------------------------------- generators
  function genHeader(g) {
    return `<div class="kind">Generators · CAT C175-16 with EMCP 4.4 · ${num(P.gen_rated_kw)} kW, 13.8 kV · N+1</div><h1>${esc(g.id)}</h1>`
      + `<p class="sub">Read once a minute over Modbus TCP (EMCP 4 SCADA data link, holding registers, unit ${esc(P.collection.generator.unit_id)}). Starts on a utility failure in Auto; started by hand (Run) for the monthly loaded exercise on the load bank. <a href="../devices/#${esc(encodeURIComponent(g.id))}">Device card ↗</a></p>`;
  }
  function genView(id, seq) {
    const g = PGEN[id], evs = P.events.filter(e => e.device === id);
    let h = genHeader(g);
    for (const e of evs.filter(e => e.finding)) h += `<div class="finding">${tag(e.finding.id, "bad")} ${esc(e.finding.title)}: ${esc(e.finding.summary)} The telemetry shows the same: ${esc(e.text.toLowerCase())}.</div>`;
    h += `<div class="tiles">` + tile("Running", `${num(g.run_min)} min`, `${num(g.runs.length)} runs this month`) + tile("Energy", `${num(g.mwh, 2)} MWh`, `peak ${num(g.kw_max)} kW (${num(g.pct_max, 1)}% of rated)`)
      + tile("Fuel at month end", `${num(g.fuel_end, 1)}%`, "main tank, 48 hours at full load when full") + tile("Hour meter", `${num(g.hours_end, 2)} h`, `advances only while running`) + `</div>`;
    h += `<h2 class="sec">Runs</h2><div class="scroll"><table><thead><tr><th>Start (UTC)</th><th>Stop</th><th>Why</th><th class="n">Running min</th><th class="n">Peak kW</th><th class="n">% of rated</th><th>Records</th><th></th></tr></thead><tbody>`
      + evs.map(e => `<tr><td class="n">${esc(at(e.t))}</td><td class="n">${esc(at(e.end))}</td><td>${pKind(e.kind)}</td><td class="n">${num(e.run_min)}</td><td class="n">${num(e.kw_max)}</td><td class="n">${num(e.pct_max, 1)}%${e.kind === "test" && e.pct_max < 30 ? ` ${tag("below 30%", "bad")}` : ""}</td><td>${refLinks(e.refs)}${e.finding ? ` ${tag(e.finding.id, "bad")}` : ""}</td><td><a class="b" href="#${esc(id)}/${esc(Math.max(0, e.m - 10))}">Minute detail</a></td></tr>`).join("") + `</tbody></table></div>`
      + `<p class="note">NFPA 110 asks for a monthly exercise at no less than 30% of the nameplate rating for 30 minutes. The tests run on a load bank (power factor 1.0); in the utility outage all seven sets shared the site's load in parallel.</p>`;
    h += `<h2 class="sec">The month, by hour</h2>` + pLegend + `<div id="pc">Loading data/power/${esc(id)}.json…</div>`;
    main.innerHTML = h;
    loadPw(id).then(j => { if (seq !== current) return;
      const S = j.series, n = j.hours, X = {...HX, n, bands: pBands(evs, n)};
      document.getElementById("pc").innerHTML = chart({...X, title: "Real power, hourly max (% of rated)", unit: "%", d: 1, series: [{v: S.pct_max, color: "var(--s1)", name: "% of rated"}], hlines: [{y: 30, label: "30% (NFPA 110 monthly exercise)", color: "var(--warn)"}], lo: 0})
        + chart({...X, title: "Coolant temperature, hourly max (°C)", unit: "°C", d: 1, series: [{v: S.coolant_max_c, color: "var(--s2)", name: "Coolant"}], lo: 0})
        + chart({...X, title: "Fuel level at the end of each hour (%)", unit: "%", d: 1, series: [{v: S.fuel_pct, color: "var(--s3)", name: "Fuel"}]})
        + chart({...X, title: "Hour meter (h)", unit: "h", d: 2, series: [{v: S.hours, color: "var(--s4)", name: "Hours"}]});
    }).catch(e => { if (seq === current) document.getElementById("pc").innerHTML = errBox(e, `data/power/${id}.json`); });
  }

  // ------------------------------------------------------------- reference
  function powerFields() {
    const K = P.collection;
    let h = `<div class="kind">Power reference</div><h1>Points and registers</h1><p class="sub">${esc(P.framing)} Object names and register numbers are the published ones; the values are this site's synthetic series. Where a document gives no point (a Galaxy VL Modbus map, the EMCP 4 register scaling), none is invented: the scaling marked "assumption" is this demo's. No vendor's internal tooling is implied.</p>`;
    h += `<div class="cards">` + tile("Poll interval", `${num(K.poll_interval_s)} s`, "every power device read once a minute")
      + tile("UPS", esc(K.ups.protocol), `${esc(K.ups.account)}; ${esc(K.ups.mibs.join(", "))}`)
      + tile("Busway", esc(K.busway.protocol), `${esc(K.busway.account)}; ${esc(K.busway.mib)}`)
      + tile("Generators", esc(K.generator.protocol), `${esc(K.generator.account)}`) + `</div>`;
    h += `<h2 class="sec">UPS (Galaxy VX and VL)</h2><div class="scroll"><table data-gl-skip><thead><tr><th>Point</th><th>SNMP object</th><th>OID</th><th>Galaxy VX register</th><th>Unit</th><th>Meaning</th></tr></thead><tbody>`
      + P.fields.ups.map(f => `<tr><td>${esc(f.name)}</td><td><code>${esc(f.snmp || "–")}</code></td><td><code>${esc(f.oid || "–")}</code></td><td>${f.modbus ? `${esc(f.modbus)} <span class="note">${esc(f.mtype)}</span>` : "–"}</td><td>${esc(f.unit)}</td><td class="note">${esc(f.help)}</td></tr>`).join("") + `</tbody></table></div>`;
    for (const [fam, title] of [["busway", "Busway runs (M70 end-feed meter)"], ["tapoff", "Tap-offs (M70 plug-in meter)"]]) {
      h += `<h2 class="sec">${esc(title)}</h2><div class="scroll"><table data-gl-skip><thead><tr><th>Point</th><th>CPM object</th><th>OID</th><th>Unit</th><th>Meaning</th></tr></thead><tbody>`
        + P.fields[fam].map(f => `<tr><td>${esc(f.name)}</td><td><code>${esc(f.snmp)}</code></td><td><code>${esc(f.oid)}</code></td><td>${esc(f.unit)}</td><td class="note">${esc(f.help)}</td></tr>`).join("") + `</tbody></table></div>`;
    }
    h += `<h2 class="sec">Generators (EMCP 4.4)</h2><div class="scroll"><table data-gl-skip><thead><tr><th>Point</th><th>Register</th><th>Scaling</th><th>Unit</th><th>Meaning</th></tr></thead><tbody>`
      + P.fields.generator.map(f => `<tr><td>${esc(f.name)}</td><td><code>${esc(f.reg)}</code></td><td class="note">${esc(f.rscale)}</td><td>${esc(f.unit)}</td><td class="note">${esc(f.help)}</td></tr>`).join("") + `</tbody></table></div>`;
    h += `<h2 class="sec">Sources</h2><ul>` + P.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a> <span class="note">(checked ${esc(s.checked)})</span></li>`).join("") + `</ul>`;
    main.innerHTML = h;
  }
  function powerAgreements() {
    const agree = P.agreements.reduce((a, c) => a + c.checked - c.misses, 0), tot = P.agreements.reduce((a, c) => a + c.checked, 0);
    let h = `<div class="kind">Power reference</div><h1>Agreement with the records</h1><p class="sub">The power telemetry is synthetic, so it is shaped never to contradict the records the other pages show: the racks' power in the GPU telemetry, the energy meters, the UPS network-card events, the busway meter and EPMS events, the generator controller readings, and the CDU telemetry. Each check reads only what the telemetry publishes and the existing records. ${num(agree)} of ${num(tot)} cases agree.</p>`;
    h += `<table><thead><tr><th>Check</th><th class="n">Agrees</th></tr></thead><tbody>` + P.agreements.map(a => `<tr><td>${esc(a.title)}</td><td class="n">${num(a.checked - a.misses)} of ${num(a.checked)} ${a.misses ? tag("does not reconcile", "bad") : tag("agrees", "ok")}</td></tr>`).join("") + `</tbody></table>`;
    if (P.misses.length) h += `<h2 class="sec">Disagreements</h2><p class="note">A disagreement means two records do not reconcile, not that anyone misled.</p><ul>` + P.misses.map(m => `<li>${esc(m)}</li>`).join("") + `</ul>`;
    h += `<p class="note">The same checks run on 60 generated months (scripts/render_telemetry.py --robustness 60); the report is reports/power_telemetry.md.</p>`;
    main.innerHTML = h;
  }
  function powerTree() {
    let h = `<div class="famsec" data-fam="power"><div class="sec">Power</div><ul><li>${link("power", "Overview")}</li>`;
    for (const hall of PHALLS) {
      const H = P.halls[hall];
      h += `<li><details open><summary>${link("power", `${H.name} UPS`)} <small>${esc(H.ups.length)} + ${esc(H.mups.length)}</small></summary><ul>`
        + H.ups.map(id => `<li>${link(id, id)}</li>`).join("") + H.mups.map(id => `<li>${link(id, id)}</li>`).join("") + `</ul></details></li>`;
    }
    for (const hall of PHALLS) {
      const H = P.halls[hall];
      h += `<li><details><summary>${link("power", `${H.name} busway`)} <small>${esc(Object.values(H.rows).flat().length)} runs</small></summary><ul>`
        + Object.entries(H.rows).map(([row, ids]) => `<li><details><summary>Row ${esc(row.slice(1))} <small>${esc(ids.length)}</small></summary><ul>` + ids.map(id => `<li>${link(id, id.split("-").slice(3).join("-"))}</li>`).join("") + `</ul></details></li>`).join("")
        + `</ul></details></li>`;
    }
    h += `<li><details open><summary>${link("GEN-1", "Generators")} <small>${esc(P.gens.length)}</small></summary><ul>` + P.gens.map(g => `<li>${link(g.id, g.id)}</li>`).join("") + `</ul></details></li>`;
    h += `</ul><div class="sec">Power reference</div><ul><li>${link("power-fields", "Points and registers")}</li><li>${link("power-agreements", "Agreement with the records")}</li></ul></div>`;
    return h;
  }

  // ----------------------------------------------------------------- router
  let current = 0;
  function route() {
    let raw;
    try { raw = decodeURIComponent(location.hash.slice(1)); } catch (e) { raw = ""; }
    const [a, b] = raw.split("/");
    let m;
    if ((m = /^([ab]\d\d)$/i.exec(a)) && RACK[a.toUpperCase()]) return {view: "rack", rack: a.toUpperCase(), hour: b == null ? null : parseInt(b, 10), key: a.toUpperCase()};
    if ((m = /^([ab]\d\d-ct\d\d)$/i.exec(a)) && b != null && /^[0-3]$/.test(b) && RACK[rackOf(a)]) return {view: "gpu", host: a.toLowerCase(), gpu: +b, key: rackOf(a)};
    if (a === "fields" || a === "agreements") return {view: a, key: a};
    if (/^cdu-[a-c]\d$/i.test(a) && CDU[a.toUpperCase()]) { const mi = b == null ? null : parseInt(b, 10); return {view: "cdu", cdu: a.toUpperCase(), minute: mi == null || Number.isNaN(mi) ? null : mi, key: a.toUpperCase(), fam: "cdu"}; }
    if (a === "cdu-fields" || a === "cdu-agreements") return {view: a, key: a, fam: "cdu"};
    if (a === "cdus" || /^cdu/i.test(a)) return {view: "cdus", key: "cdus", fam: "cdu"};
    const up = a.toUpperCase(), pf = famOf(up), mi = b == null ? null : parseInt(b, 10), pm = mi == null || Number.isNaN(mi) ? null : mi;
    if (pf) return {view: pf, dev: up, minute: pm, key: up, fam: "power"};
    if (a === "power-fields" || a === "power-agreements") return {view: a, key: a, fam: "power"};
    if (a === "power") return {view: "power", key: "power", fam: "power"};
    return {view: "gpus", key: "gpus"};
  }
  function show() {
    const seq = ++current, r = route(), fam = r.fam || "gpu";
    CH.clear(); gpuCtx = null; cduCtx = null; pmCtx = null; pwCtx = null;
    if (r.view === "rack") rackView(r.rack, r.hour, seq);
    else if (r.view === "gpu") gpuView(r.host, r.gpu, seq);
    else if (r.view === "fields") fields();
    else if (r.view === "agreements") agreements();
    else if (r.view === "cdus") cdusOverview(seq);
    else if (r.view === "cdu") r.minute == null ? cduView(r.cdu, seq) : cduMinuteView(r.cdu, r.minute, seq);
    else if (r.view === "cdu-fields") cduFields();
    else if (r.view === "cdu-agreements") cduAgreements();
    else if (r.view === "power") powerOverview(seq);
    else if (r.view === "ups" || r.view === "generator") r.minute == null ? (r.view === "ups" ? upsView(r.dev, seq) : genView(r.dev, seq)) : pMinuteView(r.dev, r.minute, seq);
    else if (r.view === "busway") runView(r.dev, r.minute, seq);
    else if (r.view === "tapoff") tapView(r.dev, r.minute, seq);
    else if (r.view === "power-fields") powerFields();
    else if (r.view === "power-agreements") powerAgreements();
    else overview(seq);
    document.querySelectorAll("#tree a").forEach(a => {
      const on = a.getAttribute("href") === "#" + r.key;
      a.classList.toggle("on", on);
      if (on) { let d = a.closest("details"); while (d) { d.open = true; d = d.parentElement.closest("details"); } }
    });
    document.querySelectorAll("#tree a[data-fam]").forEach(a => a.classList.toggle("on", a.dataset.fam === fam));
    document.querySelectorAll("#tree .famsec").forEach(s => s.classList.toggle("off", s.dataset.fam !== fam));
    if ((r.view !== "rack" || r.hour == null) && (r.view !== "cdu" || r.minute == null) && r.minute == null) main.scrollIntoView && window.scrollY > 200 && window.scrollTo(0, 0);
  }
  tree();
  window.addEventListener("hashchange", show);
  let lastW = chartWidth();
  window.addEventListener("resize", () => { const w = chartWidth(); if (Math.abs(w - lastW) > 40) { lastW = w; show(); } });
  show();
})();
</script>
</body>
</html>
