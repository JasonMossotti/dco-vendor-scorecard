<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alarm Board · Site AUS-1</title>
<style>
__SITENAV_CSS__
:root { --ink:#1e2933; --muted:#5b6774; --line:#d5dbe2; --panel:#f5f7f9; --bg:#eef1f4;
  --crit:#c0262d; --maj:#e07b00; --min:#d4b106; --clr:#3d8b5a; --oos:#b42318; --oow:#7a3fb8; --exp:#8a96a3;
  --ll:#b45309; --it:#1f5fbf; --hl:#fff3b0; }
* { box-sizing:border-box; }
body { margin:0; font:13px/1.4 "Inter","Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }
header.top { background:#fff; color:var(--ink); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
header.top a { color:var(--it); }
header.top strong { font-size:16px; }
.tabs button, .ctl button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); padding:4px 10px; border-radius:5px; cursor:pointer; }
.tabs button.on { background:var(--it); color:#fff; border-color:var(--it); }
main { margin:12px auto; max-width:1500px; padding:0 12px; }
section.view { background:#fff; border-radius:8px; padding:14px 16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
h1 { font-size:20px; margin:0 0 2px; } h2 { font-size:15px; margin:18px 0 8px; } .sub { color:var(--muted); margin:0 0 10px; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0; }
.chip { display:inline-flex; gap:6px; align-items:center; border:1px solid var(--line); border-radius:14px; padding:3px 10px; cursor:pointer; background:#fff; user-select:none; }
.chip b { font-variant-numeric:tabular-nums; } .chip i { width:10px; height:10px; border-radius:2px; display:inline-block; }
.chip.on { outline:2px solid var(--ink); } .chip.off { opacity:.45; }
.ctl label { color:var(--muted); font-size:12px; margin-right:4px; } .ctl select, .ctl input { font:inherit; padding:3px 6px; border:1px solid var(--line); border-radius:4px; }
.replay { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--panel); padding:6px 10px; border-radius:6px; }
.replay input[type=range] { flex:1; min-width:180px; } .clock { display:flex; flex-direction:column; min-width:150px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.25; }
.clock #utc { color:var(--muted); }
.wide { overflow-x:auto; }
table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap; }
th { background:var(--panel); font-weight:600; position:sticky; top:0; } td.sum { white-space:normal; min-width:260px; }
td.sev { width:6px; padding:0; } tr.critical td.sev { background:var(--crit); } tr.major td.sev { background:var(--maj); } tr.minor td.sev { background:var(--min); }
tr.cleared td.sev { background:var(--clr); } tr.cleared td { color:var(--muted); }
tr.out_of_scope { background:#fdeceb; } tr.out_of_window { background:#f3ecfb; } tr.expected td { color:var(--exp); }
tr.hl td { background:var(--hl) !important; } tr.row { cursor:pointer; } tr.detail td { white-space:normal; background:var(--panel); }
.badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; font-weight:600; color:#fff; }
.badge.out_of_scope { background:var(--oos); } .badge.out_of_window { background:var(--oow); } .badge.expected { background:var(--exp); }
.badge.Landlord { background:var(--ll); } .badge.IT { background:var(--it); } .badge.ok { background:var(--clr); } .badge.bad { background:var(--oos); } .badge.warn { background:var(--maj); }
.ack { font-weight:700; } .ack.no { color:var(--crit); } .ack.yes { color:var(--clr); }
.changes { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:8px; margin:8px 0; }
.ch { border:1px solid var(--line); border-left:4px solid var(--exp); border-radius:6px; padding:6px 10px; background:#fff; cursor:pointer; }
.ch.flag { border-left-color:var(--oos); } .ch.soon { border-left-style:dashed; border-left-color:var(--it); } .ch h3 { margin:0; font-size:13px; } .ch .n { color:var(--muted); font-size:12px; }
.note { font-size:12px; color:var(--muted); } .empty { color:var(--muted); padding:10px 0; }
ul.rules li { margin:4px 0; }
.modes { display:inline-flex; border:2px solid var(--ink); border-radius:8px; overflow:hidden; margin:0 0 10px; }
.modes button { font:inherit; font-weight:700; font-size:14px; padding:7px 18px; border:0; background:#fff; color:var(--ink); cursor:pointer; }
.modes button.on { background:var(--ink); color:#fff; } .modes button[data-mode=live].on { background:var(--crit); }
.livebadge { color:var(--crit); font-weight:700; } label.tog { font-size:12px; color:var(--ink); display:inline-flex; gap:4px; align-items:center; }
.alert { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:#fdeceb; border:1px solid var(--oos); border-left:6px solid var(--oos); border-radius:6px; padding:8px 10px; margin:8px 0; }
.alert button { font:inherit; border:1px solid var(--oos); background:#fff; color:var(--oos); padding:3px 10px; border-radius:5px; cursor:pointer; font-weight:600; }
.ch.soon.flag { border-left-color:var(--oos); }
button.link { font:inherit; border:0; background:none; color:var(--it); text-decoration:underline; cursor:pointer; padding:0; }
table.grid th, table.grid td { padding:2px 3px; text-align:center; font-size:11px; } table.grid td { border:1px solid #fff; }
.sw { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; } tr.escal td { background:#fff8e6; }
label.ck { display:inline-flex; align-items:center; gap:2px; margin-right:6px; font-size:12px; white-space:nowrap; } td.rcp { white-space:normal; min-width:260px; }
#matrix td.sum { min-width:180px; }
.panel { background:var(--panel); border-radius:6px; padding:4px 12px; } #matrix input { margin:0 3px; }
.ch .warn { color:var(--oos); font-size:12px; font-weight:600; margin-top:2px; }
.grp { display:inline-block; margin-left:6px; padding:0 7px; border:1px solid var(--it); border-radius:9px; font-size:11px; color:var(--it); background:#fff; cursor:pointer; white-space:nowrap; }
tr.child { background:#fafbfc; } tr.tk.closed td { color:var(--muted); } tr.tk[data-change] { cursor:pointer; }
svg.tl { width:100%; height:auto; display:block; min-width:640px; } tr.tlrow td { padding:0 6px 10px; } #tlwrap svg.tl { margin-bottom:4px; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:10; padding:16px; }
.modal .box { background:#fff; border-radius:8px; padding:14px 16px; width:min(780px,100%); max-height:92vh; overflow:auto; }
.modal textarea { width:100%; font:12px/1.45 ui-monospace,Consolas,monospace; border:1px solid var(--line); border-radius:4px; padding:8px; }
.split { display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,360px); gap:0 18px; align-items:start; }
.split > aside { border-left:1px solid var(--line); padding-left:16px; }
.ua { border:1px solid var(--line); border-left:4px solid var(--maj); border-radius:6px; padding:6px 10px; margin:8px 0; background:#fff; }
.ua.open { border-left-color:var(--oos); background:#fdf6f5; } .ua h3 { margin:0; font-size:13px; } .ua .n { color:var(--muted); font-size:12px; }
.ua .warn { color:var(--oos); font-size:12px; font-weight:600; margin-top:2px; } .ua .pend { color:var(--maj); font-weight:600; }
h2 .ctl select { font-size:12px; font-weight:400; padding:1px 4px; vertical-align:baseline; }
.replay button#play { min-width:64px; font-weight:600; background:rgba(61,139,90,.22); border-color:rgba(61,139,90,.65); color:#1d4a2c; }
.replay button#play.running { background:rgba(230,40,25,.6); border-color:#b42318; color:#4a0905; }
@media (max-width:900px) { .split { grid-template-columns:1fr; } .split > aside { border-left:0; padding-left:0; } }
@media (max-width:700px) { header.top { padding:8px 12px; } main { padding:0 8px; } section.view { padding:10px; } }
</style>
</head>
<body>
__SITENAV__
<header class="top">
  <div><strong>Alarm Board</strong></div>
  <div class="tabs" id="tabs">
    <button data-view="board">Board</button><button data-view="changes">Change work</button><button data-view="notify">Notifications</button><button data-view="about">How it works</button>
  </div>
</header>
<main id="doc"></main>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ms = iso => iso ? Date.parse(iso) : null;
const OFF = D.offset_h * 3600e3, MIN = 60e3, HOUR = 60 * MIN, DAY = 24 * HOUR;
const GRACE = D.declarations.length ? D.declarations[0].grace_min * MIN : 15 * MIN;
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const p2 = n => String(n).padStart(2, "0");
const W0 = ms(D.window.start), W1 = ms(D.window.end);
const A = D.alarms.map(a => ({...a, t:ms(a.raised), tc:ms(a.cleared), ta:ms(a.ack_at), keys:a.keys || []}));
const PA = (D.pending || []).map(p => ({...p, ws:ms(p.window_start), we:ms(p.window_end), sub:ms(p.steps[0].at),
  fa:ms(p.final_approved_at), df:ms(p.deferred_at), st:ms(p.work_started), en:ms(p.work_ended)}));
const TK = (D.tickets || []).map(k => ({...k, t:ms(k.opened), tc:ms(k.closed)}));
const CT = D.class_text, FLAG = ["out_of_scope", "out_of_window"], RANK = {minor:1, major:2, critical:3};
const A07_AT = ms(D.a07.overrun.raised) + 9 * MIN;   // #a07: during the rack A07 outage, just after the overrun alert
const SPEEDS = [[1, "Real time"], [60, "1 min per second"], [600, "10 min per second"], [3600, "1 h per second"]];
const LEADS = Array.from({length:12}, (_, i) => 2 * (i + 1));   // upcoming change work lead time: 2 to 24 hours
const TKWINS = Array.from({length:13}, (_, i) => 2 * i);         // closed tickets stay on the Tickets panel: 0 to 24 hours
const REAP = 6 * HOUR;    // cleared alarms stay on the live board this long
const SHIFT = 12 * HOUR;  // the shift handoff looks back one 12-hour shift
const SPAN = Math.floor((W1 - W0) / DAY) * DAY;   // whole days of sample the simulated live feed cycles through
const S = { view:"board", mode:"history", T:W0, shift:0, sev:new Set(), cls:new Set(), party:"all", hall:"all", from:W0, to:W1 - MIN, q:"", hl:"",
  change:"", open:new Set(), xopen:new Set(), timer:null, live:null, speed:3600, lead:6, tkwin:6, group:true, sound:false, seen:new Set(), heard:0, handoff:"" };

// Board times. On the live board the sample is re-dated by S.shift so it runs on the viewer's own clock.
const sh = () => (S.mode === "live" && S.view === "board") ? S.shift : 0;
const fmt = (t, off, sec) => { const d = new Date(t + off); return `${MON[d.getUTCMonth()]} ${d.getUTCDate()} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}${sec ? ":" + p2(d.getUTCSeconds()) : ""}`; };
const local = t => t == null ? "" : fmt(t + sh(), OFF, false);
const clock = (t, off) => fmt(t + sh(), off, true);
const zulu = t => t == null ? "" : new Date(t + sh()).toISOString().slice(0, 16).replace("T", " ") + "Z";
const hhmm = t => local(t).slice(-5);
const dur = m => m >= 60 ? `${Math.floor(m / 60)} h ${p2(m % 60)} min` : `${m} min`;
const meet = (x, y) => x.some(v => y.includes(v));
const assetsText = d => d.assets.map(x => x.replace("rack:", "rack ")).join(", ");
const assetsLoc = d => d.assets.map(x => x.replace("rack:", "")).join("|");   // data-loc: a pin opens the site drawing
const liveShift = wall => wall - (W0 + ((wall - W0) % SPAN + SPAN) % SPAN);   // whole days, so the time of day is the sample's
// The selected period, in site time (CDT) to the minute: S.from is its first minute and S.to its last.
const END = () => S.to + MIN;
const siteDate = t => new Date(t + OFF).toISOString().slice(0, 10), siteTime = t => new Date(t + OFF).toISOString().slice(11, 16);
const fromSite = (dt, hm) => Date.parse(`${dt}T${hm || "00:00"}:00Z`) - OFF;
const span = () => `${fmt(S.from, OFF, false)} to ${fmt(S.to, OFF, false)} CDT`;

const stateAt = (a, T) => (a.tc != null && a.tc <= T) ? "cleared" : "active";
const openAt = (k, T) => k.t <= T && (k.tc == null || k.tc > T);
function base(T) {
  const q = S.q.toLowerCase(), live = S.mode === "live";
  return A.filter(a => a.t <= T && (live ? (a.tc == null || a.tc > T - REAP) : (a.t >= S.from && a.t < END()))
    && (S.party === "all" || a.partner === S.party) && (S.hall === "all" || a.hall === S.hall)
    && (!S.change || a.change === S.change)
    && (!q || [a.id, a.device, a.summary, a.signal, a.location, a.change, a.ticket && a.ticket.id, a.source].join(" ").toLowerCase().includes(q)));
}
const sevKey = (a, T) => stateAt(a, T) === "cleared" ? "clear" : a.severity;
function visible(T) {
  return base(T).filter(a => (!S.sev.size || S.sev.has(sevKey(a, T))) && (!S.cls.size || S.cls.has(a.cls)));
}
function ticketAt(a, T) {
  const k = a.ticket; if (!k || ms(k.opened) > T) return ["", ""];
  return [k.id, (k.resolved && ms(k.resolved) <= T) ? "Resolved" : "Open"];
}
const partyBadge = p => `<span class="badge ${p === "Landlord" ? "Landlord" : "IT"}">${p === "Landlord" ? "Landlord" : "IT Partner"}</span>`;
const clsBadge = c => c === "not_change_work" ? "" : `<span class="badge ${c}">${esc(CT[c])}</span>`;

// Flood grouping: alarms on one ticket, or under a rack outage within 10 minutes, are one event.
const GK = {};
A.forEach(a => { if (a.ticket) GK[a.id] = "tk:" + a.ticket.id; });
A.filter(a => a.signal === "Rack outage").forEach(r => {
  const k = GK[r.id] || (GK[r.id] = "ro:" + r.id);
  A.forEach(a => { if (a !== r && !GK[a.id] && a.rack === r.rack && a.partner === r.partner && Math.abs(a.t - r.t) <= 10 * MIN) GK[a.id] = k; });
});
const pinned = (a, T) => FLAG.includes(a.cls) && stateAt(a, T) === "active";
function grouped(rows, T) {
  if (!S.group) return rows.map(a => [a, []]);
  const by = new Map(), out = [];
  rows.forEach(a => { const k = GK[a.id]; if (!k) out.push([a, []]); else if (by.has(k)) by.get(k)[1].push(a); else { const g = [a, []]; by.set(k, g); out.push(g); } });
  // The parent is a pinned flag if there is one, then a flag, then the most severe, then the earliest: a flag is never hidden.
  return out.map(([a, kids]) => {
    if (!kids.length) return [a, kids];
    const all = [a, ...kids].sort((x, y) => pinned(y, T) - pinned(x, T) || FLAG.includes(y.cls) - FLAG.includes(x.cls) || RANK[y.severity] - RANK[x.severity] || x.t - y.t);
    return [all[0], all.slice(1)];
  });
}

function chips(T) {
  const b = base(T);
  const n = k => b.filter(a => sevKey(a, T) === k).length, m = c => b.filter(a => a.cls === c).length;
  const sevs = [["critical","Critical","var(--crit)"],["major","Major","var(--maj)"],["minor","Minor","var(--min)"],["clear","Clear","var(--clr)"]];
  const cls = [["out_of_scope","Out of scope","var(--oos)"],["out_of_window","Out of window","var(--oow)"],["expected","Expected (change work)","var(--exp)"]];
  const c = (set, k, label, color, count, grp) => `<span class="chip ${set.size ? (set.has(k) ? "on" : "off") : ""}" data-grp="${grp}" data-k="${k}"><i style="background:${color}"></i>${label} <b>${count}</b></span>`;
  return `<div class="bar" id="chips">${sevs.map(([k,l,col]) => c(S.sev, k, l, col, n(k), "sev")).join("")}<span class="note">|</span>${cls.map(([k,l,col]) => c(S.cls, k, l, col, m(k), "cls")).join("")}</div>`;
}

// Change work: in progress, upcoming within the lead time, and what stands in the way of upcoming work.
const inProgress = T => D.declarations.filter(d => (ms(d.window_start) - GRACE <= T && T <= ms(d.window_end) + GRACE)
  || A.some(a => a.change === d.change_id && FLAG.includes(a.cls) && a.t <= T && stateAt(a, T) === "active"));
const upcoming = T => D.declarations.filter(d => ms(d.window_start) - GRACE > T && ms(d.window_start) <= T + S.lead * HOUR)
  .sort((x, y) => ms(x.window_start) - ms(y.window_start));
function warnings(d, T) {
  const sc = d.scope || d.assets;
  const tks = TK.filter(k => openAt(k, T) && meet(k.keys, sc) && meet(k.domains, d.domains));
  const ids = new Set(tks.map(k => k.id));
  const als = A.filter(a => a.t <= T && stateAt(a, T) === "active" && RANK[a.severity] >= 2 && a.cls !== "expected"
    && meet(a.keys, sc) && meet(a.domains, d.domains) && !(a.ticket && ids.has(a.ticket.id)));
  return [...D.conflicts.filter(c => c.changes.includes(d.change_id)).map(c => `Change conflict: ${c.text}`),
    ...tks.map(k => `Live trouble: ${k.device} has open ${k.id} (${k.priority}, ${k.summary})`),
    ...als.map(a => `Live trouble: ${a.device} has an active ${a.severity} alarm since ${hhmm(a.t)} CDT (${a.summary})`)];
}
function changePanel(T) {
  const act = inProgress(T);
  if (!act.length) return `<div class="empty" id="active-changes">No change work in progress at ${esc(local(T))} CDT.</div>`;
  return `<div class="changes" id="active-changes">${act.map(d => {
    const mine = A.filter(a => a.change === d.change_id && a.t <= T);
    const f = mine.filter(a => FLAG.includes(a.cls)).length, e = mine.filter(a => a.cls === "expected").length;
    return `<div class="ch ${f ? "flag" : ""}" data-change="${esc(d.change_id)}"><h3>${esc(d.change_id)} · ${partyBadge(d.owner)} ${esc(d.title)}</h3>
      <div class="n">Window ${esc(local(ms(d.window_start)))} to ${esc(local(ms(d.window_end)))} CDT · declared ${esc(assetsText(d))} · worst ${esc(d.max_severity)}</div>
      <div class="n">${e} expected · <b style="color:var(--oos)">${f} not reconciled</b></div></div>`; }).join("")}</div>`;
}
function upcomingPanel(T) {
  const up = upcoming(T);
  if (!up.length) return `<div class="empty" id="upcoming-changes">No change work scheduled to start in the next ${S.lead} hours.</div>`;
  return `<div class="changes" id="upcoming-changes">${up.map(d => { const w = warnings(d, T);
    return `<div class="ch soon${w.length ? " flag" : ""}" data-change="${esc(d.change_id)}"><h3>${esc(d.change_id)} · ${partyBadge(d.owner)} ${esc(d.title)}</h3>
      <div class="n">Starts in <b>${dur(Math.ceil((ms(d.window_start) - T) / MIN))}</b> · window ${esc(local(ms(d.window_start)))} to ${esc(local(ms(d.window_end)))} CDT</div>
      <div class="n">Declared ${esc(assetsText(d))} · worst ${esc(d.max_severity)}${d.redundancy_reduced ? " · reduces redundancy" : ""}</div>
      ${w.map(x => `<div class="warn">⚠ ${esc(x)}. Confirm before starting.</div>`).join("")}</div>`; }).join("")}</div>`;
}

// Scheduled change work without final approval from the Change Coordinator: due to start within the lead time,
// or already under way, and not yet approved or deferred. Facts from the change record and the partner's own work record.
const unapproved = T => PA.filter(p => p.sub <= T && p.ws <= T + S.lead * HOUR && T <= Math.max(p.we, p.en ?? 0)
  && !(p.fa != null && p.fa <= T) && !(p.df != null && p.df <= T)).sort((x, y) => x.ws - y.ws);
const dayOf = t => local(t).slice(0, -6);
const workRecord = p => p.owner === "Landlord" ? `Work order ${p.work_order} shows` : `${p.id} work notes show`;
function unapprovedPanel(T) {
  const ua = unapproved(T);
  if (!ua.length) return `<div class="empty" id="unapproved">Nothing scheduled in the next ${S.lead} hours is waiting on final approval.</div>`;
  return `<div id="unapproved">${ua.map(p => { const open = p.ws <= T, went = p.st != null && p.st <= T;
    const steps = p.steps.slice(1, -1).map(s => `${esc(s.step)} ✓ ${esc(dayOf(ms(s.at)))}`).join(" · ");
    return `<div class="ua${open ? " open" : ""}" data-pending="${esc(p.id)}"><h3>${esc(p.id)} · ${partyBadge(p.owner)} ${esc(p.title)}</h3>
      <div class="n">${open ? "Window" : `Starts in <b>${dur(Math.ceil((p.ws - T) / MIN))}</b> · window`} ${esc(local(p.ws))} to ${esc(hhmm(p.we))} CDT · <span data-loc="${esc(assetsLoc(p))}">${esc(assetsText(p))}</span></div>
      <div class="n">${steps} · <span class="pend">Change Coordinator final approval: not received</span></div>
      ${went ? `<div class="warn">⚠ ${esc(workRecord(p))} work started ${esc(hhmm(p.st))} CDT without final approval. The records do not reconcile.</div>`
        : open ? `<div class="warn">⚠ Window open since ${esc(hhmm(p.ws))} CDT without final approval. Work should not proceed.</div>` : ""}</div>`; }).join("")}</div>`;
}

// Tickets: open trouble tickets and change tickets, plus anything closed within the chosen time.
function ticketPanel(T) {
  const pr = p => +String(p).replace(/\D/g, "") || 9;
  const win = S.tkwin * HOUR;
  const tr = TK.filter(k => k.t <= T && (k.tc == null || k.tc > T - win) && (S.party === "all" || k.partner === S.party))
    .sort((x, y) => openAt(y, T) - openAt(x, T) || pr(x.priority) - pr(y.priority) || y.t - x.t);

// Per-change timeline: window and grace, each alarm from raised to cleared, and the notifications owed for it.
function timeline(d, T) {
  const ws = ms(d.window_start), we = ms(d.window_end);
  const all = A.filter(a => a.change === d.change_id).sort((x, y) => x.t - y.t);
  const owed = D.owed.filter(o => all.some(a => a.id === o.alarm));
  const due = o => ms(o.raised) + o.within_min * MIN;
  const x0 = Math.min(ws - HOUR, ...all.map(a => a.t - 15 * MIN));
  const x1 = Math.max(we + GRACE + HOUR, ...all.map(a => (a.tc ?? a.t) + 15 * MIN), ...owed.map(o => (o.sent ? ms(o.sent) : due(o)) + 15 * MIN));
  const W = 1000, PAD = 14, lane = 22, top = 40, H = top + lane * Math.max(1, all.length) + 6;
  const X = t => (PAD + (t - x0) / (x1 - x0) * (W - 2 * PAD)).toFixed(1);
  const seen = t => T == null || t <= T;
  const col = {expected:"var(--exp)", out_of_scope:"var(--oos)", out_of_window:"var(--oow)", not_change_work:"var(--muted)"};
  const stepH = [1, 2, 3, 6, 12, 24].find(h => (x1 - x0) / (h * HOUR) <= 9) || 24, step = stepH * HOUR;
  let s = "";
  for (let t = Math.ceil((x0 + OFF + sh()) / step) * step - OFF - sh(); t <= x1; t += step)
    s += `<line x1="${X(t)}" x2="${X(t)}" y1="14" y2="${H}" stroke="var(--line)"/><text x="${X(t)}" y="10" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(hhmm(t))}</text>`;
  s += `<rect x="${X(ws - GRACE)}" y="18" width="${X(we + GRACE) - X(ws - GRACE)}" height="10" fill="var(--it)" opacity=".18"><title>Grace: 15 minutes either side</title></rect>`;
  s += `<rect x="${X(ws)}" y="18" width="${X(we) - X(ws)}" height="10" rx="2" fill="var(--it)"><title>${esc(d.change_id)} window ${esc(local(ws))} to ${esc(hhmm(we))} CDT</title></rect>`;
  all.forEach((a, i) => {
    if (!seen(a.t)) return;
    const y = top + i * lane + 12, end = T == null ? (a.tc ?? x1) : Math.min(a.tc ?? Infinity, T), xa = +X(a.t);
    const label = `${a.device}: ${a.signal}`, right = xa > W * 0.62;
    s += `<g><title>${esc(a.id)} · ${esc(a.summary)} · ${esc(CT[a.cls] || "Not change work")} · ${esc(local(a.t))} CDT</title>
      <text x="${right ? X(end) : xa}" y="${y - 5}" font-size="10" fill="var(--ink)" text-anchor="${right ? "end" : "start"}">${esc(label)}</text>
      <line x1="${xa}" x2="${X(end)}" y1="${y}" y2="${y}" stroke="${col[a.cls]}" stroke-width="5" stroke-linecap="round"/></g>`;
    owed.filter(o => o.alarm === a.id).forEach(o => {
      if (seen(due(o))) s += `<line x1="${X(due(o))}" x2="${X(due(o))}" y1="${y - 6}" y2="${y + 6}" stroke="var(--ink)" stroke-dasharray="2 2"><title>${esc(o.rule)} due ${esc(hhmm(due(o)))} CDT</title></line>`;
      if (o.sent && seen(ms(o.sent))) { const xs = +X(ms(o.sent)), c = o.status === "on_time" ? "var(--clr)" : "var(--maj)";
        s += `<path d="M${xs} ${y - 6} L${xs + 6} ${y} L${xs} ${y + 6} L${xs - 6} ${y} Z" fill="${c}" stroke="#fff"><title>${esc(o.rule)} by ${esc(o.party)}: ${esc(o.status.replace("_", " "))} (sent ${esc(hhmm(ms(o.sent)))} CDT)</title></path>`; }
      else if (!o.sent && seen(due(o))) s += `<text x="${X(due(o))}" y="${y + 4}" font-size="13" font-weight="700" text-anchor="middle" fill="var(--crit)">✕<title>${esc(o.rule)} owed by ${esc(o.party)}: missing</title></text>`;
    });
  });
  if (T != null && T >= x0 && T <= x1) s += `<line x1="${X(T)}" x2="${X(T)}" y1="14" y2="${H}" stroke="var(--crit)" stroke-dasharray="4 3"><title>Now</title></line>`;
  return `<svg class="tl" data-change="${esc(d.change_id)}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Timeline of ${esc(d.change_id)}">${s}</svg>`;
}
const TL_LEGEND = `<p class="note">Blue bar: the declared window (pale: 15 minutes grace). Lines: each alarm from raised to cleared, colored by class. ◆ notification sent (green on time, orange late or incomplete); ✕ missing at its due time (dashed tick).</p>`;
function focusTimeline(T) {

  list(`Scheduled without the Change Coordinator's final approval, next ${S.lead} hours or under way`, unapproved(T).map(p =>

  const since = T - SHIFT, cleared = A.filter(a => a.tc != null && a.tc > since && a.tc <= T), closed = TK.filter(k => k.tc != null && k.tc > since && k.tc <= T);

  return L.join("\n");
}

  let last = Date.now();
  S.timer = setInterval(() => {
    const now = Date.now(); S.T = Math.min(W1, S.T + (now - last) * S.speed); last = now;
    if (S.T >= W1) stop();
    refresh();
  }, S.speed === 1 ? 1000 : 250);
}
// Simulated live feed: the board's time is the viewer's clock minus S.shift.
function stopLive() { if (S.live) { clearInterval(S.live); S.live = null; } }
function startLive(shift) {
  stopLive(); S.shift = shift; S.T = Date.now() - S.shift; S.seen = new Set(); S.heard = 0;
  S.live = setInterval(() => {
    if (Date.now() - S.shift >= W1) S.shift = liveShift(Date.now());
    S.T = Date.now() - S.shift;
    if (S.view === "board") refresh();
  }, 1000);
}
function setMode(m) {
  if (m === S.mode) return;
  stop(); stopLive(); S.mode = m; S.change = ""; S.handoff = ""; S.view = "board";
  if (m === "live") startLive(liveShift(Date.now()));
  else { S.shift = 0; S.T = S.from; S.seen = new Set(); S.heard = 0; }
  const hash = m === "live" ? "#live" : "#board";
  if (location.hash !== hash) history.replaceState(null, "", hash);
  render();
}
function go(view) { S.view = view; const hash = view === "board" && S.mode === "live" ? "#live" : "#" + view; if (location.hash !== hash) history.replaceState(null, "", hash); render(); }
function focusChange(id) {
  if (S.mode === "live") { S.change = S.change === id ? "" : id; S.view = "board"; return render(); }   // the live clock keeps running
  const d = D.declarations.find(x => x.change_id === id);
  stop(); S.change = id; S.view = "board"; history.replaceState(null, "", "#board");
  const flags = A.filter(a => a.change === id && FLAG.includes(a.cls));
  setT(Math.max(ms(d.window_end) + GRACE, ...flags.map(a => a.t)) + MIN);
}
function wire() {
  const $ = id => document.getElementById(id);
  if (S.view === "notify") {
    document.querySelectorAll("#matrix input[data-rc]").forEach(el => el.onchange = () => {
      const r = S.rc.rules[+el.dataset.rc], k = el.dataset.k, set = new Set(r[k]);
      el.checked ? set.add(el.dataset.v) : set.delete(el.dataset.v);
      r[k] = (k === "to" ? GROUPS : CHANNELS.map(c => c[0])).filter(x => set.has(x)); S.rcyaml = ""; render();
    });
    $("rcexport").onclick = () => { S.rcyaml = routingYaml(); render(); };
    $("rcreset").onclick = () => { S.rc = JSON.parse(JSON.stringify(D.routing)); S.rcyaml = ""; render(); };
    const lk = (id, k) => { $(id).onchange = e => { S.look[k] = e.target.value; $("lookup").innerHTML = lookupText(); }; };
    lk("lkday", "day"); lk("lktime", "time"); lk("lkevent", "event"); lk("lkdomain", "domain");
  }
  if ($("allrange")) $("allrange").onclick = () => setPeriod(W0, W1 - MIN);
  if (S.view !== "board") return;
  if (S.mode === "history") {
    $("t").oninput = e => { stop(); setT(+e.target.value); };
    document.querySelectorAll("[data-step]").forEach(b => b.onclick = () => { stop(); setT(S.T + (+b.dataset.step) * MIN); });
    $("end").onclick = () => { stop(); setT(W1); };
    $("play").onclick = () => { if (S.timer) stop(); else play(); refresh(); };
    $("speed").onchange = e => { S.speed = +e.target.value; if (S.timer) { stop(); play(); } };
    $("a07").onclick = () => { stop(); S.change = D.a07.change; S.seen = new Set(); S.heard = 0; setT(ms(D.a07.window_start) + MIN); };
    const period = e => {
      const f = fromSite($("from").value, $("fromtime").value), t = fromSite($("to").value, $("totime").value);
      if (isNaN(f) || isNaN(t)) return render();
      setPeriod(f, t, e.target.id);
    };
    ["from", "fromtime", "to", "totime"].forEach(id => $(id).onchange = period);
  } else {
    $("liveA07").onclick = () => { S.change = ""; startLive(Date.now() - (ms(D.a07.first_flag.raised) - 10 * MIN)); render(); };
    $("livenow").onclick = () => { S.change = ""; startLive(liveShift(Date.now())); render(); };
  }
  $("sound").onchange = e => { S.sound = e.target.checked; if (S.sound) beep(); };
  $("handoffbtn").onclick = () => { stop(); S.handoff = handoffText(S.T); render(); };
  if ($("handoff")) {
    const msg = t => { $("homsg").textContent = t; };
    $("hoclose").onclick = () => { S.handoff = ""; render(); };
    $("hocopy").onclick = () => {
      const fallback = () => { const ta = $("hotext"); ta.select(); try { document.execCommand("copy"); msg("Copied."); } catch (e) { msg("Select the text and copy it."); } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(S.handoff).then(() => msg("Copied."), fallback); else fallback();
    };
    $("hodl").onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([S.handoff + "\n"], {type:"text/plain"}));
      a.download = `AUS-1-shift-handoff-${local(S.T).replace(/[ :]/g, "-")}-CDT.txt`;
      document.body.appendChild(a); a.click(); a.remove(); msg("Downloaded.");
    };
  }
  $("lead").onchange = e => { S.lead = +e.target.value; refresh(); };
  $("tkwin").onchange = e => { S.tkwin = +e.target.value; refresh(); };
  $("group").onchange = e => { S.group = e.target.checked; refresh(); };
  $("party").onchange = e => { S.party = e.target.value; render(); };
  $("hall").onchange = e => { S.hall = e.target.value; render(); };
  const typed = (id, k) => { $(id).oninput = e => { S[k] = e.target.value; render(); const el = $(id); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }; };
  typed("q", "q"); typed("hl", "hl");
  if ($("clearchange")) $("clearchange").onclick = () => { S.change = ""; render(); };
  $("reset").onclick = () => { Object.assign(S, {sev:new Set(), cls:new Set(), party:"all", hall:"all", q:"", hl:"", change:""}); setPeriod(W0, W1 - MIN); };
}
// One click handler for everything that is redrawn while the clock runs (chips, cards, rows, groups, the banner).
document.getElementById("doc").addEventListener("click", e => {
  const c = sel => e.target.closest(sel);
  let el;
  if ((el = c("[data-mode]"))) return setMode(el.dataset.mode);
  if ((el = c("#alarms .grp"))) { const k = el.dataset.g; S.xopen.has(k) ? S.xopen.delete(k) : S.xopen.add(k); return refresh(); }
  if (c("#seen")) { pending(S.T).forEach(a => S.seen.add(a.id)); S.heard = 0; return refresh(); }
  if ((el = c("#chips .chip"))) { const set = S[el.dataset.grp]; set.has(el.dataset.k) ? set.delete(el.dataset.k) : set.add(el.dataset.k); return refresh(); }
  if ((el = c("#alarms tr.row"))) { const id = el.dataset.id; S.open.has(id) ? S.open.delete(id) : S.open.add(id); return refresh(); }
  if ((el = c("[data-change]")) && !c("svg")) return focusChange(el.dataset.change);
});
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { stop(); go(b.dataset.view); });
const h = location.hash.slice(1);
S.view = ["board", "changes", "notify", "about"].includes(h) ? h : "board";
if (h === "a07") S.T = A07_AT;   // a link straight to the rack A07 outage on the history board
if (h === "live") setMode("live"); else render();
</script>
