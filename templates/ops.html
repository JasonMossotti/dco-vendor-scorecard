<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operations · Site AUS-1</title>
<style>
__SITENAV_CSS__
:root { --ink:#1e2933; --muted:#5b6774; --line:#d5dbe2; --bg:#ffffff; --panel:#f5f7f9; --bad:#b42318; --good:#1d7a46; --warn:#9a6700;
        --grid:#eef1f4; --band:#fdecea; --it:#2a78d6; --ll:#eb6834; --fwd:#f7f9fc; --surge:#fff4d6; --freeze:#ece8fb; --fz:#6d4fc2; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.5 "Inter","Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:#eef1f4; }
header.top { background:#fff; border-bottom:1px solid var(--line); padding:0 24px; display:flex; flex-wrap:wrap; gap:4px 18px; align-items:center; }
header.top strong { font-size:16px; padding:12px 0; margin-right:10px; }
.views a { display:inline-block; padding:12px 10px 9px; color:var(--muted); text-decoration:none; border-bottom:3px solid transparent; }
.views a.on { color:var(--ink); font-weight:600; border-bottom-color:var(--it); }
main { max-width:1240px; margin:20px auto; background:var(--bg); padding:28px 36px; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
h1 { font-size:24px; margin:0 0 4px; } h2 { font-size:17px; margin:30px 0 10px; padding-bottom:4px; border-bottom:2px solid var(--ink); }
h3 { font-size:14px; margin:16px 0 6px; }
.sub { color:var(--muted); margin:0 0 12px; } .note { font-size:12px; color:var(--muted); }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin:14px 0; }
.tile { background:var(--panel); border-radius:8px; padding:12px 14px; }
.tile .k { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
.tile .v { font-size:26px; font-weight:700; line-height:1.2; } .tile .s { font-size:12px; color:var(--muted); }
.flag { display:inline-block; font-size:12px; font-weight:600; padding:1px 8px; border-radius:10px; white-space:nowrap; }
.flag.bad { background:var(--band); color:var(--bad); } .flag.ok { background:#e7f4ec; color:var(--good); } .flag.warn { background:var(--surge); color:var(--warn); }
.flag.fz { background:var(--freeze); color:var(--fz); } .flag.mute { background:var(--grid); color:var(--muted); }
table { width:100%; border-collapse:collapse; font-size:13px; } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { background:var(--panel); font-weight:600; } td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.nw { white-space:nowrap; } .wide { overflow-x:auto; }
.filters { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; font-size:13px; margin:10px 0; }
.filters select { font:inherit; font-size:13px; padding:3px 6px; border:1px solid var(--line); border-radius:6px; }
.legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--muted); margin:6px 0; align-items:center; }
.legend i { display:inline-block; width:12px; height:12px; border-radius:2px; margin-right:5px; vertical-align:-1px; border:1px solid var(--line); }
.cal { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); border-left:1px solid var(--line); border-top:1px solid var(--line); }
.cal .hd { font-size:12px; font-weight:600; color:var(--muted); padding:4px 6px; background:var(--panel); border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
.day { min-height:92px; padding:4px 5px 6px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); cursor:pointer; position:relative; font-size:12px; }
.day:hover { background:#f0f5ff; } .day.fwd { background:var(--fwd); } .day.freeze { background:var(--freeze); } .day.sel { outline:2px solid var(--it); outline-offset:-2px; }
.day.asof { border-left:3px solid var(--ink); }
.day .dn { display:flex; justify-content:space-between; align-items:center; gap:4px; font-weight:600; }
.day .dn .m { color:var(--muted); font-weight:400; }
.day .sg { font-size:10px; font-weight:700; color:var(--warn); background:var(--surge); border-radius:8px; padding:0 5px; }
.chip { display:block; margin-top:2px; padding:0 4px; border-radius:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-left:3px solid var(--muted); background:#fff; }
.chip.it { border-left-color:var(--it); } .chip.ll { border-left-color:var(--ll); } .chip.red { background:var(--band); color:var(--bad); font-weight:600; }
.chip.off { text-decoration:line-through; color:var(--muted); } .chip.dn { color:var(--muted); }
.chip.items { border-left-color:transparent; color:var(--muted); background:transparent; padding-left:0; }
.panel { background:var(--panel); border-radius:8px; padding:14px 16px; margin:14px 0; }
.tl { position:relative; height:auto; margin:8px 0 4px; }
.tl .ax { position:relative; height:18px; font-size:11px; color:var(--muted); margin-left:200px; }
.tl .ax span { position:absolute; transform:translateX(-50%); }
.tl .row { display:flex; align-items:center; height:24px; font-size:12px; }
.tl .lb { width:200px; flex:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:8px; }
.tl .tr { position:relative; flex:1; height:16px; background:repeating-linear-gradient(90deg, #fff 0, #fff calc(100%/24 - 1px), var(--line) calc(100%/24 - 1px), var(--line) calc(100%/24)); border-radius:3px; }
.tl .bar { position:absolute; top:0; height:100%; border-radius:3px; background:var(--muted); opacity:.85; }
.tl .bar.it { background:var(--it); } .tl .bar.ll { background:var(--ll); } .tl .bar.red { box-shadow:0 0 0 2px var(--bad); }
.tl .bar.dev { background:var(--ink); } .tl .bar.permit { background:var(--good); } .tl .bar.lock { background:var(--warn); }
.tl .bar.job { background:var(--muted); } .tl .bar.training { background:var(--fz); } .tl .bar.at { background:var(--bad); }
.tl .bar.out { background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0, rgba(255,255,255,.35) 4px, transparent 4px, transparent 8px); }
.kv { display:grid; grid-template-columns:150px 1fr; gap:3px 12px; font-size:14px; } .kv div:nth-child(odd) { color:var(--muted); }
a.job, a.fnd, a.dayl { color:var(--it); text-decoration:none; } a.job:hover, a.fnd:hover, a.dayl:hover { text-decoration:underline; }
.close { float:right; font:inherit; font-size:12px; border:1px solid var(--line); background:#fff; border-radius:6px; padding:2px 10px; cursor:pointer; }
ul.tight { margin:6px 0; padding-left:20px; } ul.tight li { margin:2px 0; }
@media (max-width:800px) { main { padding:18px 14px; } .day { min-height:64px; } .chip { font-size:10px; } .tl .lb { width:90px; } .tl .ax { margin-left:90px; } }
@media print { header.top, .filters { display:none !important; } body { background:#fff; } main { box-shadow:none; margin:0; max-width:none; padding:0; } }
</style>
</head>
<body>
__SITENAV__
<header class="top">
  <strong>Operations</strong>
  <nav class="views" aria-label="Operations views"><a href="#calendar" data-view="calendar">Calendar</a><a href="#ehs" data-view="ehs">Safety</a></nav>
</header>
<main id="doc"></main>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const C = D.calendar;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const md = d => { const [, m, dd] = d.split("-"); return `${MON[+m - 1]} ${+dd}`; };
const TZ = "America/Chicago";
const parts = iso => Object.fromEntries(new Intl.DateTimeFormat("en-US", {timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZoneName: "short"}).formatToParts(new Date(iso)).map(p => [p.type, p.value]));
const lday = iso => { const p = parts(iso); return `${p.year}-${p.month}-${p.day}`; };
const lhm = iso => { const p = parts(iso); return `${p.hour}:${p.minute}`; };
const lt = iso => { const p = parts(iso); return `${md(lday(iso))} ${p.hour}:${p.minute} ${p.timeZoneName}`; };
const lmin = iso => { const p = parts(iso); return (+p.hour) * 60 + (+p.minute); };
const JOBS = Object.fromEntries(C.jobs.map(j => [j.id, j]));
const FIND = Object.fromEntries(C.findings.map(f => [f.id, f]));
const hallName = h => h ? "Hall " + h.slice(-1) : "Site-wide";
const groupName = j => {
  if (j.takes === "feed") return `Rack ${j.rack} feeds, 2N`;
  const g = C.groups[j.group]; if (!g) return "";
  return `${g.name}${g.hall ? " (" + hallName(g.hall) + ")" : ""}, ${g.scheme}`;
};
const takes = j => j.takes === "pump" ? `Pump 2 of ${j.group.slice(6)}` : j.takes === "feed" ? `Feed ${j.unit.slice(-1)} of rack ${j.rack}`
  : j.takes === "none" ? "Nothing in a redundancy group" : j.unit;
const ownCls = o => o === "IT Partner" ? "it" : o === "Landlord" ? "ll" : "";
const IDX = Object.fromEntries(C.days.map((d, i) => [d, i]));
const isFwd = d => IDX[d] >= C.past_days;
const inFreeze = d => d >= C.freeze[0] && d <= C.freeze[1];
const jobDays = j => { const a = lday(j.start), b = lday(new Date(Date.parse(j.end) - 1000).toISOString()); return a === b ? [a] : [a, b]; };
const FILT = {source: "all", owner: "all", hall: "all", reduce: false, items: true};
const OPTS = {source: [["all", "All"], ...Object.entries(C.sources)], owner: [["all", "All"], ["IT Partner", "IT Partner"], ["Landlord", "Landlord"]],
  hall: [["all", "All"], ["HALL-A", "Hall A"], ["HALL-B", "Hall B"], ["site", "Site-wide"]]};

function jobLink(id) { return `<a class="job" href="#calendar/job/${esc(id)}">${esc(id)}</a>`; }
function findLink(id) { return `<a class="fnd" href="#calendar/finding/${esc(id)}">${esc(id)}</a>`; }
function dayLink(d) { return `<a class="dayl" href="#calendar/${esc(d)}">${esc(md(d))}</a>`; }

function shown(j) {
  if (FILT.source !== "all" && j.source !== FILT.source) return false;
  if (FILT.owner !== "all" && j.owner !== FILT.owner) return false;
  if (FILT.hall !== "all" && (FILT.hall === "site" ? j.hall !== null : j.hall !== FILT.hall)) return false;
  if (FILT.reduce && (j.takes === "none" || j.status === "deferred")) return false;
  return true;
}

function viewCalendar(sel) {
  const s = C.summary;
  const surgeFwd = Object.keys(C.surge).filter(isFwd).length, surgePast = Object.keys(C.surge).length - surgeFwd;
  const byDay = {};
  for (const j of C.jobs) if (shown(j)) for (const d of jobDays(j)) (byDay[d] = byDay[d] || []).push(j);
  const itemsByDay = {};
  for (const x of C.items) (itemsByDay[x.date] = itemsByDay[x.date] || []).push(x);
  const finDays = new Set(C.findings.map(f => f.date));
  let cells = WD.map(w => `<div class="hd">${esc(w)}</div>`).join("");
  for (const d of C.days) {
    const js = (byDay[d] || []).sort((a, b) => a.start < b.start ? -1 : 1);
    const it = itemsByDay[d] || [];
    const hb = it.filter(x => x.kind === "hallb").length, hc = it.filter(x => x.kind === "hallc").length;
    const cls = ["day", isFwd(d) ? "fwd" : "", inFreeze(d) ? "freeze" : "", d === C.as_of ? "asof" : "", d === sel ? "sel" : ""].join(" ");
    const dt = new Date(d + "T12:00:00Z");
    const label = dt.getUTCDate() === 1 || d === C.days[0] ? `${MON[dt.getUTCMonth()]} ${dt.getUTCDate()}` : String(dt.getUTCDate());
    cells += `<div class="${esc(cls)}" data-day="${esc(d)}" title="${esc(md(d))}${C.surge[d] ? " · surge day, " + esc(C.surge[d]) + " Hall B energizations" : ""}${inFreeze(d) ? " · first-compute freeze" : ""}">
      <div class="dn"><span>${esc(label)}</span>${C.surge[d] ? `<span class="sg">Surge ${esc(C.surge[d])}</span>` : ""}</div>
      ${js.slice(0, 5).map(j => `<span class="chip ${ownCls(j.owner)} ${j.findings.length ? "red" : ""} ${j.status === "deferred" ? "off" : ""} ${j.takes === "none" ? "dn" : ""}" title="${esc(j.id + ": " + j.title)}">${esc(j.id)}</span>`).join("")}
      ${js.length > 5 ? `<span class="chip items">+${esc(js.length - 5)} more</span>` : ""}
      ${FILT.items && hb ? `<span class="chip items">Hall B: ${esc(hb)} milestone${hb > 1 ? "s" : ""}</span>` : ""}
      ${FILT.items && hc ? `<span class="chip items">Hall C: ${esc(hc)} script${hc > 1 ? "s" : ""}</span>` : ""}
    </div>`;
  }
  const opt = (k, vals) => `<select data-f="${esc(k)}">${vals.map(([v, t]) => `<option value="${esc(v)}"${FILT[k] === v ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
  return `<h1>Maintenance and change calendar</h1>
  <p class="sub">Every booked job at the site on one calendar, from ${esc(md(C.days[0]))} to Hall C first compute on ${esc(md(C.first_compute))}, checked against the redundancy groups Site health uses. Times are Central. The data weeks come from the records as they are; from ${esc(md(C.as_of))} on it is the forward schedule.</p>
  <div class="tiles">
    <div class="tile"><div class="k">Data weeks</div><div class="v">${esc(s.past.jobs)} jobs</div><div class="s">${esc(s.past.findings)} findings, as found</div></div>
    <div class="tile"><div class="k">Forward look</div><div class="v">${esc(s.forward.jobs)} jobs</div><div class="s">${esc(s.forward.findings)} conflicts to move before they happen</div></div>
    <div class="tile"><div class="k">Surge days</div><div class="v">${esc(surgePast + surgeFwd)}</div><div class="s">${esc(surgePast)} in the data weeks, ${esc(surgeFwd)} ahead (${esc(C.surge_min)}+ Hall B energizations)</div></div>
    <div class="tile"><div class="k">First-compute freeze</div><div class="v">${esc(md(C.freeze[0]))} to ${esc(md(C.freeze[1]))}</div><div class="s">${esc(C.freeze_days)} days, site-wide groups and Hall C</div></div>
  </div>
  <div class="filters">
    <label>Source ${opt("source", OPTS.source)}</label>
    <label>Owner ${opt("owner", OPTS.owner)}</label>
    <label>Where ${opt("hall", OPTS.hall)}</label>
    <label><input type="checkbox" data-f="reduce"${FILT.reduce ? " checked" : ""}> Only jobs that take a unit out</label>
    <label><input type="checkbox" data-f="items"${FILT.items ? " checked" : ""}> Hall B milestones and Hall C scripts</label>
  </div>
  <div class="legend"><span><i style="background:#fff;border-left:3px solid var(--it)"></i>IT Partner</span><span><i style="background:#fff;border-left:3px solid var(--ll)"></i>Landlord</span>
    <span><i style="background:var(--band)"></i>In a finding</span><span><i style="background:var(--surge)"></i>Surge day</span><span><i style="background:var(--freeze)"></i>Freeze</span>
    <span><i style="background:var(--fwd)"></i>Forward schedule</span><span>Grey text: takes nothing out · struck through: deferred</span></div>
  <div class="cal" id="cal" data-gl-skip>${cells}</div>
  <div id="detail"></div>
  <h2>Findings</h2>
  <p class="note">A finding means the bookings do not reconcile with each other or with what the devices recorded. It starts a planning action, not a judgment of anyone.</p>
  <div class="wide"><table><tr><th>ID</th><th>Period</th><th>Kind</th><th>Jobs</th><th>When</th><th>Owner</th><th>What</th></tr>
  ${C.findings.map(f => `<tr><td class="nw">${findLink(f.id)}</td><td>${f.period === "past" ? "Data weeks" : "Forward"}</td><td>${esc(f.title)}</td>
    <td class="nw">${f.jobs.map(jobLink).join(", ")}</td><td class="nw">${esc(lt(f.at))}</td><td>${esc(f.owners.join(", "))}</td><td>${esc(f.text)}</td></tr>`).join("")}</table></div>
  <h2>Agreements with the records (data weeks)</h2>
  <table><tr><th>Agreement</th><th class="n">Cases</th><th class="n">Agree</th><th class="n">Explained by a finding</th></tr>
  ${C.agreements.map(a => `<tr><td>${esc(a.title)}</td><td class="n">${esc(a.checked)}</td><td class="n">${esc(a.checked - a.misses.length)}</td><td class="n">${esc(a.explained)}</td></tr>`).join("")}</table>
  <h2>How it works</h2>
  <ul class="tight">
    <li><b>Sources.</b> The Customer CAB's changes, the Landlord's MOPs, the change-approval queue, the Landlord's maintenance records, both partners' Hall B Jira milestones, and the Hall C commissioning scripts. A MOP or CAB change keeps its approved window; maintenance without a MOP uses what the device recorded (the chiller's lockout in the BMS, the engine's run in the EMCP record).</li>
    <li><b>What a job takes out.</b> Read from its title: a CDU filter change isolates one of the CDU's two pumps, UPS maintenance puts the UPS on maintenance bypass, chiller maintenance locks the chiller out, a tap-off retorque opens one feed of the rack. Where the change has an impact declaration, the two must agree.</li>
    <li><b>The four checks.</b> Two jobs in one redundancy group at once, below N. Work on both feeds of one rack at once. A unit out of a Hall B or site-wide group on a surge day (${esc(C.surge_min)} or more Hall B energizations: HO-4 tap-offs and rack power-ons). Work that takes a site-wide unit out, or Hall C work outside the commissioning plan, in the ${esc(C.freeze_days)} days before first compute.</li>
    <li><b>The devices.</b> In the data weeks, every device action on a job's equipment that starts inside the job's window must end inside it; one that runs past is a finding.</li>
    <li><b>Forward schedule.</b> Placed by the planner's own rules with one planted conflict of each kind; the checks never read the answer key. Report: <code>reports/change_calendar.md</code>.</li>
  </ul>`;
}

function span(a, start, end) {
  const s0 = lday(start) === a ? lmin(start) : 0;
  const e0 = lday(new Date(Date.parse(end) - 1000).toISOString()) === a ? lmin(end) || 1440 : 1440;
  return `left:${(s0 / 14.4).toFixed(2)}%;width:${Math.max(0.6, (e0 - s0) / 14.4).toFixed(2)}%`;
}

function timeline(d, js, ev = []) {
  const ax = Array.from({length: 6}, (_, i) => i * 4).map(h => `<span style="left:${esc(h / 24 * 100)}%">${esc(String(h).padStart(2, "0"))}:00</span>`).join("");
  const rows = js.map(j => `<div class="row"><div class="lb">${jobLink(j.id)}</div><div class="tr"><span class="bar ${ownCls(j.owner)} ${j.findings.length ? "red" : ""} ${j.takes !== "none" ? "out" : ""}" style="${esc(span(d, j.start, j.end))}" title="${esc(j.id + " " + lhm(j.start) + " to " + lhm(j.end))}"></span></div></div>`).join("")
    + ev.map(e => `<div class="row"><div class="lb" title="${esc(e.label)}">${esc(e.label)}</div><div class="tr"><span class="bar dev" style="${esc(span(d, e.start, e.end))}" title="${esc(e.label + " " + lhm(e.start) + " to " + lhm(e.end))}"></span></div></div>`).join("");
  return `<div class="tl"><div class="ax">${ax}</div>${rows}</div>`;
}

function dayPanel(d) {
  const js = C.jobs.filter(j => jobDays(j).includes(d)).sort((a, b) => a.start < b.start ? -1 : 1);
  const it = C.items.filter(x => x.date === d);
  const fs = C.findings.filter(f => f.date === d || f.jobs.some(id => jobDays(JOBS[id]).includes(d)));
  const flags = [C.surge[d] ? `<span class="flag warn">Surge day: ${esc(C.surge[d])} Hall B energizations</span>` : "",
                 inFreeze(d) ? `<span class="flag fz">First-compute freeze</span>` : "", isFwd(d) ? `<span class="flag mute">Forward schedule</span>` : ""].join(" ");
  return `<div class="panel" id="daypanel"><button class="close" data-close>Close</button><h3>${esc(md(d))}, ${esc(d.slice(0, 4))} ${flags}</h3>
    ${js.length ? timeline(d, js) : `<p class="note">No jobs booked.</p>`}
    ${js.length ? `<table><tr><th>Job</th><th>Window</th><th>Owner</th><th>What</th><th>Takes out</th><th>Status</th></tr>${js.map(j => `<tr><td class="nw">${jobLink(j.id)}</td>
      <td class="nw">${esc(lhm(j.start))} to ${esc(lhm(j.end))}</td><td>${esc(j.owner)}</td><td>${esc(j.title)}</td><td>${esc(takes(j))}</td><td>${esc(j.status)}</td></tr>`).join("")}</table>` : ""}
    ${it.length ? `<h3>Hall B milestones and Hall C scripts</h3><ul class="tight">${it.map(x => `<li>${esc(x.id)}: ${esc(x.title)} (${esc(x.state)})${x.energization ? ` <span class="flag warn">energization</span>` : ""}</li>`).join("")}</ul>` : ""}
    ${fs.length ? `<h3>Findings</h3><ul class="tight">${fs.map(f => `<li>${findLink(f.id)}: ${esc(f.text)}</li>`).join("")}</ul>` : ""}</div>`;
}

function jobPanel(id) {
  const j = JOBS[id]; if (!j) return "";
  const g = j.group && C.groups[j.group];
  return `<div class="panel" id="jobpanel"><button class="close" data-close>Close</button><h3>${esc(j.id)}: ${esc(j.title)}</h3><div class="kv">
    <div>Source</div><div>${esc(C.sources[j.source])}</div><div>Owner</div><div>${esc(j.owner)}</div>
    <div>Window</div><div>${esc(lt(j.start))} to ${esc(lt(j.end))} (${dayLink(lday(j.start))})</div><div>Status</div><div>${esc(j.status)}</div>
    <div>Takes out</div><div>${esc(takes(j))}</div>
    ${j.takes !== "none" ? `<div>Redundancy group</div><div>${esc(groupName(j))}${g ? ` (${esc(g.units)} units, N = ${esc(g.need)})` : ""}</div>` : ""}
    <div>Where</div><div>${esc(hallName(j.hall))}</div>
    ${j.refs.length ? `<div>Records</div><div>${esc(j.refs.join(", "))}</div>` : ""}
    ${j.note ? `<div>Note</div><div>${esc(j.note)}</div>` : ""}
    <div>Findings</div><div>${j.findings.length ? j.findings.map(f => findLink(f) + ": " + esc(FIND[f].title)).join("<br>") : "None"}</div></div></div>`;
}

function findingPanel(id) {
  const f = FIND[id]; if (!f) return "";
  const js = f.jobs.map(x => JOBS[x]);
  return `<div class="panel" id="findpanel"><button class="close" data-close>Close</button><h3>${esc(f.id)}: ${esc(f.title)} <span class="flag ${f.period === "past" ? "mute" : "bad"}">${f.period === "past" ? "Data weeks, as found" : "Forward schedule"}</span></h3>
    <p>${esc(f.text)}</p>
    ${timeline(f.date, js, f.evidence || [])}
    ${f.evidence ? `<p class="note">Bars: the booked window, then what each device recorded (dark).</p>` : ""}
    <div class="kv"><div>When</div><div>${esc(lt(f.at))} to ${esc(lt(f.until))} (${dayLink(f.date)})</div><div>Owner</div><div>${esc(f.owners.join(", "))}</div>
    <div>Jobs</div><div>${js.map(j => `${jobLink(j.id)} ${esc(j.title)}, ${esc(lhm(j.start))} to ${esc(lhm(j.end))}`).join("<br>")}</div>
    <div>Action</div><div>${esc(f.action)}</div></div></div>`;
}

// ---------------------------------------------------------------- Safety (EHS)
const S = D.ehs;
const PT = S.permit_types;
const PERM = Object.fromEntries(S.permits.map(p => [p.permit, p]));
const SFIND = Object.fromEntries(S.findings.map(f => [f.id, f]));
const PERM_BY_JOB = {};
for (const p of S.permits) (PERM_BY_JOB[p.job] = PERM_BY_JOB[p.job] || []).push(p);
const FILT_E = {ptype: "all", partner: "all", flagged: false};
const OPTS_E = {ptype: [["all", "All"], ...Object.entries(PT).filter(([k]) => S.permits.some(p => p.type === k)).map(([k, v]) => [k, v.name])],
  partner: [["all", "All"], ["landlord", "Landlord"], ["it", "IT Partner"]]};
const EVN = {near_miss: "Near miss", stop_work: "Stop-work use", first_aid: "First aid", recordable: "Recordable"};
const num = (n, d = 0) => Number(n).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const pcls = k => k === "it" ? "it" : k === "landlord" ? "ll" : "";

function permLink(id) { return `<a class="job" href="#ehs/permit/${esc(id)}">${esc(id)}</a>`; }
function sfLink(id) { return `<a class="fnd" href="#ehs/finding/${esc(id)}">${esc(id)}</a>`; }
function refLink(r) { return PERM[r] ? permLink(r) : esc(r); }

function rangeTl(rows) {
  const t0 = Math.min(...rows.map(r => Date.parse(r.start))), t1 = Math.max(...rows.map(r => Date.parse(r.end)));
  const pad = Math.max(15 * 60e3, (t1 - t0) * 0.06), a = t0 - pad, W = t1 + pad - a;
  const long = W > 3 * 864e5;
  const tick = t => { const iso = new Date(t).toISOString(); return long ? `${md(lday(iso))} ${lday(iso).slice(0, 4)}` : (W > 864e5 ? md(lday(iso)) + " " : "") + lhm(iso); };
  const ax = [0.1, 0.3, 0.5, 0.7, 0.9].map(f => `<span style="left:${esc((f * 100).toFixed(1))}%">${esc(tick(a + f * W))}</span>`).join("");
  const bar = r => { const s = (Date.parse(r.start) - a) / W * 100, w = Math.max(0.5, (Date.parse(r.end) - Date.parse(r.start)) / W * 100);
    return `<span class="bar ${esc(r.cls)}" style="left:${esc(s.toFixed(2))}%;width:${esc(w.toFixed(2))}%" title="${esc(r.label + ": " + lt(r.start) + " to " + lt(r.end))}"></span>`; };
  return `<div class="tl"><div class="ax">${ax}</div>${rows.map(r => `<div class="row"><div class="lb" title="${esc(r.label)}">${esc(r.label)}</div><div class="tr" style="background:#fff;border:1px solid var(--line)">${bar(r)}</div></div>`).join("")}</div>`;
}

function permitRows(p) {
  const rows = [{label: `${p.permit} open`, start: p.issued, end: p.closed, cls: "permit"}];
  if (p.lock_on) rows.push({label: "Lockout", start: p.lock_on, end: p.lock_off, cls: "lock"});
  if (p.device) rows.push({label: `${p.point} isolated (device)`, start: p.device[0], end: p.device[1], cls: "dev"});
  if (p.start) rows.push({label: `${p.job} work`, start: p.start, end: p.end, cls: "job"});
  return rows;
}

function trainingList(rows) {
  const by = {};
  for (const r of rows) (by[r.person] = by[r.person] || []).push(r);
  return Object.entries(by).map(([who, cs]) => `<div>${esc(who)} (${esc((S.people[who] || ["", ""])[1].replace("_", " "))}): ${cs.map(c =>
    `${esc(c.name)} <span class="flag ${c.current ? "ok" : "bad"}">${c.current ? "current" + (c.expires ? ", expires " + esc(c.expires.slice(0, 10)) : "") : (c.expires ? "lapsed, expired " + esc(c.expires.slice(0, 10)) : "never recorded")}</span>`).join(" ")}</div>`).join("");
}

function permitPanel(id) {
  const p = PERM[id]; if (!p) return "";
  const t = PT[p.type];
  return `<div class="panel" id="permitpanel"><button class="close" data-close="ehs">Close</button><h3>${esc(p.permit)}: ${esc(t.name)} permit ${p.findings.length ? `<span class="flag bad">In a finding</span>` : ""}</h3>
    ${rangeTl(permitRows(p))}
    <p class="note">Bars: the permit open (green), the lockout (amber), what the device recorded (dark), the job's work (grey).</p>
    <div class="kv"><div>Job</div><div>${esc(p.job)}: ${esc(p.title)} (${esc(S.sources[p.source] || "")})</div>
    <div>Partner</div><div>${esc(S.partners[p.partner])}</div><div>Rule</div><div>${esc(t.rule)}</div>
    ${p.point ? `<div>Point</div><div>${esc(p.point)}${p.room ? " (" + esc(p.room) + ")" : ""}</div>` : ""}
    <div>Issued</div><div>${esc(lt(p.issued))} by the ${esc(p.issuer)}${p.approved ? `; approved by the Customer ${esc(lt(p.approved))}` : ""}</div>
    ${p.lock_on ? `<div>Lockout</div><div>${esc(lt(p.lock_on))} to ${esc(lt(p.lock_off))}</div>` : ""}
    <div>Closed</div><div>${esc(lt(p.closed))}</div>
    <div>Work</div><div>${esc(lt(p.start))} to ${esc(lt(p.end))}</div>
    <div>Named</div><div>${trainingList(p.training)}${p.attendant ? `<div class="note">${esc(p.attendant)} is the second person outside the boundary.</div>` : ""}</div>
    <div>Findings</div><div>${p.findings.length ? p.findings.map(f => sfLink(f) + ": " + esc(SFIND[f].title)).join("<br>") : "None"}</div></div></div>`;
}

function safetyFindingPanel(id) {
  const f = SFIND[id]; if (!f) return "";
  const ev = (f.evidence || []).map(e => ({label: e.label, start: e.start, end: e.end, cls: e.kind === "device" ? "dev" : e.kind}));
  const work = f.kind === "untrained" ? f.refs.slice(1).map(r => PERM[r] ? {label: `${r} work`, start: PERM[r].start, end: PERM[r].end, cls: "at"} : null).filter(Boolean) : [];
  return `<div class="panel" id="sfpanel"><button class="close" data-close="ehs">Close</button><h3>${esc(f.id)}: ${esc(f.title)}</h3>
    <p>${esc(f.text)}</p>
    ${ev.length || work.length ? rangeTl(ev.concat(work)) : ""}
    ${f.badges && f.badges.length ? `<h3>Badge-ins that day</h3><ul class="tight">${f.badges.map(b => `<li>${esc(lt(b.at))}: ${esc(b.where)}</li>`).join("")}</ul>` : ""}
    <div class="kv"><div>When</div><div>${esc(lt(f.at))}</div><div>Owner</div><div>${esc(f.owner)}</div>
    <div>Records</div><div>${f.refs.map(refLink).join(", ")}</div>
    <div>Action</div><div>${esc(f.action)}</div></div></div>`;
}

function shownPermit(p) {
  if (FILT_E.ptype !== "all" && p.type !== FILT_E.ptype) return false;
  if (FILT_E.partner !== "all" && p.partner !== FILT_E.partner) return false;
  if (FILT_E.flagged && !p.findings.length) return false;
  return true;
}

function viewEhs(sel) {
  const R = S.report, P = S.partners, sm = S.summary;
  const tot = k => Object.values(R).reduce((a, r) => a + r[k], 0);
  const opt = (k, vals) => `<select data-fe="${esc(k)}">${vals.map(([v, t]) => `<option value="${esc(v)}"${FILT_E[k] === v ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
  const ps = S.permits.filter(shownPermit);
  const byType = Object.entries(PT).map(([k, v]) => [v.name, S.permits.filter(p => p.type === k).length]).filter(x => x[1]);
  const end = new Date(Date.parse(S.window.end) - 864e5).toISOString();
  return `<h1>Safety (EHS)</h1>
  <p class="sub">The contract's monthly EHS report by partner, ${esc(md(S.window.start.slice(0, 10)))} to ${esc(md(end.slice(0, 10)))}, and four checks of the work permits and training records against the job records, the badge records, and what the devices recorded. Times are Central.</p>
  <div class="tiles">
    <div class="tile"><div class="k">Hours worked</div><div class="v">${esc(num(tot("hours")))}</div><div class="s">${Object.entries(R).map(([k, r]) => esc(P[k]) + " " + esc(num(r.hours))).join(" · ")}</div></div>
    <div class="tile"><div class="k">Recordables</div><div class="v">${esc(tot("recordables"))}</div><div class="s">TRIR ${esc((tot("recordables") * 200000 / tot("hours")).toFixed(2))} per 200,000 hours</div></div>
    <div class="tile"><div class="k">Reported</div><div class="v">${esc(tot("near_miss") + tot("stop_work"))}</div><div class="s">${esc(tot("near_miss"))} near misses, ${esc(tot("stop_work"))} stop-work uses, ${esc(tot("first_aid"))} first aid; never findings</div></div>
    <div class="tile"><div class="k">Permits</div><div class="v">${esc(sm.permits)}</div><div class="s">${byType.map(([n, c]) => esc(n) + " " + esc(c)).join(" · ")}</div></div>
    <div class="tile"><div class="k">Records that do not reconcile</div><div class="v">${esc(sm.findings)}</div><div class="s">each opens a Customer EHS investigation</div></div>
  </div>
  <h2>Monthly EHS report</h2>
  <div class="wide"><table><tr><th>Partner</th><th class="n">Hours worked</th><th class="n">Recordables</th><th class="n">TRIR</th><th class="n">DART rate</th><th class="n">Near misses</th><th class="n">Stop-work uses</th><th class="n">First aid</th><th class="n">Permits issued</th><th class="n">Open corrective actions</th></tr>
  ${Object.entries(R).map(([k, r]) => `<tr><td>${esc(P[k])}</td><td class="n">${esc(num(r.hours, 1))}</td><td class="n">${esc(r.recordables)}</td><td class="n">${esc(r.trir.toFixed(2))}</td><td class="n">${esc(r.dart_rate.toFixed(2))}</td><td class="n">${esc(r.near_miss)}</td><td class="n">${esc(r.stop_work)}</td><td class="n">${esc(r.first_aid)}</td><td class="n">${esc(r.permits)}</td><td class="n">${esc(r.open_actions)}</td></tr>`).join("")}</table></div>
  <p class="note">Hours worked come from the badge records: the IT Partner's main door in to out, each Landlord shift the engineer badged in for, each Security Partner post shift the guard badged in at the post for. Rates are per 200,000 hours.</p>
  <h2>Work permits</h2>
  <div class="filters">
    <label>Type ${opt("ptype", OPTS_E.ptype)}</label>
    <label>Partner ${opt("partner", OPTS_E.partner)}</label>
    <label><input type="checkbox" data-fe="flagged"${FILT_E.flagged ? " checked" : ""}> Only permits in a finding</label>
  </div>
  <div class="wide" data-gl-skip><table id="permits"><tr><th>Permit</th><th>Type</th><th>Job</th><th>Work</th><th>Named</th><th>Findings</th></tr>
  ${ps.map(p => `<tr${p.permit === sel ? ' style="background:#f0f5ff"' : ""}><td class="nw">${permLink(p.permit)}</td><td>${esc(PT[p.type].name)}</td>
    <td><span class="chip ${pcls(p.partner)}" style="display:inline-block;margin:0 4px 0 0;vertical-align:baseline">${esc(p.job)}</span> ${esc(p.title)}</td><td class="nw">${esc(lt(p.start))} to ${esc(lhm(p.end))}</td>
    <td>${esc(p.workers.join(", "))}${p.attendant ? "; second person " + esc(p.attendant) : ""}</td><td class="nw">${p.findings.map(sfLink).join(", ")}</td></tr>`).join("")}</table></div>
  <p class="note">${esc(ps.length)} of ${esc(S.permits.length)} permits shown.</p>
  <div id="detail"></div>
  <h2>Findings</h2>
  <p class="note">A finding means the permit, training, badge, and device records do not reconcile. It opens an investigation by Customer EHS, which decides any violation class; it is not a judgment of anyone.</p>
  <div class="wide"><table><tr><th>ID</th><th>Kind</th><th>Records</th><th>When</th><th>Owner</th><th>What</th></tr>
  ${S.findings.map(f => `<tr${f.id === sel ? ' style="background:#f0f5ff"' : ""}><td class="nw">${sfLink(f.id)}</td><td>${esc(f.title)}</td><td>${f.refs.map(refLink).join(", ")}</td><td class="nw">${esc(lt(f.at))}</td><td>${esc(f.owner)}</td><td>${esc(f.text)}</td></tr>`).join("")}</table></div>
  <h2>Agreements with the records</h2>
  <table><tr><th>Agreement</th><th class="n">Cases</th><th class="n">Agree</th><th class="n">Explained by a finding</th></tr>
  ${S.agreements.map(a => `<tr><td>${esc(a.title)}</td><td class="n">${esc(a.checked)}</td><td class="n">${esc(a.checked - a.misses.length)}</td><td class="n">${esc(a.explained)}</td></tr>`).join("")}</table>
  <h2>Training records</h2>
  <table><tr><th>Course</th><th class="n">Renewal</th><th class="n">People holding it</th><th class="n">Current at month end</th><th>Lapsed</th><th class="n">Expiring in 60 days</th></tr>
  ${S.courses.map(c => `<tr><td>${esc(c.name)}</td><td class="n">${esc(c.months)} months</td><td class="n">${esc(c.holders)}</td><td class="n">${esc(c.current)}</td><td>${c.lapsed.length ? `<span class="flag bad">${esc(c.lapsed.join(", "))}</span>` : ""}</td><td class="n">${esc(c.expiring.length)}</td></tr>`).join("")}</table>
  <h2>Reported events</h2>
  <p class="note">Near misses, stop-work uses, first aid cases, and recordables are reported and counted. They are never findings and never count against anyone (29 CFR 1904.35).</p>
  <div class="wide"><table><tr><th>Event</th><th>Kind</th><th>Partner</th><th>When</th><th>Where</th><th>What</th><th>Corrective action</th></tr>
  ${S.events.map(x => `<tr><td class="nw">${esc(x.event)}</td><td>${esc(EVN[x.kind])}</td><td>${esc(P[x.partner])}</td><td class="nw">${esc(lt(x.at))}</td><td>${esc(x.where)}</td><td>${esc(x.what)}</td>
    <td>${esc(x.action)} ${x.action_closed ? `<span class="flag ok">closed ${esc(md(x.action_closed.slice(0, 10)))}</span>` : `<span class="flag warn">open, due ${esc(md(x.action_due.slice(0, 10)))}</span>`}</td></tr>`).join("")}</table></div>
  <h2>Post-incident reviews</h2>
  <ul class="tight">${S.pir.map(p => `<li><b>${esc(p.pir)}</b> (${esc(p.injuries)} injuries) ${p.referred ? `<span class="flag warn">Referred to Customer EHS</span>` : ""}: ${esc(p.screening)} ${esc(p.referral)}</li>`).join("")}</ul>
  <h2>How it works</h2>
  <ul class="tight">
    <li><b>Which jobs need a permit.</b> From the records: a tap-off retorque, a UPS maintenance, a CDU filter change, and a chiller maintenance need a lockout (EHS-R2); a new tap-off onto live busway needs an energized work permit approved in advance by the Customer, with a second person (EHS-R3), and a working-at-height permit (EHS-R9); a corrective work order on power or a UPS needs a lockout; the IT Partner's overhead cabling step needs a working-at-height permit.</li>
    <li><b>The work.</b> What the device recorded where one records it (the tap-off breaker, the UPS bypass, the CDU pump, the chiller lockout), else the job record.</li>
    <li><b>The four checks.</b> A job with no permit of a type it needs, or a tap-off breaker opened with no permit open on it. A lockout recorded outside the device's isolation (power present on a circuit recorded as locked out). A person named on a permit, or an electrical task's engineer, without a current completion of every course the work needs, with their badge-ins that day. A permit closed before the work ended.</li>
    <li><b>Synthetic layer.</b> Permits, training, and events are generated on their own random stream with four planted record problems; the checks never read the answer key. Report: <code>reports/ehs.md</code>.</li>
  </ul>`;
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "calendar";
  const [view, a, b] = h.split("/");
  const ehs = view === "ehs";
  document.querySelectorAll(".views a").forEach(x => x.classList.toggle("on", x.dataset.view === (ehs ? "ehs" : "calendar")));
  let sel = null, panel = "";
  if (ehs) {
    if (a === "permit" && PERM[b]) { panel = permitPanel(b); sel = b; }
    else if (a === "finding" && SFIND[b]) { panel = safetyFindingPanel(b); sel = b; }
  } else if (view === "calendar") {
    if (a === "job") { panel = jobPanel(b); sel = JOBS[b] ? lday(JOBS[b].start) : null; }
    else if (a === "finding") { panel = findingPanel(b); sel = FIND[b] ? FIND[b].date : null; }
    else if (a && IDX[a] !== undefined) { panel = dayPanel(a); sel = a; }
  }
  document.getElementById("doc").innerHTML = ehs ? viewEhs(sel) : viewCalendar(sel);
  document.getElementById("detail").innerHTML = panel;
  wire();
  const det = document.getElementById("detail");
  if (panel && a && det.scrollIntoView) det.scrollIntoView({block: "nearest"});
}

function wire() {
  document.querySelectorAll("#cal .day").forEach(el => el.addEventListener("click", () => { location.hash = "calendar/" + el.dataset.day; }));
  // Each filter keeps a value from its own option list (never the control's text), so nothing typed reaches the page.
  for (const k of Object.keys(FILT)) {
    const el = document.querySelector(`[data-f="${k}"]`);
    if (!el) continue;
    el.addEventListener("change", () => {
      FILT[k] = OPTS[k] ? (OPTS[k].find(([v]) => v === el.value) || OPTS[k][0])[0] : !!el.checked;
      route();
    });
  }
  for (const k of Object.keys(FILT_E)) {
    const el = document.querySelector(`[data-fe="${k}"]`);
    if (!el) continue;
    el.addEventListener("change", () => {
      FILT_E[k] = OPTS_E[k] ? (OPTS_E[k].find(([v]) => v === el.value) || OPTS_E[k][0])[0] : !!el.checked;
      route();
    });
  }
  document.querySelectorAll("[data-close]").forEach(el => el.addEventListener("click", () => {
    location.hash = el.dataset.close === "ehs" ? "ehs" : "calendar"; }));
}

window.addEventListener("hashchange", route);
route();
</script>
