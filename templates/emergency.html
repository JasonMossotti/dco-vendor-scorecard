<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emergency · Site AUS-1</title>
<style>
__SITENAV_CSS__
:root { --ink:#1e2933; --muted:#5b6774; --line:#d5dbe2; --bg:#ffffff; --panel:#f5f7f9; --ll:#b45309; --it:#1f5fbf; --cu:#4b5563; --sp:#6d28d9; --ok:#1d7a46; --bad:#b42318; --warn:#9a6700; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.5 "Inter","Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:#eef1f4; }
header.top { background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
header.top strong { font-size:16px; }
.tabs button, .tools button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); padding:6px 14px; border-radius:6px; cursor:pointer; }
.tabs button.on { background:var(--it); color:#fff; border-color:var(--it); }
main { max-width:1080px; margin:20px auto; background:var(--bg); padding:32px 40px; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
@media (max-width:700px) { main { padding:20px 16px; margin:0; border-radius:0; } header.top { padding:12px 16px; } }
h1 { font-size:24px; margin:0 0 4px; } h2 { font-size:17px; margin:28px 0 10px; padding-bottom:4px; border-bottom:2px solid var(--ink); } h3 { font-size:14px; margin:14px 0 4px; }
.sub { color:var(--muted); margin:0 0 16px; } .note { font-size:12px; color:var(--muted); }
a { color:var(--it); }
.first { border-left:4px solid var(--bad); background:#fdf3f2; padding:10px 14px; border-radius:4px; } .first ul { margin:4px 0 0; padding-left:20px; }
.box { border-left:4px solid var(--it); background:#eef4fc; padding:10px 14px; border-radius:4px; margin:8px 0; }
.plain { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
.card { background:var(--panel); border-radius:8px; padding:12px 14px; } .card h3 { margin:0 0 6px; font-size:15px; } .card p { margin:4px 0; font-size:13px; }
.strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:12px; }
.stat { border:1px solid var(--line); border-radius:8px; padding:10px 12px; } .stat .v { font-size:20px; font-weight:700; } .stat .l { font-size:12px; color:var(--muted); }
table { width:100%; border-collapse:collapse; font-size:13px; } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { background:var(--panel); font-weight:600; } td.num { white-space:nowrap; }
.tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; color:#fff; white-space:nowrap; }
.Landlord { background:var(--ll); } .IT { background:var(--it); } .Customer { background:var(--cu); } .Security { background:var(--sp); } .External { background:#0f766e; }
.met { color:var(--ok); font-weight:600; } .missed { color:var(--bad); font-weight:600; } .stale { color:var(--bad); font-weight:600; }
.btn { font:inherit; font-size:13px; border:1px solid var(--line); background:#fff; color:var(--it); padding:4px 10px; border-radius:6px; cursor:pointer; text-decoration:none; white-space:nowrap; display:inline-block; }
.pill { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; background:#fff; border:1px solid var(--line); margin:1px 2px 1px 0; white-space:nowrap; }
.stepper { border:1px solid var(--line); border-radius:10px; padding:16px 18px; background:#fff; }
.stepper .q { font-size:18px; font-weight:700; margin:0 0 4px; } .stepper .opts { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.stepper .opts button { font:inherit; text-align:left; border:1px solid var(--line); background:var(--panel); padding:10px 14px; border-radius:8px; cursor:pointer; }
.stepper .opts button:hover { border-color:var(--it); }
.trail { font-size:12px; color:var(--muted); margin-bottom:8px; } .trail b { color:var(--ink); font-weight:600; }
.leaf { border-left:4px solid var(--ok); background:#eef8f1; padding:10px 14px; border-radius:4px; }
.outline, .outline ul { list-style:none; margin:0; padding-left:18px; } .outline { padding-left:0; }
.outline li { position:relative; padding:3px 0 3px 14px; font-size:13px; } .outline li::before { content:""; position:absolute; left:0; top:13px; width:9px; border-top:1px solid var(--muted); }
.outline ul { border-left:1px solid var(--muted); margin-left:4px; } .outline .ql { font-weight:600; } .outline .to { font-weight:700; }
ol.acts { margin:0; padding-left:22px; } ol.acts li { margin:5px 0; }
ul.gate { list-style:none; padding:0; margin:0; } ul.gate li { padding:3px 0 3px 26px; position:relative; } ul.gate li::before { content:""; position:absolute; left:2px; top:7px; width:13px; height:13px; border:1.5px solid var(--ink); border-radius:2px; }
.cols { display:grid; grid-template-columns:1fr 1fr; gap:0 28px; } @media (max-width:800px) { .cols { grid-template-columns:1fr; } }
.matrix td, .matrix th { text-align:center; } .matrix td:first-child, .matrix th:first-child { text-align:left; }
.matrix td.now { background:#fdf3f2; font-weight:600; }
.crit { margin:0; padding-left:16px; font-size:12px; }
.tree { list-style:none; margin:0; padding:0; } .tree li { display:flex; gap:12px; padding:6px 0; border-bottom:1px solid var(--line); } .tree .at { min-width:64px; font-weight:700; }
.steps { margin:0; padding-left:22px; } .steps li { margin:4px 0; } .steps .due { color:var(--muted); font-size:12px; white-space:nowrap; }
pre.tpl { white-space:pre-wrap; font:13px/1.45 ui-monospace,Consolas,monospace; background:#fffef6; border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:6px 0; }
tr.step td { background:var(--panel); font-weight:600; } tr.why td { font-size:12px; background:#fdf3f2; }
main.wide { max-width:1400px; padding:24px 28px; }
.console { display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:0 22px; } @media (max-width:1100px) { .console { grid-template-columns:1fr; } }
.console h2:first-child { margin-top:8px; } .console table.kv td:first-child { color:var(--muted); white-space:nowrap; width:1%; }
.ctl { display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--panel); border-radius:8px; padding:8px 12px; position:sticky; top:0; z-index:5; }
.ctl .clk { display:flex; flex-direction:column; min-width:210px; font-variant-numeric:tabular-nums; } .ctl select, .row input, .console textarea, .console input[type=text] { font:inherit; font-size:13px; padding:3px 6px; border:1px solid var(--line); border-radius:5px; }
.safe { font-size:13px; border-left:4px solid var(--warn); background:#fff8e6; padding:6px 10px; border-radius:4px; }
.row { display:flex; flex-wrap:wrap; gap:6px; } .row input { flex:1 1 120px; } .console textarea { width:100%; margin:4px 0; } .ans { width:100%; margin-top:3px; }
.ntc { border:1px solid var(--line); border-left:4px solid var(--muted); border-radius:6px; padding:8px 10px; margin:8px 0; font-size:13px; } .ntc.sent { border-left-color:var(--warn); } .ntc.ack { border-left-color:var(--ok); } .ntc.esc { border-left-color:var(--bad); }
.ntc .tpl { font-size:12px; margin:4px 0; } .pend { color:var(--warn); font-weight:600; } .bad { background:var(--bad); } .warnb { background:var(--warn); }
ul.tight, ul.clocks { margin:0; padding-left:18px; font-size:13px; } ul.chk { list-style:none; padding:0; margin:0; font-size:13px; } ul.chk li { margin:4px 0; }
.printonly { display:none; }
@media print {
  @page { margin:12mm; }
  .usm, header.top, .noprint { display:none !important; } .printonly { display:block; }
  body { background:#fff; font-size:10.5px; line-height:1.35; } .tag, .first, .box { -webkit-print-color-adjust:exact; print-color-adjust:exact; } td .note, .pnote { display:none; } .first ul { margin:0; } .box { margin:4px 0; padding:4px 8px; } main { box-shadow:none; margin:0; max-width:none; padding:0; }
  h1 { font-size:16px; } h2 { font-size:12px; margin:8px 0 4px; } h3 { font-size:11px; margin:6px 0 2px; } .sub { margin:0 0 6px; }
  .cols { grid-template-columns:1fr 1fr; } table { font-size:9.5px; } th, td { padding:2px 4px; } .first { padding:4px 8px; } ol.acts li { margin:1px 0; }
  a { color:inherit; text-decoration:none; } h2, h3 { break-after:avoid; } tr, li { break-inside:avoid; }
}
</style>
</head>
<body>
__SITENAV__
<header class="top">
  <div><strong>Emergency</strong> <span class="note">Site AUS-1 · the Customer's procedures</span></div>
  <div class="tabs"><button id="t-procedures" class="on">Procedures</button> <button id="t-contacts">Call lists</button> <button id="t-command">Command</button> <button id="t-respond">Response</button></div>
  <div class="tools"><button id="print">Print / save PDF</button></div>
</header>
<main id="doc"></main>
<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const partyCls = p => p === "IT Partner" ? "IT" : p === "Security Partner" ? "Security" : esc(p);
const TYPES = Object.fromEntries(DATA.types.map(t => [t.id, t]));
const EVENTS = Object.fromEntries(DATA.events.map(e => [e.id, e]));
const CONTACT = Object.fromEntries(DATA.contacts.map(c => [c.id, c]));
const when = m => m === 0 ? "at once" : `within ${m} min`;
let mode = "procedures", proc = "", trail = [];     // trail: [[node, option index], ...] in the decision tree

// ---- Procedures: the tree as a step-through, the whole tree, and one card per event type
function firstBox() {
  return `<div class="first"><b>Always first</b><ul>${DATA.always_first.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
}
function stepper() {
  let node = DATA.tree.start, path = [];
  for (const [n, i] of trail) { const o = DATA.tree.nodes[n].options[i]; path.push([DATA.tree.nodes[n].q, o.label]); node = o.to; }
  const tr = path.length ? `<div class="trail">${path.map(([q, a]) => `${esc(q)} <b>${esc(a)}</b>`).join(" · ")}</div>` : "";
  if (node.startsWith("type:")) {
    const t = TYPES[node.slice(5)];
    return `<div class="stepper" id="stepper">${tr}<div class="leaf"><div class="q">${esc(t.name)}</div><p style="margin:4px 0">${esc(t.priority)}</p>` +
      `<a class="btn" href="#proc/${esc(t.id)}">Open the procedure</a> <button class="btn" id="restart">Start over</button></div></div>`;
  }
  const n = DATA.tree.nodes[node];
  return `<div class="stepper" id="stepper">${tr}<div class="q">${esc(n.q)}</div>${n.help ? `<div class="note">${esc(n.help)}</div>` : ""}` +
    `<div class="opts">${n.options.map((o, i) => `<button data-node="${esc(node)}" data-opt="${i}">${esc(o.label)}</button>`).join("")}</div>` +
    (trail.length ? `<p style="margin:10px 0 0"><button class="btn" id="back">Back</button> <button class="btn" id="restart">Start over</button></p>` : "") + `</div>`;
}
function outline(node) {
  const n = DATA.tree.nodes[node];
  return `<span class="ql">${esc(n.q)}</span><ul>` + n.options.map(o => `<li>${esc(o.label)}: ` +
    (o.to.startsWith("type:") ? `<a class="to" href="#proc/${esc(o.to.slice(5))}">${esc(TYPES[o.to.slice(5)].name)}</a>` : outline(o.to)) + `</li>`).join("") + `</ul>`;
}
function evLine(e, date = true) {
  return `${e.records.map(esc).join(" and ")} ${date ? `<span class="note">${esc(e.start.slice(0, 10))}</span> ` : ""}${esc(e.summary)}`;
}
function renderProcedures() {
  let h = `<h1>Emergency procedures</h1><p class="sub">${esc(DATA.intro)}</p>${firstBox()}`;
  h += `<h2>Which procedure?</h2><p class="note">Answer one question at a time. Every path ends at a procedure.</p>${stepper()}`;
  h += `<h2>Procedures</h2><div class="plain">` + DATA.types.map(t => `<div class="card" id="card-${esc(t.id)}"><h3><a href="#proc/${esc(t.id)}">${esc(t.name)}</a></h3>` +
    `<p>${esc(t.priority)}</p><p class="note">Leads on the bridge: ${t.leads.map(esc).join(", ")}</p>` +
    `<p class="note">${t.samples.length ? `In the sample month: ${t.samples.map(id => EVENTS[id].records.map(esc).join(" and ")).join("; ")}` : "No P1 of this type in the sample month."}</p></div>`).join("") + `</div>`;
  h += `<h2>The whole tree</h2><ul class="outline"><li style="padding-left:0">${outline(DATA.tree.start)}</li></ul>`;
  h += `<h2>P1 events in the sample month</h2><p class="note">Every P1 record in the Incident Portal, by event: records joined by a confirmed relation are one event, so one event opens one response.</p>` +
    `<div style="overflow-x:auto"><table><tr><th>Event</th><th>Records</th><th>Parties</th><th>Procedure</th></tr>` +
    DATA.events.map(e => `<tr><td class="num">${esc(e.start.slice(0, 16).replace("T", " "))} UTC</td><td>${evLine(e, false)}</td><td>${e.partners.map(p => `<span class="tag ${partyCls(p)}">${esc(p)}</span>`).join(" ")}</td>` +
      `<td>${e.types.map(t => `<a href="#proc/${esc(t)}">${esc(TYPES[t].name)}</a>`).join(", ")}</td></tr>`).join("") + `</table></div>`;
  return h;
}

// One procedure: what to do, what to ask, the return-to-service gate, who is told. Prints on one page.
const KEY_CONTACTS = ["emergency", "ic", "landlord_duty", "it_duty", "sec_console"];
function renderProc(t) {
  const b = DATA.bridge;
  let h = `<p class="noprint note"><a href="#procedures">All procedures</a></p><h1>${esc(t.name)}</h1><p class="sub">${esc(t.priority)}</p>${firstBox()}`;
  h += `<div class="box"><b>Bridge:</b> ${esc(b.dial_in)}, passcode ${esc(b.passcode)}. ${esc(b.video)}. <b>Leads:</b> ${t.leads.map(esc).join(", ")}.` +
    `<br><b>Call:</b> ${KEY_CONTACTS.map(id => `${esc(CONTACT[id].role)} ${esc(CONTACT[id].phone)}`).join(" · ")}</div>`;
  h += `<div class="cols"><div>` + t.phases.map(ph => {
    const acts = t.actions.filter(a => a.phase === ph.id);
    return `<h2>${esc(ph.name)}</h2><ol class="acts">${acts.map(a => `<li><span class="tag ${partyCls(a.owner)}">${esc(a.owner)}</span> ${esc(a.text)}</li>`).join("")}</ol>`;
  }).join("") + `</div><div><h2>Questions for the bridge</h2><ol class="acts">${t.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ol>` +
    `<h2>Before anything returns to service</h2><ul class="gate">${t.rts.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` +
    `<h2>Who is told</h2><table><tr><th>Who</th><th>When</th><th>Phone</th></tr>${t.notify.map(n => `<tr><td><b>${esc(n.name)}</b><br><span class="note">${esc(n.why)}</span></td><td class="num">${esc(when(n.within_min))}</td><td class="num">${esc(n.phone)}</td></tr>`).join("")}</table></div></div>`;
  h += `<h2>Partner documents</h2><p class="note pnote">The partners act under their own procedures, which the Customer requires and this page names rather than rewrites.</p><ul>${t.partner_docs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const ev = t.samples.map(id => EVENTS[id]);
  h += `<div class="noprint"><h2>In the sample month</h2>${ev.length ? `<ul>${ev.map(e => `<li>${evLine(e)}</li>`).join("")}</ul>` : `<p class="note">No P1 record of this type in the sample month.</p>`}` +
    `<p>${t.links.map(l => `<a class="btn" href="../${esc(l.href)}">${esc(l.label)}</a>`).join(" ")}</p></div>`;
  h += `<p class="printonly note">Site AUS-1 emergency card, printed from the Emergency tab. Fictional contacts. Synthetic data for a portfolio demonstration.</p>`;
  return h;
}

// ---- Call lists: the bridge, every contact with its currency, the on-call rota, the paging tree, and the tiers
function renderContacts() {
  const b = DATA.bridge, s = DATA.site;
  const stale = DATA.contacts.filter(c => c.stale);
  let h = `<h1>Call lists</h1><p class="sub">Who to call, in what order, and by when. Roles only; every number and address is fictional. In production the contacts live in the paging platform, never in a repository.</p>`;
  h += `<div class="strip"><div class="stat"><div class="v">${esc(DATA.contacts.length)}</div><div class="l">Contacts</div></div>` +
    `<div class="stat"><div class="v ${stale.length ? "stale" : "met"}">${esc(stale.length)}</div><div class="l">Not verified in ${esc(DATA.verify_within_days)} days (as of ${esc(DATA.as_of)})</div></div>` +
    `<div class="stat"><div class="v">${esc(b.dial_in)}</div><div class="l">Bridge, passcode ${esc(b.passcode)}</div></div></div>`;
  h += `<h2>The bridge</h2><div class="box"><b>${esc(b.name)}.</b> Dial-in ${esc(b.dial_in)}, passcode ${esc(b.passcode)}. Backup: ${esc(b.backup)}. Video: ${esc(b.video)}. ${esc(b.chat)}.</div>` +
    `<ul>${b.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` +
    `<div style="overflow-x:auto"><table><tr><th>Role</th><th>Who</th><th>Does</th></tr>${b.roles.map(r => `<tr><td><b>${esc(r.role)}</b></td><td>${esc(r.who)}</td><td>${esc(r.does)}</td></tr>`).join("")}</table></div>` +
    `<p class="note">Roll call: ${b.roll_call.map(esc).join(", ")}.</p>`;
  h += `<h2>Contacts</h2><p class="note">${esc(s.name)}, ${esc(s.address)}. ${esc(s.responders)} ${esc(s.assembly)}</p><div style="overflow-x:auto"><table id="contacts"><tr><th>Group</th><th>Role</th><th>Phone</th><th>Email</th><th>Last verified</th></tr>` +
    DATA.contacts.map(c => `<tr${c.stale ? ' class="stale-row"' : ""}><td><span class="tag ${partyCls(c.group)}">${esc(c.group)}</span></td><td><b>${esc(c.role)}</b>${c.note ? `<br><span class="note">${esc(c.note)}</span>` : ""}</td>` +
      `<td class="num">${c.rota ? `By rota, below` : esc(c.phone)}</td><td>${esc(c.email || "")}</td>` +
      `<td class="num">${esc(c.verified)}${c.stale ? `<br><span class="stale">Overdue: ${esc(c.age_days)} days</span>` : ""}</td></tr>`).join("") + `</table></div>`;
  const p = DATA.paging;
  h += `<h2>On call</h2><div style="overflow-x:auto"><table><tr><th>Shift (${esc(p.timezone)})</th><th>Days</th><th>Hours</th><th>Primary</th><th>Secondary</th></tr>` +
    CONTACT.oncall_primary.rota_shifts.map((x, i) => { const y = CONTACT.oncall_secondary.rota_shifts[i];
      return `<tr><td>${esc(x.label)}</td><td>${esc(x.days.join(", "))}</td><td class="num">${esc(x.start)} to ${esc(x.end)}</td><td>${esc(x.who)}<br><span class="note">${esc(x.phone)}</span></td><td>${esc(y.who)}<br><span class="note">${esc(y.phone)}</span></td></tr>`; }).join("") + `</table></div>`;
  h += `<h2>Paging tree for a critical alarm</h2><ul class="tree">` + p.levels.map(l => `<li><span class="at">${l.min ? "+" + esc(l.min) + " min" : "At once"}</span><span><b>${esc(l.who)}</b><br><span class="note">${esc(l.via)}</span></span></li>`).join("") + `</ul>`;
  h += `<h2>Leadership notification tiers</h2><p class="note">Who beyond the site team is told, by event type. Site leadership's notice follows the runbook's ${esc(DATA.facts.first_notice_min)}-minute clock for every type; the other minutes are the Customer's judgment.</p>` +
    `<div style="overflow-x:auto"><table class="matrix" id="tiers"><tr><th>Tier</th>${DATA.types.map(t => `<th><a href="#proc/${esc(t.id)}">${esc(t.short)}</a></th>`).join("")}</tr>` +
    DATA.tiers.map(tr => `<tr><td><b>${esc(tr.name)}</b><br><span class="note">${esc(tr.why)}</span></td>` + DATA.types.map(t => { const n = t.notify.find(x => x.tier === tr.id);
      return `<td class="num${n && n.within_min === 0 ? " now" : ""}">${n ? esc(n.within_min === 0 ? "At once" : n.within_min + " min") : ""}</td>`; }).join("") + `</tr>`).join("") + `</table></div>`;
  h += `<h2>Sources</h2><ul class="note">${DATA.sources.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  return h;
}

// ---- Command: the Customer's Incident Commander runbook, then the replay of past incidents against it.
const hm = m => m == null ? "—" : m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? " " + String(m % 60).padStart(2, "0") + " min" : ""}` : `${m} min`;
const result = met => met == null ? "—" : met ? `<span class="met">Met</span>` : `<span class="missed">Missed</span>`;
function renderCommand() {
  const C = DATA.command, rb = C.runbook, sv = rb.severity;
  let h = `<h1>Incident Commander runbook</h1><p class="sub">${esc(rb.intro)}</p>`;
  h += `<div class="box" style="border-color:var(--ll);background:#fdf6ec"><b>Who commands.</b> ${esc(rb.commander)}<br>${rb.roles.map(esc).join("<br>")}<br><b>Bridge.</b> ${esc(rb.bridge_rule)}</div>`;
  h += `<p class="note">The runbook is the Customer's. A missed step is a process finding for the post-incident review, not an SLA default, and carries no credit. The procedures for each type of event are under <a href="#procedures">Procedures</a>.</p>`;

      r.log.map(e => `<tr><td class="num">${esc(e.t.slice(11, 19))}</td><td class="num">${esc(e.local)}</td><td><span class="tag ${partyCls(e.party)}">${esc(e.party)}</span></td><td>${esc(e.role)}${e.to ? `<br><span class="note">to ${esc(e.to)}</span>` : ""}</td><td>${esc(e.text)}</td></tr>`).join("") + `</table></div>`;

// ---- Response: the console for one P1 event (or an escalated P2). Nothing is ever sent: Send records the message and
// the time in this browser. The console's clock is the event's own time: it starts at the event's start (or the
// minute a Live link names) and runs at real speed or faster. Drill simulates acknowledgements and joins on a seeded
// stream; Replay plays the bridge's recorded comms log where one exists.
const RESP = DATA.responses.events, BYREC = DATA.responses.by_record, CON = DATA.console, RB = CON.runbook;
const MIN = 60e3, OFF = CON.offset_h * 3600e3, RKEY = "usm.emergency.responses";
const p2 = n => String(n).padStart(2, "0");
const ms = s => s ? Date.parse(s) : null;
const clockStr = (t, off) => { const d = new Date(t + off); return `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; };
const cdt = t => t == null ? "—" : `${clockStr(t, OFF)} ${CON.timezone}`;
const both = t => t == null ? "—" : `${clockStr(t, OFF)} ${CON.timezone} (${clockStr(t, 0)} UTC)`;
const dayStr = t => new Date(t + OFF).toISOString().slice(0, 10);
const span = m => { m = Math.round(m); const a = Math.abs(m); return a >= 60 ? `${Math.floor(a / 60)} h ${p2(a % 60)} min` : `${a} min`; };
function store() { try { return JSON.parse(localStorage.getItem(RKEY) || "{}") || {}; } catch (e) { return {}; } }
// Saved responses are keyed by event id; only a known event's own key is ever read or written (never __proto__).
const known = id => typeof id === "string" && id !== "__proto__" && id !== "constructor" && id !== "prototype" && Object.prototype.hasOwnProperty.call(RESP, id);
function saved(id) { const s = store(); return known(id) && Object.prototype.hasOwnProperty.call(s, id) ? s[id] : null; }
function persist() { if (!RS || RS.mode === "replay" || !known(RS.id)) return; const s = store(); s[RS.id] = RS; try { localStorage.setItem(RKEY, JSON.stringify(s)); } catch (e) { /* private window */ } }
function rng(seed) { let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
let RS = null, TIMER = null, LASTSIG = "";

function fresh(id, at) {
  const e = RESP[id], t0 = at || ms(e.start);
  return {id, records: e.records.map(r => r.id), mode: "live", type: e.types[0] || "", t0, w0: Date.now(), speed: 1, paused: false, opened: t0,
    sent: {}, extra: {}, engaged: {}, bridge: null, joins: {}, assign: {}, acts: {}, answers: {}, rts: {}, holds: {}, decisions: [], log: [{t: t0, text: "Response opened."}],
    command: [{t: t0, who: "On-call primary (" + e.on_call.primary + ")"}], rtsAt: null, closed: null};
}
const T = () => RS.paused ? RS.t0 : RS.t0 + (Date.now() - RS.w0) * RS.speed;
function setClock(t, paused) { RS.t0 = t; RS.w0 = Date.now(); RS.paused = paused; }
function note(text, t) { RS.log.push({t: t ?? T(), text}); }

// What the clock shows: the user's own entries, or the recorded log in Replay, and the simulated acknowledgements,
// joins, and escalations (Drill), all as of the clock.
function view() {
  const e = RESP[RS.id], now = T(), type = TYPES[RS.type];
  const tiers = type ? type.notify : [];
  if (RS.mode === "replay") {
    const L = e.replay.filter(x => ms(x.t) <= now), first = k => L.find(x => x.kind === k);
    const lu = L.filter(x => x.kind === "leadership_update");
    const sent = {}; if (lu.length && tiers[0]) sent[tiers[0].tier] = {t: ms(lu[0].t), text: lu[0].text};
    const ack = {}; if (lu.length && tiers[0]) ack[tiers[0].tier] = ms(lu[0].t);
    const joins = {}; L.filter(x => x.kind === "lead_joined").forEach(x => joins[x.role] = ms(x.t));
    if (first("bridge_open")) joins["Incident Commander"] = ms(first("bridge_open").t);
    const ic = first("ic_declared");
    return {now, tiers, sent, ack: {}, acked: ack, bridge: first("bridge_open") ? ms(first("bridge_open").t) : null, joins,
      command: ic ? [{t: ms(ic.t), who: ic.role + ": " + ic.text.split(".")[0]}] : [], leadership: lu.map(x => ms(x.t)),
      log: L.map(x => ({t: ms(x.t), text: `${x.role}${x.to ? " to " + x.to : ""}: ${x.text}`})), esc: escalations(tiers, sent, ack, now),
      engaged: {},
      rts: L.some(x => x.kind === "rts_declared") ? ms(L.find(x => x.kind === "rts_declared").t) : null};
  }
  const acked = {}, joins = {...RS.joins}, log = RS.log.slice();
  for (const [k, s] of Object.entries(RS.sent)) if (s.ack != null && s.ack <= now) acked[k] = s.ack;
  if (RS.mode === "drill") {
    const never = tiers.length ? tiers[Math.floor(rng(RS.id + "never")() * tiers.length)].tier : "";
    for (const [k, s] of Object.entries(RS.sent)) {
      if (acked[k] != null || k === never) continue;
      const a = s.t + (1 + Math.floor(rng(RS.id + k)() * 12)) * MIN;
      if (a <= now) { acked[k] = a; log.push({t: a, text: `Drill: ${tierName(k)} acknowledged.`}); }
    }
    if (RS.bridge != null) rollCall(e, type).forEach(r => {
      if (joins[r] != null || r === "Incident Commander") return;
      const j = RS.bridge + (1 + Math.floor(rng(RS.id + r)() * 9)) * MIN;
      if (j <= now) { joins[r] = j; log.push({t: j, text: `Drill: ${r} joined the bridge.`}); }
    });
  }
  const esc_ = escalations(tiers, RS.sent, acked, now);
  esc_.forEach(x => log.push({t: x.t, text: `${tierName(x.tier)} not acknowledged after ${x.after_min} min: escalated to ${x.to}.`}));
  const leadership = Object.entries(RS.sent).filter(([k]) => k === "site_leadership").map(([, s]) => s.t).concat(RS.log.filter(x => x.leadership).map(x => x.t));
  return {now, tiers, sent: RS.sent, acked, bridge: RS.bridge, joins, command: RS.command, leadership: leadership.sort((a, b) => a - b),
    log, esc: esc_, rts: RS.rtsAt, engaged: RS.engaged || {}};
}
function tierName(k) { const t = DATA.tiers.find(x => x.id === k); return t ? t.name : k; }
function escalations(tiers, sent, acked, now) {
  const out = [];
  for (const n of tiers) { const s = sent[n.tier]; if (!s) continue;
    for (const x of CON.escalate) { const t = s.t + x.after_min * MIN; if (t <= now && !(acked[n.tier] != null && acked[n.tier] <= t)) out.push({tier: n.tier, t, after_min: x.after_min, to: x.to}); } }
  return out;
}
function rollCall(e, type) {
  const want = new Set(["Incident Commander", "Scribe", ...(type ? type.leads : []), ...e.partners.map(p => p + " lead")]);
  if (type && type.notify.some(n => n.tier === "comms")) want.add("Communications lead");
  return DATA.bridge.roll_call.filter(r => want.has(r));
}
function due(at, now, done) {   // a clock against the console's time
  if (done != null) return done <= at ? `<span class="met">Met ${esc(cdt(done))}</span>` : `<span class="missed">Late ${esc(cdt(done))}, ${esc(span((done - at) / MIN))} over</span>`;
  return at >= now ? `<span class="pend">Due ${esc(cdt(at))}, in ${esc(span((at - now) / MIN))}</span>` : `<span class="missed">Overdue since ${esc(cdt(at))}</span>`;
}
function message(e, n) {
  const st = ms(e.start), c = e.clocks.find(x => x.label.startsWith("Restore"));
  return `${e.priority}: ${e.summary.replace(/\.?$/, ".")}` + (e.rack ? ` Rack ${e.rack}` + (e.gpus ? ` (${e.gpus} GPUs)` : "") + "." : "") +
    ` Started ${cdt(st)}${e.location ? " in " + e.location : ""}.` + (c ? ` Restore target ${cdt(st + c.min * MIN)} (${c.label}).` : "") +
    ` Bridge ${DATA.bridge.dial_in}, passcode ${DATA.bridge.passcode}. Next update by ${cdt(Math.max(T(), st) + RB.leadership_cadence_min * MIN)}.`;
}

  h += `<div style="overflow-x:auto"><table id="resp-list"><tr><th>Start</th><th>Event</th><th>Procedure</th><th>Response</th></tr>` +

  // 2. Command and notifications
  const cmd = v.command[v.command.length - 1];
  h += `<h2>Command</h2><p>${cmd ? `<b>${esc(cmd.who)}</b> since ${esc(cdt(cmd.t))}` : "Not yet declared."} ${due(st + RB.declare_min * MIN, now, v.command.length ? v.command[0].t : null)}</p>` +
    (ro ? "" : `<p class="row"><input type="text" id="r-cmd" placeholder="Hand over to (role)"><button class="btn" id="r-cmd-go">Hand over command</button></p>`) +
    (v.command.length > 1 ? `<p class="note">${v.command.map(c => `${esc(cdt(c.t))} ${esc(c.who)}`).join(" · ")}</p>` : "");
  h += `<h2>Notifications</h2><p class="note">Who is told for this procedure, by when (call lists). Unacknowledged after ${CON.escalate.map(x => `${esc(x.after_min)} min, ${esc(x.to)}`).join("; after ")} is told (routing file).</p>`;
  if (!type) h += `<p class="note">Choose a procedure to list who is told.</p>`;
  h += v.tiers.map(n => { const s = v.sent[n.tier], a = v.acked[n.tier], es = v.esc.filter(x => x.tier === n.tier), at = st + n.within_min * MIN;
    return `<div class="ntc${s ? (a != null ? " ack" : es.length ? " esc" : " sent") : ""}" id="n-${esc(n.tier)}"><div class="nh"><b>${esc(n.name)}</b> <span class="note">${esc(n.contact)} ${esc(n.phone)}</span></div>` +
      `<div class="note">${n.within_min === 0 ? "At once" : `Within ${esc(n.within_min)} min`}: ${RS.mode === "replay" && !s ? `due ${esc(cdt(at))}` : due(at, now, s ? s.t : null)}</div>` +
      (s ? `<pre class="tpl">${esc(s.text)}</pre>` : RS.mode === "replay" ? `<p class="note">Not in the recorded log.</p>` : `<pre class="tpl">${esc(message(e, n))}</pre>` + (ro ? "" : `<textarea id="x-${esc(n.tier)}" data-extra="${esc(n.tier)}" rows="2" placeholder="Anything else to add">${esc(RS.extra[n.tier] || "")}</textarea><button class="btn" data-send="${esc(n.tier)}">Send</button>`)) +
      (s ? `<div>${a != null ? `<span class="met">Acknowledged ${esc(cdt(a))}</span>` : `<span class="pend">Sent ${esc(cdt(s.t))}, not acknowledged</span>${ro || RS.mode === "drill" ? "" : ` <button class="btn" data-ack="${esc(n.tier)}">Mark acknowledged</button>`}`}</div>` : "") +
      es.map(x => `<div class="missed">Escalated ${esc(cdt(x.t))}: ${esc(x.to)} told</div>`).join("") + `</div>`; }).join("");
  const lastL = v.leadership.length ? v.leadership[v.leadership.length - 1] : null;
  h += `<h3>Next leadership update</h3><p>${lastL == null ? due(st + RB.first_leadership_min * MIN, now, null) + " (first notice)" : due(lastL + RB.leadership_cadence_min * MIN, now, null) + ` (every ${esc(RB.leadership_cadence_min)} min)`}` +
    (ro || lastL == null ? "" : ` <button class="btn" id="r-upd">Leadership update sent</button>`) + `</p>`;
  h += `</div><div class="col" id="c-bridge">`;
  // 3. The bridge and the procedure
  const b = DATA.bridge, rc = rollCall(e, type);
  h += `<h2>Bridge</h2><div class="box"><b>${esc(b.dial_in)}</b>, passcode ${esc(b.passcode)}<br>${esc(b.video)}<br><span class="note">Backup ${esc(b.backup)}</span></div>` +
    `<p>Open within ${esc(DATA.facts.bridge_min)} min: ${due(st + DATA.facts.bridge_min * MIN, now, v.bridge)}${v.bridge == null && !ro ? ` <button class="btn" id="r-bridge">Bridge open</button>` : ""}</p>`;
  h += `<table id="roll"><tr><th>Roll call</th><th>Joined</th></tr>${rc.map(r => { const j = v.joins[r];
    return `<tr><td>${esc(r)}${!ro && ["Incident Commander", "Scribe", "Communications lead"].includes(r) ? `<br><input type="text" data-assign="${esc(r)}" value="${esc(RS.assign[r] || "")}" placeholder="Who">` : RS.assign[r] ? `<br><span class="note">${esc(RS.assign[r])}</span>` : ""}</td>` +
      `<td class="num">${j != null ? (v.bridge != null && r !== "Incident Commander" ? due(v.bridge + RB.lead_join_min * MIN, now, j) : esc(cdt(j))) : v.bridge == null ? "" : ro || RS.mode === "drill" && r !== "Scribe" ? `<span class="pend">Not yet</span>` : `<button class="btn" data-join="${esc(r)}">Joined</button>`}</td></tr>`; }).join("")}</table>`;
  if (type) {
    h += `<h2>Checklist</h2>` + type.phases.map(ph => `<h3>${esc(ph.name)}</h3><ul class="chk">` + type.actions.map((a, i) => [a, i]).filter(([a]) => a.phase === ph.id).map(([a, i]) =>
      `<li><label><input type="checkbox" data-act="${i}"${RS.acts[i] != null && RS.mode !== "replay" ? " checked" : ""}${ro ? " disabled" : ""}> <span class="tag ${partyCls(a.owner)}">${esc(a.owner)}</span> ${esc(a.text)}</label>${RS.acts[i] != null && RS.mode !== "replay" ? ` <span class="note">${esc(cdt(RS.acts[i]))}</span>` : ""}</li>`).join("") + `</ul>`).join("");
    h += `<h2>Questions for the bridge</h2><ol class="acts">${type.questions.map((q, i) => `<li>${esc(q)}${ro ? (RS.answers[i] ? `<br><i>${esc(RS.answers[i].a)}</i>` : "") : `<br><input type="text" class="ans" data-q="${i}" value="${esc((RS.answers[i] || {}).a || "")}" placeholder="Answer">`}</li>`).join("")}</ol>`;
    const gate = type.rts.every((_, i) => RS.rts[i] != null);
    h += `<h2>Return-to-service gate</h2><ul class="chk">${type.rts.map((x, i) => `<li><label><input type="checkbox" data-rts="${i}"${RS.rts[i] != null && RS.mode !== "replay" ? " checked" : ""}${ro ? " disabled" : ""}> ${esc(x)}</label></li>`).join("")}</ul>` +
      `<p>${v.rts != null ? `<span class="met">Returned to service ${esc(cdt(v.rts))}</span>` : ro ? "" : `<button class="btn" id="r-rts"${gate ? "" : " disabled"}>Declare return to service</button>${gate ? "" : ` <span class="note">Locked until every gate item is ticked.</span>`}`}</p>`;
  }
  h += `<h2>Decision log</h2>${ro ? "" : `<div class="row"><input type="text" id="d-what" placeholder="Decision"><input type="text" id="d-who" placeholder="Who decided"><input type="text" id="d-why" placeholder="On what facts"><button class="btn" id="d-add">Log</button></div>`}` +
    (RS.mode !== "replay" && RS.decisions.length ? `<table id="decisions">${RS.decisions.map(d => `<tr><td class="num">${esc(cdt(d.t))}</td><td><b>${esc(d.what)}</b> (${esc(d.who)})<br><span class="note">${esc(d.why)}</span></td></tr>`).join("")}</table>` : `<p class="note">No decision logged.</p>`);
  h += `</div></div>`;
  // The timeline, and close-out into the review
  const tl = v.log.filter(x => x.t <= now).sort((a, b) => a.t - b.t);
  h += `<h2>Timeline</h2><div style="overflow-x:auto"><table id="timeline"><tr><th>${esc(CON.timezone)}</th><th>UTC</th><th>What</th></tr>${tl.map(x => `<tr><td class="num">${esc(clockStr(x.t, OFF))}</td><td class="num">${esc(clockStr(x.t, 0))}</td><td>${esc(x.text)}</td></tr>`).join("")}</table></div>`;
  if (RS.mode === "replay" && DATA.command.replays.length) { const r = DATA.command.replays[0];
    h += `<p class="box" id="replay-score">Held against the runbook, this bridge met <b>${esc(r.summary.met)} of ${esc(r.summary.steps)}</b> steps (${esc(r.summary.missed)} missed). <a href="#replay">The replay, step by step</a> · <a href="../pir/#${esc(r.review)}">${esc(r.review)}</a></p>`; }
  if (RS.mode !== "replay") {
    const pirDue = RS.closed != null ? businessDays(RS.closed, DATA.facts.pir_business_days) : null;
    h += `<h2>Close</h2>${RS.closed == null ? `<p><button class="btn" id="r-close">Close response</button> <span class="note">Stops the clock, exports the response as YAML, and starts the post-incident review from it.</span></p>` :
      `<p><span class="met">Closed ${esc(cdt(RS.closed))}.</span> Post-incident review due ${esc(pirDue)} (${esc(DATA.facts.pir_business_days)} business days, Interface Agreement). <button class="btn" id="r-yaml">Export YAML</button> <a class="btn" id="r-pir" href="../pir/#new=${esc(RS.id)}">Start post-incident review</a> <button class="btn" id="r-reopen">Reopen</button></p>`}`;
  }
  return h;
}
function businessDays(t, n) { const d = new Date(t + OFF); while (n > 0) { d.setUTCDate(d.getUTCDate() + 1); if (d.getUTCDay() % 6) n--; } return d.toISOString().slice(0, 10); }

// The response as YAML, the shape the post-incident review reads (JSON strings are valid YAML scalars)
function responseDoc() {
  const e = RESP[RS.id], v = view();
  return {event: RS.id, records: e.records.map(r => r.id), procedure: RS.type, mode: RS.mode, opened: new Date(RS.opened).toISOString(), closed: RS.closed ? new Date(RS.closed).toISOString() : null,
    command: v.command.map(c => ({at: new Date(c.t).toISOString(), who: c.who})), bridge_open: v.bridge ? new Date(v.bridge).toISOString() : null,
    roll_call: Object.fromEntries(Object.entries(v.joins).map(([k, t]) => [k, new Date(t).toISOString()])), roles: RS.assign,
    notifications: v.tiers.filter(n => v.sent[n.tier]).map(n => ({to: n.name, sent: new Date(v.sent[n.tier].t).toISOString(), acknowledged: v.acked[n.tier] ? new Date(v.acked[n.tier]).toISOString() : null,
      escalated: v.esc.filter(x => x.tier === n.tier).map(x => x.to), message: v.sent[n.tier].text})),
    checklist: TYPES[RS.type] ? TYPES[RS.type].actions.map((a, i) => ({owner: a.owner, action: a.text, done: RS.acts[i] ? new Date(RS.acts[i]).toISOString() : null})) : [],
    answers: TYPES[RS.type] ? TYPES[RS.type].questions.map((q, i) => ({question: q, answer: (RS.answers[i] || {}).a || ""})) : [],
    change_holds: Object.entries(RS.holds).map(([k, d]) => ({change: k, decision: d.what, at: new Date(d.t).toISOString()})),
    decisions: RS.decisions.map(d => ({at: new Date(d.t).toISOString(), decision: d.what, who: d.who, why: d.why})),
    returned_to_service: RS.rtsAt ? new Date(RS.rtsAt).toISOString() : null,
    timeline: v.log.sort((a, b) => a.t - b.t).map(x => ({at: new Date(x.t).toISOString(), what: x.text}))};
}
function yaml(v, ind = "") {
  if (Array.isArray(v)) return v.length ? v.map(x => `\n${ind}- ` + (x && typeof x === "object" ? yaml(x, ind + "  ").replace(/^\n\s*/, "") : JSON.stringify(x))).join("") : " []";
  if (v && typeof v === "object") return Object.keys(v).length ? Object.entries(v).map(([k, x]) => `\n${ind}${/^[A-Za-z0-9_-]+$/.test(k) ? k : JSON.stringify(k)}:` + (x && typeof x === "object" ? yaml(x, ind + "  ") : " " + JSON.stringify(x))).join("") : " {}";
  return JSON.stringify(v);
}
const responseYaml = () => "# Emergency response exported from the Emergency tab (browser only; nothing was sent).\n" + yaml(responseDoc()).replace(/^\n/, "") + "\n";

function wireRespond() {
  const doc = document.getElementById("doc"), on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  const act = f => { f(); persist(); redraw(); };
  document.getElementById("r-mode").value = RS.mode;
  document.getElementById("r-mode").onchange = ev => { const m = ev.target.value;
    if (m === "replay") { RS = {...fresh(RS.id), mode: "replay"}; } else { RS = saved(RS.id) || fresh(RS.id); RS.mode = m; }
    persist(); history.replaceState(null, "", "#respond/" + RS.id + (m === "replay" ? "/replay" : "")); redraw(); };
  document.getElementById("r-speed").onchange = ev => { setClock(T(), RS.paused); RS.speed = +ev.target.value; persist(); };
  on("r-pause", () => act(() => setClock(T(), !RS.paused)));
  on("r-fwd", () => act(() => setClock(T() + 5 * MIN, RS.paused)));
  on("r-reset", () => { const m = RS.mode; const s = store(); delete s[RS.id]; try { localStorage.setItem(RKEY, JSON.stringify(s)); } catch (e) { /* private window */ } RS = fresh(RS.id); RS.mode = m === "replay" ? "replay" : m; persist(); redraw(); });
  const t = document.getElementById("r-type"); if (t) t.onchange = () => act(() => { RS.type = t.value; note(`Procedure: ${TYPES[t.value] ? TYPES[t.value].name : "none"}.`); });
  doc.querySelectorAll("[data-extra]").forEach(el => el.oninput = () => { RS.extra[el.dataset.extra] = el.value; persist(); });
  doc.querySelectorAll("[data-send]").forEach(el => el.onclick = () => act(() => { const k = el.dataset.send, n = TYPES[RS.type].notify.find(x => x.tier === k);
    const x = (RS.extra[k] || "").trim(); RS.sent[k] = {t: T(), to: n.name, local: dayStr(T()) + " " + cdt(T()), text: message(RESP[RS.id], n) + (x ? "\n" + x : "")}; note(`Notice sent to ${n.name} (${n.contact}).`); }));
  doc.querySelectorAll("[data-ack]").forEach(el => el.onclick = () => act(() => { const k = el.dataset.ack; RS.sent[k].ack = T(); note(`${tierName(k)} acknowledged.`); }));
  doc.querySelectorAll("[data-hold]").forEach(el => el.onclick = () => act(() => { const k = el.dataset.hold, w = el.dataset.what; RS.holds[k] = {what: w, t: T()};
    RS.decisions.push({t: T(), what: `${w} ${k}`, who: "Incident Commander", why: "Change work on or beside the affected equipment, decided on the bridge."}); note(`Decision: ${w.toLowerCase()} ${k}.`); }));
  on("r-cmd-go", () => { const w = document.getElementById("r-cmd").value.trim(); if (w) act(() => { RS.command.push({t: T(), who: w}); note(`Command handed over to ${w}.`); }); });
  on("r-upd", () => act(() => { RS.log.push({t: T(), text: "Leadership update sent.", leadership: true}); }));
  on("r-bridge", () => act(() => { RS.bridge = T(); RS.joins["Incident Commander"] = RS.bridge; note("Bridge open."); }));
  doc.querySelectorAll("[data-engaged]").forEach(el => el.onclick = () => act(() => { RS.engaged = RS.engaged || {}; RS.engaged[el.dataset.engaged] = T(); note(`${el.dataset.engaged} engaged on site.`); }));
  doc.querySelectorAll("[data-join]").forEach(el => el.onclick = () => act(() => { RS.joins[el.dataset.join] = T(); note(`${el.dataset.join} joined the bridge.`); }));
  doc.querySelectorAll("[data-assign]").forEach(el => el.onchange = () => act(() => { RS.assign[el.dataset.assign] = el.value.trim(); note(`${el.dataset.assign}: ${el.value.trim() || "unassigned"}.`); }));
  doc.querySelectorAll("[data-act]").forEach(el => el.onchange = () => act(() => { const i = +el.dataset.act, a = TYPES[RS.type].actions[i];
    if (el.checked) { RS.acts[i] = T(); note(`Done: ${a.text}`); } else { delete RS.acts[i]; note(`Reopened: ${a.text}`); } }));
  doc.querySelectorAll("[data-q]").forEach(el => el.onchange = () => act(() => { const i = +el.dataset.q; RS.answers[i] = {a: el.value, t: T()}; note(`Bridge answer: ${TYPES[RS.type].questions[i]} ${el.value}`); }));
  doc.querySelectorAll("[data-rts]").forEach(el => el.onchange = () => act(() => { const i = +el.dataset.rts; if (el.checked) { RS.rts[i] = T(); note(`Gate: ${TYPES[RS.type].rts[i]}`); } else delete RS.rts[i]; }));
  on("r-rts", () => act(() => { RS.rtsAt = T(); note("Return to service declared."); }));
  on("d-add", () => { const g = id => document.getElementById(id).value.trim(); if (g("d-what")) act(() => { RS.decisions.push({t: T(), what: g("d-what"), who: g("d-who"), why: g("d-why")}); note(`Decision: ${g("d-what")}.`); }); });
  on("r-close", () => { act(() => { RS.closed = T(); RS.pir_due = businessDays(RS.closed, DATA.facts.pir_business_days); note("Response closed."); setClock(RS.closed, true); }); download(responseYaml(), "response-" + RS.id + ".yaml"); });
  on("r-yaml", () => download(responseYaml(), "response-" + RS.id + ".yaml"));
  on("r-reopen", () => act(() => { RS.closed = null; note("Response reopened."); }));
}
function download(text, name) {
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type: "text/yaml"})); a.download = name; a.click(); } catch (e) { /* no Blob URLs */ }
}
function sig() { const v = view(); return [v.log.filter(x => x.t <= v.now).length, Object.keys(v.acked).length, v.esc.length, Object.keys(v.joins).length, Math.floor(v.now / MIN)].join(","); }
function redraw() {   // keep the focused field and its caret across a redraw
  const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
  document.getElementById("doc").innerHTML = renderRespond(); wireRespond(); LASTSIG = sig();
  const b = id && document.getElementById(id); if (b && b.focus) { b.focus(); if (pos != null && b.setSelectionRange) b.setSelectionRange(pos, pos); }
}
function tickRespond() {
  if (mode !== "respond" || !RS) return;
  if (sig() !== LASTSIG) { const a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.dataset.extra == null && a.id !== "r-cmd") return; redraw(); }
}
function openResponse(id, at, replay) {
  const s = saved(id);
  RS = replay ? {...fresh(id, at), mode: "replay"} : s || fresh(id, at);
  if (at && !replay && !s) setClock(at, false);
  if (replay && at) setClock(at, false);
  persist();
}

function show() {
  const doc = document.getElementById("doc");
  doc.classList.toggle("wide", mode === "respond" && !!RS);
  ticker(mode === "respond" && !!RS);
  if (mode === "respond") { doc.innerHTML = RS ? renderRespond() : renderRespondList(); if (RS) { wireRespond(); LASTSIG = sig(); } }
  else doc.innerHTML = mode === "contacts" ? renderContacts() : mode === "command" ? renderCommand() : proc ? renderProc(TYPES[proc]) : renderProcedures();
  ["procedures", "contacts", "command", "respond"].forEach(k => document.getElementById("t-" + k).classList.toggle("on", k === mode));
  doc.querySelectorAll("#stepper [data-node]").forEach(el => el.onclick = () => { trail.push([el.dataset.node, +el.dataset.opt]); refreshStepper(); });
  wireStepper();
}
function wireStepper() {
  const back = document.getElementById("back"), restart = document.getElementById("restart");
  if (back) back.onclick = () => { trail.pop(); refreshStepper(); };
  if (restart) restart.onclick = () => { trail = []; refreshStepper(); };
}
function refreshStepper() {
  const el = document.getElementById("stepper");
  el.outerHTML = stepper();
  document.querySelectorAll("#stepper [data-node]").forEach(b => b.onclick = () => { trail.push([b.dataset.node, +b.dataset.opt]); refreshStepper(); });
  wireStepper();
}
function setMode(m, opt) {   // #procedures, #proc/<type>, #contacts, #command, #replay, #respond[/<record>[/<time>|/replay]]
  mode = m; proc = m === "procedures" && TYPES[opt] ? opt : "";
  if (m !== "respond") RS = null;
  const hash = m === "respond" ? "#respond" + (RS ? "/" + RS.id + (RS.mode === "replay" ? "/replay" : "") : "") : m === "command" ? (opt === "replay" ? "#replay" : "#command") : m === "contacts" ? "#contacts" : proc ? "#proc/" + proc : "#procedures";
  if (location.hash !== hash) history.replaceState(null, "", hash);
  show();
  const rp = document.getElementById("replay");
  if (opt === "replay" && rp && rp.scrollIntoView) rp.scrollIntoView();
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "respond" || h.startsWith("respond/")) {   // a record opens its event's response; a time (UTC, from Live) sets the clock
    const [, rec, at] = h.split("/"), up = (rec || "").toUpperCase(), id = Object.prototype.hasOwnProperty.call(BYREC, up) ? BYREC[up] : up;
    if (known(id)) openResponse(id, at && at !== "replay" ? Date.parse(at) || null : null, at === "replay"); else RS = null;
    setMode("respond"); document.documentElement.scrollTop = 0;
    if (rec && !known(id)) document.getElementById("doc").insertAdjacentHTML("afterbegin", `<p class="missed">No P1 event or P2 record ${esc(rec)} in this dataset.</p>`);
  }
  else if (h === "contacts") setMode("contacts");
  else if (h === "command" || h === "replay") setMode("command", h);
  else if (h.startsWith("proc/")) { setMode("procedures", h.slice(5)); document.documentElement.scrollTop = 0; }
  else setMode("procedures");
}
document.getElementById("t-procedures").onclick = () => setMode("procedures");
document.getElementById("t-contacts").onclick = () => setMode("contacts");
document.getElementById("t-command").onclick = () => { setMode("command"); document.documentElement.scrollTop = 0; };
document.getElementById("t-respond").onclick = () => { RS = null; setMode("respond"); document.documentElement.scrollTop = 0; };
document.getElementById("print").onclick = () => window.print();
// the console's one-second tick runs only while a response is open
function ticker(on) { if (on && !TIMER) TIMER = setInterval(tick1, 1000); else if (!on && TIMER) { clearInterval(TIMER); TIMER = null; } }
function tick1() { if (mode === "respond" && RS) { const c = document.getElementById("clk"), n = T(); if (c) c.textContent = both(n);
  const im = document.getElementById("impact"), e = RESP[RS.id]; if (im && e.gpus) im.textContent = (e.gpus * Math.max(0, Math.min(n, ms(e.end) ?? n) - ms(e.start)) / 3600e3).toFixed(1); tickRespond(); } }
window.addEventListener("hashchange", route);
route();
</script>
