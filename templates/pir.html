<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post-Incident Review · Site AUS-1</title>
<style>
__SITENAV_CSS__
:root { --ink:#1e2933; --muted:#5b6774; --line:#d5dbe2; --bg:#ffffff; --panel:#f5f7f9; --ll:#b45309; --it:#1f5fbf; --cu:#4b5563; --ok:#1d7a46; --bad:#b42318; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.5 "Inter","Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:#eef1f4; }
header.top { background:#fff; color:var(--ink); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
header.top a { color:var(--it); }
header.top strong { font-size:16px; }
.tabs button, .tools button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); padding:6px 14px; border-radius:6px; cursor:pointer; }
.tabs button.on { background:var(--it); color:#fff; border-color:var(--it); }
.tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
main { max-width:1080px; margin:20px auto; background:var(--bg); padding:32px 40px; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
h1 { font-size:24px; margin:0 0 4px; } h2 { font-size:17px; margin:28px 0 10px; padding-bottom:4px; border-bottom:2px solid var(--ink); }
.sub { color:var(--muted); margin:0 0 16px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 18px; }
.kv { font-size:13px; } .kv b { display:block; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
.plain { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
.card { background:var(--panel); border-radius:8px; padding:12px 14px; } .card h3 { margin:0 0 6px; font-size:14px; }
.strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:12px; }
.stat { border:1px solid var(--line); border-radius:8px; padding:10px 12px; } .stat .v { font-size:20px; font-weight:700; } .stat .l { font-size:12px; color:var(--muted); }
table { width:100%; border-collapse:collapse; font-size:13px; } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { background:var(--panel); font-weight:600; } td.num { white-space:nowrap; }
.tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; color:#fff; white-space:nowrap; }
.Landlord { background:var(--ll); } .IT { background:var(--it); } .Customer { background:var(--cu); }
.met { color:var(--ok); font-weight:600; } .missed { color:var(--bad); font-weight:600; }
details summary { cursor:pointer; color:var(--muted); font-size:12px; } code.rec { display:block; white-space:pre-wrap; word-break:break-all; font-size:11px; background:#f7f7f2; padding:6px; border-radius:4px; }
.box { border-left:4px solid var(--ll); background:#fdf6ec; padding:10px 14px; border-radius:4px; }
textarea, input[type=text], select { width:100%; font:inherit; border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:#fffef6; }
textarea { min-height:70px; resize:vertical; }
.autofill { display:flex; gap:8px; align-items:center; background:var(--panel); padding:12px; border-radius:8px; margin-bottom:12px; }
.autofill input { max-width:240px; } .note { font-size:12px; color:var(--muted); }
.plainonly .tech { display:none; }
.filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px 12px; align-items:end; background:var(--panel); padding:12px; border-radius:8px; margin:8px 0 12px; }
.filters label { font-size:12px; color:var(--muted); } .filters label.ck { display:flex; gap:6px; align-items:center; color:var(--ink); }
.filters input[type=date] { width:100%; font:inherit; border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
.btn { font:inherit; font-size:13px; border:1px solid var(--line); background:#fff; color:var(--it); padding:4px 10px; border-radius:6px; cursor:pointer; text-decoration:none; white-space:nowrap; display:inline-block; }
.pill { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; background:var(--panel); border:1px solid var(--line); margin:1px 2px 1px 0; white-space:nowrap; }
.pill.near { border-style:dashed; }
.saved { font-size:12px; color:var(--ok); }
.sign { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; } .sign div { border-top:1px solid var(--ink); padding-top:6px; font-size:13px; min-height:60px; }
@media print { header.top, .autofill, .addrow { display:none !important; } body { background:#fff; } main { box-shadow:none; margin:0; max-width:none; padding:0; } h2 { break-after:avoid; } tr { break-inside:avoid; } }
</style>
</head>
<body>
__SITENAV__
<header class="top">
  <div><strong>Post-Incident Review</strong></div>
  <div class="tabs"><button id="t-list">Reviews</button> <button id="t-example" class="on">Review</button> <button id="t-blank">Blank form</button></div>
  <div class="tools">
    <label style="font-size:13px;"><input type="checkbox" id="plainonly"> Plain-language view</label>
    <button id="print">Print / save PDF</button><button id="md">Export Markdown</button>
  </div>
</header>
<main id="doc"></main>
<script id="data" type="application/json">__DATA__</script>
<script type="application/json" data-gl-skip id="near">__NEAR__</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const NEAR = JSON.parse(document.getElementById("near").textContent);   // record -> devices one connection away
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const partyCls = p => p === "IT Partner" ? "IT" : esc(p);
let mode = "example";
let current = DATA.reviews[0].id;     // the completed review on the Review tab
let draftRef = "";                    // the record the blank form is filled from
const BY_ID = Object.fromEntries(DATA.reviews.map(r => [r.id, r]));
const REVIEWED = {};                  // record number -> completed review id
DATA.reviews.forEach(r => { const f = DATA.index[r.ref]; [r.ref, f.ticket, f.work_order].filter(Boolean).forEach(x => REVIEWED[x] = REVIEWED[x] || r.id); });
const KEY = "usm.pir.drafts";         // drafts live in this browser only
function drafts() { try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { return {}; } }
function saveDrafts(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); return true; } catch (e) { return false; } }

function swimlane(f) {
  if (!f.phases || !f.phases.length) return "";
  const t = s => new Date(s).getTime();
  const rows = f.timeline.filter(r => r.t >= f.timeline[0].t);
  const times = rows.map(r => t(r.t)).concat(f.phases.flatMap(p => [t(p[1]), t(p[2])]), f.marks.map(m => t(m[0])));
  const t0 = Math.min(...times), t1 = Math.max(...times);
  const W = 960, L = 120, x = v => L + (W - L - 20) * (t(v) - t0) / (t1 - t0 || 1);
  const lanes = ["Landlord", "IT Partner", "Customer"], y = p => 30 + lanes.indexOf(p) * 34;
  const color = p => p === "Landlord" ? "#b45309" : p === "IT Partner" ? "#1f5fbf" : "#4b5563";
  let s = `<svg viewBox="0 0 ${W} 150" width="100%" role="img" aria-label="Timeline by party">`;
  lanes.forEach(p => s += `<text x="8" y="${y(p) + 4}" font-size="12" fill="#5b6774">${p}</text><line x1="${L}" x2="${W - 20}" y1="${y(p)}" y2="${y(p)}" stroke="#d5dbe2"/>`);
  let labels = "";
  f.phases.forEach(([p, a, b, lbl], i) => {
    s += `<rect x="${x(a)}" y="${y(p) - 9}" width="${Math.max(2, x(b) - x(a))}" height="18" fill="${color(p)}" opacity=".85"/>`;
    labels += `<text x="${(x(a) + x(b)) / 2}" y="${i === 0 ? y(p) - 13 : y(p) + 22}" font-size="11" fill="${color(p)}" text-anchor="middle">${esc(lbl)}</text>`;
  });
  rows.forEach(r => s += `<circle cx="${x(r.t)}" cy="${y(r.party)}" r="3" fill="#1e2933"><title>${esc(r.local + " " + r.event)}</title></circle>`);
  s += labels;   // labels sit outside the bars, so event dots never cover them
  f.marks.forEach(([v, lbl]) => {
    s += `<line x1="${x(v)}" x2="${x(v)}" y1="14" y2="128" stroke="#1e2933" stroke-dasharray="3 3"/><text x="${x(v)}" y="142" font-size="11" text-anchor="middle">${esc(lbl)} ${new Date(v).toLocaleTimeString("en-US", {timeZone: "America/Chicago", hour: "numeric", minute: "2-digit"})}</text>`;
  });
  return s + "</svg>";
}

function field(name, value, edit, rows = 3) {
  return edit ? `<textarea data-f="${name}" rows="${rows}">${esc(value)}</textarea>` : `<div>${esc(value) || "<span class='note'>(not completed)</span>"}</div>`;
}

function render(f, a, edit) {
  a = a || {};
  const pl = a.plain_language || {};
  const sev = a.severity || {};
  const osr = sev.osr_level || (f && f.osr_suggested.level);
  let h = "";
  if (edit) h += `<div class="autofill"><b>Auto-fill from</b><input type="text" id="ref" placeholder="Any record, e.g. INC3900001, WO-41024, MOP-310" value="${esc(f ? f.ref : "")}"><button id="go">Fill facts</button>` +
    (f ? `<button id="yaml" class="btn">Export YAML</button><button id="deldraft" class="btn">Delete draft</button>` : "") +
    `<span class="note" id="refnote">${f ? `Draft ${esc("PIR-DRAFT-" + f.ref)} is saved in this browser as you type.` : `${Object.keys(DATA.index).length} records indexed: every incident, change, work order, method of procedure, and preventive maintenance task in the sample month.`}</span><span class="saved" id="savednote"></span></div>`;
  h += `<h1>${edit ? `<input type="text" data-f="title" value="${esc(a.title || (f ? f.title : ""))}" placeholder="Incident title">` : esc(a.title)}</h1>`;
  h += `<p class="sub">${esc(a.id || (f ? "PIR-DRAFT-" + f.ref : "PIR-draft"))} · Status: ${edit ? `<select data-f="status">${["Draft", "In review", "Approved; action items in progress", "Action items closed"].map(o => `<option${o === a.status ? " selected" : ""}>${o}</option>`).join("")}</select>` : esc(a.status)} · Blameless review: findings describe systems and procedures, not individuals.</p>`;
  h += `<div class="grid">` + [
    ["Incident date", f && f.date], ["Ticket", f && f.ticket], ["Work order", f && f.work_order], ["MOP", f && f.mops.join(", ")],
    ["Unit", f && f.unit], ["Record", f && `${f.ref} (${f.type_label})`], ["Related records", f && f.related.join(", ")], ["Uptime severity (OSR)", osr ? `${osr} · ${DATA.osr[osr][0]}` : ""], ["Internal severity", sev.internal || (f && f.findings.length ? f.findings[0].severity : "")],
    ["Priority", sev.priority || ""], ["Incident Commander", a.incident_commander || ""], ["Review meeting", a.review_meeting || ""]
  ].map(([k, v]) => `<div class="kv"${k === "Unit" && v ? ` data-loc="${esc(v)}"` : ""}><b>${k}</b>${edit && ["Priority", "Incident Commander", "Review meeting"].includes(k) ? `<input type="text" data-f="${k}" value="${esc(v)}">` : esc(v || "—")}</div>`).join("") + `</div>`;
  if (f && ["chg", "mop", "pm"].includes(f.kind)) h += `<p class="note">This record is a ${esc(f.type_label.toLowerCase())}: its facts are the ${f.kind === "pm" ? "due" : "approved"} window, the work recorded, its alarms, and its findings. Response targets apply to incidents and work orders.</p>`;
  if (osr) h += `<p class="note">OSR ${esc(osr)} (${esc(DATA.osr[osr][0])}): ${esc(DATA.osr[osr][1])} ${esc(sev.osr_rationale || "")}</p>`;

  h += `<h2>In plain language</h2><div class="plain">` + [["What happened?", "what_happened"], ["Who was affected?", "who_was_affected"], ["Why did it happen?", "why"], ["What are we doing about it?", "what_we_are_doing"]]
    .map(([q, k]) => `<div class="card"><h3>${q}</h3>${field("pl." + k, pl[k], edit, 5)}</div>`).join("") + `</div>`;
  if (f) {
    const im = f.impact;
    h += `<div class="strip">` + [[im.duration, f.labels.duration], [im.gpus + " GPUs", f.labels.gpus], [im.gpu_hours_total, "GPU-hours lost"],
      [im.gpu_hours_landlord + " / " + im.gpu_hours_it, f.labels.split], [im.injuries, "Injuries"],
      [f.credits_landlord != null ? "$" + Math.round(f.credits_landlord).toLocaleString() : "—", "Landlord credits this month (all causes)"]]
      .map(([v, l]) => `<div class="stat"><div class="v">${esc(v)}</div><div class="l">${l}</div></div>`).join("") + `</div>`;
    h += `<h2>Timeline at a glance</h2>${swimlane(f)}`;
  }
  h += `<div class="tech">`;
  h += `<h2>Summary (technical)</h2>${field("summary_technical", a.summary_technical, edit, 6)}`;
  h += `<div class="grid" style="margin-top:10px">` + [["Trigger", "trigger"], ["Detection", "detection"], ["Resolution", "resolution"]].map(([k, n]) => `<div class="kv"><b>${k}</b>${field(n, a[n], edit)}</div>`).join("") + `</div>`;
  if (f) {
    h += `<h2>Response against targets</h2><table><tr><th>Measure</th><th>From (UTC)</th><th>To (UTC)</th><th>Elapsed</th><th>Target</th><th>Result</th></tr>` +
      f.metrics.map(m => `<tr><td>${esc(m.measure)}${m.note ? `<br><span class="note">${esc(m.note)}</span>` : ""}</td><td class="num">${esc(m.from.slice(11, 19))}</td><td class="num">${esc(m.to.slice(11, 19))}</td><td class="num">${esc(m.elapsed)}</td><td>${m.target ? esc(m.target) + " min" : "—"}</td><td>${m.met === null ? "—" : m.met ? "<span class='met'>Met</span>" : "<span class='missed'>Missed</span>"}</td></tr>`).join("") + `</table>`;
    h += `<h2>Alarm and event timeline (exact source records)</h2><p class="note">Times in UTC and Central (CDT). Expand a row to see the source record exactly as stored. ${esc(DATA.badge_note)}</p><table><tr><th>UTC</th><th>Central</th><th>Party</th><th>Event</th><th>Source</th></tr>` +
      f.timeline.map(r => `<tr><td class="num">${esc(r.t.slice(11, 19))}</td><td class="num">${esc(r.local)}</td><td><span class="tag ${partyCls(r.party)}">${esc(r.party)}</span></td><td>${esc(r.event)}${r.record ? `<details><summary>record</summary><code class="rec">${esc(r.record)}</code></details>` : ""}</td><td><code>${esc(r.source)}</code></td></tr>`).join("") + `</table>`;
    h += `<h2>Attribution (Interface Agreement)</h2><div class="box"><b>Owner: ${esc(f.attribution.owner)}</b>${f.attribution.rules.length ? " · rules " + esc(f.attribution.rules.join(", ")) : ""}<br>${esc(f.attribution.evidence)}${f.handoff ? `<br>Under FA-3 the IT Partner's clock started at the Landlord's handoff, ${esc(f.handoff.slice(11, 19))}Z.` : ""}</div>`;
    h += `<h2>Contract and compliance consequences</h2><ul>` +
      f.findings.map(x => `<li>Finding ${esc(x.id)} (${esc(x.severity)}): ${esc(x.summary)}</li>`).join("") +
      (f.csl["OT-CSL-01"] ? `<li>OT-CSL-01 Rack Power Availability measured ${esc(f.csl["OT-CSL-01"].actual.toFixed(4))}% against a Minimum of ${esc(f.csl["OT-CSL-01"].minimum)}%: ${esc(f.csl["OT-CSL-01"].status.replace(/_/g, " "))}${f.csl["OT-CSL-01"].credit ? `, credit $${esc(Math.round(f.csl["OT-CSL-01"].credit).toLocaleString())}` : ""}.</li>` : "") +
      (f.mop_overrun ? `<li>${esc(f.mop_overrun.mop)} window ended ${esc(f.mop_overrun.window_end.slice(11, 19))}Z; its equipment was closed at ${esc(f.mop_overrun.closed.slice(11, 19))}Z, ${esc(f.mop_overrun.overrun)} past the approved window.</li>` : "") + `</ul>`;
  }
  const ehs = a.ehs || {};
  h += `<h2>EHS screening</h2><div class="grid"><div class="kv"><b>Injuries</b>${edit ? `<input type="text" data-f="ehs.injuries" value="${esc(ehs.injuries ?? 0)}">` : esc(ehs.injuries ?? 0)}</div><div class="kv"><b>Screening</b>${field("ehs.screening", ehs.screening, edit)}</div><div class="kv"><b>Referral</b>${field("ehs.referral", ehs.referral, edit)}</div></div>`;
  h += `<h2>Contributing factors</h2><p class="note">Classified as Uptime Institute does for human-error outages: procedure not followed, procedure inadequate, plus equipment, design, and change control.</p><table><tr><th>ID</th><th>Type</th><th>Factor</th></tr>` +
    (a.factors || [{id: "F1", type: "", text: ""}, {id: "F2", type: "", text: ""}]).map((x, i) => `<tr><td>${esc(x.id)}</td><td>${edit ? `<select data-f="factors.${i}.type">${["", "Procedure not followed", "Procedure inadequate", "Equipment", "Design and identification", "Change control", "External"].map(o => `<option${o === x.type ? " selected" : ""}>${o}</option>`).join("")}</select>` : esc(x.type)}</td><td>${field(`factors.${i}.text`, x.text, edit, 2)}</td></tr>`).join("") + `</table>`;
  h += `</div>`;
  const ls = a.lessons || {};
  h += `<h2>Lessons</h2><div class="plain">` + [["What went well", "went_well"], ["What went poorly", "went_poorly"], ["Where we got lucky", "lucky"]].map(([t, k]) =>
    `<div class="card"><h3>${t}</h3>${edit ? `<textarea data-f="lessons.${k}" rows="5">${esc((ls[k] || []).join("\n"))}</textarea>` : `<ul>${(ls[k] || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`}</div>`).join("") + `</div>`;
  h += `<h2>Action items</h2><p class="note">Status as of ${edit ? `<input type="text" data-f="status_as_of" value="${esc(a.status_as_of || "")}" placeholder="YYYY-MM-DD">` : esc(a.status_as_of)}</p><table><tr><th>ID</th><th>Action</th><th>Factor</th><th>Owner</th><th>Priority</th><th>Due</th><th>Success criterion</th><th>Status</th></tr>` +
    (a.actions || [{id: "A1"}, {id: "A2"}, {id: "A3"}]).map((x, i) => `<tr><td>${esc(x.id)}</td>` + ["action", "factor", "owner", "priority", "due", "success", "status"].map(k => `<td${k === "due" ? ' class="num"' : ""}>${edit ? `<input type="text" data-f="actions.${i}.${k}" value="${esc(x[k] || "")}">` : esc(x[k])}</td>`).join("") + `</tr>`).join("") + `</table>`;
  h += `<div class="tech"><h2>Communications log</h2><table><tr><th>Time</th><th>To</th><th>Message</th></tr>` +
    (a.communications || [{}, {}]).map((x, i) => `<tr>` + ["local", "to", "message"].map(k => `<td>${edit ? `<input type="text" data-f="communications.${i}.${k}" value="${esc(x[k] || "")}">` : esc(x[k])}</td>`).join("") + `</tr>`).join("") + `</table>`;
  if (f && f.repeats.length) {
    const rr = a.repeat_rulings || {};
    h += `<h2>Repeat-event check</h2><p class="note">Other records in the window on the same rack or busway. Each is ruled in or out as related.</p><ul>` +
      f.repeats.map(r => {
        const rl = rr[r.ref] || {};
        const ruling = edit
          ? `<br><select data-f="repeat.${esc(r.ref)}.related">${["", "Related", "Not related"].map(o => `<option${o === (rl.related === undefined ? "" : rl.related ? "Related" : "Not related") ? " selected" : ""}>${o}</option>`).join("")}</select> <input type="text" data-f="repeat.${esc(r.ref)}.reason" value="${esc(rl.reason || "")}" placeholder="Why it is or is not related">`
          : rl.related === undefined ? ` <b>Not yet ruled.</b>` : ` <b>${rl.related ? "Related" : "Not related"}:</b> ${esc(rl.reason)}`;
        return `<li>${esc(r.ref)} (${esc(r.opened.slice(0, 16).replace("T", " "))}Z): ${esc(r.what)}.${ruling}</li>`;
      }).join("") + `</ul>`;
  }
  h += `</div>`;
  h += `<h2>Sign-off</h2><div class="sign">${(a.signoff || [{role: "Customer Site Lead (Incident Commander)"}, {role: "Landlord"}, {role: "IT Partner"}]).map(s => `<div>${esc(s.role)}<br><span class="note">${s.date ? "Signed " + esc(s.date) : "Signature and date"}</span></div>`).join("")}</div>`;
  h += `<p class="note" style="margin-top:24px">Synthetic data for a portfolio demonstration; all names and events are fictional. Facts are generated from the dataset by src/scorecard/pir.py; ${edit ? "this draft's judgment fields are saved in this browser; Export YAML gives the file for pir/reviews/." : `this review's judgment fields are in pir/reviews/${esc(a.id || "")}.yaml.`}</p>`;
  return h;
}

function collect() {
  const out = {};
  document.querySelectorAll("[data-f]").forEach(el => out[el.dataset.f] = el.value);
  return out;
}

function toMarkdown() {
  const doc = document.getElementById("doc").cloneNode(true);
  doc.querySelectorAll("textarea,input,select").forEach(el => { const s = document.createElement("span"); s.textContent = el.value; el.replaceWith(s); });
  doc.querySelectorAll("details,.autofill,svg").forEach(el => el.remove());
  let md = "";
  doc.childNodes.forEach(function walk(n) {
    if (n.nodeType === 3) { md += n.textContent; return; }
    const tag = n.tagName;
    if (tag === "H1") md += "\n# " + n.textContent.trim() + "\n\n";
    else if (tag === "H2") md += "\n## " + n.textContent.trim() + "\n\n";
    else if (tag === "H3") md += "\n**" + n.textContent.trim() + "**\n\n";
    else if (tag === "TABLE") { [...n.rows].forEach((r, i) => { md += "| " + [...r.cells].map(c => c.textContent.trim().replace(/\|/g, "/")).join(" | ") + " |\n"; if (i === 0) md += "|" + [...r.cells].map(() => "---").join("|") + "|\n"; }); md += "\n"; }
    else if (tag === "LI") md += "- " + n.textContent.trim() + "\n";
    else { n.childNodes.forEach(walk); if (["P", "DIV", "UL"].includes(tag)) md += "\n"; }
  });
  return md.replace(/\n{3,}/g, "\n\n");
}

// The flat form fields (data-f) back into the shape of pir/reviews/*.yaml.
function toReview(flat, f) {
  const a = {id: f ? "PIR-DRAFT-" + f.ref : "PIR-draft", ref: f ? f.ref : "", title: flat.title || "", status: flat.status || "Draft",
    incident_commander: flat["Incident Commander"] || "", review_meeting: flat["Review meeting"] || "", status_as_of: flat.status_as_of || "",
    severity: {osr_level: f ? f.osr_suggested.level : null, priority: flat.Priority || ""}, plain_language: {}, ehs: {},
    summary_technical: flat.summary_technical || "", trigger: flat.trigger || "", detection: flat.detection || "", resolution: flat.resolution || "",
    factors: [], lessons: {}, actions: [], communications: [], repeat_rulings: {}};
  Object.entries(flat).forEach(([k, v]) => {
    const p = k.split(".");
    if (p[0] === "pl") a.plain_language[p[1]] = v;
    else if (p[0] === "ehs") a.ehs[p[1]] = p[1] === "injuries" ? (Number(v) || 0) : v;
    else if (p[0] === "lessons") a.lessons[p[1]] = v.split("\n").map(x => x.trim()).filter(Boolean);
    else if (["factors", "actions", "communications"].includes(p[0])) {
      const i = Number(p[1]), list = a[p[0]];
      list[i] = list[i] || (p[0] === "communications" ? {} : {id: (p[0] === "factors" ? "F" : "A") + (i + 1)});
      list[i][p[2]] = v;
    } else if (p[0] === "repeat") {
      const ref = p.slice(1, -1).join("."), r = a.repeat_rulings[ref] = a.repeat_rulings[ref] || {};
      if (p[p.length - 1] === "related") { if (v) r.related = v === "Related"; } else r.reason = v;
    }
  });
  ["factors", "actions", "communications"].forEach(k => a[k] = a[k].filter(Boolean));
  return a;
}

// A review's facts pre-fill the judgment fields that have an obvious first draft; everything else is left for people.
function prefill(f, a) {
  const pl = a.plain_language;
  a.title = a.title || f.title;
  a.severity.priority = a.severity.priority || f.priority || "";
  pl.what_happened = pl.what_happened || `On ${f.date}, ${f.unit} was affected for ${f.impact.duration || "an unknown time"}. [Describe in everyday words what happened.]`;
  pl.who_was_affected = pl.who_was_affected || (f.impact.gpus ? `${f.impact.gpus} GPUs (${f.impact.gpu_hours_total} GPU-hours) were unavailable. Injuries: ${f.impact.injuries}.` : "No compute capacity was lost.");
  const det = f.metrics.find(m => m.measure.startsWith("Detect"));
  a.detection = a.detection || (det ? `${det.measure}: ${det.elapsed}.` : "");
  return a;
}

// YAML for pir/reviews/: JSON strings are valid YAML scalars, so values are written JSON-quoted.
function toYaml(v, ind = "") {
  if (Array.isArray(v)) return v.length ? v.map(x => `\n${ind}- ` + (x && typeof x === "object" ? toYaml(x, ind + "  ").replace(/^\n\s*/, "") : JSON.stringify(x))).join("") : " []";
  if (v && typeof v === "object") return Object.entries(v).map(([k, x]) => `\n${ind}${/^[A-Za-z0-9_-]+$/.test(k) ? k : JSON.stringify(k)}:` +
    (x && typeof x === "object" ? (Object.keys(x).length ? toYaml(x, ind + "  ") : Array.isArray(x) ? " []" : " {}") : " " + JSON.stringify(x))).join("");
  return JSON.stringify(v);
}
function reviewYaml(a) {
  return "# Post-incident review draft exported from the Post-Incident Review page. Facts come from the data;\n# give it the next review number as its file name and id, then add it to pir/reviews/ once it is signed off.\n" + toYaml(a).replace(/^\n/, "") + "\n";
}

// ----------------------------------------------------------------------------- the review list and search
function entries(all) {
  const out = DATA.reviews.map(r => ({id: r.id, ref: r.ref, title: r.title, status: r.status, href: "#" + r.id, label: r.id}));
  const ds = drafts();
  Object.keys(ds).sort().forEach(ref => { if (DATA.index[ref]) out.push({id: "PIR-DRAFT-" + ref, ref, title: ds[ref].a.title || DATA.index[ref].title,
    status: "Draft, saved in this browser " + String(ds[ref].saved || "").slice(0, 10), href: "#new=" + ref, label: "Continue draft"}); });
  if (all) Object.keys(DATA.index).filter(ref => !REVIEWED[ref] && !ds[ref]).forEach(ref => out.push({id: "", ref, title: DATA.index[ref].title,
    status: "No review", href: "#new=" + ref, label: "Start review"}));
  return out;
}

function search() {
  const v = id => (document.getElementById(id).value || "").trim();
  const from = v("f-from"), to = v("f-to"), num = v("f-ticket").toUpperCase(), dev = v("f-device").toLowerCase().replace(/(?: port \d+|:swp\d+)$/, "");
  const near = document.getElementById("f-near").checked;
  const rows = [];
  entries(document.getElementById("f-all").checked).forEach(e => {
    const f = DATA.index[e.ref];
    if (from && f.date < from || to && f.date > to) return;
    const nums = [e.id, e.ref, f.ticket, f.work_order, ...f.mops, ...f.related].filter(Boolean);
    if (num && !nums.some(x => x.toUpperCase().includes(num))) return;
    let via = "";
    if (dev) {
      const own = f.devices.find(d => d.toLowerCase().includes(dev)) || ((f.unit || "").toLowerCase().includes(dev) ? f.unit : "");
      const conn = !own && near ? (NEAR[e.ref] || []).find(d => d.toLowerCase() === dev) : "";
      if (!own && !conn) return;
      via = conn ? `connected to ${conn}` : "";
    }
    rows.push([e, f, via]);
  });
  rows.sort((a, b) => b[1].date.localeCompare(a[1].date) || a[0].ref.localeCompare(b[0].ref));
  const done = rows.filter(r => r[0].status !== "No review").length;
  document.getElementById("count").textContent = `${done} review${done === 1 ? "" : "s"}` + (document.getElementById("f-all").checked ? ` and ${rows.length - done} records with no review` : "") + " match.";
  document.getElementById("results").innerHTML = `<table><tr><th>Review</th><th>Event date</th><th>Title</th><th>Status</th><th>Records</th><th>Devices</th></tr>` +
    rows.map(([e, f, via]) => `<tr><td class="num"><a class="btn" href="${esc(e.href)}">${esc(e.label)}</a></td><td class="num">${esc(f.date)}</td><td>${esc(e.title)}</td><td>${esc(e.status)}</td>` +
      `<td>${[e.ref, f.ticket, f.work_order, ...f.mops].filter((x, i, l) => x && l.indexOf(x) === i).map(x => `<span class="pill">${esc(x)}</span>`).join("")}</td>` +
      `<td>${f.devices.map(d => `<span class="pill">${esc(d)}</span>`).join("")}${via ? `<span class="pill near">${esc(via)}</span>` : ""}</td></tr>`).join("") + `</table>`;
}

function renderList() {
  return `<h1>Post-incident reviews</h1><p class="sub">Completed reviews live in the repository (pir/reviews/) and are checked against the data. Drafts are saved in this browser only. Start a review from any record here or from the Incident Portal.</p>` +
    `<div class="filters"><label>Event from<input type="date" id="f-from"></label><label>to<input type="date" id="f-to"></label>` +
    `<label>Ticket number<input type="text" id="f-ticket" placeholder="INC, CHG, WO, MOP or PM"></label><label>Device name<input type="text" id="f-device" placeholder="e.g. CDU-A2, a07-ct04, leaf-a04-r1"></label>` +
    `<label class="ck"><input type="checkbox" id="f-near"> Include connected devices</label><label class="ck"><input type="checkbox" id="f-all"> Also records with no review</label>` +
    `<div><button id="f-clear" class="btn">Clear</button></div></div><p class="note" id="count"></p><div id="results"></div>` +
    `<p class="note">A ticket number matches the review's own record and every record related to it. A device name matches the devices the record names; with connected devices, also anything one connection away in the device directory (a tray's leaf switch, a rack's tap-offs and CDU).</p>`;
}

function show() {
  const doc = document.getElementById("doc");
  if (mode === "list") {
    doc.innerHTML = renderList();
    doc.querySelectorAll(".filters input").forEach(el => el.addEventListener("input", search));
    doc.querySelectorAll(".filters input[type=checkbox]").forEach(el => el.addEventListener("change", search));
    document.getElementById("f-clear").onclick = () => { doc.querySelectorAll(".filters input").forEach(el => el.type === "checkbox" ? el.checked = false : el.value = ""); search(); };
    search();
  } else if (mode === "example") doc.innerHTML = render(DATA.index[BY_ID[current].ref], BY_ID[current], false);
  else {
    const f = DATA.index[draftRef];
    const d = f && drafts()[draftRef];
    doc.innerHTML = render(f || null, f ? (d ? d.a : prefill(f, toReview({}, f))) : {}, true);
    wireBlank();
  }
  document.getElementById("t-example").textContent = "Review: " + current;
}

function wireBlank() {
  const doc = document.getElementById("doc");
  document.getElementById("go").onclick = () => {
    const ref = document.getElementById("ref").value.trim().toUpperCase();
    const f = DATA.index[ref];
    if (!f) { document.getElementById("refnote").textContent = `No record "${ref}" in this dataset (no incident, change, work order, method of procedure, or preventive maintenance task by that number). Try INC3900001, WO-41024, or MOP-310.`; return; }
    const saved = drafts()[ref];
    const a = saved ? saved.a : prefill(f, toReview(collect(), f));
    draftRef = ref;
    history.replaceState(null, "", "#new=" + ref);
    doc.innerHTML = render(f, a, true);
    wireBlank();
  };
  if (!draftRef || !DATA.index[draftRef]) return;
  const save = () => {
    const d = drafts();
    d[draftRef] = {saved: new Date().toISOString(), a: toReview(collect(), DATA.index[draftRef])};
    if (saveDrafts(d)) document.getElementById("savednote").textContent = " Saved.";
  };
  doc.querySelectorAll("[data-f]").forEach(el => { el.addEventListener("input", save); el.addEventListener("change", save); });
  document.getElementById("yaml").onclick = () => download(reviewYaml(toReview(collect(), DATA.index[draftRef])), "PIR-DRAFT-" + draftRef + ".yaml", "text/yaml");
  document.getElementById("deldraft").onclick = () => {
    const d = drafts(); delete d[draftRef]; saveDrafts(d);
    doc.innerHTML = render(DATA.index[draftRef], prefill(DATA.index[draftRef], toReview({}, DATA.index[draftRef])), true);
    wireBlank();
    document.getElementById("savednote").textContent = " Draft deleted.";
  };
}

function download(text, name, type) {
  const blob = new Blob([text], {type});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

function setMode(m, opt) {   // #reviews, #PIR-2026-001 (or #example), #blank, #new=<record>
  mode = m;
  if (m === "example" && opt) current = opt;
  if (m === "blank") draftRef = opt || "";
  ["list", "example", "blank"].forEach(k => document.getElementById("t-" + k).classList.toggle("on", k === m));
  const hash = m === "list" ? "#reviews" : m === "example" ? (current === DATA.reviews[0].id ? "#example" : "#" + current) : draftRef ? "#new=" + draftRef : "#blank";
  if (location.hash !== hash) history.replaceState(null, "", hash);
  show();
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "reviews") setMode("list");
  else if (h === "blank") setMode("blank");
  else if (h.startsWith("new=")) setMode("blank", h.slice(4).toUpperCase());
  else if (BY_ID[h]) setMode("example", h);
  else setMode("example", DATA.reviews[0].id);
}
document.getElementById("t-list").onclick = () => setMode("list");
document.getElementById("t-example").onclick = () => setMode("example");
document.getElementById("t-blank").onclick = () => setMode("blank", draftRef);
document.getElementById("plainonly").onchange = e => document.body.classList.toggle("plainonly", e.target.checked);
document.getElementById("print").onclick = () => window.print();
document.getElementById("md").onclick = () => download(toMarkdown(), (mode === "example" ? current : draftRef ? "PIR-DRAFT-" + draftRef : "PIR-draft") + ".md", "text/markdown");
window.addEventListener("hashchange", route);
route();
</script>
</body>
