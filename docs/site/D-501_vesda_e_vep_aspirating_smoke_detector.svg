<text x="740.0" y="196.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6b7785" font-weight="normal">Sampling holes along each cold aisle (sheet A-201)</text>
<text x="560.0" y="480.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">Air drawn in through the holes, through the filter to the chamber; the</text>
<text x="560.0" y="494.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">flow sensor on each inlet raises a flow fault when its pipe is blocked.</text>
<text x="1010.0" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#1e2933" font-weight="bold">Alarm points on this sheet</text>
<text x="1010.0" y="80.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1e2933" font-weight="bold">Pipe inlets and flow sensors</text>
<text x="1020.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">Detector fault: airflow low (Modbus HLI)</text>
<text x="1010.0" y="113.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1e2933" font-weight="bold">Detection chamber</text>
<text x="1020.0" y="127.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">Smoke alarm (Alert, Action, Fire 1, Fire 2) (Modbus</text>
<text x="1020.0" y="141.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">HLI, fire panel)</text>
<text x="1010.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1e2933" font-weight="bold">Display</text>
<text x="1020.0" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">Detector isolated (Modbus HLI)</text>
<text x="1010.0" y="201.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#1e2933" font-weight="bold">Notes</text>
<text x="1010.0" y="221.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">Representative drawing from public product</text>
<text x="1010.0" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">information; not a manufacturer drawing. Typical of</text>
<text x="1010.0" y="249.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">every instance on the site: the popup names the</text>
<text x="1010.0" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">instance.</text>
<text x="1010.0" y="287.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">Four pipe inlets on top, numbered left to right</text>
<text x="1010.0" y="301.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">(assumed). Pipe run shown schematically; the hall</text>
<text x="1010.0" y="315.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">plans show where it runs.</text>
<text x="1010.0" y="339.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">Sources and assumptions for every part:</text>
<text x="1010.0" y="353.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7785" font-weight="normal">site/details.yaml.</text>
