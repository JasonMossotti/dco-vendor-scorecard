# Engineer notes written by hand for the records a reviewer is most likely to open: the P1 records and the A07
# outage. Each entry replaces or adds fields of the composed note (src/scorecard/engineer_notes.py) in the same
# shape: text fields {text}, logs {entries: [{at, by, text}]}, tables {rows}, checklists {items}, time {entries:
# [{by, from, to, hours, what}]}. Times are UTC and must be times on the record; clock times in the text are
# Central (CDT). People by person ID only. tests/test_engineer_notes.py holds every note to its record.
#
# Notes follow the partner's own record. They do not explain away a finding: where the Customer's measurement
# differs (WO-41043, WO-41062), the record and its finding stay as they are.

INC3900001:
  comments:
    entries:
      - {at: "2026-09-15T15:48:04Z", by: RSS-004, text: "Rack A07 is down on both power feeds. The Landlord is working it under WO-41023; we are standing by at the rack for the handoff and will update at power-on."}
      - {at: "2026-09-15T19:16:55Z", by: RSS-004, text: "Landlord handoff received; power restored at 14:06. Powering on rack A07 and running the return-to-service checks."}
      - {at: "2026-09-15T20:01:36Z", by: RSS-004, text: "All return-to-service checks passed (rack_power_on, rack_nvlink_acceptance, nccl_allreduce_rack). Rack A07 is back in production."}
  cause:
    text: "Facility power loss, not an IT fault: both tap-off feeds to rack A07 were open at the same time during Landlord work (WO-41023, MOP-310). No IT hardware failed."
  close_notes:
    text: "Facility restored; validated. Landlord restored power at 14:06 under WO-41023. Rack powered on and validated: rack_power_on, rack_nvlink_acceptance, and nccl_allreduce_rack all passed. 18 of 18 nodes back in service at 15:01. No IT parts used."
  time_worked:
    entries:
      - {by: RSS-004, from: "2026-09-15T19:13:02Z", to: "2026-09-15T20:01:36Z", hours: 0.81, what: "On site at the rack to validation complete (work notes)"}

WO-41023:
  long_description:
    text: "Rack A07 lost both feeds during MOP-310. The A-side tap-off TO-A07-A was open for the retorque; the B-side tap-off TO-A07-B was opened at 10:42, leaving the rack with no input power. Unit Rack A07, Hall A."
  work_log:
    entries:
      - {at: "2026-09-15T15:45:08Z", by: CCF-E02, text: "BMS alarm acknowledged: rack input power lost (both feeds). TO-A07-B found open alongside TO-A07-A, which was open for MOP-310."}
      - {at: "2026-09-15T15:45:17Z", by: CCF-E02, text: "In Hall A at the busway. Stopped the MOP work. TO-A07-B is the B-side unit next to the A-side one being retorqued."}
      - {at: "2026-09-15T19:06:55Z", by: CCF-E02, text: "B tap-off unit failed on reclose and was replaced. TO-A07-B closed; B-side feed to rack A07 restored. Handoff to the IT Partner (INC3900001)."}
      - {at: "2026-09-15T19:22:05Z", by: CCF-E02, text: "Retorque finished; TO-A07-A closed. Both feeds live."}
      - {at: "2026-09-15T19:27:55Z", by: CCF-E02, text: "Closed. Rack A07 on both feeds."}
  failure:
    rows:
      - ["Failure class", "OT-FC-PWR"]
      - ["Problem", "Rack lost both feeds"]
      - ["Cause", "Wrong tap-off (TO-A07-B) opened while TO-A07-A was open under MOP-310; the B unit failed on reclose"]
      - ["Remedy", "Replaced the B tap-off unit, closed TO-A07-B, finished the retorque, closed TO-A07-A"]
  labor:
    entries:
      - {by: CCF-E02, from: "2026-09-15T15:45:17Z", to: "2026-09-15T19:22:05Z", hours: 3.61, what: "Engaged to both feeds closed (work order)"}

MOP-310:
  step_log:
    items:
      - {step: "Confirm the approved window and notify the Customer", result: "Done", at: "2026-09-15T14:46:03Z", by: CCF-E02}
      - {step: "Open TO-A07-A on BW-A-R1-PG-A2-A (rack A07 stays on its B-side feed)", result: "Done", at: "2026-09-15T15:16:03Z", by: CCF-E02}
      - {step: "Retorque the A-side tap-off connections", result: "Stopped: TO-A07-B opened at 10:42; work order WO-41023", at: "2026-09-15T15:42:11Z", by: CCF-E02}
      - {step: "Close TO-A07-A and confirm the A-side feed live", result: "Done late, after the window", at: "2026-09-15T19:22:05Z", by: CCF-E02}
      - {step: "Close the window", result: "Window closed at 12:16 with TO-A07-A still open", at: "2026-09-15T17:16:03Z", by: CCF-E02}
  deviations:
    text: "TO-A07-B on BW-A-R1-PG-A2-B was opened while TO-A07-A was open, which the MOP does not allow; rack A07 lost both feeds. Work moved to WO-41023. The window closed at 12:16 with TO-A07-A still open; it was closed at 14:22."
  backout_used:
    text: "No. The B unit failed on reclose and was replaced under WO-41023 before the B-side feed returned at 14:06."
  as_left:
    text: "TO-A07-A and TO-A07-B closed; rack A07 on both feeds."
  completion_notes:
    text: "Not completed as written. See WO-41023 and INC3900001."

INC3101173:
  comments:
    entries:
      - {at: "2026-09-25T08:15:12Z", by: RSS-022, text: "NVLink switch tray a15-nvsw3 is unreachable and the NVLink domain is degraded, so all of rack A15 is drained. Technician on site."}
