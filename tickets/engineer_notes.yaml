WO-41009:
  long_description:
    text: "Utility outage. Both mains (MV-A and MV-B) tripped on utility undervoltage at 16:14. All 7 generators carried the site; no IT impact."
  work_log:
    entries:
      - {at: "2026-09-24T21:16:39Z", by: CCF-E03, text: "Acknowledged. Both mains open, generators on the paralleling bus, tie breakers closed to MV-A and MV-B."}
      - {at: "2026-09-24T21:22:27Z", by: CCF-E03, text: "At the MV switchgear. Generators carrying the site. Called the utility for an estimate."}
      - {at: "2026-09-24T21:56:06Z", by: CCF-E03, text: "Utility back. MV-A and MV-B main breakers closed on a closed-transition retransfer; generator tie breakers open after."}
      - {at: "2026-09-24T22:18:14Z", by: CCF-E03, text: "Generators in cool-down and back to auto. Closed."}
  failure:
    rows:
      - ["Failure class", "None (utility)"]
      - ["Problem", "Utility outage"]
      - ["Cause", "Utility undervoltage; both mains tripped"]
      - ["Remedy", "Generators carried the load; closed-transition retransfer when the utility returned"]

