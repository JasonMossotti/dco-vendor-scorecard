      - {at: "2026-09-25T11:29:42Z", by: RSS-022, text: "Rack A15 validated and back in production."}
  cause:
    text: "NVLink switch tray a15-nvsw3 unreachable; NVLink domain degraded. Tray did not recover on a power cycle; switch tray at fault."
  close_notes:
    text: "Hardware replaced. NVLink switch tray a15-nvsw3: removed SN NSOM4K9ZBC, installed SN NS82PHK3SG. Failed part tagged for RMA. Checks passed: leak_hold_30m, nmx_tray_health, rack_nvlink_acceptance, nccl_allreduce_rack; validation attached to the ticket."

INC3100714:
