name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"     # Mondays 06:00 UTC: publish a fresh "latest 4 weeks" dataset
  workflow_dispatch:         # allow a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test before publishing
        run: pytest -q
      - name: Generate the latest 4 weeks of synthetic data
        run: python scripts/generate_data.py --latest --out data/latest
      - name: Build the static site
        run: python scripts/build_site.py --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
