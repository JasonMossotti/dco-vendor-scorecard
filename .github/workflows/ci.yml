name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-live.txt   # includes requirements.txt; the collector's tests run against simulators
      - name: Validate SLA and check generated document is current
        run: python scripts/render_sla.py --check
      - name: Validate site model and check generated drawings are current
        run: python scripts/render_site.py --check
      - name: Check Landlord reports are current
        run: python scripts/run_landlord.py --check
      - name: Check Security Partner reports are current
        run: python scripts/run_security.py --check
      - name: Check the post-incident review is current
        run: python scripts/render_pir.py --check
      - name: Emergency procedures and the Incident Commander runbook are current
        run: python scripts/render_emergency.py --check
      - name: Weekly review packs are current
        run: python scripts/render_weekly.py --check
      - name: Failure pattern review is current
        run: python scripts/render_patterns.py --check
      - name: Predictive maintenance report is current
        run: python scripts/render_predict.py --check
      - name: Change-aware alarm review is current
        run: python scripts/render_alarms.py --check
      - name: PUE report is current
        run: python scripts/render_energy.py --check
      - name: Availability report is current
        run: python scripts/render_availability.py --check
      - name: GPU health review is current
        run: python scripts/render_gpu_health.py --check
      - name: GPU telemetry report is current (rebuilds the per-GPU hourly tier and checks its checksums)
        run: python scripts/render_telemetry.py --check
      - name: Live tab is current (its files' checksums and the reconciliation with Site health)
        run: python scripts/render_live.py --check
      - name: Asset register reconciliation is current
        run: python scripts/render_assets.py --check
      - name: Fire protection report is current
        run: python scripts/render_fire.py --check
      - name: Quality audit report is current
        run: python scripts/render_audit.py --check
      - name: Change calendar report is current
        run: python scripts/render_calendar.py --check
      - name: EHS report is current
        run: python scripts/render_ehs.py --check
      - name: Daily standup report is current
        run: python scripts/render_standup.py --check
      - name: Quarterly review months and report are current
        run: python scripts/generate_quarter.py --check && python scripts/render_qbr.py --check
      - name: Glossary is current and explains every code
        run: python scripts/render_glossary.py --check
      - name: Install jsdom for the review page's browser test
        run: cd tests/js && npm install --no-save jsdom@24
      - name: Run tests (includes check that data/sample is current)
        run: pytest -q
