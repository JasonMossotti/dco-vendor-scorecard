name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-live.txt   # includes requirements.txt; the collector's tests run against simulators
      - name: Validate SLA and check generated document is current
        run: python scripts/render_sla.py --check
      - name: Validate site model and check generated drawings are current
        run: python scripts/render_site.py --check
      - name: Check Landlord reports are current
        run: python scripts/run_landlord.py --check
      - name: Check the post-incident review is current
        run: python scripts/render_pir.py --check
      - name: Weekly review packs are current
        run: python scripts/render_weekly.py --check
      - name: Failure pattern review is current
        run: python scripts/render_patterns.py --check
      - name: Change-aware alarm review is current
        run: python scripts/render_alarms.py --check
      - name: Glossary is current and explains every code
        run: python scripts/render_glossary.py --check
      - name: Install jsdom for the review page's browser test
        run: cd tests/js && npm install --no-save jsdom@24
      - name: Run tests (includes check that data/sample is current)
        run: pytest -q
