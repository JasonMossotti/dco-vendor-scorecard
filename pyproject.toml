[project]
name = "dco-vendor-scorecard"
version = "0.1.0"
description = "Vendor performance and repair-verification scorecard for partner-operated GPU sites (synthetic data portfolio demo)."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
