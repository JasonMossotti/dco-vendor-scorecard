# Local runs (streamlit run app/streamlit_app.py) use the same light theme as the published site
# (scripts/build_site.py STREAMLIT_CONFIG).
[theme]
base = "light"
primaryColor = "#1f5fbf"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7f9"
textColor = "#1e2933"

[client]
toolbarMode = "viewer"
