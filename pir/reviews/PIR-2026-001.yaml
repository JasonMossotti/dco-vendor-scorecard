  - {local: "11:30 CDT", to: "Customer infrastructure leadership", message: "B-side breaker failed on reclose; Landlord replacing it from site spares. Estimated restoration 2:00 p.m. IT Partner standing by to validate."}
  - {local: "14:07 CDT", to: "Customer infrastructure leadership", message: "Power restored at 2:06 p.m. IT Partner validating the rack; return to service expected within an hour."}
  - {local: "15:05 CDT", to: "Customer infrastructure leadership", message: "Rack A07 back in production at 3:01 p.m. Post-incident review scheduled for September 18."}
