# =============================================================================
# Site AUS-1: site model as code
# =============================================================================
# Single source of truth for what exists at the site, what feeds what, and how
# each device is monitored. The SLA documents, synthetic generator, engine, and
# drawings (docs/site/) all describe the same site because they read this file.
#
# Real, named products in a fictional site operated by fictional companies.
# Product facts were checked against manufacturer documentation (see
# `products.*.sources`). Values marked `basis: assumption` are engineering
# assumptions for this model, not manufacturer claims; review them before
# using this file to design anything real.
# =============================================================================

meta:
  title: "Site AUS-1 site model"
  version: "1.0"
  fictional: true
  disclaimer: >-
    Fictional site for a portfolio demonstration. Equipment models are real
    products; the site, its layout, quantities, and operators are invented.
    Schematic only: not a construction document.

site:
  id: "AUS-1"
  name: "Site AUS-1 (fictional)"
  location: "Central Texas, USA (fictional parcel)"
  grid: "ERCOT"
  timezone: "America/Chicago"
  design_ambient_c: 43          # basis: assumption (hot-day design dry bulb for chiller derating)
  service_voltage_kv: 138
  distribution_voltage_kv: 13.8
  utilization_voltage_v: 480
  house_load_kw: 400            # basis: assumption (offices, lighting, security, MMRs)

parties:
  customer:
    name: "Customer"
    role: "Leases the halls; owns the IT equipment and site outcomes; operates the Telemetry of Record."
  it_partner:
    name: "Ridgeline Site Services, LLC"
    fictional: true
    role: "Deployment, break-fix, and data hall IT operations."
  landlord:
    name: "Caprock Critical Facilities, LLC"
    fictional: true
    role: "Wholesale data center owner-operator: owns and operates the building, power, cooling, fire protection, and building monitoring; leases the halls to the Customer."
  security_partner:
    name: "Llano Gate Protective Services, LLC"
    fictional: true
    role: "Armed Level III officers for the whole property: gates and perimeter, the security console, the hall entrance posts, patrols, visitors, and media destruction (sheets A-002 and A-102)."
  utility:
    name: "Serving utility (ERCOT region)"
    role: "Owns the 138 kV substation and its transformers; serves the Landlord."

# Engineering assumptions made for this model (listed in docs/site/SITE.md).
assumptions:
  - "Rack design envelope 132 kW for GB200 and GB300 (GB300 power-capped to the hall envelope); 230 kW for the 800 VDC pilot racks."
  - "Hot-day design dry bulb of 43 C; each 1,500 kW chiller derated to 1,150 kW, plant COP 3.0 on that day."
  - "UPS double-conversion efficiency 97%; UPS input sized with a 10% battery-recharge allowance; power factor 0.99."
  - "Busway may carry up to 90% of its rating with one feed lost."
  - "One facility water loop at 20 C supply / 30 C return serves CDUs, thermal walls, and CRAHs."
  - "Thermal-wall fan power 20 kW per unit; CRAH fan power 5 kW; facility water pumps 110 kW each."
  - "Lithium-ion runtime 5 minutes; 48 hours of generator fuel at full load; 400 kW of house load."

