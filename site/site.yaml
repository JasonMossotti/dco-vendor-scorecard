    liquid_fraction: 0.87       # about 115 kW liquid / 17 kW air in a published GB200 rack design
    footprint_mm: [600, 1200]   # basis: assumption (footprint allowance incl. door and manifold)
    input: "3-phase AC to power shelves (N+N), ~50 VDC in-rack busbar"
    interfaces: ["Redfish (BMC)", "NVLink telemetry via NMX", "InfiniBand via UFM"]
