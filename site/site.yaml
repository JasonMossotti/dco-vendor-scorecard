# -----------------------------------------------------------------------------
# Halls. Racks are numbered A01..A32 in row order; each row holds 8 racks and
# one CDU. Power groups pair two UPS modules (A feed, B feed); with 4 UPS and
# all 6 pairings, losing any one UPS spreads its load evenly over the other 3
# (distributed redundant, "4 make 3").
# -----------------------------------------------------------------------------
halls:
  - id: "HALL-A"
    letter: "A"
    name: "Hall A"
    state: "production"
    rack_product: gb200_nvl72
    rows: 4
    racks_per_row: 8
    fabric: quantum2_qm9700
    power:
      architecture: "distributed_redundant"
      ups_product: galaxy_vx_1500
      ups_count: 4
      battery_product: galaxy_li_ion
      unit_sub_product: unit_sub_2500
      busway_product: starline_1200t5
      groups:                         # rack counts in rack order; feeds = [A-side UPS, B-side UPS]
        - {id: "PG-A1", racks: 6, feeds: [1, 2]}
        - {id: "PG-A2", racks: 6, feeds: [3, 4]}
        - {id: "PG-A3", racks: 5, feeds: [1, 3]}
        - {id: "PG-A4", racks: 5, feeds: [2, 4]}
        - {id: "PG-A5", racks: 5, feeds: [1, 4]}
        - {id: "PG-A6", racks: 5, feeds: [2, 3]}
      mech_ups_product: galaxy_vl_300
      mech_ups_count: 2               # 2N for CDU pumps and thermal-wall fans
    cooling:
      cdu_product: coolit_chx2000
      cdu_count: 4                    # one per row, shared secondary header
      cdu_redundancy: 1               # N+1
      thermal_wall_product: liebert_cwa_400
      thermal_wall_count: 4
      thermal_wall_redundancy: 1
      electrical_room_crah_product: liebert_cw_crah
      electrical_room_crah_count: 3
      electrical_room_crah_redundancy: 1
    fire_life_safety:
      vesda_detectors: 2              # hall + electrical room
      leak_circuits: 8                # one per row manifold, one under each CDU
      preaction_zones: 2              # the hall in halves, two rows each
      clean_agent_systems: 1          # the electrical room
    management:                       # basis: assumption (counts and wiring; see config/telemetry_mgmt.yaml)
      rack_switch_product: sn2201
      rack_switches: 2                # <rack>-mgmt1 out of band (BMCs), <rack>-mgmt2 in band (NVLink switch eth0, host management)
      aggregation_product: sn5600
      aggregation_count: 2            # N+1: every rack switch uplinks to both
      console_product: console_48
      console_per_row: 1
    storage:                          # basis: assumption (counts and wiring; see config/telemetry_storage.yaml)
      node_product: storage_node
      racks: 2                        # STG-<hall>1 and STG-<hall>2
      nodes_per_rack: 8
      drives_per_node: 24
      erasure_coding: [8, 2]          # 8 data + 2 parity, spread across nodes: the cluster serves with two nodes out
      fabric_product: sn5600_fabric
      leaf_pairs_per_row: 1           # eth-<hall><row>-1 and -2: every compute tray has one 200 GbE storage port to each
      storage_leaves: 2               # eth-<hall>-st1 and -st2: every storage node has one 400 GbE port to each
      spines: 2                       # eth-<hall>-sp1 and -sp2: every leaf has two uplinks to each
  - id: "HALL-B"
    letter: "B"
    name: "Hall B"
    state: "deployment"
    rack_product: gb300_nvl72
    rows: 4
    racks_per_row: 8
    fabric: quantum_x800_q3400
    power:
      architecture: "distributed_redundant"
      ups_product: galaxy_vx_1500
      ups_count: 4
      battery_product: galaxy_li_ion
      unit_sub_product: unit_sub_2500
      busway_product: starline_1200t5
      groups:
        - {id: "PG-B1", racks: 6, feeds: [1, 2]}
        - {id: "PG-B2", racks: 6, feeds: [3, 4]}
        - {id: "PG-B3", racks: 5, feeds: [1, 3]}
        - {id: "PG-B4", racks: 5, feeds: [2, 4]}
        - {id: "PG-B5", racks: 5, feeds: [1, 4]}
        - {id: "PG-B6", racks: 5, feeds: [2, 3]}
      mech_ups_product: galaxy_vl_300
      mech_ups_count: 2
    cooling:
      cdu_product: coolit_chx2000
      cdu_count: 4
      cdu_redundancy: 1
      thermal_wall_product: liebert_cwa_400
      thermal_wall_count: 4
      thermal_wall_redundancy: 1
      electrical_room_crah_product: liebert_cw_crah
      electrical_room_crah_count: 3
      electrical_room_crah_redundancy: 1
    fire_life_safety:
      vesda_detectors: 2
      leak_circuits: 8
      preaction_zones: 2
      clean_agent_systems: 1
    management:                       # basis: assumption (counts and wiring; see config/telemetry_mgmt.yaml)
      rack_switch_product: sn2201
      rack_switches: 2                # <rack>-mgmt1 out of band (BMCs), <rack>-mgmt2 in band (NVLink switch eth0, host management)
      aggregation_product: sn5600
      aggregation_count: 2            # N+1: every rack switch uplinks to both
      console_product: console_48
      console_per_row: 1
    storage:                          # basis: assumption (counts and wiring; see config/telemetry_storage.yaml)
      node_product: storage_node
      racks: 2                        # STG-<hall>1 and STG-<hall>2
      nodes_per_rack: 8
      drives_per_node: 24
      erasure_coding: [8, 2]          # 8 data + 2 parity, spread across nodes: the cluster serves with two nodes out
      fabric_product: sn5600_fabric
      leaf_pairs_per_row: 1           # eth-<hall><row>-1 and -2: every compute tray has one 200 GbE storage port to each
      storage_leaves: 2               # eth-<hall>-st1 and -st2: every storage node has one 400 GbE port to each
      spines: 2                       # eth-<hall>-sp1 and -sp2: every leaf has two uplinks to each
  - id: "HALL-C"
    letter: "C"
    name: "Hall C (800 VDC pilot)"
    state: "planned"
    rack_product: pilot_800vdc_rack
    rows: 2
    racks_per_row: 4
    fabric: quantum_x800_q3400
    power:
      architecture: "2n_dc"
      mvsst_product: eaton_mvsst
      mvsst_count: 2                  # 2N: one per 13.8 kV bus
      note: "Energy storage and the 800 VDC busway are selected during pilot design."
    cooling:
      cdu_product: coolit_chx2000
      cdu_count: 3
      cdu_redundancy: 1
      thermal_wall_count: 0           # fully liquid-cooled racks
      electrical_room_crah_product: liebert_cw_crah
      electrical_room_crah_count: 2
      electrical_room_crah_redundancy: 1
    fire_life_safety:
      vesda_detectors: 1
      leak_circuits: 5
      preaction_zones: 1
      clean_agent_systems: 1

# -----------------------------------------------------------------------------
# Central plants
# -----------------------------------------------------------------------------
plants:
  utility:
    substation_kv: 138
    transformer_product: utility_tx_25mva
    transformer_count: 2              # 2N: either can carry the site
  mv_switchgear:
    voltage_kv: 13.8
    arrangement: "main-tie-main"
    buses: ["MV-A", "MV-B"]
    note: "Automatic tie on loss of one main; the generator paralleling bus feeds both buses."
  generators:
    product: cat_c175_16
    count: 7
    redundancy: 1                     # N+1
    fuel_hours_at_full_load: 48       # basis: assumption
    fuel_leak_detection: tracetek_tt5000
  heat_rejection:
    chiller_product: liebert_afc_1500
    chiller_count: 11
    chiller_redundancy: 1             # N+1 at design ambient
    supply_c: 20                      # basis: assumption (single facility water loop)
    return_c: 30
    pump_product: fw_pump
    pump_count: 3
    pump_redundancy: 1
  mechanical_power:
    chiller_unit_subs: 4              # 2N pairs of unit substations for the chiller yard
    unit_sub_product: unit_sub_2500

# -----------------------------------------------------------------------------
# Security: the property, its zones, gates, posts, and exterior devices.
# The Security Partner guards and patrols the whole property (Security SLA,
# SEC-POST; Interface Agreement DM-SEC). Exterior positions are campus meters
# from the north-west corner of the property line (sheet A-001's grid); the
# building's doors, readers, and cameras are placed on the building grid by
# the drawing code (sheet A-102). The hall cameras, Customer doors, and
# interior tour checkpoints come from config/security.yaml, which the
# synthetic security data (data/security/) is generated from; nothing here
# changes that data.
# -----------------------------------------------------------------------------
security:
  property: {width_m: 250, depth_m: 160, fence_inset_m: 10,
             fence: "2.4 m anti-climb mesh fence with outriggers on the property line inset; vehicle-rated cable in the gate approaches"}
  zones:
    - id: Z0
      name: Public approach
      where: "Outside the property fence: the access road to the main gate and the pedestrian turnstile."
      entry: "Anyone. No badge."
      method: "None; the main gate's intercom and plate camera (CAM-X-01) at the fence line."
      controlled_by: Customer
      patrolled_by: "Security Partner, by camera from the security console; the exterior tour checks the fence line from inside."
      response: "A person or vehicle loitering at the gate: P3 (camera review, intercom challenge)."
    - id: Z1
      name: Perimeter and grounds
      where: "Inside the property fence: roads, staff and visitor parking, the truck court, the guard house, and the fire lane."
      entry: "Badge holders of any party; pre-registered visitors and drivers on a Customer-approved request."
      method: "Badge or plate read at the main gate, or the security console opening the gate after an intercom check; the pedestrian turnstile reads badges."
      controlled_by: Customer
      patrolled_by: "Security Partner: the exterior tour (POST-PATROL) and the exterior cameras."
      response: "An intruder inside the fence: P1 (guard engaged in 3 minutes). A gate or the fence found open: P2 (5 minutes)."
    - id: Z2
      name: Equipment yards
      where: "The generator yard, the chiller yard with USS-CH1 to USS-CH4, and the MV switchgear and MVSST pad, each behind its own yard fence."
      entry: "The Landlord's staff and its vendors; others only with a Landlord escort."
      method: "The Landlord's yard readers (Generator yard, Chiller yard, MV switchgear) on its base building access control."
      controlled_by: Landlord
      patrolled_by: "Security Partner, outside the yard fences: the exterior tour checks each yard gate is shut and locked."
      response: "A yard gate found open with no Landlord work under way: P2, the console calls the Landlord's operator."
    - id: Z3
      name: Building shell and lobby
      where: "The security lobby and mantrap, the secure corridor, the NOC, staging and burn-in, and the receiving dock."
      entry: "Badge holders of any party; visitors signed in at the security console."
      method: "The Landlord's Main lobby reader and the mantrap; the Customer's OPS-MAIN reader at the NOC; the dock door opened by the dock post."
      controlled_by: "Landlord (lobby and mantrap), Customer (NOC, dock)"
      patrolled_by: "Security Partner: the security console, the receiving dock post (day), and the interior tour (Receiving dock, Corridor east)."
      response: "Tailgating through the mantrap: P1. A dock door held open: P2."
    - id: Z4
      name: Landlord plant rooms
      where: "The electrical rooms (ER-A, ER-B, ER-C), the meet-me rooms (MMR-1, MMR-2), the fire riser, and the pump room."
      entry: "The Landlord's staff and its vendors; carriers in the meet-me rooms with a Landlord escort; the fire department."
      method: "The Landlord's readers (Hall A electrical room, Hall B electrical room, and the riser, pump room, and meet-me room doors)."
      controlled_by: Landlord
      patrolled_by: "Landlord. The Security Partner passes the doors on the interior tour but does not enter."
      response: "The Landlord's door alarms go to the Landlord's operator; the console sends a guard on request."
    - id: Z5
      name: Customer halls
      where: "Hall A, Hall B, Hall C (planned), and the telecom room (the out-of-band network)."
      entry: "People on the hall's access list; visitors only with a named escort who badges in with them."
      method: "The Customer's hall door readers (HALL-A, HALL-B) beside a guard post; emergency exits on door contacts only."
      controlled_by: Customer
      patrolled_by: "Security Partner: the Hall A and Hall B entrance posts and the interior tour; and the hall cameras."
      response: "Door forced: P1 (guard engaged in 3 minutes). Door held past 60 seconds: P2. A visitor without an escort: P2."
    - id: Z6
      name: Spares cage and media room
      where: "The spares cage (trays, PSUs, optics, drives) and the media destruction room beside it."
      entry: "Spares cage: the IT Partner's named technicians. Media room: the Security Partner's destruction operator with a witness."
      method: "The Customer's SPARES-CAGE reader; the media room reader admits two people together (two-person rule)."
      controlled_by: Customer
      patrolled_by: "Security Partner: the interior tour (Hall A spares aisle) and the spares cage cameras."
      response: "Door forced, or media unaccounted for in the chain of custody: P1."
  gates:
