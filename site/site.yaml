# -----------------------------------------------------------------------------
# Halls. Racks are numbered A01..A32 in row order; each row holds 8 racks and
# one CDU. Power groups pair two UPS modules (A feed, B feed); with 4 UPS and
# all 6 pairings, losing any one UPS spreads its load evenly over the other 3
# (distributed redundant, "4 make 3").
# -----------------------------------------------------------------------------
halls:
  - id: "HALL-A"
    letter: "A"
    name: "Hall A"
    state: "production"
    rack_product: gb200_nvl72
    rows: 4
    racks_per_row: 8
    fabric: quantum2_qm9700
    power:
      architecture: "distributed_redundant"
      ups_product: galaxy_vx_1500
      ups_count: 4
      battery_product: galaxy_li_ion
      unit_sub_product: unit_sub_2500
      busway_product: starline_1200t5
      groups:                         # rack counts in rack order; feeds = [A-side UPS, B-side UPS]
        - {id: "PG-A1", racks: 6, feeds: [1, 2]}
        - {id: "PG-A2", racks: 6, feeds: [3, 4]}
        - {id: "PG-A3", racks: 5, feeds: [1, 3]}
        - {id: "PG-A4", racks: 5, feeds: [2, 4]}
        - {id: "PG-A5", racks: 5, feeds: [1, 4]}
        - {id: "PG-A6", racks: 5, feeds: [2, 3]}
      mech_ups_product: galaxy_vl_300
      mech_ups_count: 2               # 2N for CDU pumps and thermal-wall fans
    cooling:
      cdu_product: coolit_chx2000
      cdu_count: 4                    # one per row, shared secondary header
      cdu_redundancy: 1               # N+1
      thermal_wall_product: liebert_cwa_400
      thermal_wall_count: 4
      thermal_wall_redundancy: 1
      electrical_room_crah_product: liebert_cw_crah
      electrical_room_crah_count: 3
      electrical_room_crah_redundancy: 1
    fire_life_safety:
      vesda_detectors: 2              # hall + electrical room
      leak_circuits: 8                # one per row manifold, one under each CDU
  - id: "HALL-B"
    letter: "B"
    name: "Hall B"
    state: "deployment"
    rack_product: gb300_nvl72
    rows: 4
    racks_per_row: 8
    fabric: quantum_x800_q3400
    power:
      architecture: "distributed_redundant"
      ups_product: galaxy_vx_1500
      ups_count: 4
      battery_product: galaxy_li_ion
      unit_sub_product: unit_sub_2500
      busway_product: starline_1200t5
      groups:
        - {id: "PG-B1", racks: 6, feeds: [1, 2]}
        - {id: "PG-B2", racks: 6, feeds: [3, 4]}
        - {id: "PG-B3", racks: 5, feeds: [1, 3]}
        - {id: "PG-B4", racks: 5, feeds: [2, 4]}
        - {id: "PG-B5", racks: 5, feeds: [1, 4]}
        - {id: "PG-B6", racks: 5, feeds: [2, 3]}
      mech_ups_product: galaxy_vl_300
      mech_ups_count: 2
    cooling:
      cdu_product: coolit_chx2000
      cdu_count: 4
      cdu_redundancy: 1
      thermal_wall_product: liebert_cwa_400
      thermal_wall_count: 4
      thermal_wall_redundancy: 1
      electrical_room_crah_product: liebert_cw_crah
      electrical_room_crah_count: 3
      electrical_room_crah_redundancy: 1
    fire_life_safety:
      vesda_detectors: 2
      leak_circuits: 8
  - id: "HALL-C"
    letter: "C"
    name: "Hall C (800 VDC pilot)"
    state: "planned"
    rack_product: pilot_800vdc_rack
    rows: 2
    racks_per_row: 4
    fabric: quantum_x800_q3400
    power:
      architecture: "2n_dc"
      mvsst_product: eaton_mvsst
      mvsst_count: 2                  # 2N: one per 13.8 kV bus
      note: "Energy storage and the 800 VDC busway are selected during pilot design."
    cooling:
      cdu_product: coolit_chx2000
      cdu_count: 3
      cdu_redundancy: 1
      thermal_wall_count: 0           # fully liquid-cooled racks
      electrical_room_crah_product: liebert_cw_crah
      electrical_room_crah_count: 2
      electrical_room_crah_redundancy: 1
    fire_life_safety:
      vesda_detectors: 1
      leak_circuits: 5

# -----------------------------------------------------------------------------
# Central plants
# -----------------------------------------------------------------------------
plants:
  utility:
    substation_kv: 138
    transformer_product: utility_tx_25mva
    transformer_count: 2              # 2N: either can carry the site
  mv_switchgear:
    voltage_kv: 13.8
    arrangement: "main-tie-main"
    buses: ["MV-A", "MV-B"]
    note: "Automatic tie on loss of one main; the generator paralleling bus feeds both buses."
  generators:
    product: cat_c175_16
    count: 7
    redundancy: 1                     # N+1
    fuel_hours_at_full_load: 48       # basis: assumption
    fuel_leak_detection: tracetek_tt5000
  heat_rejection:
    chiller_product: liebert_afc_1500
    chiller_count: 11
    chiller_redundancy: 1             # N+1 at design ambient
    supply_c: 20                      # basis: assumption (single facility water loop)
    return_c: 30
    pump_product: fw_pump
    pump_count: 3
    pump_redundancy: 1
  mechanical_power:
    chiller_unit_subs: 4              # 2N pairs of unit substations for the chiller yard
    unit_sub_product: unit_sub_2500

# -----------------------------------------------------------------------------
# Monitoring. The Landlord operates EcoStruxure day to day. The Customer's
# Telemetry of Record collector polls critical devices directly, read-only,
# and also receives the BMS feed, so the two can be compared.
# -----------------------------------------------------------------------------
monitoring:
  systems:
    - id: "EBO"
      name: "EcoStruxure Building Operation"
      role: "BMS: HVAC, chillers, CDUs, thermal walls, fire and leak (secondary)"
      operator: landlord
    - id: "PME"
      name: "EcoStruxure Power Monitoring Expert"
      role: "EPMS: switchgear, metering, power quality"
      operator: landlord
    - id: "EIT"
      name: "EcoStruxure IT"
      role: "DCIM: UPS, busway, rack power, capacity"
      operator: landlord
    - id: "FACP"
      name: "Notifier fire alarm control panel"
      role: "Fire alarm system of record (life safety)"
      operator: landlord
    - id: "UFM"
      name: "NVIDIA UFM"
      role: "InfiniBand fabric management"
      operator: it_partner
    - id: "NMX"
      name: "NVIDIA NMX"
      role: "NVLink domain management (per rack)"
      operator: it_partner
    - id: "TOR"
      name: "Customer Telemetry of Record collector"
      role: "Independent, read-only aggregation of every source; basis for SLA measurement"
      operator: customer
  device_classes:
    - {class: "UPS", products: [galaxy_vx_1500, galaxy_vl_300], protocol: "SNMPv3", system: "EIT", customer_tap: "direct (SNMPv3 read-only user)"}
    - {class: "Busway", products: [starline_1200t5], protocol: "Modbus TCP", system: "EIT", customer_tap: "direct (read-only)"}
    - {class: "Switchgear and meters", products: [unit_sub_2500], protocol: "Modbus TCP", system: "PME", customer_tap: "PME export"}
    - {class: "Generators", products: [cat_c175_16], protocol: "Modbus TCP (EMCP 4.4)", system: "EBO", customer_tap: "direct (read-only)"}
    - {class: "CDUs", products: [coolit_chx2000], protocol: "Redfish", system: "EBO", customer_tap: "direct (Redfish read-only account)"}
    - {class: "Thermal walls and CRAHs", products: [liebert_cwa_400, liebert_cw_crah], protocol: "BACnet/IP", system: "EBO", customer_tap: "BMS feed"}
    - {class: "Chillers and pumps", products: [liebert_afc_1500, fw_pump], protocol: "BACnet/IP", system: "EBO", customer_tap: "BMS feed"}
    - {class: "Leak detection", products: [tracetek_ttdm128], protocol: "Modbus TCP (via gateway)", system: "EBO", customer_tap: "direct (read-only)"}
    - {class: "Aspirating smoke", products: [vesda_e_vep], protocol: "Modbus HLI", system: "EBO", customer_tap: "BMS feed (fire panel is the system of record)"}
    - {class: "Compute racks", products: [gb200_nvl72, gb300_nvl72], protocol: "Redfish", system: "TOR", customer_tap: "direct"}
    - {class: "InfiniBand fabric", products: [quantum2_qm9700, quantum_x800_q3400], protocol: "UFM REST / events", system: "UFM", customer_tap: "UFM event export"}

# -----------------------------------------------------------------------------
# Drawing geometry (meters). Used only by the schematic drawings.
# -----------------------------------------------------------------------------
layout:
  cold_aisle_m: 1.8
  hot_aisle_m: 1.2
  end_clearance_m: 2.0
  thermal_wall_depth_m: 2.4
