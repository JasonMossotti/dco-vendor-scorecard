# Utility mains metering and UPS ride-through for Site AUS-1 (synthetic; portfolio demo). PR A of the live status plan
# (/mnt/project-files/live-status/PLAN.md).
#
# The Landlord's revenue meters on the two 13.8 kV mains (MV-A and MV-B, main-tie-main; the Landlord SLA's definition
# of total facility energy names them) read once a minute: voltage per phase, current per phase, kW, kVAR, power factor,
# frequency, voltage THD, and the lowest voltage since the last read. The site's metering is Schneider PowerLogic into
# Power Monitoring Expert (site/site.yaml, unit_sub_2500), so the meters are PowerLogic ION9000s and the Customer reads
# them through the Landlord's PME (Interface Agreement data access), never from the meter itself.
#
# Point names are the ION architecture's measurement labels (Vll ab, I a, kW tot, PF sign tot, Freq), as published for
# ION meters' Modbus maps. Schneider publishes the ION9000's own Modbus register map only as an attachment to FAQ
# FA362601, which could not be opened from here, so no register numbers are shown; a deployment reads the names from PME.
#
# The series are shaped to agree with what the month already records: each hour's energy across both mains equals
# utility_kwh in data/energy/meters_hourly.csv (so PUE and every headline stay put), the mains read nothing from the
# utility trip to the closed-transition retransfer (facility/epms_events.jsonl), and the frequency is the one the UPS
# inputs already publish. Own random stream ({seed}:telemetry:utility). Every number below is an assumption for the demo
# ("basis: assumption") unless a public source is named.
# Read by src/scorecard/synthetic/telemetry_utility.py (the data) and src/scorecard/telemetry_utility.py (the agreements).

framing: "Synthetic utility metering at the 13.8 kV mains, and the UPS ride-through it leaves the site if the utility fails."
sources:
  - {name: "Schneider Electric, PowerLogic ION9000 data sheet (Modbus TCP; voltage, current, power, PF, frequency, U THD)", url: "https://www.farnell.com/datasheets/3771069.pdf", checked: "2026-10-19"}
  - {name: "Schneider Electric FAQ FA362601: the ION9000 Modbus register map (attachment)", url: "https://www.se.com/ca/en/faqs/FA362601", checked: "2026-10-19"}
  - {name: "PowerLogic ION meters' Modbus maps (measurement labels Vll ab, I a, kW tot, kVAR tot, PF sign tot, Freq)", url: "https://www.aggsoft.com/modbus-data-logging/schneider-electric-powerlogic.htm", checked: "2026-10-19"}
  - {name: "NFPA 110-2016 design considerations (Type 10: load terminals without power no more than 10 seconds)", url: "https://www.csemag.com/articles/nfpa-110-2016-design-considerations/", checked: "2026-10-19"}

collection:
  poll_interval_s: 60
  path: "the Landlord's Power Monitoring Expert (read-only account under the Interface Agreement data access clause)"
  meter: "Schneider PowerLogic ION9000, one per 13.8 kV main, on the utility side of the main breaker"

mains:
  MV-A: {bus: "MV-A", breaker: "MV-A main breaker"}
  MV-B: {bus: "MV-B", breaker: "MV-B main breaker"}
split:
  # Each UPS's unit substation sits on one bus (basis: assumption): odd-numbered on MV-A, even on MV-B, so the A and B
  # feeds of most busway groups come from different buses. Everything else (chillers, pumps, CRAHs, house load) is
  # split evenly across the two buses. The tie stays open while both mains are in.
  ups_bus: {odd: "MV-A", even: "MV-B"}
  rest_share_a: 0.5
  rest_share_sd_pct: 1.5            # the split of the rest of the load wanders a little (basis: assumption)

electrical:
  nominal_v: 13800.0
  v_sd_pct: 0.35                    # utility voltage wander at the mains (basis: assumption)
  v_rho: 0.998
  phase_sd_pct: 0.15                # spread between the three line-to-line voltages (basis: assumption)
  current_imbalance_pct: 0.8        # spread between the three line currents (basis: assumption)
  pf: [0.975, 0.99]                 # UPS rectifiers near unity, chiller drives a little lower (basis: assumption)
  thd_pct: [0.9, 1.6]               # voltage THD at the mains (IEEE 519 limit at 13.8 kV is 5%; basis: assumption)
  sag_before_trip_s: 3              # the undervoltage relay's delay: the voltage sagged this long before the trip
  sag_pu: 0.62                      # lowest voltage in the sag, per unit (basis: assumption)

ride_through:
  # A UPS counts toward the site's IT ride-through while it carries load. Its runtime is what its NMC reports
  # (upsAdvBatteryRunTimeRemaining); the NMC caps it at the power layer's runtime_cap_min at light load.
  min_load_kw: 1.0
  design_take_load_s: 10            # reference only: NFPA 110 Type 10. A data hall's critical load is not a Level 1
                                    # emergency system, so the site is held to no take-load time; the UPS bridges it.

fields:
  - {key: v_ab, name: "Vll ab", unit: "V", scale: 1, help: "Line-to-line voltage, phases A to B, on the utility side of the main breaker."}
  - {key: v_bc, name: "Vll bc", unit: "V", scale: 1, help: "Line-to-line voltage, phases B to C."}
  - {key: v_ca, name: "Vll ca", unit: "V", scale: 1, help: "Line-to-line voltage, phases C to A."}
  - {key: v_min, name: "Vll avg minimum in the minute", unit: "V", scale: 1, help: "The lowest average line-to-line voltage the meter saw during the minute (its minimum/maximum recorder; the label is this demo's). It catches a sag between two reads."}
  - {key: a_a, name: "I a", unit: "A", scale: 10, help: "Current in phase A: what the site draws from the utility on this main."}
  - {key: a_b, name: "I b", unit: "A", scale: 10, help: "Current in phase B."}
  - {key: a_c, name: "I c", unit: "A", scale: 10, help: "Current in phase C."}
  - {key: kw, name: "kW tot", unit: "kW", scale: 10, help: "Real power through the main, the minute's average (from the meter's energy register)."}
  - {key: kvar, name: "kVAR tot", unit: "kVAr", scale: 10, help: "Reactive power through the main."}
  - {key: pf, name: "PF sign tot", unit: "", scale: 1000, help: "Total power factor (lagging)."}
  - {key: hz, name: "Freq", unit: "Hz", scale: 100, help: "Utility frequency (ERCOT, 60 Hz)."}
  - {key: thd, name: "V THD", unit: "%", scale: 100, help: "Voltage total harmonic distortion (the label is this demo's; the ION9000 publishes U THD)."}
  - {key: brk, name: "Main breaker", unit: "", scale: 1, help: "1 closed, 0 open (from the EPMS breaker events)."}

tiers:
  window_before_min: 30
  window_after_min: 90
checks:
  energy_kwh_tolerance: 1.0         # both mains against the utility meter column, per hour (meter rounding)
  amps_tolerance_pct: 0.5           # amps against kW over (sqrt 3 x V x PF), after rounding
  voltage_band_pct: [-5.0, 5.0]     # basis: rounded service band, as the power layer uses at 480 V
  frequency_tolerance_hz: 0.1       # the UPS input publishes frequency to 0.1 Hz
  runtime_tolerance_s: 10           # the NMC's runtime is published to 10 s
