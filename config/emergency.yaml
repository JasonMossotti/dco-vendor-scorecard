# Emergency procedures, the decision tree, and the call lists: the Customer's, not any partner's.
#
# Judgment written by people, reviewed and changed like the SLAs. What the contracts set is read from them, never
# restated: a {name} in any text below is filled by src/scorecard/emergency.py from the agreements, the runbook
# (config/incident_command.yaml), the routing file (config/customer_notifications.yaml), or the site model:
#   {bridge_min}         the joint bridge's clock (Interface Agreement, incident command)
#   {page_min}           the partners' page under NT-1 (Interface Agreement section 10)
#   {lead_cadence_min}   each lead's update cadence, the stricter of the SLAs' P1 terms
#   {pir_business_days}  the joint review's clock (Interface Agreement, incident command)
#   {first_notice_min}   the first notice to Customer leadership (the runbook's clock)
#   {fuel_hours}         generator fuel at full load (site model)
#
# The procedures say what the Customer checks, asks, and decides. The partners act under the RACI and their own
# emergency operating procedures and methods of procedure, which are named here, not rewritten. An action that names
# a RACI component must belong to a party that is Responsible for it (tests/test_emergency.py checks).
#
# Every contact is fictional: example.com addresses and 555-01xx numbers. In production the real contacts live in the
# paging platform, never in this repository. Roles only; no individual is named.

intro: >-
  What to do in the first minutes of an emergency at Site AUS-1, by type of event: who acts, what the Customer checks
  and asks on the bridge, who is told and by when, and what must be true before equipment returns to service. Start with
  the decision tree if the type is not yet clear. Life safety always comes first.

sources:
  - "Federal workplace injury reporting, 29 CFR 1904.39 (fatality within 8 hours; in-patient hospitalization, amputation, or loss of an eye within 24 hours): https://www.osha.gov/report"
  - "29 CFR 1904.39 text: https://www.ecfr.gov/current/title-29/subtitle-B/chapter-XVII/part-1904/subpart-E/section-1904.39"

# Shown above every procedure and on every print card.
always_first:
  - "If anyone is hurt or in danger, call 911 first. Then call the Security Partner console so a guard meets the responders at the gate and walks them in."
  - "Nobody enters a hall with an evacuation alarm sounding or after a clean agent release until the fire department or the Landlord says it is safe."
  - "The Customer coordinates; it does not operate a partner's equipment. The party the RACI makes Responsible does the work."
  - "Check for change work on the equipment or its redundant pair before anyone touches anything (the A07 lesson)."

site:
  name: "Site AUS-1 (fictional)"
  address: "1200 Example Ranch Road, Central Texas (fictional)"
  responders: "Send fire, EMS, and police to the north vehicle gate; the Security Partner meets them there."
  assembly: "Assembly point: the north parking lot, row A, upwind of the generator yard."

# The standing bridge. Opened by the Incident Commander for every P1; joined by each party the event involves.
bridge:
  name: "AUS-1 standing incident bridge"
  dial_in: "+1 512 555 0150"
  passcode: "4471 0915 #"
  backup: "+1 512 555 0151 (same passcode), if the primary bridge is down"
  video: "https://bridge.example.com/aus1-incident"
  chat: "Incident channel #aus1-incident (the scribe posts each decision there too)"
  rules:
    - "Opened by the Incident Commander within {bridge_min} minutes of a multi-party P1 (Interface Agreement, incident command); for a one-party P1 the Customer opens it anyway, so the clock never depends on judging how many parties are involved."
    - "Roll call at the start and each time someone joins: name the role, not the person."
    - "One conversation. Side work happens off the bridge and comes back as a report."
    - "Each lead reports every {lead_cadence_min} minutes until their part is done, using the runbook's template."
    - "Decisions are said out loud, repeated by the Incident Commander, and written down by the scribe with the time."
  roles:
    - {role: "Incident Commander", who: "Customer Site Lead; the on-call primary holds command until the Site Lead joins", does: "Priorities, decisions, and every message to Customer leadership. Does not work the fault."}
    - {role: "Scribe", who: "Customer on-call secondary, or the next Customer engineer on the bridge", does: "Keeps the timeline and the decision log as it happens; times every join, report, and decision."}
    - {role: "Communications lead", who: "Customer Communications, joined by the Incident Commander when a tier calls for it", does: "Drafts anything that leaves the site team: leadership summaries, tenant notices, and any outside statement."}
    - {role: "Landlord lead", who: "Landlord chief engineer or duty manager", does: "Facility status, isolation, and restoration (Interface Agreement roles)."}
    - {role: "IT Partner lead", who: "IT Partner site manager or duty lead", does: "Rack protection, controlled shutdowns, and return-to-service validation."}
    - {role: "Security Partner lead", who: "Security Partner shift supervisor", does: "Guard posts, door control, escorts, responder access, and chain of custody for any media."}
  roll_call: ["Incident Commander", "Scribe", "Landlord lead", "IT Partner lead", "Security Partner lead", "Communications lead"]

