# GPU XID codes: the Glossary addendum and the "XID nn" popups on every page.
#
# Source: NVIDIA, "Xid Errors" guide, Xid Catalog (public). Each code's number, NVIDIA's name, the
# GB200 applicability flag, and the two resolution buckets (immediate and investigatory action) are
# transcribed from the catalog as it stood on the retrieval date below. The "text" of each code and
# the bucket meanings are this project's own plain-language reading for operators at the fictional
# site AUS-1; NVIDIA's catalog is the authority, and every popup links to it.
#
# Scope: every code the catalog marks as applying to GB200 that is not "Unused". Codes the catalog
# lists but marks as not applying to GB200 are named in "not_gb200" with no meaning.
#
# tests/test_xid.py checks: every XID the site shows has an entry here, the generator's XID messages
# use NVIDIA's names, and the critical XIDs in the IT Partner SLA are all here.

source:
  title: "NVIDIA Xid Errors: Analyzing Xid Errors with the Xid Catalog"
  url: "https://docs.nvidia.com/deploy/xid-errors/latest/analyzing-xid-catalog.html"
  updated: "2026-09-09"
  retrieved: "2026-10-07"

# Resolution buckets: what each of NVIDIA's action names asks an operator to do (our reading of the
# names; "none listed" where the catalog gives no bucket).
buckets:
  RESTART_APP: "Restart the application that hit the error; the GPU stays in service"
  RESET_GPU: "Drain the GPU's jobs and reset the GPU"
  RESTART_BM: "Drain the node and reboot the host"
  RESTART_VM: "Restart the virtual machine that owns the GPU"
  IGNORE: "No action on its own; act on any other XID logged with it"
  "IGNORE (sympathetic)": "No action; it is a side effect of the error that caused it"
  CONTACT_SUPPORT: "Open a hardware case with the vendor through the IT Partner"
  CHECK_MECHANICALS: "Check physical connections, such as auxiliary power to the board"
  UPDATE_SWFW: "Update the driver or firmware"
  INVESTIGATE_SW: "Investigate the driver, firmware, and software stack"
  INVESTIGATE_SW_USER: "Investigate the software stack and the user's workload"
  INVESTIGATE_LINK_SI: "Investigate the link's signal integrity"
  CHECK_APP/CUDA: "Check the application and its CUDA code"
  CHECK_UVM: "Check the application's use of unified memory"
  SYMPATHETIC_REPORT_SOLO: "Treat it as a side effect of another error; report it if it appears alone"
  XID_154: "Read the recovery action the driver reports with it"
  XID_137_FLOW: "Follow NVIDIA's documented flow for XID 137"
  WORKFLOW_XID_13: "Follow NVIDIA's documented workflow for XID 13"
  WORKFLOW_XID_31: "Follow NVIDIA's documented workflow for XID 31"
  WORKFLOW_XID_45: "Follow NVIDIA's documented workflow for XID 45"
  WORKFLOW_XID_48: "Follow NVIDIA's documented workflow for XID 48 (check the ECC summary; RMA if the threshold is exceeded)"
  WORKFLOW_NVLINK_ERR: "Follow NVIDIA's documented NVLink error workflow"
  WORKFLOW_NVLINK5_ERR: "Follow NVIDIA's documented fifth-generation NVLink error workflow"
  "Solo: RESTART_FM Not Solo: IGNORE (follow other Xid)": "If it appears alone, restart the Fabric Manager; otherwise act on the other XID"

# xid: number; name: NVIDIA's name; now / then: immediate and investigatory buckets ("" = none listed);
# critical: starts the IT Partner's GPU restoration clock at AUS-1 (IT Partner SLA, GPU fault class).
codes:
  - {xid: 8, name: "GPU stopped processing", now: RESTART_APP, then: CONTACT_SUPPORT, text: "The GPU stopped making progress on work it was given, usually because of the application."}
  - {xid: 11, name: "Invalid or corrupted push buffer stream", now: RESTART_APP, then: CHECK_APP/CUDA, text: "The GPU received a bad command stream from the driver or application."}
  - {xid: 13, name: "Graphics Engine Exception", now: RESTART_APP, then: WORKFLOW_XID_13, text: "A fault in the application's GPU code, such as an out-of-range memory access. Almost always the user's code, not the hardware."}
  - {xid: 25, name: "Invalid or illegal push buffer stream", now: RESTART_APP, then: CHECK_APP/CUDA, text: "The GPU received a command it could not accept from the driver or application."}
  - {xid: 31, name: "GPU memory page fault", now: RESTART_APP, then: WORKFLOW_XID_31, text: "The application touched GPU memory it does not own. Usually the user's code; repeated faults on one GPU with different jobs point at hardware."}
  - {xid: 32, name: "Invalid or corrupted push buffer stream", now: RESTART_APP, then: CHECK_APP/CUDA, text: "The GPU's command stream was corrupted on the way in, by software or, less often, the PCIe path."}
  - {xid: 37, name: "Driver firmware error", now: IGNORE, then: CHECK_APP/CUDA, text: "The driver reported a firmware error; on its own it needs no action."}
  - {xid: 38, name: "Driver firmware error", now: IGNORE, then: CONTACT_SUPPORT, text: "The driver reported a firmware error; escalate if it recurs."}
  - {xid: 39, name: "Copy Engine Exception", now: RESTART_APP, then: CONTACT_SUPPORT, text: "A copy engine (the GPU's data mover) reported an error while moving data for the application."}
