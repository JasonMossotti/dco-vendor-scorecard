# Synthetic scenario for the incident comms log: data/incident_comms/ (scripts/generate_incident_comms.py).
#
# The sample's records hold the alarms, pages, tickets, and work orders for an incident, but not the joint bridge:
# when it opened, who joined, and what each lead told the Incident Commander. This file scripts that log for each
# incident the runbook replays. Each entry is the minute (UTC) something was said or done; the generator adds the
# second from its own random stream, so nothing else in the dataset moves.
#
# The log is a record, like a bridge recording's transcript. It must reconcile with the PIR timeline (restoration
# declared after the busway shows the feed closed, return to service after the scheduler shows the nodes back) and
# with the review's communications log (every leadership update the review lists is here, at the same minute, with
# the same words). tests/test_command.py checks both. Roles only: no individual is named.

incidents:
  INC3900001:
    date: "2026-09-15"
    events:
