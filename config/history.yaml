# =============================================================================
# Failure history configuration (the half-year before the sample month)
# -----------------------------------------------------------------------------
# Feeds the failure pattern review. Generated by scripts/generate_history.py
# into data/history/ from its own random stream, on the committed fleet
# (data/sample/site/topology.json), so nothing here can change the sample
# month or any report built from it. All values are illustrative.
# =============================================================================

seed: 2026
start: "2026-03-02"                # Monday; 26 weeks ending Sunday 2026-08-30, the day before the sample month
weeks: 26
hall: HALL-A                       # Hall B was not yet in production during the history window

# Background failure rates for the production hall, per week (as in config/synthetic.yaml,
# plus GPU thermal slowdowns, which the sample month does not model).
rates_per_week:
  tray_gpu: 9
  thermal: 0.5         # DCGM thermal slowdown (clock event reason HW Thermal Slowdown) on a GPU
  psu: 2
xid_mix: {79: 25, 94: 20, 48: 10, 119: 15, 145: 20, 149: 10}

# Optics. One OSFP module at each end of every back-end link (host NIC side and leaf switch side).
optics:
  failures_per_module_year: 0.035   # module (laser, receiver) failures; the transceiver's DOM raises an alarm
  fiber_faults_per_week: 2.0        # dirty or damaged fiber and connectors; no DOM alarm on either end
  lots:                             # Date-code lots installed at commissioning, share of the installed base
    LOT-2539: 0.18
    LOT-2541: 0.16
    LOT-2544: 0.14
    LOT-2546: 0.13
    LOT-2548: 0.12
    LOT-2550: 0.10
    LOT-2602: 0.09
    LOT-2605: 0.08
  fiber_fault_replace_probability: 0.3   # No DOM alarm: usually cleaned; otherwise one end's module is replaced
                                          # (a module that raised a DOM alarm is always replaced)
  spares_lots: [LOT-2605, LOT-2608, LOT-2611]   # Lots in the spares pool during the window

# Repairs (as in config/synthetic.yaml)
tray_swap_probability: 0.7          # Otherwise the tray is reseated (thermal slowdowns: half and half)
recurrence_probability: 0.04        # Any repair: the same unit faults again with the same signature within 30 days

# CDU secondary loop (Customer read-only Redfish poll, stored as 4-hour averages)
cdu:
  setpoint_c: 25.0                  # basis: assumption (secondary supply setpoint)
  alarm_high_c: 28.0                # basis: assumption (Landlord BMS high-supply alarm; the edge of the rack band)
  flow_lpm: 1800                    # site/site.yaml secondary_flow_lpm
  noise_c: 0.25
  filter_change_days: 91            # Quarterly filter change (Landlord SLA maintenance schedule)

# -----------------------------------------------------------------------------
# Planted patterns, recorded in ground_truth/ so the review can be scored.
# The robustness run moves each one (lot, CDU, signature, rack) and its size
# on every generated history. The pattern analysis never reads ground_truth/.
# -----------------------------------------------------------------------------
planted:
  optic_lot:                        # One commissioning lot's modules fail several times faster than the rest
    lot: LOT-2544
    rate_multiplier: 3.5
  cdu_drift:                        # A CDU's filter fouls; secondary supply creeps up but stays under the alarm
    cdu: CDU-A3
    start_week: 7
    peak_rise_c: 2.6                # above setpoint, reached when the next quarterly filter change restores it
    thermal_per_week_at_peak: 6     # extra GPU thermal slowdowns in the racks this CDU serves
  reseat_recurrence:                # Reseat-only fixes for one GPU fault signature do not hold
    xid: 79
    recurrence_probability: 0.45
  decoy:                            # Unrelated faults (one of each GPU signature) on one rack, so it tops a
    rack: A11                       # ticket-count league table; there is no common cause, and it must NOT be flagged
    extra_events: 6
