# Glossary: every code, acronym, and record ID the site uses.
#
# Contract codes (CSL-07, TR-1, NT-2, ...) are NOT written here: src/scorecard/glossary.py reads them
# from the SLA and Interface Agreement YAML through the "contract_terms" map below, so a popup quotes
# the contract. Everything else is hand-written here: acronyms ("terms"), ID formats ("families"),
# and the capitalised words left plain on purpose ("plain").
#
# tests/test_glossary.py fails when a page or document shows a code that is neither explained
# nor listed as plain, and when an entry here is no longer used anywhere.
#
# Definitions are generic, written for this fictional site; they describe no real company's systems.

types:   # filter chips on the Glossary tab, in this order
  - {key: acronym, label: Acronyms}
  - {key: service_level, label: Service levels}
  - {key: measure, label: Key measures}
  - {key: rule, label: Contract rules}
  - {key: notification, label: Notifications}
  - {key: priority, label: Priorities and severity}
  - {key: safety, label: Safety and standards}
  - {key: scope, label: Scope and fault classes}
  - {key: data_source, label: Data sources}
  - {key: ticket_state, label: Ticket states}
  - {key: record, label: Records and documents}
  - {key: equipment, label: Site and equipment}
  - {key: product, label: Products and models}
  - {key: xid, label: GPU XID codes}
  - {key: metric, label: GPU telemetry fields}

# Where the contracts define codes. "path" is a dotted path in the loaded contract (partner SLAs are
# merged onto sla/common.yaml); "title" and "text" quote fields of each item. A sentence whose field is
# empty is dropped.
contract_terms:
  - {path: critical_service_levels, type: service_level, title: "{name}",
     text: "{description} Expected {expected}{unit}; minimum {minimum}{unit}."}
  - {path: key_measurements, type: measure, title: "{name}", text: "Target {direction} {target}{unit}. Measured from {data_sources}."}
  - {path: alarm_notification.key_measures, type: measure, title: "{name}",
     text: "Owed by the {party}. Target {direction} {target}{unit}. Measured from {data_sources}."}
  - {path: ticket_handling.stability.rules, type: rule, title: "{name}", text: "{rule}"}
  - {path: fault_attribution.rules, type: rule, title: "Fault attribution rule", text: "{rule}"}
  - {path: handoffs, type: rule, title: "{name}", text: "{rule}"}
  - {path: asset_register.rules, type: rule, title: "Asset register: {name}", text: "{rule}"}
  - {path: energy_reporting.terms, type: measure, title: "{name}", text: "{rule}"}
  - {path: demarcations, type: rule, title: "{system} demarcation", text: "Boundary: {boundary} Evidence: {evidence}"}
  - {path: chronic_failure.triggers, type: rule, title: "Chronic failure trigger", text: "{rule}"}
  - {path: alarm_notification.notifications, type: notification, title: "{trigger}",
     text: "Within {within_min} minutes, by {channels} (at least {channels_min} channels). Owed by: {owed_by}."}
  - {path: priorities, type: priority, title: "Priority {id}: {name}",
     text: "Acknowledge within {acknowledge_min} min; engaged on site within {engaged_on_site_min} min; contained within {containment_min} min; restored within {restore_min} min. {escalation}"}
  - {path: breach_severity.levels, type: priority, title: "Internal severity {id}: {name}", text: "{escalation}"}
  - {path: breach_severity.aggravators, type: priority, title: "Severity aggravator", text: "{description}"}
  - {path: ehs.violation_classes, type: safety, title: "Safety violation class: {name}",
     text: "Credit of {credit_pct_of_monthly_charges}% of monthly charges. Examples: {examples}"}
  - {path: ehs.site_rules, type: safety, title: "{title}", text: "{rule}"}
  - {path: ehs.standards, type: safety, title: "{name}", text: "{scope}"}
  - {path: scope.in_scope, type: scope, title: "{name}", text: "{description}"}
  - {path: site.service_units, type: scope, title: "Service unit: {name}", text: "{note}"}
  - {path: measurement_spec, type: scope, title: "Fault class: {name}", text: "Service unit key: {service_unit_key}. Default priority {default_priority}."}
  - {path: deployment.milestones, type: scope, title: "Deployment milestone: {name}", text: "Exit criteria: {exit_criteria}"}
  - {path: measurement.records_access.terms, type: rule, title: "Records access: {name}", text: "{text}"}
  - {path: measurement.data_sources, type: data_source, title: "{name}", text: "Measures: {measures} Owner: {owner}."}
  - {path: ticket_handling.states, type: ticket_state, title: "Ticket state", text: "{description} Clock: {clock}.", code_only: true}
  - {path: ticket_handling.pause_codes, id_field: code, type: ticket_state, title: "Pause code", text: "{description}", code_only: true}
  - {path: definitions, id_from: term, type: rule, title: "{term}", text: "{definition}"}
  - {path: document, type: record, title: "{title}", text: "{subtitle}. Version {version}, effective {effective_date}."}
  - {path: site.halls, type: equipment, title: "Data hall", text: "State: {state}; {racks} racks."}

# In family labels, # stands for a digit and [hall] for a hall letter.
# Hand-written terms. "link: false" lists an everyday term without underlining it on every page.
# "pages" limits a term or family to some pages (page keys: overview, scorecards, alarms, pir, weekly,
# patterns, agreements, site); on those pages its meaning is shown first.
terms:
  # --- Acronyms: operations and contracts
  - {term: CAP, type: acronym, expansion: Corrective action plan, text: "A plan the partner owes after a serious breach or finding: cause, fix, owner, and a date, tracked to verified closure."}
  - {term: CSL, type: acronym, expansion: Critical service level, text: "A service level with money attached: missing its minimum earns the Customer a credit. Numbered CSL-01 and up in the IT Partner SLA, OT-CSL-01 and up in the Landlord SLA, and SEC-CSL-01 and up in the Security SLA."}
  - {term: DCO, type: acronym, expansion: Data center operations, text: "The Customer's site operations team, which runs the Telemetry of Record and manages both partners."}
  - {term: EHS, type: acronym, expansion: Environment, health, and safety, text: "The safety terms every party working at the site signs, with their own rules (EHS-R), violation classes (EHS-C), and credits."}
  - {term: CAB, type: acronym, expansion: Change advisory board, text: "The Customer's board that reviews and approves the IT Partner's change records before work starts."}
  - {term: CHG, type: acronym, expansion: Change record, text: "The prefix of the IT Partner's change records (CHG + 7 digits)."}
  - {term: MOP, type: acronym, expansion: Method of procedure, text: "The step-by-step plan for planned work on live equipment: scope, window, isolation, back-out, and the alarms the work is expected to raise."}
  - {term: PIR, type: acronym, expansion: Post-incident review, text: "The written review after a major incident: timeline, causes, contributing factors, and owned, dated actions.", see: "pir/"}
  - {term: RACI, type: acronym, expansion: "Responsible, accountable, consulted, informed", text: "The ownership matrix in the Interface Agreement: for each component, who does the work, who owns the outcome, who is asked, and who is told."}
  - {term: RCA, type: acronym, expansion: Root cause analysis, text: "The investigation that finds why an incident happened, not just what failed. P1 incidents owe a preliminary and a final RCA."}
  - {term: RMA, type: acronym, expansion: Return merchandise authorization, text: "The return of a failed part to the manufacturer for repair or replacement."}
  - {term: P90, type: acronym, expansion: 90th percentile, text: "The value nine in ten cases come in at or under. The Availability tab gives it beside each median, so a long tail shows."}
  - {term: SLA, type: acronym, expansion: Service level agreement, link: false, text: "The contract schedule that sets service levels, how they are measured, and the credits for missing them. Each partner signs its own."}
  - {term: OEM, type: acronym, expansion: Original equipment manufacturer, text: "The company that built the equipment (here, the rack and system integrator), with its own warranty and support contract."}
  - {term: FRU, type: acronym, expansion: Field-replaceable unit, text: "A part a technician can swap on site, such as a compute tray, optic, power supply, or fan."}
  - {term: PPE, type: acronym, expansion: Personal protective equipment, text: "Gloves, arc-rated clothing, face shields, and similar gear a task's hazard analysis requires."}
  - {term: ESD, type: acronym, expansion: Electrostatic discharge, text: "Static electricity that can damage components; technicians follow an ESD control program."}
  - {term: TRIR, type: acronym, expansion: Total recordable incident rate, text: "Recordable injuries per 200,000 hours worked, a standard safety statistic used to qualify partners."}
  - {term: DART, type: acronym, expansion: "Days away, restricted, or transferred", text: "The rate of injuries serious enough to cost work days or restrict duty, per 200,000 hours worked."}
  - {term: EMR, type: acronym, expansion: Experience modification rate, text: "An insurer's rating of a company's injury history against its industry; 1.0 is average."}
  - {term: OSHA, type: acronym, expansion: Occupational Safety and Health Administration, text: "The US federal workplace safety regulator. Its standards are listed in the SLAs' safety section as OSHA-1904, OSHA-1910, and OSHA-1926."}
  - {term: OSH, type: acronym, expansion: Occupational Safety and Health (Act), text: "The US law that created OSHA; its General Duty Clause is OSHA-GDC."}
  - {term: CFR, type: acronym, expansion: Code of Federal Regulations, text: "The US federal regulations; workplace safety rules are in Title 29 (29 CFR)."}
  - {term: NFPA, type: acronym, expansion: National Fire Protection Association, text: "Publisher of the fire and electrical safety codes the SLAs cite, such as NFPA 70E."}
  - {term: ANSI, type: acronym, expansion: American National Standards Institute, text: "Coordinates US voluntary standards, including ANSI/ASSP Z10.0."}
  - {term: ASSP, type: acronym, expansion: American Society of Safety Professionals, text: "Publisher of the ANSI/ASSP Z10.0 safety management standard."}
  - {term: EPA, type: acronym, expansion: Environmental Protection Agency, text: "The US environmental regulator. Refrigerant work requires an EPA Section 608 certified technician."}
  - {term: IEC, type: acronym, expansion: International Electrotechnical Commission, text: "Publishes international standards with ISO, such as ISO/IEC 30134-2 (power usage effectiveness)."}
  - {term: PUE, type: acronym, expansion: Power usage effectiveness, text: "Total facility energy divided by IT energy over a period (ISO/IEC 30134-2:2026). 1.0 would mean every kilowatt-hour reaches the IT equipment; the rest is cooling, power path losses, and house load. Partial PUE (pPUE) measures one part of that overhead. Reported on the Energy tab."}
  - {term: ISO, type: acronym, expansion: International Organization for Standardization, text: "Publisher of international standards, such as ISO 45001 (safety management) and ISO 8601 week numbering (an ISO week runs Monday to Sunday)."}
  - {term: ERCOT, type: acronym, expansion: Electric Reliability Council of Texas, text: "The grid operator for most of Texas, including the site's utility."}
  - {term: OSR, type: acronym, expansion: Outage severity rating, text: "A public five-level scale for how badly an outage affected services, from 1 (negligible) to 5 (severe). The post-incident review records it beside the internal severity."}
  - {term: ASN, type: acronym, expansion: Advance ship notice, text: "The shipper's list of what is in a delivery, used to reconcile asset tags and serial numbers at receipt."}
  - {term: SN, type: acronym, expansion: Serial number, text: "The manufacturer's unique number for a part; a part swap must show a serial change in inventory."}
  - {term: CCTV, type: acronym, expansion: Closed-circuit television, text: "Security cameras. At AUS-1 the Customer's video system records the Customer halls; the Security Partner watches camera health and retention (SEC-CSL-04, SEC-KM-01)."}
  - {term: CPR, type: acronym, expansion: Cardiopulmonary resuscitation, link: false, text: "At least one guard on every shift is trained in CPR and first aid (Security SLA)."}
  - {term: NIST, type: acronym, expansion: National Institute of Standards and Technology, text: "The US standards body. Its SP 800-88 Rev. 2 sets how storage media is sanitized; the Security SLA requires its Destroy method on site."}
  - {term: SP, type: acronym, expansion: Special Publication, text: "A NIST Special Publication, such as SP 800-88 (media sanitization)."}
  - {term: E1, type: product, title: "E1.S drive", text: "A small, hot-swappable NVMe drive form factor (EDSFF). Each compute tray at AUS-1 holds 8; every one is destroyed on site before a failed tray ships."}
  - {term: SMS, type: acronym, expansion: Short message service, link: false, text: "Text messaging, one of the notification channels."}
  - {term: SMTP, type: acronym, expansion: Simple Mail Transfer Protocol, text: "The protocol for sending email; an SMTP relay is the minimum email channel for notifications."}
  - {term: UTC, type: acronym, expansion: Coordinated Universal Time, link: false, text: "The time standard every record is stamped in. The site is in US Central time (UTC minus 5 in summer)."}
  - {term: CDT, type: acronym, expansion: Central Daylight Time, link: false, text: "US Central time in summer, UTC minus 5 hours: the site's local time."}
  - {term: IT, type: acronym, expansion: Information technology, link: false, text: "Here, the data hall equipment and the IT Partner that works on it."}
  - {term: ID, type: acronym, expansion: Identifier, link: false, text: "A record's unique code."}
  - {term: LLC, type: acronym, expansion: Limited liability company, link: false, text: "A US company form; both partners are fictional LLCs."}
  - {term: PDF, type: acronym, expansion: Portable Document Format, link: false, text: "A printable document file."}
  - {term: YAML, type: acronym, expansion: "YAML (a data file format)", link: false, text: "The plain-text format the contracts and reviews are written in, so they can be tested against the data."}
  - {term: API, type: acronym, expansion: Application programming interface, link: false, text: "A way for one system to read from or send to another."}
  - {term: REST, type: acronym, expansion: Representational state transfer, link: false, text: "A common style of web API."}
  - {term: HTTPS, type: acronym, expansion: Hypertext Transfer Protocol Secure, link: false, text: "Encrypted web traffic."}
  - {term: IP, type: acronym, expansion: Internet Protocol, link: false, text: "The network protocol; BACnet/IP is building automation over an IP network."}
  - {term: TCP, type: acronym, expansion: Transmission Control Protocol, link: false, text: "The network transport; Modbus TCP is Modbus over an Ethernet network."}
  - {term: US, type: acronym, expansion: United States, link: false, text: "The United States."}
  - {term: USA, type: acronym, expansion: United States of America, link: false, text: "The United States."}
  # --- Acronyms: facility (Landlord side)
  - {term: BMS, type: acronym, expansion: Building management system, text: "The Landlord's system that monitors and controls cooling, chillers, CDUs, thermal walls, fire and leak detection. The Customer reads it."}
  - {term: EPMS, type: acronym, expansion: Electrical power monitoring system, text: "The system that records switchgear, UPS, and meter data for the electrical plant."}
  - {term: DCIM, type: acronym, expansion: Data center infrastructure management, text: "Software that tracks power, capacity, and assets across the facility."}
  - {term: SCADA, type: acronym, expansion: Supervisory control and data acquisition, text: "Industrial control and monitoring; here, the utility's own system for its substation."}
  - {term: CDU, type: acronym, expansion: Coolant distribution unit, text: "Moves coolant between the facility water loop and the racks' liquid loop, and controls its temperature, flow, and pressure. The Landlord owns the CDUs; each serves up to 8 racks."}
  - {term: CRAH, type: acronym, expansion: Computer room air handler, text: "A chilled-water air handler that cools a room's air, here the electrical rooms."}
  - {term: UPS, type: acronym, expansion: Uninterruptible power supply, text: "Batteries and power electronics that carry the load through a utility loss until the generators take over."}
  - {term: MV, type: acronym, expansion: Medium voltage, text: "Here, the 13.8 kV switchgear between the utility, the generators, and the unit substations."}
  - {term: L-L, type: acronym, expansion: Line to line, text: "Voltage measured between two phases of a three-phase supply; 0 V line to line means the feed is dead."}
  - {term: MVA, type: acronym, expansion: Megavolt-ampere, text: "A unit of apparent power, used to rate transformers."}
  - {term: MW, type: acronym, expansion: Megawatt, text: "One million watts."}
  - {term: VDC, type: acronym, expansion: Volts direct current, text: "DC voltage, as in the 800 VDC pilot racks."}
  - {term: DC, type: acronym, expansion: Direct current, link: false, text: "Electric current in one direction, as from batteries."}
  - {term: VFD, type: acronym, expansion: Variable frequency drive, text: "Controls a pump or fan motor's speed."}
  - {term: LPM, type: acronym, expansion: Liters per minute, text: "Coolant flow rate."}
  - {term: COP, type: acronym, expansion: Coefficient of performance, text: "Cooling delivered per unit of power used; higher is more efficient."}
  - {term: HVAC, type: acronym, expansion: "Heating, ventilation, and air conditioning", text: "Building air systems."}
  - {term: VESDA, type: acronym, expansion: Very early smoke detection apparatus, text: "Aspirating smoke detection that samples room air through pipes and alarms in stages (Alert, Action, Fire 1, Fire 2)."}
  - {term: HLI, type: acronym, expansion: High-level interface, text: "A data link from the fire alarm panel to the BMS, used for secondary monitoring."}
  - {term: NMC, type: acronym, expansion: Network management card, text: "The UPS's monitoring card, which sends SNMP traps and answers polls."}
  - {term: SNMP, type: acronym, expansion: Simple Network Management Protocol, text: "A standard protocol for reading equipment status and receiving alarms (traps)."}
  - {term: TOR, type: acronym, expansion: Telemetry of Record, text: "The Customer's own collection system: the readings contracts are measured against. On the management network it polls every BMC's Redfish service root once a minute.", see: "telemetry/#mgmt-fields"}
  - {term: HTTP, type: acronym, expansion: Hypertext Transfer Protocol, text: "The web protocol Redfish runs over (HTTPS in practice): a client sends GET to a resource and the BMC answers with a status code and JSON."}
  - {term: SSH, type: acronym, expansion: Secure Shell, text: "An encrypted remote login; console servers offer SSH to each serial port so a technician can reach a switch console from anywhere."}
  - {term: NVUE, type: acronym, expansion: NVIDIA User Experience, text: "The command line and API of Cumulus Linux, the operating system on the management switches."}
  - {term: QSFP28, type: acronym, expansion: Quad Small Form-factor Pluggable 28, text: "The 100 GbE optic or cable port; the SN2201 management switch has four, used here for its two uplinks."}
  - {term: SSD, type: acronym, expansion: Solid-state drive, text: "A drive built on flash memory. Every storage node holds 24 NVMe SSDs of 30.72 TB."}
  - {term: LED, type: acronym, expansion: Light-emitting diode, text: "The drive bay's status light; Redfish StatusIndicator reports what it shows (Fail, Rebuild, PredictiveFailureAnalysis), so a technician pulls the right drive."}
  - {term: DPU, type: acronym, expansion: Data processing unit, text: "A network card with its own processors. Each compute tray's BlueField-3 DPU carries its two 200 GbE storage ports, one to each leaf of its row's storage leaf pair.", see: "telemetry/#storage"}
  - {term: ECMP, type: acronym, expansion: Equal-cost multipath, text: "Spreading flows across every uplink of equal cost. Each storage fabric leaf has four uplinks; one down is carried by the other three, but a link that flaps re-hashes the flows through it again and again.", see: "telemetry/#storage"}
  - {term: DGX, type: product, title: "NVIDIA DGX", text: "NVIDIA's own line of AI systems; the DGX SuperPOD reference architecture is NVIDIA's published design for a full cluster, including its management networks."}
  - {term: DSP0266, type: acronym, expansion: DMTF Redfish Specification, text: "The document number of the Redfish specification, which defines the service root /redfish/v1/ every BMC serves."}
  - {term: RTU, type: acronym, expansion: Remote terminal unit, text: "Modbus RTU is Modbus over a serial line such as RS-485."}
  - {term: PG25, type: acronym, expansion: "Propylene glycol, 25%", text: "The coolant in the racks' liquid loop: water with 25% propylene glycol."}
  - {term: GEN, type: acronym, expansion: Generator, text: "Standby diesel generators; the GEN paralleling bus combines them."}
  # --- Acronyms: IT equipment and telemetry
  - {term: GPU, type: acronym, expansion: Graphics processing unit, link: false, text: "The accelerator the site exists to run; 72 per NVL72 rack."}
  - {term: CPU, type: acronym, expansion: Central processing unit, link: false, text: "The general-purpose processor; each compute tray has two Grace CPUs."}
  - {term: PSU, type: acronym, expansion: Power supply unit, text: "Converts power for equipment; in a rack's power shelves, each PSU is a field-replaceable unit."}
  - {term: BMC, type: acronym, expansion: Baseboard management controller, text: "A small management computer in each tray and switch that reports inventory, health, and sensors (through Redfish), independent of the main system."}
  - {term: XID, type: acronym, expansion: "Xid error (GPU driver error code)", text: "A numbered error the GPU driver reports, such as XID 79 (GPU has fallen off the bus). Critical XIDs start the restoration clock for a GPU fault. Every XID that applies to GB200 is listed under GPU XID codes, from NVIDIA's public Xid catalog."}
  - {term: DCGM, type: acronym, expansion: Data Center GPU Manager, text: "The GPU vendor's monitoring tool for GPU health, errors, and diagnostics; the source for DS-DCGM."}
  - {term: SM, type: acronym, expansion: Streaming multiprocessor, text: "The GPU's compute units. Its clock (DCGM_FI_DEV_SM_CLOCK) drops when the GPU throttles for heat or power."}
  - {term: HMMA, type: acronym, expansion: Half-precision matrix multiply-accumulate, text: "The tensor core operation that dominates AI training; DCGM_FI_PROF_PIPE_TENSOR_ACTIVE is the share of cycles it runs."}
  - {term: UUID, type: acronym, expansion: Universally unique identifier, text: "The GPU's own identifier, a label on every exporter series. A replaced tray brings new GPUs with new UUIDs, so their readings start new series."}
  - {term: CSV, type: acronym, expansion: Comma-separated values, text: "A plain table file any spreadsheet opens."}
  - {term: DCGM_FI_DRIVER_VERSION, type: metric, title: "Driver version (a label)", text: "The exporter attaches the GPU driver version to every series as a label. A real site shows the driver it validated; this demo shows a placeholder."}
  - {term: HBM, type: acronym, expansion: High-bandwidth memory, text: "The stacked memory beside each GPU. Its temperature is watched with the GPU's, and its bad rows are what row remapping replaces."}
  - {term: ECC, type: acronym, expansion: Error-correcting code, text: "Memory that detects and corrects bit errors; rising corrected errors can warn of a failing part."}
  - {term: GSP, type: acronym, expansion: GPU System Processor, text: "A processor on the GPU that runs its firmware; XID 119 is a timeout waiting for it."}
  - {term: RPC, type: acronym, expansion: Remote procedure call, text: "A request one program sends another, here the GPU driver to the GSP."}
  - {term: IMEX, type: acronym, expansion: Internode memory exchange, text: "The service that lets GPUs in one NVLink domain share memory; it must be up before a rack returns to service."}
  - {term: NCCL, type: acronym, expansion: Collective communications library, text: "The GPU vendor's library for multi-GPU communication; an NCCL all-reduce test checks a rack's bandwidth."}
  - {term: NMX, type: acronym, expansion: NVLink management software, text: "Manages and reports on the NVLink switches inside the racks; the source for DS-NMX."}
  - {term: DMTF, type: acronym, expansion: Distributed Management Task Force, text: "The standards body behind Redfish, the REST API the CDUs report their telemetry through."}
  - {term: OCP, type: acronym, expansion: Open Compute Project, text: "An industry group that publishes open hardware specifications, including Redfish profiles for cooling units."}
  - {term: OAI, type: acronym, expansion: OCP Accelerator Infrastructure, text: "The OCP project behind the Redfish profiles for accelerator and liquid-cooling equipment."}
  - {term: TTDM, type: acronym, expansion: TraceTek leak detection module, text: "The module that monitors the sensing cable under each CDU and reports a leak to the BMS."}
  - {term: NDA, type: acronym, expansion: Non-disclosure agreement, text: "A confidentiality contract; vendors share some technical documents, such as BMS point maps, only under one."}
  - {term: UFM, type: acronym, expansion: Unified Fabric Manager, text: "Manages and monitors the InfiniBand fabric: port state, link-down events, and optic health; the source for DS-UFM."}
  - {term: IB, type: acronym, expansion: InfiniBand, text: "The back-end network between compute trays and the leaf switches. The scheduler writes a lost link as 'IB link down'."}
  - {term: HCA, type: acronym, expansion: Host channel adapter, text: "The InfiniBand network card in a compute tray."}
  - {term: NDR, type: acronym, expansion: "Next data rate (InfiniBand, 400 Gb/s)", text: "An InfiniBand speed generation."}
  - {term: XDR, type: acronym, expansion: "Extended data rate (InfiniBand, 800 Gb/s)", text: "An InfiniBand speed generation."}
  - {term: BER, type: acronym, expansion: Bit error rate, text: "The share of bits received in error on a link; pre-FEC BER drift can warn of a failing optic."}
  - {term: DOM, type: acronym, expansion: Digital optical monitoring, text: "An optic's own report of temperature, power, and signal levels; a DOM alarm warns the optic is failing."}
  - {term: OSFP, type: acronym, expansion: Octal small form-factor pluggable, text: "The optic module format for the 400G and 800G network links; a QM9700 cage holds two 400G ports."}
  - {term: ASIC, type: acronym, expansion: Application-specific integrated circuit, text: "The switching chip in a network switch or NVLink switch tray; its temperature is one of the chassis readings."}
  - {term: FEC, type: acronym, expansion: Forward error correction, text: "Extra bits on every InfiniBand link that let the receiver fix raw bit errors. Errors FEC cannot fix are counted as symbol errors."}
  - {term: RS-FEC, type: acronym, expansion: Reed-Solomon forward error correction, text: "The FEC code NDR and XDR links use, written RS-FEC (544,514): 514 data symbols protected by 30 check symbols."}
  - {term: PLR, type: acronym, expansion: Physical layer retransmission, text: "An XDR link feature that resends a block FEC could not correct, on top of RS-FEC."}
  - {term: BER, type: acronym, expansion: Bit error rate, text: "Errored bits per bit sent. Raw BER is before FEC corrects them (about 1E-8 to 1E-6 on a healthy link); a failing optic pushes it up until FEC can no longer keep up."}
  - {term: SNR, type: acronym, expansion: Signal-to-noise ratio, text: "How far the optical signal stands above the noise at the receiver, in dB. Low SNR at normal receive power points at the switch-side optic."}
  - {term: PHY, type: acronym, expansion: Physical layer, text: "The part of a link that turns bits into light and back: the optics, lanes, and FEC. UFM reads its fields every 5 minutes."}
  - {term: GUID, type: acronym, expansion: Globally unique identifier, text: "The 64-bit number that names each InfiniBand switch (node GUID) and port (port GUID); UFM labels every reading with them."}
  - {term: IBTA, type: acronym, expansion: InfiniBand Trade Association, text: "The body that publishes the InfiniBand specification, including the port counters (PortCounters, PortCountersExtended) every switch and NIC keeps."}
  - {term: IB-NDR, type: acronym, expansion: InfiniBand NDR (400 Gb/s), text: "The 400 Gb/s InfiniBand speed of Hall A's back-end links: 4 lanes of 100G."}
  - {term: IB-XDR, type: acronym, expansion: InfiniBand XDR (800 Gb/s), text: "The 800 Gb/s InfiniBand speed of Hall B's back-end links: 4 lanes of 200G."}
  - {term: NMX-T, type: acronym, expansion: NMX Telemetry, text: "The NVLink management software's telemetry service: it reads every NVLink switch tray once a minute and serves the readings to Prometheus.", see: "telemetry/#network-fields"}
  - {term: MFT, type: acronym, expansion: NVIDIA Firmware Tools, text: "The vendor's command-line tools for its NICs and switches; mlxlink, one of them, prints a port's link state, optic readings, and error counters."}
  - {term: CMIS, type: acronym, expansion: Common Management Interface Specification, text: "The standard memory map an OSFP optic publishes its temperature, voltage, and per-lane transmit and receive power through."}
  - {term: ENTITY-SENSOR-MIB, type: acronym, expansion: Entity sensor MIB (RFC 3433), text: "The standard SNMP MIB for a device's sensors (temperatures, fan speeds, power); the QM9700 switches answer it."}
  - {term: IF-MIB, type: acronym, expansion: Interfaces group MIB (RFC 2863), text: "The standard SNMP MIB for a device's ports: ifOperStatus says whether each port is up, and the linkDown and linkUp traps report each change as it happens.", see: "telemetry/#mgmt-fields"}
  - {term: ENTITY-MIB, type: acronym, expansion: Entity MIB (RFC 6933), text: "The standard SNMP MIB that lists a device's parts (chassis, fans, power supplies) that ENTITY-SENSOR-MIB readings attach to."}
  - {term: MLNX-OS, type: product, title: "MLNX-OS switch operating system", text: "The operating system on the QM9700 InfiniBand switches; it names ports ib 1/<cage>/<port>."}
  - {term: NVOS, type: product, title: "NVOS switch operating system", text: "The operating system on the Quantum-X800 switches; it streams telemetry over gNMI and names ports sw<cage>p<port>."}
  - {term: QM9790, type: product, title: "Quantum-2 QM9790 InfiniBand switch", text: "The unmanaged sibling of the QM9700 (same hardware, run from the fabric manager); named here only in a source title."}
  - {term: OS, type: acronym, link: false, expansion: Operating system, text: "The software a switch runs."}
  - {term: ABI, type: acronym, link: false, expansion: Application binary interface, text: "In a source title: the Linux kernel's documented interface, here the InfiniBand counter files."}
  - {term: DAC, type: acronym, expansion: Direct attach copper, text: "A short copper network cable with connectors built on."}
  - {term: OOB, type: acronym, expansion: Out-of-band, text: "The separate management network that reaches equipment even when the main network is down."}
  - {term: RAID, type: acronym, expansion: Redundant array of independent disks, text: "Disks combined so one can fail without losing data; rebuilt after a drive swap."}
  - {term: POST, type: acronym, expansion: Power-on self-test, text: "The checks a system runs when it powers on."}
  # --- Codes the data uses that the contracts do not list
  - {term: M0, type: scope, title: "Deployment milestone: not received", text: "The rack has not yet arrived at the site; milestone M1 (received and inspected) comes next."}
  - {term: UTILITY, type: scope, title: "Fault class: utility supply", text: "A loss of the serving utility's power. Neither partner owns it; it is attributed under rule FA-6."}
  - {term: RESEAT, type: ticket_state, title: "Close code: reseat", code_only: false, text: "The repair was a reseat: the part was removed and reinstalled, no part was used, and inventory shows no serial change."}
  - {term: OPS-MAIN, type: equipment, title: "Main operations entrance badge reader", text: "The door every shift badges through; the staffing check counts badge-ins here."}
  - {term: AUS-1, type: equipment, title: "Site AUS-1", text: "The fictional leased AI data center in Central Texas this project models."}
  - {term: TTDM-A, type: equipment, title: "Hall A leak detection module", text: "The leak alarm and locator module for Hall A's sensing cables. An alarm names the circuit (C1, C2, ...) and the distance along the cable."}
  - {term: TTDM-B, type: equipment, title: "Hall B leak detection module", text: "The leak alarm and locator module for Hall B's sensing cables."}
  - {term: MV-A, type: equipment, title: "Medium-voltage bus A", text: "One of the two 13.8 kV switchgear buses (main-tie-main). The A feeds of the halls trace back to it."}
  - {term: MV-B, type: equipment, title: "Medium-voltage bus B", text: "The other 13.8 kV switchgear bus. The B feeds of the halls trace back to it."}
  - {term: Z10, type: safety, title: "ANSI/ASSP Z10.0", text: "The US standard for occupational health and safety management systems, accepted in place of ISO 45001."}
  - {term: RS-485, type: acronym, expansion: "RS-485 (serial line standard)", text: "A two-wire serial link used by Modbus RTU devices such as the leak detection modules."}
  # --- Deployments: codes, standards, and Texas authorities (Deployments tab)
  - {term: NEC, type: safety, title: "National Electrical Code (NFPA 70)", text: "The US electrical installation code. Texas adopted the 2026 edition effective 2026-09-01; work designed or permitted before that is under the 2023 edition (TX-NEC)."}
  - {term: NETA, type: acronym, expansion: InterNational Electrical Testing Association, text: "Publishes the acceptance testing specifications (ANSI/NETA ATS) that third-party testers follow for breakers, busway, and tap-offs before energization."}
  - {term: ATS, type: safety, title: "ANSI/NETA Acceptance Testing Specifications", pages: [deployments], text: "The electrical acceptance test standard (current edition ATS-2025): insulation resistance, torque, contact resistance, and an infrared scan under load, recorded on a NETA test report."}
  - {term: ATS-2025, type: safety, title: "ANSI/NETA ATS-2025", text: "The current edition of the NETA Acceptance Testing Specifications, used for the Hall B power commissioning (G1-02)."}
  - {term: TC, type: acronym, expansion: "Technical Committee (ASHRAE)", text: "TC 9.9 is the ASHRAE committee for mission-critical facilities and data centers; it publishes the Thermal Guidelines, whose envelopes the Site health page uses for supply air."}
  - {term: ASHRAE, type: acronym, expansion: "American Society of Heating, Refrigerating and Air-Conditioning Engineers", text: "Publisher of Guideline 0 (the commissioning process behind levels L1 to L5) and the thermal guidelines for data centers."}
  - {term: TIA-942-C, type: safety, title: "ANSI/TIA-942-C (2024)", text: "The data center telecommunications infrastructure standard, used for the cabling plan, labeling, and pathways."}
  - {term: TDLR, type: acronym, expansion: Texas Department of Licensing and Regulation, text: "The state agency that adopts the Texas electrical code, licenses electricians, and runs the Architectural Barriers program (TX-TABA)."}
  - {term: TAC, type: acronym, expansion: Texas Administrative Code, text: "The state's compiled agency rules; 16 TAC chapter 73 holds the electrical rules that adopt the NEC."}
  - {term: PUCT, type: acronym, expansion: Public Utility Commission of Texas, text: "The state utility regulator, which sets the large-load interconnection rules under SB 6 (TX-SB6)."}
  - {term: SB, type: acronym, expansion: "Senate Bill", pages: [deployments], text: "A Texas Senate bill. SB 6 (2025) sets rules for large loads of 75 MW or more (TX-SB6)."}
  - {term: APS, type: acronym, expansion: Alarm planning superintendent, text: "A Texas State Fire Marshal's Office license: fire alarm plans are signed by a licensed APS or sealed by a fire protection engineer."}
  - {term: PE, type: acronym, expansion: Professional engineer, text: "A licensed engineer; in Texas a PE seals the construction documents and load calculations (the Landlord's engineer of record)."}
  - {term: PF, type: acronym, expansion: Power factor, text: "The ratio of real to apparent power; the calculation sheet converts rack kW to amps at 480 V with PF 0.99."}
  - {term: NIC, type: acronym, expansion: Network interface card, text: "A server's network adapter; each GB300 tray has one per fabric rail."}
  - {term: CCF-DEP, type: record, title: "Landlord's Jira project for the Hall B fit-out", text: "Caprock's own Jira project for the hall readiness work it runs or coordinates and each rack's tap-off energization (HO-4). Read through the importer, never written.", see: "deployments/#jira/CCF-DEP"}
  - {term: RSS-DEP, type: record, title: "IT Partner's Jira project for the Hall B rack deployment", text: "Ridgeline's own Jira project: one story per rack with a sub-task per milestone M1 to M7. Read through the importer, never written.", see: "deployments/#jira/RSS-DEP"}
  - {term: RDY-C-PILOT, type: record, title: "Hall C readiness program", text: "The readiness program for Hall C, the 800 VDC pilot: commissioning L1 to L5, the Customer's readiness gates R0 to R4, pilot spares, and the first-compute forecast.", see: "deployments/#hallc"}
  - {term: DEP-B-GB300, type: record, title: "Hall B GB300 rollout program", text: "The deployment program for Hall B's 32 GB300 NVL72 racks: gates G0 to G3, their steps, calculations, permits, and records.", see: "deployments/"}
  - {term: R-HO4, type: rule, title: "Tap-off energization (Interface Agreement HO-4)", text: "The Landlord energizes the rack's tap-off and opens its isolation valves only after the IT Partner confirms the rack is set and leak-tested (M3). A rack step between M3 and M4.", see: "deployments/#step/R-HO4"}
  # --- Products and models named in the site model
  - {term: NVIDIA, type: product, link: false, title: "GPU and network vendor", text: "Makes the GB200 and GB300 NVL72 racks, the NVLink switches, and the InfiniBand fabric."}
  - {term: GB200, type: product, title: "GB200 NVL72 rack", text: "A rack-scale GPU system: 72 GPUs and 36 Grace CPUs joined by NVLink, direct-to-chip liquid cooled. Hall A runs 32 of them."}
  - {term: GB300, type: product, title: "GB300 NVL72 rack", text: "The next generation of the NVL72 rack. Hall B is deploying 32 of them."}
  - {term: B200, type: product, title: "B200 GPU", text: "The Blackwell GPU in a GB200 rack; public figures put it at up to 1,200 W. Hall A runs it at that default limit."}
  - {term: B300, type: product, title: "B300 GPU", text: "The Blackwell Ultra GPU in a GB300 rack, up to 1,400 W by public figures. Hall B caps it at 1,200 W to fit the 132 kW rack envelope."}
  - {term: NVL72, type: product, title: "NVL72 rack", text: "A rack of 72 GPUs in one NVLink domain, so they work as one large GPU. One rack-hour is 72 GPU-hours."}
  - {term: SN2201, type: product, title: "Spectrum SN2201 1G management switch", text: "The 48-port 1 GbE management switch; each rack has two (rack-mgmt1 out of band, rack-mgmt2 in band), the switch NVIDIA's GB200 reference architecture uses for the out-of-band network.", see: "telemetry/#management"}
  - {term: SN5600, type: product, title: "Spectrum SN5600 switch", text: "The Ethernet switch each hall's management aggregation pair runs on (every rack management switch uplinks to both), and every switch of the storage and in-band Ethernet fabric: a leaf pair per row, a storage leaf pair and a spine pair per hall.", see: "telemetry/#management"}
  - {term: QM9700, type: product, title: "Quantum-2 QM9700 InfiniBand switch", text: "The 400 Gb/s (NDR) InfiniBand switch in Hall A's back-end fabric."}
  - {term: Q3400-RA, type: product, title: "Quantum-X800 Q3400-RA InfiniBand switch", text: "The 800 Gb/s (XDR) InfiniBand switch for Hall B and the planned 800 VDC pilot hall (Hall C)."}
  - {term: C175-16, type: product, title: "Caterpillar C175-16 generator", text: "The 3,000 kW diesel standby generator model; the site has 7 (N+1)."}
  - {term: EMCP, type: product, title: "EMCP 4.4 generator controller", text: "The generator's control panel, read over Modbus TCP for run, load, and alarm data."}
  - {term: TT5000, type: product, title: "TraceTek TT5000 sensing cable", text: "Hydrocarbon leak sensing cable, used around the generators' diesel."}
  - {term: TTDM-128, type: product, title: "TraceTek TTDM-128 leak module", text: "The leak alarm and locator module that reads sensing cable and reports where along it the leak is."}
  - {term: RAYCHEM, type: product, link: false, title: "TraceTek product line", text: "The brand line of the leak detection cable and modules."}
  - {term: VX, type: product, title: "Galaxy VX UPS", text: "The 1,500 kW UPS model for the halls' critical power."}
  - {term: VL, type: product, title: "Galaxy VL UPS", text: "The 300 kW UPS model for mechanical loads (pumps, CDUs)."}
  - {term: VS, type: product, title: "Galaxy VS UPS", text: "A smaller UPS model in the same family as the VX and VL; the NMC4 card's documentation covers all of them. The site does not run one."}
  - {term: VXL, type: product, title: "Galaxy VXL UPS", text: "A larger UPS model in the same family as the VX; the NMC4 card's documentation covers it. The site does not run one."}
  - {term: NMC4, type: product, title: "Network management card 4", text: "The SNMPv3 and Modbus TCP card in each Galaxy UPS. The power telemetry polls it once a minute; its event log is the record of mode changes."}
  - {term: APC, type: product, link: false, title: "UPS brand", text: "Schneider Electric's UPS brand. Its PowerNet-MIB holds the battery and output-status objects the Galaxy UPS cards answer."}
  - {term: CAT, type: product, link: false, title: "Generator brand", text: "Caterpillar. The site's 7 standby generators are CAT C175-16 sets with EMCP 4.4 controllers."}
  - {term: M70, type: product, title: "Starline M70 CPM", text: "The monitoring module on each busway's end feed: it meters the run and every tap-off on it and answers SNMP polls."}
  - {term: CPM, type: acronym, expansion: Critical power monitor, text: "Starline's busway metering module (the M70 at this site). It records each tap-off breaker opening and closing, and the busway losing its feed."}
  - {term: MIB, type: acronym, expansion: Management information base, text: "The published list of what a device answers over SNMP: each reading's object name, number (OID), type, and unit."}
  - {term: OID, type: acronym, expansion: Object identifier, text: "The dotted number that names one SNMP reading, such as 1.3.6.1.2.1.33.1.4.4.1.4.1 for a UPS's output power."}
  - {term: UPS-MIB, type: product, title: "UPS-MIB (RFC 1628)", text: "The IETF standard MIB every UPS card answers: input, output, bypass, and battery readings under mib-2 33."}
  - {term: STARLINE-CPM-MIB, type: product, title: "Starline CPM MIB", text: "Starline's published MIB for the M70 CPM (enterprise 35774): run and tap-off voltage, current, power, energy, and breaker state."}
  - {term: IETF, type: acronym, expansion: Internet Engineering Task Force, text: "The standards body that publishes RFCs, including RFC 1628, the UPS-MIB."}
  - {term: RFC, type: acronym, expansion: Request for Comments, text: "An IETF standards document. RFC 1628 defines the UPS-MIB."}
  - {term: RMS, type: acronym, expansion: Root mean square, text: "The effective value of an AC voltage or current; meters report RMS volts and amps."}
  - {term: L1, type: acronym, expansion: Line 1, text: "The first phase of a three-phase supply; L2 and L3 are the other two."}
  - {term: L2, type: acronym, expansion: Line 2, text: "The second phase of a three-phase supply."}
  - {term: L3, type: acronym, expansion: Line 3, text: "The third phase of a three-phase supply."}
  - {term: UINT16, type: acronym, expansion: Unsigned 16-bit integer, text: "A Modbus value held in one register (0 to 65,535); the point map gives its scale, such as 0.1 Hz."}
  - {term: UINT32, type: acronym, expansion: Unsigned 32-bit integer, text: "A Modbus value held in two registers, used for counters such as energy and engine hours."}
  - {term: ENUM, type: acronym, expansion: Enumerated value, text: "A register or object whose number stands for a state, such as 1 for normal, 2 for bypass, 4 for battery."}
  - {term: INTEGER, type: acronym, link: false, expansion: SNMP integer type, text: "The SNMP type of a whole-number reading; snmpget prints it before the value."}
  - {term: AP9644, type: product, title: "Network management card 4", text: "The UPS's monitoring card (the NMC), the source of SNMP traps."}
  - {term: MVSST, type: product, title: "Medium-voltage solid-state transformer", text: "Converts 13.8 kV directly to 800 VDC for the planned 800 VDC racks."}
  - {term: PME, type: product, title: "Power Monitoring Expert", text: "The electrical power monitoring software (EPMS) that records switchgear and meter data."}
  - {term: AFC, type: product, title: "Liebert AFC chiller", text: "The air-cooled free-cooling chiller model in the central plant."}
  - {term: CWA, type: product, title: "Liebert CWA thermal wall", text: "The chilled-water fan wall that cools the halls' air."}
  - {term: CW, type: product, title: "Liebert CW CRAH", text: "The perimeter air handler model for the electrical rooms."}
  - {term: EBO, type: product, title: "EcoStruxure Building Operation", text: "The Landlord's BMS server software. It serves every chiller, pump, thermal wall, and CRAH controller's points as BACnet objects, and the Customer reads them from it.", see: "telemetry/#mech-fields"}
  - {term: V1C, type: product, title: "iCOM 3 V1C control application", text: "The Liebert iCOM 3 controller application the AFC chillers run. Vertiv publishes its points (names, Modbus registers, and alarm binary values) in a communication points list.", see: "telemetry/#mech-fields"}
  - {term: V1A, type: product, title: "iCOM 3 V1A application", text: "The Liebert iCOM 3 application of Vertiv's PDX and PCW room units; its published monitoring guide gives the chilled-water point names used for the thermal walls and CRAHs."}
  - {term: PCW, type: product, title: "Liebert PCW", text: "Vertiv's chilled-water room cooling unit. Its iCOM 3 monitoring guide names the points used here for the thermal walls and CRAHs."}
  - {term: PDX, type: product, title: "Liebert PDX", text: "Vertiv's direct-expansion room cooling unit; it shares the V1A monitoring guide with the PCW."}
  - {term: R-513A, type: product, title: "R-513A refrigerant", text: "The low global-warming refrigerant in the AFC chillers' screw compressor circuits; its saturation curve turns condensing temperature into pressure."}
  - {term: B-ASC, type: acronym, expansion: BACnet Advanced Application Specific Controller, text: "The BACnet device profile the chiller controller declares: it serves its own objects and answers reads and writes."}
  - {term: BV, type: acronym, expansion: BACnet binary value, text: "A BACnet object with two states. Vertiv publishes the V1C alarms as binary values: BV 35 is Circuit 1 - High Condensing Pressure.", see: "telemetry/#mech-fields"}
  - {term: IR, type: acronym, expansion: Modbus input register, text: "A read-only 16-bit Modbus register. The V1C points list gives each chiller reading one (IR 49203 is Unit Inlet Temperature)."}
  - {term: HR, type: acronym, expansion: Modbus holding register, text: "A read-write 16-bit Modbus register, used for setpoints and commands (HR 45101 is the chiller's Unit ON/OFF)."}
  - {term: IS, type: acronym, expansion: Modbus input status, text: "A read-only one-bit Modbus point (a discrete input); the iCOM 3 alarms are input statuses."}
  - {term: UDP, type: acronym, expansion: User Datagram Protocol, text: "The IP transport BACnet/IP uses, on port 47808."}
  - {term: PICS, type: acronym, expansion: Protocol Implementation Conformance Statement, text: "A BACnet device's published list of the objects, properties, and services it supports."}
  - {term: DX, type: acronym, expansion: Direct expansion, text: "Cooling by a refrigerant circuit in the unit itself rather than by chilled water (CW)."}
  - {term: FW, type: acronym, expansion: Facility water, text: "The chilled water loop from the central plant to the halls' CDUs, thermal walls, and CRAHs (20 C supply, 30 C design return).", see: "telemetry/#FW-LOOP"}
  - {term: FC, type: acronym, expansion: Free cooling, text: "Cooling with outdoor air through the chiller's free-cooling coils instead of its compressors, when the air is cooler than the returning water. The V1C point Stop or Inhibit FC activation holds it off."}
  - {term: OVERRIDDEN, type: acronym, expansion: BACnet status flag, text: "One of the four BACnet Status_Flags. It is set only when a local hand override the client cannot change is in force; a BMS write at priority 8 shows in the Priority_Array instead.", see: "telemetry/#mech-fields"}
  - {term: VESDA-E, type: product, title: "VESDA-E aspirating smoke detector", text: "The current generation of VESDA detectors."}
  - {term: VEP, type: product, title: "VESDA-E VEP detector", text: "A VESDA-E model with multiple sampling pipes."}

families:
  # --- Records
  - {key: INC, label: "INC#######", pattern: 'INC\d{7}', type: record, title: Incident ticket, example: INC3100816,
     text: "A ticket in the ticketing system. Faults the telemetry detects open one automatically (the Ticket of Record), stamped with T0, the fault class, and the unit."}
  - {key: WO, label: "WO-#####", pattern: 'WO-\d{5}', type: record, title: Landlord work order, example: WO-41023,
     text: "The Landlord's record of facility work: a fault repair, planned maintenance, or a change."}
  - {key: MOP-N, label: "MOP-###", pattern: 'MOP-\d{3}', type: record, title: Method of procedure (change record), example: MOP-310,
     text: "An approved plan for planned work on live equipment, with its window and the alarms it declares it will cause. The Alarm Board checks every alarm against it.", see: "alarms/#changes"}
  - {key: CHG-N, label: "CHG#######", pattern: 'CHG\d{7}', type: record, title: IT Partner change record, example: CHG2040031,
     text: "A planned change by the IT Partner, such as a firmware update, with its window and declared alarms.", see: "alarms/#changes"}
  - {key: ALM, label: "ALM-####", pattern: 'ALM-\d{4}', type: record, title: Alarm, example: ALM-0001,
     text: "One alarm on the Alarm Board, checked against the change work that declared it.", see: "alarms/"}
  - {key: PM, label: "PM-####", pattern: 'PM-\d{4}', type: record, title: Preventive maintenance record, example: PM-0003,
     text: "A scheduled maintenance task on facility equipment, such as a generator's monthly loaded exercise."}
  - {key: AI, label: "AI-###", pattern: 'AI-\d{3}', type: record, title: BMS analog input point, example: AI-101,
     text: "An illustrative point number in the BMS point list for the CDU telemetry: each analog input maps one Redfish reading to a BACnet object and a Modbus register. No CDU vendor publishes its map; these numbers are this site's own.", see: "telemetry/#cdu-fields"}
  - {key: CAP-N, label: "CAP-###", pattern: 'CAP-\d{3}', type: record, title: Corrective action plan, example: CAP-001,
     text: "A corrective action plan drafted at the period review for each serious finding, grouped by the tickets it affects.", see: "app/"}
  - {key: F-N, label: "F-###", pattern: 'F-\d{3}', type: record, title: IT Partner finding, example: F-001,
     text: "A place where the IT Partner's records do not reconcile with the telemetry, from the monthly scorecard.", see: "app/"}
  - {key: L-N, label: "L-###", pattern: 'L-\d{3}', type: record, title: Landlord finding, example: L-001,
     text: "A place where the Landlord's work orders or maintenance records do not reconcile with the telemetry, from the monthly scorecard.", see: "app/"}
  - {key: S-N, label: "S-###", pattern: 'S-\d{3}', type: record, title: Security Partner finding, example: S-001,
     text: "A place where the Security Partner's post log, dispatch log, visitor log, or destruction certificates do not reconcile with the Customer's access control system, Redfish inventory, or the RMA shipments.", see: "app/"}
  - {key: SIR, label: "SIR-#####", pattern: 'SIR-\d{5}', type: record, title: Security incident report, example: SIR-00016,
     text: "The Security Partner's dispatch record for a door alarm: who was sent, when they arrived, and how it was closed. A claim; the guard's badge at the door is the evidence.", see: "tickets/"}
  - {key: ACS-N, label: "ACS-#####", pattern: 'ACS-\d{5}', type: record, title: Door alarm (access control system), example: ACS-00016,
     text: "A door forced or door held alarm raised by the Customer's access control system, with the console acknowledgement time."}
  - {key: VIS, label: "VIS-####", pattern: 'VIS-\d{4}', type: record, title: Visit, example: VIS-0038,
     text: "One visitor's sign-in under a Customer-approved request (VR-####), with the named escort and the visitor badge (V-####)."}
  - {key: VR, label: "VR-####", pattern: 'VR-\d{4}', type: record, title: Visit request, example: VR-2038,
     text: "A Customer-approved request for a visitor, naming the hall and the escort."}
  - {key: VB, label: "V-####", pattern: 'V-\d{4}', type: record, title: Visitor badge, example: V-3038,
     text: "A visitor badge. It opens only the hall doors on the visit request and expires at sign-out."}
  - {key: LGP, label: "LGP-###", pattern: 'LGP-\d{3}', type: record, title: Security Partner guard ID, example: LGP-011,
     text: "A guard on the Security Partner's roster (Llano Gate Protective Services)."}
  - {key: POST-N, label: "POST-...", pattern: 'POST-(?:HA|HB|SOC|DOCK|PATROL)', type: record, title: Guard post, example: POST-HA,
     text: "A guard post in the Security Partner SLA: Hall A and Hall B entrances, the security console, the receiving dock, and the roving patrol. Staffed means a guard badged in at the post reader."}
  - {key: DOOR, label: "Customer door", pattern: 'HALL-[AB]-EXIT-N|SPARES-CAGE|DOCK-INNER', type: record, title: Customer door on the access control system, example: DOCK-INNER,
     text: "A Customer door the Security Partner watches: hall emergency exits (door forced alarms are P1), the spares cage, and the receiving dock's inner door. A guard answering an alarm badges the door's own reader."}
  - {key: CAM, label: "CAM-X-##", pattern: 'CAM-[A-Z]-\d{2}', type: record, title: Camera, example: CAM-B-04,
     text: "A camera on the Customer's video system covering the Customer halls. The video system records whether it is recording; no video is used for measurement."}
  - {key: SER-E1S, label: "E1S + 9 characters", pattern: 'E1S[A-Z0-9]{9}', type: record, title: Drive serial number, example: E1S46F6ZGWWD,
     text: "A storage drive's serial number from the compute tray's Redfish inventory. It needs a certificate of destruction before the tray ships."}
  - {key: PIR-ID, label: "PIR-YYYY-###", pattern: 'PIR-\d{4}-\d{3}', type: record, title: Post-incident review, example: PIR-2026-001,
     text: "A completed post-incident review.", see: "pir/"}
  - {key: EN-F, label: "EN-F#", pattern: 'EN-F\d', type: record, title: Energy finding, example: EN-F1, see: "energy/",
     text: "A finding on the Energy tab: the Landlord's energy report or the chiller free-cooling log does not reconcile with the meters (Landlord SLA section 22)."}
  - {key: MP-N, label: "MP-#", pattern: 'MP-\d{1,2}', type: record, title: Management network finding, example: MP-1, see: "telemetry/#management",
     text: "A finding on the Telemetry tab's management network section: a record that does not reconcile with what the BMCs, management switches, or console servers showed (an outage with no ticket, a check that passed while its BMC was silent, BMCs answering after M4, a console port labelled the wrong way round)."}
  - {key: SP-N, label: "SP-#", pattern: 'SP-\d{1,2}', type: record, title: Storage finding, example: SP-1, see: "telemetry/#storage",
     text: "A finding on the Telemetry tab's storage section: a record that does not reconcile with what the storage nodes or the storage fabric showed (a drive ticket naming the wrong bay, a ticket resolved before the rebuild finished, a pulled drive with no custody handover, a flapping uplink whose ticket says there was no customer impact)."}
  - {key: GH-F, label: "GH-F#", pattern: 'GH-F\d', type: record, title: GPU health finding, example: GH-F1, see: "gpu/",
     text: "A finding on the GPU Health tab: a GPU to replace before it fails, a node returned to service with a row remap pending, or thermal slowdown walked to the party whose side of the cooling demarcation caused it."}
  - {key: FPR, label: "FPR-YYYY-H#", pattern: 'FPR-\d{4}-H[12]', type: record, title: Failure pattern review, example: FPR-2026-H1,
     text: "The review of six months of failures for patterns, with owners and fixes.", see: "patterns/"}
  - {key: PA, label: "PA#", pattern: 'PA\d{1,2}', type: record, title: Failure pattern action, example: PA6,
     text: "An owned, dated action from the failure pattern review.", see: "patterns/"}
  - {key: W, label: "W##", pattern: 'W\d{2}', type: record, title: ISO week, example: W38,
     text: "The week of the year (Monday to Sunday, UTC); one weekly operations review pack per week.", see: "weekly/"}
  - {key: RSS, label: "RSS-###", pattern: 'RSS-\d{3}', type: record, title: IT Partner staff ID, example: RSS-003,
     text: "A person on the IT Partner's roster (Ridgeline Site Services). The staffing checks match rostered people to badge-ins."}
  - {key: CCF-E, label: "CCF-E##", pattern: 'CCF-E\d{2}', type: record, title: Landlord engineer ID, example: CCF-E07,
     text: "An engineer on the Landlord's staff (Caprock Critical Facilities)."}
  - {key: BADGE, label: "B#####", pattern: 'B\d{5}', type: record, title: Access badge, example: B40028,
     text: "An access badge; badge-ins and badge-outs at the hall doors are the evidence for on-site times."}
  - {key: LOT, label: "LOT-####", pattern: 'LOT-\d{4}', type: record, title: Manufacturing lot, example: LOT-2544,
     text: "A batch of parts made together; a bad lot fails more often than the others."}
  - {key: AR-N, label: "AR-#", pattern: 'AR-\d{1,2}', type: record, title: Asset register finding, example: AR-1, see: "devices/#assets",
     text: "A finding of the daily asset register reconciliation: a device answering with a serial the register lists in the spares cage or as disposed, or an OEM replacement delivered to the dock and never received (Interface Agreement section 11)."}
  - {key: AT-TAG, label: "AT-######", pattern: 'AT-\d{6}', type: record, title: Asset tag, example: AT-004079, see: "devices/#assets",
     text: "An asset's tag in the Customer's asset register: one per serial, from receipt to disposal (REG-1)."}
  - {key: EW-CERT, label: "EW-#####", pattern: 'EW-\d{5}', type: record, title: Disposal certificate, example: EW-00504, see: "devices/#assets",
     text: "An e-waste disposal certificate from the recycler, naming the serial of every asset it covers and witnessed by the Security Partner (REG-5)."}
  - {key: RMA-N, label: "RMA-#####", pattern: 'RMA-\d{5}', type: record, title: OEM return authorization, example: RMA-74947, see: "devices/#assets",
     text: "The OEM's RMA number for a failed part: when the OEM received it, and the replacement it shipped and delivered (carrier proof of delivery)."}
  - {key: SER-REG, label: "RK, MS, IB, EN, CS, AG, SN, SR, or FE + 8 characters", pattern: '(?:RK|MS|IB|EN|CS|AG|SN|SR|FE)[A-Z0-9]{8}', type: record,
     title: Equipment serial number, example: MSK4Z3UMGF, see: "devices/#assets",
     text: "The serial number of a rack (RK), management switch (MS), InfiniBand leaf (IB), Ethernet switch (EN), console server (CS), OOB aggregation switch (AG), storage node (SN), storage rack (SR), or piece of facility equipment (FE), as the asset register holds it and, for switches and storage nodes, as SNMP entPhysicalSerialNum reports it."}
  - {key: SER-NV, label: "NV + 10 characters", pattern: 'NV[A-Z0-9]{10}', type: record, title: Storage node drive serial number, example: NVWJNT8QR85V, see: "telemetry/#storage-tickets",
     text: "An NVMe drive's serial number from a storage node's Redfish Drive resource. A swap shows as a new serial in the bay, and the pulled drive must reach the Security Partner under chain of custody (HO-5)."}
  - {key: EQ-PFS, label: "PFS-[hall]", pattern: 'PFS-[A-C]', type: equipment, title: Storage cluster, example: PFS-A, see: "telemetry/#storage",
     text: "A hall's parallel file system: 16 all-flash storage nodes in two storage racks, erasure coding 8+2, so it keeps serving with two nodes out."}
  - {key: SER-CT, label: "CT + 8 characters", pattern: 'CT[A-Z0-9]{8}', type: record, title: Compute tray serial number, example: CT3PQ9DACL,
     text: "A compute tray's serial number. A part swap must show the serial change in the BMC inventory."}
  - {key: SER-NS, label: "NS + 8 characters", pattern: 'NS[A-Z0-9]{8}', type: record, title: NVLink switch tray serial number, example: NS82PHK3SG,
     text: "An NVLink switch tray's serial number."}
  - {key: SER-PS, label: "PS or PU + 8 characters", pattern: 'P[SU][A-Z0-9]{8}', type: record, title: Power shelf or PSU serial number, example: PS2DWQG7M1,
     text: "A power shelf's (PS) or power supply's (PU) serial number."}
  - {key: SER-OP, label: "OP + 8 characters", pattern: 'OP[A-Z0-9]{8}', type: record, title: Optic serial number, example: OP3BY26V5W,
     text: "A network optic's serial number."}
  - {key: SER-FAC, label: "CHX-P##### or GVX-M#####", pattern: '(?:CHX-P|GVX-M)\d{5}', type: record, title: Facility part serial number, example: CHX-P24761,
     text: "The serial number of a replaced facility part: a CDU pump assembly (CHX-P) or a UPS power module (GVX-M)."}
  - {key: EHS-EX, label: "EHS-#", pattern: 'EHS-\d', type: safety, title: Worked safety example, example: EHS-1, pages: [agreements],
     text: "A numbered example event in an SLA's worked safety credit example (Appendix B)."}
  - {key: SHEET, label: "A-###, E-###, M-###, D-###", pattern: '[AEMD]-\d{3}', type: record, title: Site drawing sheet, example: A-101, pages: [site],
     text: "A sheet in the site drawing set: A for architectural plans, E for electrical, M for mechanical, D for equipment details (one representative sheet per product, typical of every unit of it)."}
  # --- Deployments (Deployments tab)
  - {key: DEP-GATE, label: "G#", pattern: 'G[0-3]', type: record, title: Deployment gate, example: G1, pages: [deployments, overview, weekly], see: "deployments/",
     text: "A gate in the Hall B rollout: G0 design and approvals, G1 hall readiness, G2 rack deployment, G3 closeout. A gate closes when every work order in it is complete."}
  - {key: DEP-STEP, label: "G#-##", pattern: 'G[0-3]-\d{2}', type: record, title: Deployment program step, example: G1-02, see: "deployments/",
     text: "A step of a gate, with its procedure, acceptance criteria, records, sign-off roles, and inspections (config/deployments.yaml)."}
  - {key: DEP-RSTEP, label: "R-M#", pattern: 'R-M[1-7]', type: record, title: Rack deployment step, example: R-M3, see: "deployments/#gate/G2",
     text: "A step done once per rack, following the IT Partner SLA's milestones M1 (received) to M7 (Validated Handoff)."}
  - {key: CX-L, label: "L1 to L5", pattern: 'L[1-5]', type: safety, title: Commissioning level, example: L4, pages: [deployments],
     text: "The commissioning levels: L1 factory witness test, L2 receipt inspection, L3 installation and start-up checks, L4 functional test of each system, L5 integrated systems test."}
  - {key: RDY-GATE, label: "R0 to R4", pattern: 'R[0-4]', type: record, title: Hall C readiness gate, example: R1, pages: [deployments], see: "deployments/#hallc",
     text: "A gate of the Customer's readiness for Hall C: R0 commissioning accepted, R1 spares and logistics, R2 security and access, R3 people and process, R4 first compute. Done when every item in it is done."}
  - {key: PO-C, label: "PO-C-####", pattern: 'PO-C-\d{4}', type: record, title: Pilot spares purchase order, example: PO-C-4101, pages: [deployments], see: "deployments/#hcspares",
     text: "A purchase order line for the Hall C pilot spares; each receipt names the order it delivers against."}
  - {key: RDY-ITEM, label: "R#-##", pattern: 'R[0-4]-\d{2}', type: record, title: Hall C readiness item, example: R1-02, pages: [deployments], see: "deployments/#hallc",
     text: "An item of the Customer's readiness for a new hall: R0 commissioning accepted, R1 spares and logistics, R2 security and access, R3 people and process, R4 first compute (config/readiness.yaml)."}
  - {key: RDY-EV, label: "RDY-C-R#-##", pattern: 'RDY-C-R[0-4]-\d{2}', type: record, title: Readiness evidence record, example: RDY-C-R1-02, pages: [deployments], see: "deployments/#hallc",
     text: "The record that closes a Hall C readiness item (a certificate, a test record, an approved list), numbered after the item it closes."}
  - {key: CX-SCRIPT, label: "CX-C-<system>-L#", pattern: 'CX-C-[A-Z0-9]+(?:-[A-Z0-9]+)*-L[1-5]', type: record, title: Commissioning script, example: CX-C-CDU-C1-L4, pages: [deployments], see: "deployments/#hallc",
     text: "The commissioning agent's test script for one Hall C system at one level, with its runs and its signatures by role, in order."}
  - {key: CXI, label: "CXI-C-###", pattern: 'CXI-C-\d{3}', type: record, title: Commissioning issue, example: CXI-C-001, pages: [deployments], see: "deployments/#cxissues/all,all",
     text: "An entry in the commissioning agent's issues log. Category 1 prevents the level from passing; Category 2 must be fixed before handoff; Category 3 is an observation."}
  - {key: DWO, label: "DWO-B-####", pattern: 'DWO-B-\d{4}', type: record, title: Deployment work order, example: DWO-B-0001, see: "deployments/#workorders",
     text: "One unit of deployment work (a program step, or a rack step for one rack) built from the partner's Jira issue or the Customer's record. Complete only when done, signed by every role, and every required inspection passed."}
  - {key: JIRA-DEP, label: "CCF-DEP-#, RSS-DEP-#", pattern: '(?:CCF|RSS)-DEP-\d+', type: record, title: Partner Jira issue, example: CCF-DEP-4,
     text: "An issue in a partner's own Jira project (CCF-DEP: Landlord; RSS-DEP: IT Partner), as its export shows it. A Jira Done is the partner's claim."}
  - {key: CUST-STEP, label: "CUST-G#-##", pattern: 'CUST-G[0-3]-\d{2}', type: record, title: Customer step record, example: CUST-G0-01,
     text: "The Customer's own record of a program step it performs (a decision or approval), kept outside the partners' Jira projects."}
  - {key: INSP-B, label: "INSP-B-###", pattern: 'INSP-B-\d{3}', type: record, title: Inspection record, example: INSP-B-001, see: "deployments/#inspections",
     text: "One inspection result (pass or fail) by an internal, third-party, or authority inspector, on a deployment step."}
  - {key: DEP-DOC, label: "DEP-B-XX-##", pattern: 'DEP-B-[A-Z]{2,4}(?:-[A-Z]{0,2}\d+)+', type: record, title: Deployment document, example: DEP-B-RK-01, see: "deployments/#docs",
     text: "A controlled document of the Hall B rollout (procedure, test script, or report template), one per step, with its revision."}
  - {key: AHJ-PERMIT, label: "AHJ-FM-XX", pattern: 'AHJ-FM-[A-Z]+(?:-\d{2}-\d{4})?', type: safety, title: Fire Marshal permit, example: AHJ-FM-CON, see: "deployments/#permits",
     text: "A permit from the authority having jurisdiction (AHJ), here the Williamson County Fire Marshal: construction (CON), fire alarm (FA), sprinkler (SPK), and the Certificate of Compliance (COC). With a number (AHJ-FM-CON-26-6930), the fictional permit issued."}
  - {key: TX-ITEM, label: "TX-XX", pattern: 'TX-(?:NEC|TABA|SB6)', type: safety, title: Texas statewide requirement, example: TX-NEC, see: "deployments/#statewide",
     text: "A statewide item the program records a determination for: the Texas electrical code edition (TX-NEC), the Architectural Barriers Act (TX-TABA), and large-load interconnection under SB 6 (TX-SB6)."}
  - {key: EQ-PG, label: "PG-[hall]#", pattern: 'PG-[A-C]\d', type: equipment, title: Power group, example: PG-B1,
     text: "A group of racks fed by one pair of A and B busways; the calculation sheet checks each group's load against its busway and UPS."}
  # --- Records that only mean something on one page
  - {key: PIR-A, label: "A# (post-incident review)", pattern: 'A\d', type: record, title: Post-incident review action, example: A3,
     pages: [pir, weekly], text: "An owned, dated action from the post-incident review, carried into the weekly pack until done."}
  - {key: PIR-F, label: "F# (post-incident review)", pattern: 'F\d', type: record, title: Post-incident review contributing factor, example: F5,
     pages: [pir, alarms], text: "A contributing factor the post-incident review found, such as an inadequate procedure or a missing alert."}
  - {key: WK-D, label: "D# (weekly review)", pattern: 'D\d', type: record, title: Weekly review decision, example: D1,
     pages: [weekly], text: "A decision recorded in the weekly operations review's meeting notes."}
  - {key: WK-Q, label: "Q# (weekly review)", pattern: 'Q\d', type: record, title: Weekly review ask, example: Q1,
     pages: [weekly], text: "An ask of one party from the weekly operations review, with a due date."}
  - {key: CREW, label: "D# or N# (shift crew)", pattern: '[DN]\d', type: record, title: Shift crew, example: D1,
     pages: [scorecards], text: "A rostered shift crew (D for day, N for night); the staffing check compares each crew's roster with badge-ins."}
  - {key: FP-P, label: "P# (failure pattern review)", pattern: 'P[1-9]', type: record, title: Failure pattern number, example: P2,
     pages: [patterns], text: "On the Failure Pattern Review, P1, P2, and P3 also number the patterns found. In the action tables, the Priority column uses the SLA priorities."}
  - {key: ONCALL, label: "E# (on-call role)", pattern: 'E\d', type: record, title: On-call role, example: E1,
     pages: [alarms], text: "An operations engineer's on-call role in the Customer's notification rota (E1 to E4)."}
  # --- Equipment tags (from the site model's naming)
  - {key: EQ-STG, label: "STG-[hall]#", pattern: 'STG-[A-C]\d', type: equipment, title: Storage rack, example: STG-A1, see: "telemetry/#storage",
     text: "One of a hall's two storage racks: eight all-flash storage nodes of the hall's storage cluster (PFS-A or PFS-B), 24 NVMe drives each."}
  - {key: EQ-CDU, label: "CDU-[hall]#", pattern: 'CDU-[A-C]\d', type: equipment, title: Coolant distribution unit, example: CDU-A3,
     text: "A CDU, named by hall and number: CDU-A3 is CDU 3 in Hall A. Each serves up to 8 racks; the Landlord owns it."}
  - {key: EQ-UPS, label: "UPS-[hall]#", pattern: 'UPS-[A-C]\d', type: equipment, title: UPS module, example: UPS-A1,
     text: "A hall UPS, named by hall and number. Hall A's four UPSs run distributed redundant (4 make 3)."}
  - {key: EQ-MUPS, label: "MUPS-[hall]#", pattern: 'MUPS-[A-C]\d', type: equipment, title: Mechanical UPS, example: MUPS-A1,
     text: "A UPS for a hall's mechanical loads (CDUs and pumps), named by hall and number."}
  - {key: EQ-USS, label: "USS-[hall]#", pattern: 'USS-[A-C]\d', type: equipment, title: Unit substation, example: USS-A3,
     text: "Steps 13.8 kV down to 480 V for a UPS, named by hall and number."}
  - {key: EQ-TX, label: "TX-#", pattern: 'TX-\d', type: equipment, title: Utility transformer, example: TX-1,
     text: "One of the two utility-owned 138 kV to 13.8 kV transformers."}
  - {key: EQ-GEN, label: "GEN-#", pattern: 'GEN-\d', type: equipment, title: Standby generator, example: GEN-3,
     text: "One of the 7 diesel standby generators (N+1) on the paralleling bus."}
  - {key: EQ-CH, label: "CH-##", pattern: 'CH-\d{2}', type: equipment, title: Chiller, example: CH-05,
     text: "One of the 11 air-cooled chillers (N+1) in the central plant."}
  - {key: EQ-TW, label: "TW-[hall]#", pattern: 'TW-[A-C]\d', type: equipment, title: Thermal wall, example: TW-B2,
     text: "A chilled-water fan wall that cools a hall's air, named by hall and number."}
  - {key: EQ-CRAH, label: "CRAH-[hall]#", pattern: 'CRAH-[A-C]\d', type: equipment, title: Electrical-room CRAH, example: CRAH-A1,
     text: "A chilled-water air handler in a hall's electrical room, named by hall and number."}
  - {key: EQ-FWP, label: "FWP-#", pattern: 'FWP-\d', type: equipment, title: Facility water pump, example: FWP-2,
     text: "One of the 3 variable-speed facility water pumps in the central plant: two run, one stands by."}
  - {key: FWLOOP, label: "FW-LOOP", pattern: 'FW-LOOP', type: data_source, title: Facility water loop readings, example: FW-LOOP, see: "telemetry/#FW-LOOP",
     text: "The Telemetry tab's view of the central plant's supply and return headers (BMS plant objects): their temperatures, flow, and differential pressure."}
  - {key: EQ-VESDA, label: "VESDA-[hall]#", pattern: 'VESDA-[A-C]\d', type: equipment, title: Smoke detector, example: VESDA-B1,
     text: "An aspirating smoke detector in a hall, named by hall and number."}
  - {key: EQ-BW, label: "BW-[hall]-R#-PG-[hall]#-[side]", pattern: 'BW-[A-C]-R\d-PG-[A-C]\d-[AB]', type: equipment, title: Busway segment, example: BW-A-R1-PG-A2-A,
     text: "Overhead busway feeding a row of racks. BW-A-R1-PG-A2-A is Hall A, row 1, power group A2, A side. Each rack takes power from an A and a B busway through tap-offs."}
  - {key: EQ-TO, label: "TO-[rack]-[side]", pattern: 'TO-[A-C]\d{2}(?:-[AB])?', type: equipment, title: Busway tap-off, example: TO-A07-B,
     text: "The breaker box that takes power from the busway to one rack: TO-A07-B is rack A07's B-side tap-off. Its output terminals are the power demarcation (DM-PWR)."}
  - {key: EQ-LEAK, label: "C# (leak circuit)", pattern: 'C\d{1,2}', type: equipment, title: Leak detection circuit, example: C8,
     text: "A sensing cable circuit on a leak detection module: TTDM-A/C8 is circuit 8 on Hall A's module."}
  # Devices written in lower case or with a word (src/scorecard/glossary.py DEVICE_NAME finds them). The popup adds
  # the device's own description and connections from docs/site/devices.json.
  - {key: EQ-RACK, label: "Rack [hall]##", pattern: '[Rr]ack [A-C]\d{2}', type: equipment, title: Rack, example: Rack A07,
     text: "One NVL72 rack: 18 compute trays, 9 NVLink switch trays, and 8 power shelves, fed by an A and a B tap-off. Rack A07 is Hall A, rack 7 (row 1, position 7)."}
  - {key: EQ-CT, label: "[rack]-ct##", pattern: '[a-c]\d{2}-ct\d{2}', type: equipment, title: Compute tray, example: a13-ct18,
     text: "A compute tray by its host name: a13-ct18 is compute tray 18 in rack A13. Each tray has 4 GPUs and one InfiniBand NIC per rail (mlx5_0 to mlx5_3)."}
  - {key: EQ-NVSW, label: "[rack]-nvsw#", pattern: '[a-c]\d{2}-nvsw\d', type: equipment, title: NVLink switch tray, example: a15-nvsw3,
     text: "An NVLink switch tray by its name: a15-nvsw3 is switch tray 3 of 9 in rack A15. Together the 9 trays join the rack's 72 GPUs into one NVLink domain."}
  - {key: EQ-PSHELF, label: "[rack]_PowerShelf_#", pattern: '[A-C]\d{2}_PowerShelf_\d', type: equipment, title: Power shelf, example: A06_PowerShelf_1,
     text: "A rack power shelf by its Redfish name: A06_PowerShelf_1 is shelf 1 of 8 in rack A06. Shelves turn the rack's AC feeds into DC for the busbar."}
  - {key: EQ-MGMT, label: "[rack]-mgmt#", pattern: '[a-c]\d{2}-mgmt[12]', type: equipment, title: Rack management switch, example: a07-mgmt1,
     text: "One of a rack's two 1 GbE management switches: a07-mgmt1 is rack A07's out-of-band switch (every BMC and power shelf controller in the rack), a07-mgmt2 its in-band switch (the NVLink switch trays' eth0 and the trays' host management ports)."}
  - {key: EQ-AGG, label: "oob-agg-[hall]#", pattern: 'oob-agg-[a-c]\d', type: equipment, title: Management aggregation switch, example: oob-agg-a1,
     text: "Half of a hall's management aggregation pair: every rack management switch has one uplink to each, so the hall keeps its management network with one down."}
  - {key: EQ-CON, label: "con-[hall]#", pattern: 'con-[a-c]\d', type: equipment, title: Console server, example: con-a1,
     text: "A row's serial console server: con-a1 is Hall A row 1. It reaches every management and leaf switch console in the row, and its session log records each session."}
  - {key: EQ-LEAF, label: "leaf-[hall]##-r# port ##", pattern: 'leaf-[a-c]\d{2}-r\d(?: port \d{1,3}|:swp\d{1,3})?', type: equipment,
     title: InfiniBand leaf switch, example: leaf-a07-r1 port 18,
     text: "A leaf switch of the rail-optimized InfiniBand fabric, and optionally one port: leaf-a07-r1 is leaf 7 of Hall A on rail 1. Leaf numbers count rack pairs (leaf 7 serves racks A13 and A14): ports 1 to 18 go to the first rack's trays, 19 to 36 to the second's. UFM writes a port as leaf-a07-r1:swp18."}

plain:   # capitalised text that is not a code
  words:
    - {terms: [DO, NOT, EDIT, BY, HAND, FILE, GENERATED], why: "The generated-file banner at the top of each contract."}
    - {terms: [MOCK, ILLUSTRATIVE], why: "The contracts' status banner: fictional and illustrative."}
    - {terms: [ONLY, OK, LIVE], why: "Words set in capitals for emphasis or as a status label."}
    - {terms: [YYYY-MM-DD], why: "A date format shown as a placeholder."}
    - {terms: [FAQ, EAB], why: "Words inside a source's web address on the Deployments tab."}
    - {terms: [MB, GB, TB, PB, EB], why: "Units of data size: megabytes, gigabytes, terabytes, petabytes, and exabytes."}
    - {terms: [FAN], why: "The sensor class a switch fan reports under in ENTITY-SENSOR-MIB (the field reference names it beside the reading)."}
    - {terms: [GET], why: "The HTTP method a Redfish client uses to read a resource."}
    - {terms: [HELP, TYPE], why: "Keywords of the Prometheus text format: each field's description and its metric type (gauge or counter)."}
    - {terms: [ALARM, LOADED, LOADING, MTN, "OFF", "ON", STARTING, UNLOADED, UNLOADING], why: "Values of the V1C compressor status, set in capitals as Vertiv's points list writes them (MTN: maintenance)."}
    - {terms: [STRING, INTEGER], why: "SNMP value types, as a client prints a reading (IF-MIB::ifName.5 = STRING: swp5)."}
    - {terms: ["TRUE"], why: "A BACnet boolean value, as a client prints Event_Algorithm_Inhibit."}
    - {terms: [TR], why: "Part of a published iCOM unit status name (TR standby), quoted as Vertiv writes it."}
    - {terms: [NVLINK, RLW, NETIR], why: "Words inside NVIDIA's XID names (NVLINK: RLW Error, NVLINK: NETIR Error); the XID code's popup explains the error."}
  patterns:
    - {pattern: '[A-C]-?\d{2}', why: "A rack position (A07 is Hall A, rack 7); the site drawings show where each is."}
    - {pattern: 'BAS-PTS007C(-EN_\d+)?', why: "A Trane document number cited as a source for BACnet point lists.", pages: [telemetry]}
    - {pattern: '[A-Z0-9-]+_\d{8}T\d{4}', why: "The file name of a one-minute window around an event (device and start time).", pages: [telemetry]}
    - {pattern: 'BW-[A-C]-R\d-PG-[A-C]\d', why: "A busway run: its A and B segments together.", pages: [telemetry]}
    - {pattern: 'R[1-4]', why: "A row number in a busway name (BW-A-R1-... is row 1).", pages: [telemetry]}
    - {pattern: 'FA\d{6}', why: "A Schneider Electric FAQ number cited as a source.", pages: [telemetry]}
    - {pattern: '(ASIC|FAN|PSU)\d(/\d)?', why: "A component name in a gNMI path (openconfig-platform names the parts of the switch).", pages: [telemetry]}
    - {pattern: 'IB1', why: "The first part of an MLNX-OS port name (IB1/9/2 is ASIC 1, cage 9, port 2).", pages: [telemetry]}
    - {pattern: 'SITE', why: "The whole site, in the power events table (a utility event is not one device's).", pages: [telemetry]}
    - {pattern: 'L-N', why: "Line to neutral: a voltage measured between one phase and neutral (277 V on a 480 V system).", pages: [telemetry]}
    - {pattern: 'A1', why: "ASHRAE class A1 (an air-cooled equipment class), named with its envelope on the Site health page.", pages: [telemetry]}
    - {pattern: 'E1', why: "Part of E1.S, a solid-state drive form factor.", pages: [agreements, availability]}
    - {pattern: 'MVS-C[12]|ESS-C|DCB-C-[AB]|LD-C|BMS-C|HALL-C', why: "A Hall C system in the readiness tracker (planned hall, not yet in the device directory); its page lists its commissioning.", pages: [deployments]}
    - {pattern: 'A[1-4]', why: "Shorthand for CDU-A1 to CDU-A4 in the site model's cooling path.", pages: [site]}
    - {pattern: 'B[1-4]', why: "Shorthand for CDU-B1 to CDU-B4 in a deployment step.", pages: [deployments]}
