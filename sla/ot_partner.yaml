      - DS-CMMS
      - DS-CAB
  - id: OT-KM-08
    name: Corrective Action Plans Closed On Time
    unit: '%'
    direction: higher_is_better
    target: 95.0
    data_sources:
      - DS-CMMS

rts_validation:
  principle: Facility equipment is returned to service only when its redundancy is restored and proven, not when
    an alarm clears.
  classes:
    - component: Electrical distribution (busway, tap-off, breaker)
      check_ids:
        - busway_in_tolerance
        - ir_scan
      checks:
        - Critical Power Monitor shows both feeds in tolerance for every rack on the segment.
        - Infrared scan of the repaired connection under load.
    - component: UPS module
      check_ids:
        - ups_normal_mode
        - redundancy_restored
      checks:
        - UPS in normal (double-conversion) mode with all modules healthy.
        - Redundancy confirmed from the NMC, not from the work order.
    - component: Generator
      check_ids:
        - gen_loaded_run
      checks:
        - EMCP records a start and a run at 30% of nameplate or more for 30 minutes.
    - component: CDU component (pump, filter, sensor)
      check_ids:
        - cdu_flow_baseline
        - pump_failover_test
      checks:
        - Flow, supply temperature, and return temperature within baseline.
        - Pump redundancy confirmed by failover test; leak alarms clear; coolant conductivity and pH within specification
          after any fluid work.
    - component: Chiller, pump, or air handler
      check_ids:
        - unit_in_service
        - plant_redundancy
      checks:
        - Unit running in auto with no active alarms.
        - Plant or hall redundancy restored at current load.
    - component: Leak detection zone
      check_ids:
        - leak_hold_30m
        - cable_continuity
      checks:
        - 30-minute hold with no leak alarm.
        - Cable continuity and circuit healthy on the TTDM-128.
    - component: Fire protection system
      check_ids:
        - fire_test
        - impairment_closed
      checks:
        - Function test under NFPA 72 or NFPA 25 passed.
        - Impairment closed with the Customer notified.

maintenance:
  principle: A maintenance task counts as done only when telemetry or badge records confirm it.
  schedule:
    - system: Generators
      task: Monthly loaded exercise
      requirement: At least 30% of nameplate kW for 30 minutes (NFPA 110), recorded by the EMCP.
      frequency: Monthly
    - system: Generators
      task: Supplemental load bank
      requirement: 50% of nameplate for 30 minutes then 75% for 60 minutes when monthly tests did not reach 30%.
      frequency: Annual
    - system: Generators
      task: Endurance test
      requirement: 4 continuous hours under load (NFPA 110, Level 1).
      frequency: Every 36 months
    - system: Generators
      task: Fuel quality test
      requirement: Sampled and tested; results on file.
      frequency: Annual
    - system: UPS and batteries
      task: Preventive maintenance and battery health check
      requirement: Manufacturer schedule and NFPA 70B.
      frequency: Semiannual
    - system: Switchgear and busway
      task: Infrared thermography under load
      requirement: NFPA 70B.
      frequency: Annual
    - system: CDUs
      task: Filter change and coolant sample
      requirement: Manufacturer schedule; conductivity, pH, and inhibitor within specification.
      frequency: Quarterly
    - system: Chillers
      task: Preventive maintenance
      requirement: Manufacturer schedule; refrigerant work by EPA 608 certified technicians.
      frequency: Quarterly
    - system: Fire protection
      task: Inspection and testing
      requirement: NFPA 72 and NFPA 25 intervals; VESDA per manufacturer.
      frequency: Per code

chronic_failure:
  triggers:
    - id: CF-1
      rule: A Minimum Service Level Default on the same CSL in 3 consecutive Measurement Periods.
    - id: CF-2
      rule: A Minimum Service Level Default on the same CSL in any 4 of 6 rolling Measurement Periods.
    - id: CF-3
      rule: Total Service Level Credits over 50% of the cumulative At-Risk Amount in any rolling 6 Measurement Periods.
    - id: CF-4
      rule: Any confirmed deliberate falsification of records.
  customer_rights:
    - Terminate the affected services or the entire Site scope for cause, without termination charges.
    - Require a Supplier executive-sponsored recovery plan within 10 business days.
    - 'Step-in: the Customer or a third party may perform the affected services at the Supplier''s cost during recovery.'
  termination_assistance: The Supplier provides up to 6 months of transition assistance at the then-current service
    levels, including full transfer of performance data, procedures, and spares records to the successor.

staffing:
  coverage: 24x7x365 on site
  committed_per_shift:
    - shift: Day (07:00 to 19:00 local)
      technicians: 3
      shift_leads: 1
    - shift: Night (19:00 to 07:00 local)
      technicians: 2
      shift_leads: 1
  key_personnel:
    - Chief engineer (named; replacement requires 30 days notice and Customer consultation)
    - EHS coordinator
  required_qualifications:
    - NFPA 70E qualified person for the electrical tasks performed
    - Manufacturer training for Galaxy UPS, CHx2000 CDUs, and Cat EMCP 4.4
    - EPA Section 608 certification for refrigerant work
    - Lockout/tagout and group lockout
    - Customer site security and escort procedures
  qualification_rule: Only badge-verified hours by engineers with current qualifications count toward OT-CSL-09.

spares:
  ownership: Spares are Landlord-owned and Landlord-managed.
  minimum_stock_per_hall:
    - fru: UPS power module
      minimum: 1
    - fru: CDU pump assembly
      minimum: 1
    - fru: CDU filter set
      minimum: 4
    - fru: Busway tap-off unit
      minimum: 2
    - fru: Thermal-wall fan assembly
      minimum: 1
    - fru: VFD
      minimum: 1
  reorder_rule: Replenished within 10 business days of use.
  cycle_count: Quarterly, reported to the Customer.

change_management:
  landlord: Changes to critical power, cooling, or fire systems require an approved MOP, notice under the Interface
    Agreement, and a Customer-approved window when redundancy is reduced.

breach_severity:
  finding_types:
    - id: gen_test_no_load
      name: Generator test reported without load
      base_level: S2
      aggravators:
        - AGG-INTEGRITY
      sla_refs:
        - OT-CSL-06
        - OT-KM-02
        - OT-CSL-08
      action: Recount the test as not done. Confirm EMCP data for every generator test in the period and schedule
        a compliant test.
    - id: pm_without_evidence
      name: Maintenance closed without evidence
      base_level: S2
      aggravators:
        - AGG-INTEGRITY
      sla_refs:
        - OT-CSL-06
        - OT-CSL-08
      action: Reopen the task. Audit the engineer's other closures in the period against badge and device records.
    - id: bms_override_unrecorded
      name: BMS override or alarm inhibit without a change record
      base_level: S1
      aggravators:
        - AGG-INTEGRITY
      sla_refs:
        - OT-CSL-07
        - OT-KM-05
      action: Release the override or inhibit, or record it under an approved change with an expiry. Review alarm
        suppression controls.
    - id: alarm_acked_no_dispatch
      name: Alarm acknowledged but never dispatched
      base_level: S2
      aggravators: []
      sla_refs:
        - OT-CSL-04
        - OT-CSL-05
      action: Recalculate response from badge evidence. Review the acknowledgment workflow so an acknowledgment
        cannot stand in for a response.
    - id: landlord_clock_shift
      name: Work order restored before the telemetry
      base_level: S2
      aggravators:
        - AGG-INTEGRITY
      sla_refs:
        - OT-CSL-05
        - OT-CSL-08
      action: Recalculate restoration from the device telemetry. Confirm work orders take their restore time from the
        telemetry, not from the engineer's entry.
    - id: attribution_contradicted
      name: Fault attributed to another party against the telemetry
      base_level: S1
      aggravators:
        - AGG-INTEGRITY
      sla_refs:
        - OT-CSL-01
        - OT-CSL-02
        - OT-CSL-08
      action: Apply the Interface Agreement attribution rules from the Telemetry of Record and correct the work order. Review
        with both parties at the monthly service review.
    - id: critical_work_no_mop
      name: Critical work without an approved MOP
      base_level: S1
      aggravators: []
      sla_refs:
        - OT-CSL-07
      action: Stop similar work until MOP control is confirmed. Joint review with the Customer change board.
