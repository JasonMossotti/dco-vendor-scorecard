# =============================================================================
# Interface Agreement: Site AUS-1 (SLA as Code)
# -----------------------------------------------------------------------------
# The multi-party agreement that joins the Lease (Landlord SLA) and the IT
# Partner SLA: where each party's equipment ends, who owns each component,
# how an outage is attributed to one party, how the parties run incidents
# together, and the Customer's negotiated right to read facility telemetry.
# Party names come from common.yaml. The document docs/sla/INTERFACE_AGREEMENT.md
# is GENERATED from this file; the ownership matrix also prints as an exhibit
# in each partner SLA.
#
# MOCK DOCUMENT FOR PORTFOLIO DEMONSTRATION ONLY. All parties, sites, figures,
# and commercial terms are fictional and illustrative. Not legal advice.
# =============================================================================

document:
  id: "IA-AUS1-001"
  title: "Interface Agreement: Site AUS-1"
  subtitle: "Joined to the Data Center Lease (Schedule C) and the IT Partner Services Agreement (Schedule B)"
  version: "1.0.0"
  effective_date: "2026-10-05"
  status: "MOCK / ILLUSTRATIVE"
  disclaimer: >-
    This is a fictional, illustrative interface agreement created for a
    portfolio demonstration. All parties, sites, and terms are invented. It is
    not legal advice and is not derived from any real organization's internal
    documents or contracts.

parties: ["customer", "landlord", "it_partner", "oem", "utility"]

principles:
  - "Every component has exactly one Accountable party."
  - "Boundaries are physical points a technician can see and touch, so ownership is never a matter of opinion."
  - "Outages are attributed from the Customer's Telemetry of Record by walking the site's power and cooling paths, never from ticket text alone."
  - "No party's SLA clock runs for time another party's fault is active, and no outage goes unowned."
  - "The common terms, including EHS, bind every party working at the Site."

demarcations:
  - id: "DM-PWR"
    system: "Power"
    boundary: "Output terminals of the busway tap-off unit."
    upstream: "landlord"
    downstream: "it_partner"
    evidence: "Busway Critical Power Monitor at the segment (Landlord side); rack power shelf input via Redfish (IT side)."
  - id: "DM-COOL"
    system: "Liquid cooling"
    boundary: "Rack manifold isolation valves (supply and return)."
    upstream: "landlord"
    downstream: "it_partner"
    evidence: "CDU secondary supply temperature, flow, and pressure via Redfish (Landlord side); tray and manifold leak sensors via the rack BMC (IT side)."
  - id: "DM-AIR"
    system: "Air cooling"
    boundary: "Cold aisle supply air at the rack face."
    upstream: "landlord"
    downstream: "it_partner"
    evidence: "Cold-aisle temperature sensors in the BMS; rack inlet temperatures via Redfish."
  - id: "DM-UTIL"
    system: "Utility service"
    boundary: "13.8 kV main breakers in the Landlord's switchgear."
    upstream: "utility"
    downstream: "landlord"
    evidence: "Utility revenue metering; main breaker status in the EPMS."
  - id: "DM-NET"
    system: "Network"
    boundary: "Meet-me room cross-connect panel."
    upstream: "landlord"
    downstream: "it_partner"
    evidence: "Cross-connect records; optical power at the IT side of the panel."
  - id: "DM-MON"
    system: "Monitoring"
    boundary: "The read-only interfaces listed under Customer data access."
    upstream: "landlord"
    downstream: "customer"
    evidence: "Feed availability measured by the Customer collector (OT-KM-06)."

