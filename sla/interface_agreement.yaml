fault_attribution:
  principle: >-
    When the Telemetry of Record shows rack capacity lost, the Customer walks
    that rack's power and cooling paths in the site model (site/site.yaml) as
    of T0. The first unhealthy component, starting from the source, decides
    which party owns the outage.
  rules:
    - id: "FA-1"
      rule: "If every feed of the rack was out of tolerance at the tap-off at or before T0, or the CDU secondary supply at the rack was out of band, the outage is Landlord-attributed from T0."
    - id: "FA-2"
      rule: "If the Landlord side was healthy at T0, the outage is IT Partner-attributed and runs under the IT Partner SLA."
    - id: "FA-3"
      rule: "When a Landlord-attributed outage ends (Landlord restoration declared and confirmed by telemetry), the IT Partner's clock starts at that handoff time, for validating the rack's return to service. The IT Partner is never measured for the Landlord's minutes."
    - id: "FA-4"
      rule: "If one party's action caused another party's equipment to fail (for example, an IT Partner whip fault tripping a tap-off breaker), the outage is attributed to the party whose action caused it, as found by the joint post-incident review."
    - id: "FA-5"
      rule: "Loss of one feed or of N+1 cooling with no capacity lost is a Landlord redundancy event (OT-CSL-02, OT-CSL-05) and does not stop or start any IT Partner clock."
    - id: "FA-6"
      rule: "Utility outages are Utility-attributed; the Landlord is measured on carrying the load (transfer, generators, and UPS) and is attributed any capacity lost during a utility event."
  disputes: "The Customer determines attribution from the Telemetry of Record within 2 business days. A party may appeal to the monthly service review with evidence; attribution is never decided from ticket or work order text alone."

incident_command:
  commander: "The Customer is Incident Commander for any P1 under any partner SLA and for any event involving more than one party."
  roles:
    - "Landlord lead: facility status, isolation, and restoration."
    - "IT Partner lead: rack protection, controlled shutdowns, and return-to-service validation."
    - "Security Partner lead: guard posts, door control, escorts, and chain of custody for any media involved."
    - "Customer Incident Commander: priorities, decisions, and all communications to Customer leadership."
  bridge: "A joint bridge opens within 15 minutes of a multi-party P1. Each lead updates the Incident Commander at the strictest of the involved partners' SLA update cadences."
  post_incident: "A joint post-incident review within 5 business days produces one timeline from the Telemetry of Record, the attribution decision, and actions tracked in each party's corrective action process."

handoffs:
  - id: "HO-1"
    name: "Facility restored to IT validation"
    rule: "The Landlord declares restoration in the joint bridge; the Customer confirms it from telemetry (feeds in tolerance, cooling in band); the IT Partner then validates each affected rack."
  - id: "HO-2"
    name: "De-energizing a tap-off for rack work"
    rule: "The IT Partner requests it under an approved change; the Landlord isolates under group lockout with both parties' locks applied (EHS-R2)."
  - id: "HO-3"
    name: "Leak at a rack"
    rule: "The IT Partner isolates at the rack manifold valves; the Landlord isolates at the header if the leak is upstream of the valves; both follow the spill procedure (EHS-R5)."
  - id: "HO-4"
    name: "New rack energization"
    rule: "The Landlord energizes the tap-off and opens the isolation valves only after the IT Partner confirms the rack is set, leak-tested, and ready; the time is recorded as the deployment milestone handoff."
  - id: "HO-5"
    name: "Storage media from a failed part"
    rule: "The IT Partner removes every drive from a failed part in the rack area and hands the drives to the Security Partner under chain of custody, by serial number; the Security Partner destroys them on site and certifies each serial before the part may ship."

change_coordination:
  - "Any change touching a demarcation point needs a joint method of procedure approved by the Customer and both parties."
  - "Landlord work that reduces redundancy is notified at least 10 business days ahead and done in a Customer-approved window; emergency work is notified as soon as it is known and at least 1 hour ahead where possible."
  - "Group lockout under EHS-R2 for any multi-party work."
  - "BMS point overrides and alarm inhibits carry a change reference and an expiry, and are visible to the Customer in real time."

alarm_notification:
  principle: >-
    Planned work causes alarms the parties can predict. Each change therefore
    declares the alarms it expects, and anything else that happens on the
    equipment it touches reaches the Customer at once, automatically, from the
    party doing the work. The Customer runs its own check on the same feeds so
    that it never depends on a party's notification alone.
  impact_declaration:
    - "Every change record, method of procedure, and planned work order (other than routine preventive maintenance with no expected alarm) declares its impact in the Customer's schema before approval: the assets touched, the alarms each asset is expected to raise, the worst severity the work may cause, whether redundancy is reduced, and the window."
    - "A change without a declaration is not approved. A declaration is part of the approved change: work outside it is outside the approval (common terms, change management)."
    - "An alarm counts as expected only on a declared asset, with a declared alarm, at or below the declared severity, inside the window plus 15 minutes either side."
  out_of_scope:
    - "Out of scope: during a window, an alarm on a declared asset that the declaration did not list or that exceeds the declared severity, or an alarm on equipment connected to a declared asset (the same load, a redundant partner, or the load it serves, from the site model) of a kind the work could cause."
    - "Out of window: a declared alarm raised before the window opens, or a declared asset still in its maintenance state 15 minutes after the window closes."
    - "An out-of-scope or out-of-window alarm means the records do not reconcile with the approved change; it is not by itself a finding against anyone."
  notifications:
    - id: "NT-1"
      trigger: "Critical alarm (P1 under any partner SLA) not expected under a declared change"
      within_min: 5
      channels: "Page to the Customer Incident Commander plus email or SMS"
      channels_min: 2
      page: true
      owed_by: "The party that owns the equipment"
    - id: "NT-2"
      trigger: "Major alarm (P2) not expected under a declared change"
      within_min: 15
      channels: "Two of email, SMS, and the Customer alarm feed"
      channels_min: 2
      page: false
      owed_by: "The party that owns the equipment"
    - id: "NT-3"
      trigger: "Any out-of-scope or out-of-window alarm on change work"
      within_min: 5
      channels: "Two of email, SMS, and the Customer alarm feed; a page as well if the alarm is critical"
      channels_min: 2
      page: false
      owed_by: "The party doing the change, whoever owns the equipment"
  rules:
    - "Notifications are sent by each party's monitoring system without a person deciding whether to send. A call from a duty manager does not count toward the two channels."
    - "Each notification carries the alarm, device, location, severity, the change it relates to, and the party's ticket or work order."
    - "Each party keeps a delivery log (alarm, channel, recipient, sent, delivered) and gives the Customer read access to it, with the alarm feeds under section 9."
    - "Whether a notification was owed is decided from the Customer's Telemetry of Record and the declarations, not from the party's own classification."
  customer_backstop: >-
    The Customer's alarm board reads both parties' feeds, classifies every alarm
    against the declared changes, and alerts the Customer's on-call directly. A
    missed or late party notification is still counted against that party.
  key_measures:
    - id: "IA-KM-01"
      party: "Landlord"
      name: "Change-aware notifications on time (NT-1 to NT-3)"
      unit: "%"
      direction: "higher_is_better"
      target: 99.0
      data_sources: "Customer alarm board; Landlord delivery log"
    - id: "IA-KM-02"
      party: "IT Partner"
      name: "Change-aware notifications on time (NT-1 to NT-3)"
      unit: "%"
      direction: "higher_is_better"
      target: 99.0
      data_sources: "Customer alarm board; IT Partner delivery log"
  measurement_note: >-
    Key measures report and trigger corrective action; they carry no service
    credit. Moving them to credit-bearing service levels is a later negotiation
    once both delivery logs have proved reliable.

data_access:
  principle: >-
    The Customer's right to read facility telemetry is a negotiated term of the
    Lease, not a courtesy. Without it, the Landlord SLA would be measured by the
    Landlord.
  rights:
    - "Read-only access to: UPS network management cards (SNMPv3), busway Critical Power Monitors (Modbus TCP), generator controllers (EMCP 4.4, Modbus TCP), CDU controllers (Redfish), and leak detection controllers (Modbus via gateway)."
    - "A real-time export of BMS and EPMS alarms, acknowledgments, point overrides, and alarm inhibits, and one-minute trend data for the points that measure the Landlord SLA."
    - "Read-only access is enforced at each device (no write credentials are issued) over a segmented monitoring network the Landlord approves."
    - "The Landlord may not disable, filter, or delay the feeds. A feed outage over 15 minutes is a Landlord P2 and counts against OT-KM-06."
    - "The Landlord keeps 13 months of BMS and EPMS history and provides it within 5 business days of a request."
    - "All systems are NTP-synchronized; clock skew over 5 seconds is flagged under the common measurement terms."
    - "The Customer uses the data only to measure the SLAs, attribute outages, and protect safety, and shares it with the IT Partner only as needed for attribution."

asset_register:
  principle: >-
    One register follows every asset at the site by serial, from receipt to install, RMA, and disposal. A quantity count
    shows how many parts are on the shelf; only the serials show which, and only the devices' own answers show what is
    really installed.
  rules:
    - id: "REG-1"
      name: "One register"
      rule: "The Customer's asset register holds every asset at the site by serial: installed devices and their field-replaceable parts, spares, parts removed for RMA, and storage media removed from service. Each party records the assets it maintains: the IT Partner its IT equipment and the spares cage, the Landlord its facility equipment, and the Security Partner the media in its custody."
    - id: "REG-2"
      name: "Record every move within 4 hours"
      rule: "Every receipt, install, removal, RMA shipment, custody handover, destruction, and disposal is recorded by serial within 4 hours of the work, citing the ticket, work order, RMA, milestone, or certificate."
    - id: "REG-3"
      name: "Receive deliveries within 24 hours"
      rule: "A delivery signed for at the dock (carrier proof of delivery) is received into the register and the spares ledger within 24 hours."
    - id: "REG-4"
      name: "Daily reconciliation"
      rule: "The Customer reconciles the register every day against the serials the devices report (Redfish SerialNumber; SNMP entPhysicalSerialNum), the spares ledger, RMA shipments, the OEM's RMA portal, custody handovers, and destruction and disposal certificates. A device that does not answer is a gap in evidence, not a finding."
    - id: "REG-5"
      name: "Disposal by serial"
      rule: "A disposal certificate names the serial of every asset it covers and is witnessed by the Security Partner. A disposed serial that answers on any network is an asset whose disposal is unconfirmed: the party that disposed of it and the Security Partner trace it the same day."
    - id: "REG-6"
      name: "Serial-level cycle counts"
      rule: "The monthly full count of the spares cage checks serials, not only quantities, so a removed part returned to the shelf in place of a good one is found."

fire_impairments:
  principle: >-
    The Landlord owns fire protection; the Customer's halls depend on it. An impairment is any time all or part of
    a fire alarm, detection, or suppression system is out of service, planned or not (NFPA 25, 2026 edition,
    chapter 15; NFPA 72, 2025 edition; NFPA 2001, 2025 edition for clean agent). The fire panel's history log
    records when protection was out; the Landlord's impairment log says why and who. A trouble on one detector
    while adjacent detection keeps coverage is not an impairment.
  rules:
    - id: "FPI-1"
      name: "Notice before planned work"
      rule: "A planned impairment is notified to the Customer at least 24 hours before it begins, naming the points to be disabled, the window, and the method of procedure where one applies."
    - id: "FPI-2"
      name: "Unplanned impairment"
      rule: "An unplanned impairment is notified to the Customer within 15 minutes of discovery and handled as a P1 under OT-FC-FIRE."
    - id: "FPI-3"
      name: "Fire watch"
      rule: "When an impairment lasts more than 4 hours, a fire watch patrols the affected area from no later than the fourth hour until restoration, logged with its start and end. Where the authority having jurisdiction sets a stricter threshold, that threshold applies."
    - id: "FPI-4"
      name: "Restore within the window, or extend with notice"
      rule: "A planned impairment is restored by the end of its window, or an extension naming the new end time is notified to the Customer before the window ends."
    - id: "FPI-5"
      name: "Restoration is what the panel shows"
      rule: "An impairment is restored when the fire panel shows every disabled point enabled and every supervisory signal on it cleared. The Landlord's impairment log records that time within 15 minutes and notifies the Customer within 30 minutes."
    - id: "FPI-6"
      name: "Log every impairment"
      rule: "A disabled point or a supervisory signal on a suppression valve or release circuit that lasts more than 30 minutes is an impairment and goes on the log. The Customer reconciles the log with the panel's history every day."
