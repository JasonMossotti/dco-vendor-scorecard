# =============================================================================
# Common terms: shared by every partner SLA at Site AUS-1 (SLA as Code)
# -----------------------------------------------------------------------------
# Terms in this file apply to every partner contract at the site: the
# Customer, the site profile, Telemetry of Record measurement principles,
# excused events, corrective action, governance cadence, security, EHS, SLA
# change control, and the internal breach severity framework.
#
# Partner files (e.g. it_partner.yaml) declare `extends: common.yaml`. A
# partner file may ADD terms but may never override a term set here: the
# loader rejects any key set in both files, so no partner contract can
# quietly weaken a site-wide standard.
#
# MOCK DOCUMENT FOR PORTFOLIO DEMONSTRATION ONLY. All parties, sites, figures,
# and commercial terms are fictional and illustrative. Not legal advice. Not
# based on any real company's internal information or agreements.
# =============================================================================

schema_version: "1.0"
common_version: "1.2.0"

parties:
  customer:
    name: "Customer"
    description: "An AI compute operator that leases the data halls and owns the IT equipment and spares at the Site."
    role: "Owns site outcomes; directs the IT partner; operates the Telemetry of Record; holds the Landlord to its SLA."
  landlord:
    name: "Caprock Critical Facilities, LLC"
    fictional: true
    description: "Wholesale data center owner-operator. Owns and operates the building, power (utility interface through busway tap-offs), cooling (chillers through CDUs and the secondary header), fire protection, and building monitoring."
    role: "Separate lease and Landlord SLA (Schedule C). Bound by the common terms, including EHS."
  it_partner:
    name: "Ridgeline Site Services, LLC"
    fictional: true
    description: "Strategic site operations partner performing day-to-day data hall IT work."
    role: "Separate services agreement and IT Partner SLA (Schedule B)."
  utility:
    name: "Serving utility (ERCOT region)"
    description: "Owns the 138 kV substation and transformers; delivers power at 13.8 kV to the Landlord."
    role: "Contracts with the Landlord. Named here only to define ownership boundaries."
  oem:
    name: "OEM / System Integrator"
    description: "Hardware manufacturer and integrator providing warranty, RMA, and field diagnostics."
    role: "Separate contract. Named here only to define ownership boundaries."

site:
  id: "AUS-1"
  name: "Site AUS-1 (fictional)"
  platform: "NVIDIA GB200 NVL72 (rack-scale, direct-to-chip liquid cooled)"
  halls:
    - id: "HALL-A"
      state: "production"
      racks: 32
    - id: "HALL-B"
      state: "deployment"
      racks: 32
  per_rack:
    gpus: 72
    grace_cpus: 36
    compute_trays: 18
    gpus_per_compute_tray: 4
    nvlink_switch_trays: 9
    power_shelves: 8
    nominal_power_kw: 120
  cooling:
    cdu_type: "CoolIT CHx2000 row-based liquid-to-liquid CDU"
    cdu_capacity_mw: 2.0
    racks_per_cdu: 8
    cdus_total: 8
  service_units:
    - id: "SU-TRAY"
      name: "Compute tray"
      gpus: 4
      note: "Smallest GPU field-replaceable service unit."
    - id: "SU-SWITCH"
      name: "NVLink switch tray"
      gpus: 72
      note: "Treated as a rack-wide event until degraded operation is proven safe."
    - id: "SU-RACK"
      name: "NVL72 rack"
      gpus: 72
      note: "One NVLink domain; the Customer's smallest large-job scheduling unit."
    - id: "SU-CDU"
      name: "CDU loop"
      gpus: 576
      note: "Each CDU is the primary for one row of 8 racks on a shared N+1 secondary header; a loss of cooling can affect all of them."

# -----------------------------------------------------------------------------
# MEASUREMENT: Telemetry of Record
# -----------------------------------------------------------------------------
measurement:
  principle: >-
    Performance is measured from Customer-operated Telemetry of Record, not from
    Supplier self-reporting. Supplier ticket and work order data is used for work content and
    narrative, and is reconciled against telemetry. Where they disagree, the
    higher-precedence source prevails.
  clock_rules:
    start: "T0, the earliest evidence of the fault across all sources."
    stop: "Validated RTS."
    pause_allowed_only_for:
      - "A Customer-requested hold, recorded in the ticket or work order with Customer approval."
      - "Customer-controlled access delays (e.g., cage access withheld by the Customer)."
      - "An approved Excused Event."
    pause_not_allowed_for:
      - "Waiting for parts when Customer spares were at or above minimum stock."
      - "Supplier staffing shortfalls or shift changes."
      - "Waiting on Supplier internal escalation."
  record_integrity_tolerance_min: 15
  timestamp_standard: "All systems record UTC and are NTP-synchronized; records with clock skew over 5 seconds are flagged."
  reporting:
    weekly: "Operating scorecard by Monday 12:00 UTC, generated automatically from telemetry and ticket or work order data."
    monthly: "Service Level Report within 5 business days after month end, including all defaults, credits, and trends."
    raw_data_access: "The Customer may access ticket and work order data through API at any time; the Supplier must keep all records for the Term plus 2 years."
    failure_to_report: >-
      If the Supplier fails to provide data required to measure a service level,
      that service level is deemed to have a Minimum Service Level Default for the period.
  reference_implementation: >-
    Every calculation in this SLA is implemented in the scorecard source code
    (src/scorecard), which both parties receive and may run. That reference
    implementation, applied to the Telemetry of Record, is the agreed method of
    calculation, so any disagreement is about data, never about math. Changes to
    it follow SLA change control.
  calibration:
    days: 90
    rule: >-
      For the first 90 days, both parties measure every service level in parallel
      and reconcile every difference weekly. Credits do not apply during
      calibration; defaults are recorded and reviewed, and the Measurement
      Specification is corrected before credits begin.
  reconciliation: >-
    Each week the scorecard lists every record where Supplier data and telemetry
    disagree. The Supplier responds to each item before the weekly operations review.
  disputes:
    window_business_days: 5
    rule: >-
      The Supplier may dispute a measurement within 5 business days of the weekly
      scorecard, with evidence from a Telemetry of Record source. Undisputed
      measurements are final. Disputes unresolved after 10 business days escalate
      to the monthly service review.
  audit:
    sample_pct: 5
    rule: >-
      Each month the Customer audits a random 5% of closed tickets or work orders (minimum 10) end
      to end against raw telemetry, badge, and inventory records. Audit findings
      count toward CSL-11.
  data_sources:
    - id: "DS-DCGM"
      name: "GPU telemetry (DCGM and driver XID events)"
      measures: "GPU faults, ECC and XID events, diagnostic results, burn-in results."
      owner: "Customer"
      precedence: 1
    - id: "DS-REDFISH"
      name: "BMC Redfish API"
      measures: "Hardware inventory and serial numbers, PSU health, tray leak detection, power state."
      owner: "Customer"
      precedence: 1
    - id: "DS-NMX"
      name: "NVLink fabric management telemetry"
      measures: "NVLink switch tray health, NVLink domain state, link errors."
      owner: "Customer"
      precedence: 1
    - id: "DS-UFM"
      name: "InfiniBand fabric manager"
      measures: "Port state, link-down events, symbol and error counters."
      owner: "Customer"
      precedence: 1
    - id: "DS-HEALTH"
      name: "Cluster health-check and automated recovery platform"
      measures: "Periodic and job-boundary health checks; node drain and return events."
      owner: "Customer"
      precedence: 1
    - id: "DS-SCHED"
      name: "Customer workload scheduler"
      measures: "Node state (available, drained, down) and capacity returned to production."
      owner: "Customer"
      precedence: 1
    - id: "DS-BMS"
      name: "Building management system feed (EcoStruxure Building Operation, operated by the Landlord)"
      measures: "Chillers, pumps, thermal walls, CRAHs, CDU summary points, alarm acknowledgments, point overrides and alarm inhibits."
      owner: "Landlord"
      precedence: 2
    - id: "DS-EPMS"
      name: "Electrical power monitoring (EcoStruxure Power Monitoring Expert export)"
      measures: "Switchgear breaker states, utility and generator source, meter readings, power quality events."
      owner: "Landlord"
      precedence: 2
    - id: "DS-UPS"
      name: "UPS network management cards (SNMPv3, Customer read-only user)"
      measures: "UPS mode (normal, battery, bypass), module status, load, battery state of charge, alarms."
      owner: "Customer"
      precedence: 1
    - id: "DS-BUSWAY"
      name: "Busway Critical Power Monitors (Modbus TCP, Customer read-only)"
      measures: "Per-segment voltage, current, and power at each A and B busway; tap-off breaker state."
      owner: "Customer"
      precedence: 1
    - id: "DS-EMCP"
      name: "Generator controllers (EMCP 4.4 via Modbus TCP, Customer read-only)"
      measures: "Engine run state, kW load, percent of nameplate, exhaust temperature, start and transfer events, alarms."
      owner: "Customer"
      precedence: 1
    - id: "DS-CDU"
      name: "CDU controllers (Redfish, Customer read-only account)"
      measures: "Secondary supply and return temperature, flow, pressure, pump status and redundancy, coolant level, CDU leak sensors."
      owner: "Customer"
      precedence: 1
    - id: "DS-LEAK"
      name: "Leak detection (TraceTek TTDM-128 via Modbus gateway, Customer read-only)"
      measures: "Leak alarms with distance along the cable, cable breaks, circuit faults."
      owner: "Customer"
      precedence: 1
    - id: "DS-FIRE"
      name: "Fire alarm and aspirating smoke detection (VESDA via HLI, secondary monitoring)"
      measures: "VESDA Alert, Action, Fire 1, and Fire 2; detector faults; fire system impairments. The fire panel remains the life-safety system of record."
      owner: "Landlord"
      precedence: 2
    - id: "DS-CMMS"
      name: "Landlord maintenance management system"
      measures: "Work orders, preventive maintenance schedule and completion, method of procedure (MOP) references, Landlord-recorded timestamps."
      owner: "Landlord"
      precedence: 3
    - id: "DS-BADGE"
      name: "Access control system"
      measures: "Technician and engineer presence by hall and equipment room, time on site, staffing fill."
      owner: "Customer"
      precedence: 1
    - id: "DS-CAB"
      name: "Customer change management system"
      measures: "Approved changes and maintenance windows."
      owner: "Customer"
      precedence: 1
    - id: "DS-ITSM"
      name: "Supplier ticketing system"
      measures: "Ticket lifecycle, work notes, parts used, priority, Supplier-recorded timestamps."
      owner: "Supplier"
      precedence: 3
    - id: "DS-SPARES"
      name: "Supplier spares and RMA system"
      measures: "Stock levels, consumption, cycle counts, RMA shipments."
      owner: "Supplier"
      precedence: 3

# -----------------------------------------------------------------------------
# CHANGE MANAGEMENT
# -----------------------------------------------------------------------------
change_management:
  rules:
    - "All non-emergency changes require Customer change approval before work starts."
    - "Standard changes (pre-approved runbook FRU swaps) may proceed under an open incident."
    - "Emergency changes require verbal approval from the Customer Incident Commander, recorded in the ticket or work order within 1 hour."
    - "Work outside the approved window or scope is an unauthorized change and counts against KM-10."

# -----------------------------------------------------------------------------
# EXCUSED EVENTS
# -----------------------------------------------------------------------------
excused_events:
  claim_window_business_days: 5
  evidence_required: true
  events:
    - "Force majeure as defined in the Agreement."
    - "Failures attributed to another party under the Interface Agreement, for the time that party's fault is active (the Supplier must still respond, protect equipment, and notify)."
    - "Customer-caused delays, including withheld access or Customer-requested holds recorded in the ticket or work order."
    - "Approved maintenance inside an approved change window, within the approved duration."
    - "OEM part unavailability, ONLY if Customer spares for that FRU class were at or above minimum stock and the Supplier notified the Customer within 4 hours."
  treatment: >-
    The excused occurrence is removed from both the numerator and the
    denominator of the affected service level. The rest of the Measurement
    Period is still measured.
  supplier_duty: "The Supplier must use commercially reasonable efforts to perform despite the Excused Event."

# -----------------------------------------------------------------------------
# ROOT CAUSE ANALYSIS AND CORRECTIVE ACTION
# -----------------------------------------------------------------------------
corrective_action:
  triggers:
    - "Any Expected or Minimum Service Level Default."
    - "Any Key Measurement miss."
    - "Any P1 incident."
    - "Any Lemon Unit."
    - "Any Record Integrity Finding."
    - "Any reopened ticket or work order (TR-1 or TR-2)."
  rca_timelines:
    p1_preliminary_hours: 24
    p1_final_business_days: 5
    other_business_days: 10
  cap_requirements:
    - "Root cause stated in terms of process, people, parts, or tooling; not 'technician error' alone."
    - "Each action has a single named owner, a due date, and an evidence-of-completion definition."
    - "Effectiveness check: the triggering metric is reviewed for 2 Measurement Periods after closure."
  cap_overdue_escalation: "CAPs more than 10 business days overdue escalate to the monthly service review."

# -----------------------------------------------------------------------------
# GOVERNANCE CADENCE
# -----------------------------------------------------------------------------
governance:
  - forum: "Daily operations standup"
    frequency: "Daily, 15 minutes"
    attendees: "Supplier shift leads; Customer site lead"
    inputs: "Open P1 and P2 incidents, today's deployment plan, blockers, spares alerts."
  - forum: "Weekly operations review"
    frequency: "Weekly"
    attendees: "Supplier site manager; Customer site lead"
    inputs: "Automated weekly scorecard, breach severity log, CAP status, staffing, lemon units."
  - forum: "Monthly service review"
    frequency: "Monthly"
    attendees: "Supplier account manager; Customer DCO leadership"
    inputs: "Service Level Report, credits and earnback, chronic-failure watch, trends."
  - forum: "Quarterly business review"
    frequency: "Quarterly"
    attendees: "Supplier executive sponsor; Customer DCO leadership"
    inputs: "Trend analysis, SLA change proposals, roadmap and capacity plan, program-wide lessons learned."

# -----------------------------------------------------------------------------
# SECURITY AND CHAIN OF CUSTODY
# -----------------------------------------------------------------------------
security:
  requirements:
    - "Badge access only for Customer-approved personnel; no tailgating; visitors escorted at all times."
    - "Daily reconciliation of badge records against the shift roster."
    - "Storage media (e.g., E1.S drives) never leave the Site intact; media is sanitized or destroyed on site under the Customer's media sanitization standard, with a certificate per serial number."
    - "Every failed part is logged into chain of custody at removal, with serial, ticket or work order, technician, and timestamp."
    - "Cameras and photography in the data hall are prohibited except for Customer-approved documentation."
  incident_reporting: "Suspected security incidents are reported to the Customer within 1 hour of discovery."

# -----------------------------------------------------------------------------
# ENVIRONMENTAL, HEALTH, AND SAFETY (EHS)
# Binding on every partner and every subcontractor working at the Site.
# Editions below were checked against published sources in October 2026 (see
# `sources`). Not legal advice: a real agreement needs counsel.
# -----------------------------------------------------------------------------
ehs:
  principles:
    - "Safety is never traded for speed, schedule, or a service level. No target in any partner SLA justifies an unsafe act."
    - "Every person on Site has stop-work authority and must use it for any unsafe condition. Stopping work is never a violation and never counts against a service level."
    - "Consequences attach to confirmed violations of required controls, never to injuries, illnesses, or near misses that are reported. Reporting is protected (29 CFR 1904.35(b)(1)(iv))."
    - "Where a regulation and a requirement below differ, the more protective one applies."

  standards:
    - {id: "OSHA-1910", name: "OSHA 29 CFR 1910, General Industry", scope: "All work. Includes Subpart S (electrical), 1910.147 (hazardous energy control), 1910.132 to .138 (PPE, including 1910.137 electrical protective equipment), 1910.1200 (hazard communication: PG25 coolant, diesel, lithium-ion), 1910.178 (powered industrial trucks), 1910.95 (noise), 1910.38 and .39 (emergency action and fire prevention plans), and Subpart D (walking-working surfaces)."}
    - {id: "OSHA-1926", name: "OSHA 29 CFR 1926, Construction", scope: "Build-out, fit-out, and installation work during deployment, including Subpart K (electrical) and Subpart M (fall protection)."}
    - {id: "OSHA-1904", name: "OSHA 29 CFR 1904, Recordkeeping and Reporting", scope: "Injury and illness records, severe-injury reporting (1904.39), and the prohibition on discouraging reports (1904.35)."}
    - {id: "OSHA-GDC", name: "OSH Act Section 5(a)(1), General Duty Clause", scope: "Recognized hazards without a specific standard, including heat stress. Texas has no state plan; federal OSHA has jurisdiction."}
    - {id: "NFPA-70E", name: "NFPA 70E, Standard for Electrical Safety in the Workplace", edition: "2027", scope: "Electrical safety program, qualified persons, energized work permits, approach boundaries, arc flash and shock PPE, battery and DC systems."}
    - {id: "NFPA-70B", name: "NFPA 70B, Standard for Electrical Equipment Maintenance", edition: "2026", scope: "Documented electrical maintenance program; supports the 70E condition-of-maintenance assumption."}
    - {id: "NFPA-855", name: "NFPA 855, Installation of Stationary Energy Storage Systems", edition: "2026", scope: "Lithium-ion UPS battery rooms and any energy storage in the 800 VDC pilot."}
    - {id: "NFPA-110", name: "NFPA 110, Emergency and Standby Power Systems", scope: "Generator testing and maintenance, including safe running-equipment practices."}
    - {id: "NFPA-72-25", name: "NFPA 72 and NFPA 25", scope: "Fire alarm and water-based fire protection inspection, testing, and impairment handling."}
    - {id: "NFPA-51B", name: "NFPA 51B, Fire Prevention During Welding, Cutting, and Other Hot Work", scope: "Hot work permits and fire watch."}
    - {id: "ISO-45001", name: "ISO 45001:2018 or ANSI/ASSP Z10.0", scope: "Each partner operates an occupational health and safety management system aligned to one of these."}

  site_rules:
    - id: "EHS-R1"
      title: "Pre-task planning"
      rule: "Every non-routine task starts with a written job hazard analysis and a job briefing covering hazards, energy sources, boundaries, PPE, and emergency response."
      refs: ["NFPA-70E", "OSHA-1910"]
    - id: "EHS-R2"
      title: "Hazardous energy control"
      rule: "Lockout/tagout under a written, task-specific procedure for any work requiring de-energization, with test-before-touch absence-of-voltage verification by a qualified person. Group lockout for multi-partner work, with every worker applying a personal lock."
      refs: ["OSHA-1910", "NFPA-70E"]
    - id: "EHS-R3"
      title: "Energized electrical work"
      rule: "Prohibited unless de-energizing creates a greater hazard or is infeasible, and then only under an energized electrical work permit approved in advance by the Customer. Where the permit specifies shock or arc flash PPE, a second person trained in contact release and emergency response is present outside the boundary, as NFPA 70E (2027) requires. Arc flash labels and the incident energy study are kept current."
      refs: ["NFPA-70E", "OSHA-1910"]
    - id: "EHS-R4"
      title: "Battery rooms and DC systems"
      rule: "Work on lithium-ion UPS batteries and any 800 VDC equipment requires a risk assessment that addresses chemical, contact thermal, shock, and arc flash hazards, PPE for each, authorized entry only, and the battery system's emergency procedures."
      refs: ["NFPA-70E", "NFPA-855"]
    - id: "EHS-R5"
      title: "Liquid cooling and coolant"
      rule: "Safety data sheets for PG25 coolant on hand; spill kits at every CDU and row end; quick-disconnect service only on isolated loops; leak alarms answered under the site spill procedure."
      refs: ["OSHA-1910"]
    - id: "EHS-R6"
      title: "Rack and heavy equipment moves"
      rule: "Racks (well over a metric ton loaded) move only on rated powered equipment run by trained operators, with a route survey, floor-load check, and a dedicated spotter. Team lifts and lift assists for trays and power shelves."
      refs: ["OSHA-1910"]
    - id: "EHS-R7"
      title: "Heat illness prevention"
      rule: "A written heat illness prevention plan for outdoor work (generator and chiller yards) and hot aisles. At a heat index of 80 F: drinking water, shade, and acclimatization for new and returning workers. At 90 F: at least 15 minutes of rest in shade every 2 hours, buddy system or check-ins, and observation for heat illness. Thresholds are modeled on OSHA's proposed heat rule; the rule is not final, so this agreement makes them binding."
      refs: ["OSHA-GDC"]
    - id: "EHS-R8"
      title: "Generators and running equipment"
      rule: "Hearing protection in posted areas; exclusion zones around running engines and during load-bank tests; diesel spills handled under the site spill procedure."
      refs: ["OSHA-1910", "NFPA-110"]
    - id: "EHS-R9"
      title: "Working at height"
      rule: "Rated ladders and platforms for overhead busway and cable tray work; fall protection where required; no standing on racks, CDUs, or containment."
      refs: ["OSHA-1910", "OSHA-1926"]
    - id: "EHS-R10"
      title: "Working alone"
      rule: "No lone work on energized equipment, in battery rooms, or outdoors at a heat index of 90 F or above. Other lone work requires check-ins at least every 60 minutes."
      refs: ["NFPA-70E", "OSHA-GDC"]
    - id: "EHS-R11"
      title: "Hot work and fire protection impairment"
      rule: "Hot work only under permit with a fire watch. Any impairment of fire alarm, detection, or suppression is notified to the Customer before it begins and tracked to restoration."
      refs: ["NFPA-51B", "NFPA-72-25"]
    - id: "EHS-R12"
      title: "Electrostatic discharge"
      rule: "ESD-safe handling for all electronic components (equipment protection, tracked with the safety rules)."
      refs: []

  partner_qualification:
    - "Experience Modification Rate (EMR) of 1.0 or lower, or a Customer-approved improvement plan."
    - "Three years of injury rates (TRIR and DART) and five years of OSHA citation history disclosed before mobilization and annually."
    - "Workers' compensation coverage for every person on Site. Texas allows employers to opt out of workers' compensation; partners at this Site may not."
    - "A written safety program and a named, on-site EHS coordinator."
    - "Training records on Site for every worker: NFPA 70E qualified-person training for electrical tasks, lockout/tagout, powered equipment operation, heat illness, hazard communication, and site orientation. Supervisors hold OSHA 30-hour training."
    - "Subcontractors meet the same requirements; the partner remains responsible for them."

  reporting:
    injury_or_recordable_hours: 1
    near_miss_hours: 24
    severe_events: "Fatalities, in-patient hospitalizations, amputations, and losses of an eye are reported to the Customer immediately and to OSHA within the 29 CFR 1904.39 deadlines (8 hours for a fatality, 24 hours for the others)."
    monthly: "Hours worked, recordables, near misses, stop-work uses, permits issued, and open corrective actions, by partner."

  investigation:
    trigger: "Any suspected violation of a site rule or standard above, from any source: observation, audit, telemetry, permit and badge records, or a report."
    investigator: "Customer EHS, or an independent third-party Certified Safety Professional engaged by the Customer. The partner whose work is investigated may not lead the investigation."
    partner_response_business_days: 5
    standard_of_proof: "Preponderance of the evidence."
    evidence: "Permits, job hazard analyses, lockout records, telemetry (for example, power present on a circuit recorded as locked out), badge records, witness statements, and photographs taken for the investigation."
    disputes: "Disputed findings go to the monthly service review, then to the independent Certified Safety Professional, whose determination of fact is final for EHS credits."

  violation_classes:
    - id: "EHS-C1"
      name: "Life-critical"
      examples:
        - "Energized electrical work without an approved permit, or without the required second person."
        - "Lockout/tagout not applied or not verified before work."
        - "Entering an arc flash or shock boundary without the required PPE."
        - "Bypassing or defeating a safety interlock, guard, or fire protection system."
        - "A rack move without the required equipment, operator, or spotter."
      credit_pct_of_monthly_charges: 1.0
      consequences:
        - "Immediate stop of the task and removal of the individuals involved from Site work pending review."
        - "Partner-wide safety stand-down at the Site within 24 hours."
        - "Root cause analysis and corrective action plan within 5 business days."
        - "Internal severity S1."
      cost_recovery: true
    - id: "EHS-C2"
      name: "Serious"
      examples:
        - "Work performed without a required job hazard analysis or permit, where no life-critical control was missed."
        - "A worker performing a task without current required qualification."
        - "Required PPE missing outside a hazard boundary."
        - "Heat illness controls not provided at a triggering heat index."
      credit_pct_of_monthly_charges: 0.25
      consequences:
        - "Correction before work resumes."
        - "Corrective action plan within 10 business days."
        - "Internal severity S2."
      cost_recovery: false
    - id: "EHS-C3"
      name: "Administrative"
      examples:
        - "Incomplete or late paperwork where the required control was in place."
        - "Training records not available on Site."
      credit_pct_of_monthly_charges: 0.0
      consequences:
        - "Corrected and tracked in the weekly operations review."
        - "Internal severity S3."
      cost_recovery: false

  credits:
    basis: "Each partner's own monthly charges under its SLA."
    outside_monthly_cap: true
    earnback_eligible: false
    repeat:
      class: "EHS-C1"
      window_days: 90
      multiplier: 2
    self_reported_reduction_pct: 50
    concealment_multiplier: 2
    concealment_is_record_integrity_finding: true
    nature: >-
      EHS Credits are a price adjustment reflecting that services were not
      delivered to the contracted safety standard. Their amounts are a
      reasonable pre-estimate of costs the Customer incurs from a confirmed
      violation (investigation, re-verification of affected work, and
      operational disruption), which are real but impractical to quantify in
      advance. They are not a penalty, are not subject to the monthly credit
      cap, cannot be earned back, and do not limit the Customer's other
      rights, including recovery of actual costs and termination.
    self_reporting: >-
      A violation the partner reports to the Customer within the reporting
      window and corrects before work resumes has its EHS Credit reduced by the
      percentage above. A violation the partner knew of and did not report, or
      whose records were altered, has its EHS Credit multiplied as above and is
      also a record-integrity finding.
    never_based_on: >-
      No EHS Credit, charge, or adverse action is ever based on the number of
      injuries, illnesses, or near misses reported, or on the use of
      stop-work authority.
    cost_recovery: "For Life-critical violations, the partner also reimburses the Customer's documented costs of the independent investigation and of any Customer-directed stand-down."

  sources:
    - "NFPA 70E current edition (2027): https://www.nfpa.org/codes-and-standards/nfpa-70e-standard-development/70e"
    - "NFPA 70E 2027 effective May 6, 2026; second-person and battery changes: https://arcflashtraining.org/guide/nfpa-70e/2027-changes/"
    - "NFPA 70B as a standard; 2026 edition current: https://reliamag.com/guides/nfpa-70b-compliance/"
    - "NFPA 855 2026 edition: https://www.energy-storage.news/nfpa-855-2026-edition-updates-and-what-they-mean-for-energy-storage-projects/"
    - "OSHA heat rule status and Heat NEP (April 2026, through 2031): https://www.salussafety.io/us/osha/heat-rule"
    - "Proposed heat rule triggers (80 F and 90 F heat index): https://abccarolinas.org/heat-illness-prevention-what-southeast-contractors-need-in-place-before-summer-2026/"
    - "OSHA interpretation of 29 CFR 1904.35(b)(1)(iv) (2018): https://www.osha.gov/laws-regs/standardinterpretations/2018-10-11"
    - "Liquidated damages must be a reasonable pre-estimate, not a penalty: https://www.venable.com/insights/publications/design-build/law-practice-contractor-marketing-penalty-clauses"

  escalation:
    - "Two Life-critical violations by one partner in any rolling 90 days: executive review and a partner-wide safety improvement plan approved by the Customer."
    - "Three Life-critical violations by one partner in any rolling 12 months, or one resulting in a fatality or permanent disability: a material breach, giving the Customer the right to terminate for cause."
    - "The Customer may require removal of any individual from Site work for safety reasons at any time."

# -----------------------------------------------------------------------------
# SLA CHANGE CONTROL AND CONTINUOUS IMPROVEMENT
# -----------------------------------------------------------------------------
sla_change_control:
  customer_rights:
    - "Promote a Key Measurement to a Critical Service Level, or demote a CSL, with 90 days notice (maximum 2 changes per contract year)."
    - "Reallocate credit allocation percentages with 90 days notice, within the pool and per-CSL caps."
    - "Add new service levels; targets are set from 6 months of measured baseline, or by mutual agreement."
  continuous_improvement: >-
    At each contract anniversary, the Expected and Minimum levels of each CSL
    tighten by 10% of the remaining gap to perfect performance, using the
    trailing 12 months of results, unless the parties agree otherwise.
  versioning: "Every change to this file is a new SLA version, reviewed through pull request and approved by both parties."

# -----------------------------------------------------------------------------
# INTERNAL BREACH SEVERITY INDEX
# Customer-internal: guides escalation. Not a contractual remedy and not shared
# with the Supplier.
# -----------------------------------------------------------------------------
breach_severity:
  internal_only: true
  purpose: >-
    Translates a breach into a single severity so readers immediately understand
    how serious it was. Severity is the worst level across all dimensions, then
    adjusted by aggravators.
  levels:
    - id: "S1"
      name: "Critical"
      rank: 4
      escalation: "Same-day notification to Customer DCO leadership; Supplier executive engaged within 24 hours; CAP within 5 business days; chronic-failure and contract-remedy review."
    - id: "S2"
      name: "Major"
      rank: 3
      escalation: "Formal CAP within 10 business days; reviewed jointly by Customer site lead and Supplier account manager; tracked to verified closure."
    - id: "S3"
      name: "Minor"
      rank: 2
      escalation: "Supplier RCA within 10 business days; discussed in the weekly operations review."
    - id: "S4"
      name: "Watch"
      rank: 1
      escalation: "Logged and trended in the weekly scorecard; no formal action unless it repeats."
  event_dimensions:
    overrun_pct:
      description: "How far past the target time the event ran: (actual - target) / target."
      bands:
        - {max: 10, level: "S4"}
        - {max: 50, level: "S3"}
        - {max: 200, level: "S2"}
        - {max: null, level: "S1"}
    gpu_hours_beyond_target:
      description: "GPU-hours lost after the target expired (GPUs affected x hours late). 72 GPU-hours = one NVL72 rack-hour."
      bands:
        - {max: 72, level: "S4"}
        - {max: 500, level: "S3"}
        - {max: 5000, level: "S2"}
        - {max: null, level: "S1"}
  period_rules:
    - condition: "met_expected"
      level: null
      description: "Expected level met; no breach."
    - condition: "below_expected"
      level: "S4"
      description: "Below Expected but at or above Minimum."
    - condition: "below_minimum"
      level: "S3"
      description: "Below Minimum (credit-bearing default)."
    - condition: "deep_below_minimum"
      level: "S2"
      description: "Below Minimum by more than the Expected-to-Minimum gap."
    - condition: "chronic"
      level: "S1"
      description: "Minimum default on the same CSL for 3 or more consecutive periods (chronic failure CF-1)."
  aggravators:
    - id: "AGG-REPEAT"
      description: "Same CSL or same Service Unit breached within the previous 30 days."
      effect: "bump"
      amount: 1
    - id: "AGG-RACKWIDE"
      description: "Breach affected an entire NVL72 rack or a CDU loop."
      effect: "floor"
      level: "S2"
    - id: "AGG-INTEGRITY"
      description: "Breach involved a Record Integrity Finding (vendor record contradicted by telemetry)."
      effect: "floor"
      level: "S1"
    - id: "AGG-EHS"
      description: "Breach involved an EHS recordable, stop-work event, or uncontained leak."
      effect: "floor"
      level: "S1"
    - id: "AGG-SECURITY"
      description: "Breach involved a security or chain-of-custody failure."
      effect: "floor"
      level: "S1"
