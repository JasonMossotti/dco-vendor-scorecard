# -----------------------------------------------------------------------------
# INCIDENT PRIORITY MATRIX (GB200-specific criteria)
# -----------------------------------------------------------------------------
priority_rules:
  authority: >-
    The Customer has final authority over priority. Telemetry-based automatic
    classification sets the initial priority. The Supplier may request a change
    but may not downgrade an incident without written Customer approval. If
    priority changes, the stricter target applies from T0.
  escalation_on_risk: >-
    The Supplier must notify the Customer Incident Commander as soon as it
    believes any target is at risk, and no later than 50% of the target time elapsed.

priorities:
  - id: "P1"
    name: "Critical"
    criteria:
      - "Active coolant leak or any tray, rack, or CDU leak-detection alarm."
      - "CDU loss of flow, or loss of pump redundancy with rising temperatures."
      - "Rack-level outage (an entire NVL72 rack or more unavailable)."
      - "NVLink switch tray failure (treated as rack-wide)."
      - "Any EHS event involving injury, fire, smoke, or electrical hazard."
      - "Physical security breach of the Customer cage."
    examples:
      - "Leak detector alarm on rack A-14 manifold."
      - "CDU-3 flow drops below baseline; 8 racks at risk."
    acknowledge_min: 5
    engaged_on_site_min: 15
    containment_min: 60
    restore_min: 240
    update_cadence_min: 30
    escalation: "Immediate page to Customer Incident Commander; Supplier site manager engaged."
  - id: "P2"
    name: "High"
    criteria:
      - "Single compute tray down in production (4 GPUs)."
      - "Back-end fabric link down or flapping and impacting jobs."
      - "Power shelf failure with redundancy lost."
      - "CDU pump redundancy lost with stable temperatures."
    examples:
      - "XID 79 (GPU fallen off bus) on a production tray."
      - "Repeated link-down events on a leaf port serving rack B-03."
    acknowledge_min: 15
    engaged_on_site_min: 30
    containment_min: null
    restore_min: 480
    update_cadence_min: 60
    escalation: "Supplier shift lead; Customer on-call informed."
  - id: "P3"
    name: "Medium"
    criteria:
      - "Redundant component failed with redundancy still intact (e.g., one PSU)."
      - "Degradation trend before failure (rising corrected errors, pre-FEC BER drift)."
      - "Fault on a non-production or burn-in tray."
    examples:
      - "One 5.5 kW PSU failed in a power shelf; shelf redundancy intact."
      - "Rising symbol errors on an optic that has not yet flapped."
    acknowledge_min: 60
    engaged_on_site_min: 240
    containment_min: null
    restore_min: 1440
    update_cadence_min: 1440
    escalation: "Tracked in daily standup."
  - id: "P4"
    name: "Low"
    criteria:
      - "Service requests, planned work, labeling, audits, and cable management."
    examples:
      - "Re-label a row after a layout change."
    acknowledge_min: 240
    engaged_on_site_min: null
    containment_min: null
    restore_min: 7200
    update_cadence_min: null
    escalation: "Tracked in weekly operations review."

# -----------------------------------------------------------------------------
# MEASUREMENT: Telemetry of Record
# -----------------------------------------------------------------------------
measurement:
  principle: >-
    Performance is measured from Customer-operated Telemetry of Record, not from
    Supplier self-reporting. Supplier ticket data is used for work content and
    narrative, and is reconciled against telemetry. Where they disagree, the
    higher-precedence source prevails.
  clock_rules:
    start: "T0, the earliest evidence of the fault across all sources."
    stop: "Validated RTS."
    pause_allowed_only_for:
      - "A Customer-requested hold, recorded in the ticket with Customer approval."
      - "Customer-controlled access delays (e.g., cage access withheld by the Customer)."
      - "An approved Excused Event."
    pause_not_allowed_for:
      - "Waiting for parts when Customer spares were at or above minimum stock."
      - "Supplier staffing shortfalls or shift changes."
      - "Waiting on Supplier internal escalation."
  record_integrity_tolerance_min: 15
  timestamp_standard: "All systems record UTC and are NTP-synchronized; records with clock skew over 5 seconds are flagged."
  reporting:
    weekly: "Operating scorecard by Monday 12:00 UTC, generated automatically from telemetry and ticket data."
    monthly: "Service Level Report within 5 business days after month end, including all defaults, credits, and trends."
    raw_data_access: "The Customer may access ticket data through API at any time; the Supplier must keep all records for the Term plus 2 years."
    failure_to_report: >-
      If the Supplier fails to provide data required to measure a service level,
      that service level is deemed to have a Minimum Service Level Default for the period.
  reference_implementation: >-
    Every calculation in this SLA is implemented in the scorecard source code
    (src/scorecard), which both parties receive and may run. That reference
    implementation, applied to the Telemetry of Record, is the agreed method of
    calculation, so any disagreement is about data, never about math. Changes to
    it follow SLA change control.
  calibration:
    days: 90
    rule: >-
      For the first 90 days, both parties measure every service level in parallel
      and reconcile every difference weekly. Credits do not apply during
      calibration; defaults are recorded and reviewed, and the Measurement
      Specification is corrected before credits begin.
  reconciliation: >-
    Each week the scorecard lists every record where Supplier data and telemetry
    disagree. The Supplier responds to each item before the weekly operations review.
  disputes:
    window_business_days: 5
    rule: >-
      The Supplier may dispute a measurement within 5 business days of the weekly
      scorecard, with evidence from a Telemetry of Record source. Undisputed
      measurements are final. Disputes unresolved after 10 business days escalate
      to the monthly service review.
  audit:
    sample_pct: 5
    rule: >-
      Each month the Customer audits a random 5% of closed tickets (minimum 10) end
      to end against raw telemetry, badge, and inventory records. Audit findings
      count toward CSL-11.
  data_sources:
    - id: "DS-DCGM"
      name: "GPU telemetry (DCGM and driver XID events)"
      measures: "GPU faults, ECC and XID events, diagnostic results, burn-in results."
      owner: "Customer"
      precedence: 1
    - id: "DS-REDFISH"
      name: "BMC Redfish API"
      measures: "Hardware inventory and serial numbers, PSU health, tray leak detection, power state."
      owner: "Customer"
      precedence: 1
    - id: "DS-NMX"
      name: "NVLink fabric management telemetry"
      measures: "NVLink switch tray health, NVLink domain state, link errors."
      owner: "Customer"
      precedence: 1
    - id: "DS-UFM"
      name: "InfiniBand fabric manager"
      measures: "Port state, link-down events, symbol and error counters."
      owner: "Customer"
      precedence: 1
    - id: "DS-HEALTH"
      name: "Cluster health-check and automated recovery platform"
      measures: "Periodic and job-boundary health checks; node drain and return events."
      owner: "Customer"
      precedence: 1
    - id: "DS-SCHED"
      name: "Customer workload scheduler"
      measures: "Node state (available, drained, down) and capacity returned to production."
      owner: "Customer"
      precedence: 1
    - id: "DS-BMS"
      name: "Building management system feed (via Facility Provider)"
      measures: "CDU flow, supply and return temperatures, pump status, room leak sensors."
      owner: "Facility Provider"
      precedence: 2
    - id: "DS-BADGE"
      name: "Access control system"
      measures: "Technician presence by hall, time on site, staffing fill."
      owner: "Customer"
      precedence: 1
    - id: "DS-CAB"
      name: "Customer change management system"
      measures: "Approved changes and maintenance windows."
      owner: "Customer"
      precedence: 1
    - id: "DS-ITSM"
      name: "Supplier ticketing system"
      measures: "Ticket lifecycle, work notes, parts used, priority, Supplier-recorded timestamps."
      owner: "Supplier"
      precedence: 3
    - id: "DS-SPARES"
      name: "Supplier spares and RMA system"
      measures: "Stock levels, consumption, cycle counts, RMA shipments."
      owner: "Supplier"
      precedence: 3

# -----------------------------------------------------------------------------
# TICKET HANDLING RULES (identical for every person, every shift)
# -----------------------------------------------------------------------------
ticket_handling:
  principle: >-
    Ticket handling is standardized so that no individual's habits or preferences
    can change a measurement. These rules apply to every fault class; the
    Measurement Specification adds the class-specific details.
  ticket_of_record:
    - "Telemetry-detected faults open the Ticket of Record automatically through the Customer alerting integration, stamped with T0, the fault class, and the Service Unit Key. The Supplier works that ticket and does not open its own for the same fault."
    - "Faults found by people first (visible leak, physical damage, smoke, odor) are opened by the Supplier immediately. T0 is still the earliest evidence from any source."
    - "One Ticket of Record per fault per Service Unit Key. A second ticket for the same unit opened while the first is open or in MONITORING is merged into the first and keeps the earliest T0."
    - "The fault class, chosen from the controlled list in the Measurement Specification, sets the priority, evidence, validation, and stability rules. It cannot be changed without Customer approval."
  required_fields:
    - "Ticket of Record ID and fault class"
    - "Service Unit Key"
    - "T0 (system-generated)"
    - "Priority (from the Measurement Specification)"
    - "Assigned technician (person ID)"
    - "Parts removed and installed, with scanned serial numbers"
    - "Validation record IDs linked from the health-check system"
    - "Close code and root-cause category (controlled lists)"
  states:
    - {id: "NEW", clock: "running", description: "Opened from telemetry or by the Supplier."}
    - {id: "ASSIGNED", clock: "running", description: "Acknowledged by a qualified person."}
    - {id: "IN_PROGRESS", clock: "running", description: "Technician Engaged On-Site."}
    - {id: "PENDING_CUSTOMER", clock: "paused", description: "Allowed only with an approved pause code and a named Customer approver."}
    - {id: "VALIDATING", clock: "running", description: "Repair complete; validation checks running."}
    - {id: "MONITORING", clock: "stopped", description: "Validated RTS reached; unit in production for its stability window."}
    - {id: "REOPENED", clock: "running", description: "Fault recurred during MONITORING; clock resumes under TR-1 or TR-2."}
    - {id: "CLOSED", clock: "stopped", description: "Stability window passed with no fault. Set automatically, never manually."}
  pause_codes:
    - {code: "CUST_HOLD", description: "Customer-requested hold, such as a job checkpoint before work starts."}
    - {code: "CUST_ACCESS", description: "Access withheld by the Customer."}
    - {code: "EXCUSED", description: "Approved Excused Event."}
  data_integrity:
    - "All timestamps are system-generated in UTC. Manual timestamp entry is disabled; any edit to a timestamp, priority, state, or fault class is audit-logged with user, time, and reason."
    - "Part serial numbers are captured by scanning the part label. Manual entry requires a reason code and is flagged for audit (KM-19)."
    - "Fault class, close code, root-cause category, and pause code come from controlled lists. Free text is narrative only and is never used to calculate a service level."
    - "Validation evidence is linked from the health-check system by record ID. Pasted text, typed summaries, and screenshots are not evidence."
  stability:
    principle: "A repair is finished when the unit stays up, not when it comes up."
    early_failure_minutes: 60
    rules:
      - id: "TR-1"
        name: "Early failure"
        rule: >-
          If the same Service Unit Key faults again within 60 minutes of Validated
          RTS, the earlier restore is void. The ticket reopens and the clock runs
          continuously from the original T0, including the minutes the unit was up.
      - id: "TR-2"
        name: "Reopen within the stability window"
        rule: >-
          If the same Service Unit Key faults again after 60 minutes but within its
          fault class's stability window, the original ticket reopens. Measured
          restoration time is the cumulative downtime of every down interval since
          the original T0, and the ticket is restored only when a Validated RTS
          survives a full stability window.
      - id: "TR-3"
        name: "Automatic closure"
        rule: >-
          Tickets stay in MONITORING for the stability window and close
          automatically when it passes with no fault. They cannot be closed
          manually before then.
      - id: "TR-4"
        name: "Stability runs in production"
        rule: >-
          The stability window runs with the unit in production. Holding a repaired
          unit out of production to wait out the window counts as downtime.
      - id: "TR-5"
        name: "Linked recurrence"
        rule: >-
          A fault on the same Service Unit Key after the stability window but within
          its recurrence window opens a new ticket, automatically linked to the
          original as a child. The child has its own clock; the original counts as
          a First-Time Fix failure (CSL-06) and a Repeat Failure (CSL-08).
      - id: "TR-6"
        name: "No ticket splitting"
        rule: >-
          Opening a new ticket for a fault that TR-1 or TR-2 requires to reopen an
          existing ticket is a Record Integrity Finding (CSL-11, aggravator
          AGG-INTEGRITY). The tickets are merged for measurement.
      - id: "TR-7"
        name: "Unrelated-fault dispute"
        rule: >-
          The Supplier may show with telemetry evidence that a recurrence is
          unrelated to the repair (for example, a GPU memory fault on a tray that was
          just repaired for a quick-disconnect leak). The default presumption is
          that a recurrence is related. Disputes follow the measurement dispute process.

# -----------------------------------------------------------------------------
# MEASUREMENT SPECIFICATION: one rule card per fault class
# -----------------------------------------------------------------------------
measurement_spec:
  - id: "FC-GPU"
    name: "GPU fault on a compute tray"
    service_unit_key: "Compute tray host (e.g., a14-ct07)"
    detection:
      source: "DS-DCGM"
      signal: "Critical XID (48, 79, 94, 119, 145, 149) or a failed GPU health check."
      t0_rule: "Earliest of: the first critical XID for the host, the first failed GPU health check, or the scheduler draining the node for a GPU reason."
    recurrence_signal: "Any critical XID or failed GPU health check on the same host."
    default_priority: "P2"
    priority_rules:
      - "P1 if two or more compute trays in the same rack are down at the same time."
    additional_fields: ["XID code and GPU index"]
    repair_evidence:
      - "Tray replacement: removed and installed serials scanned, confirmed by a serial change in BMC inventory."
      - "Reseat: no part used; close code RESEAT."
    validation_class: ["Compute tray"]
    clock_stop: "The scheduler returns the node to service after every Compute tray validation check has passed."
    stability_window_hours: 24
    recurrence_window_days: 7
    capacity_impact:
      gpus: 4
      states: [{state: "Tray drained", gpus: 4, factor: 1.0}]
    redundancy_exposure: false
  - id: "FC-SWITCH"
    name: "NVLink switch tray failure"
    service_unit_key: "Rack (the NVLink domain)"
    detection:
      source: "DS-NMX"
      signal: "Switch tray failed or unreachable, or NVLink domain degraded."
      t0_rule: "Earliest of: the first switch tray failure event, the first NVLink domain degradation, or the first rack-wide NVLink health-check failure."
    recurrence_signal: "Any NVLink domain degradation in the same rack."
    default_priority: "P1"
    priority_rules: []
    additional_fields: ["Switch tray slot"]
    repair_evidence:
      - "Removed and installed switch tray serials scanned, confirmed by a serial change in BMC inventory."
    validation_class: ["NVLink switch tray"]
    clock_stop: "All 18 compute nodes in the rack are returned to service after rack-level validation has passed."
    stability_window_hours: 24
    recurrence_window_days: 7
    capacity_impact:
      gpus: 72
      states: [{state: "Rack drained", gpus: 72, factor: 1.0}]
    redundancy_exposure: false
  - id: "FC-LINK"
    name: "Back-end fabric link fault"
    service_unit_key: "Link: host and HCA on one end, switch and port on the other (both ends together)"
    detection:
      source: "DS-UFM"
      signal: "Link down, or symbol errors at or above 1,000 within 15 minutes."
      t0_rule: "Earliest of: the first link-down event or the first symbol-error threshold crossing on the link."
    recurrence_signal: "Any link-down event or any symbol errors on the same link. A validated link should be clean, so the bar is stricter after repair."
    default_priority: "P3"
    priority_rules:
      - "P2 if the link went down, flapped, or the node was drained."
    additional_fields: ["Which end was worked (switch side, host side, or both)", "Fiber inspection record for each end"]
    repair_evidence:
      - "Optic replacement: serial scanned for each end replaced, recorded with its side."
      - "Cleaning: inspection record for each end cleaned."
    validation_class: ["Optic, cable, or fiber"]
    clock_stop: "A 30-minute soak completes with zero errors, and the node returns to service if it was drained."
    stability_window_hours: 24
    recurrence_window_days: 7
    capacity_impact:
      gpus: 4
      states: [{state: "Node drained", gpus: 4, factor: 1.0}, {state: "Degraded in service", gpus: 4, factor: 0.25}]
    redundancy_exposure: false
  - id: "FC-PSU"
    name: "Single PSU failure (redundancy intact)"
    service_unit_key: "PSU slot (rack, power shelf, PSU number)"
    detection:
      source: "DS-REDFISH"
      signal: "PowerSupplyFailed event."
      t0_rule: "Timestamp of the first PowerSupplyFailed event for the slot."
    recurrence_signal: "Any PSU failure in the same slot."
    default_priority: "P3"
    priority_rules:
      - "P2 if the shelf's redundancy is lost."
    additional_fields: []
    repair_evidence:
      - "Removed and installed PSU serials scanned, confirmed by a serial change in BMC inventory."
    validation_class: ["Power shelf or PSU"]
    clock_stop: "BMC reports the PSU healthy and shelf redundancy restored."
    stability_window_hours: 24
    recurrence_window_days: 7
    capacity_impact:
      gpus: 0
      states: []
    redundancy_exposure: false
  - id: "FC-SHELF"
    name: "Power shelf failure (redundancy lost)"
    service_unit_key: "Power shelf slot (rack, shelf number)"
    detection:
      source: "DS-REDFISH"
      signal: "PowerShelfFailed event."
      t0_rule: "Timestamp of the first PowerShelfFailed event for the slot."
    recurrence_signal: "Any failure in the same shelf slot."
    default_priority: "P2"
    priority_rules:
      - "P1 if any rack power loss affects compute."
    additional_fields: []
    repair_evidence:
      - "Removed and installed shelf serials scanned, confirmed by a serial change in BMC inventory."
    validation_class: ["Power shelf or PSU"]
    clock_stop: "BMC reports power redundancy restored."
    stability_window_hours: 24
    recurrence_window_days: 7
    capacity_impact:
      gpus: 0
      states: []
    redundancy_exposure: true
  - id: "FC-CDU"
    name: "CDU pump failure (redundancy lost)"
    service_unit_key: "CDU and pump number"
    detection:
      source: "DS-BMS"
      signal: "PumpRedundancyLost alarm."
      t0_rule: "Timestamp the alarm became active."
    recurrence_signal: "Any pump alarm on the same CDU."
    default_priority: "P2"
    priority_rules:
      - "P1 if supply temperature rises above baseline or flow drops below baseline."
    additional_fields: ["Supply and return temperatures at T0 and at restore"]
    repair_evidence:
      - "Removed and installed pump assembly serials scanned."
    validation_class: ["CDU component (pump, filter, sensor)"]
    clock_stop: "BMS alarm cleared and pump failover test passed."
    stability_window_hours: 72
    recurrence_window_days: 14
    capacity_impact:
      gpus: 0
      states: []
    redundancy_exposure: true
  - id: "FC-LEAK"
    name: "Coolant leak alarm"
    service_unit_key: "Leak location (compute tray or rack manifold)"
    detection:
      source: "DS-REDFISH"
      signal: "LeakDetected from a tray or rack leak detector, or a BMS leak rope or spot sensor."
      t0_rule: "Earliest leak detection from any source (BMC or BMS)."
    recurrence_signal: "Any leak detection at the same location."
    default_priority: "P1"
    priority_rules: []
    additional_fields: ["Leak location", "Estimated fluid volume", "Containment time"]
    repair_evidence:
      - "Hose and quick-disconnect kit used, with location."
      - "Tray serials scanned if a tray was replaced."
    validation_class: ["Compute tray", "Rack manifold"]
    clock_stop: "Leak hold passed and affected capacity returned to service after validation."
    stability_window_hours: 72
    recurrence_window_days: 14
    capacity_impact:
      gpus: 4
      states: [{state: "Tray leak, tray drained", gpus: 4, factor: 1.0}, {state: "Manifold leak, rack drained", gpus: 72, factor: 1.0}]
    redundancy_exposure: false

# -----------------------------------------------------------------------------
# CAPACITY AND DOWNTIME ACCOUNTING
# -----------------------------------------------------------------------------
capacity_accounting:
  principle: >-
    Per-incident timers show how fast each fault was fixed. Capacity accounting
    shows how much compute the Customer actually lost across all incidents,
    including reopens and degraded operation. Both are measured.
  measure: "Capacity-Weighted GPU-Hours"
  states:
    - {state: "Drained or down in the scheduler", factor: 1.0, note: "Full loss."}
    - {state: "In service with a degraded back-end link", factor: 0.25, note: "One of four rails impaired."}
    - {state: "Rack NVLink domain degraded", factor: 1.0, note: "The rack cannot run a full 72-GPU job."}
    - {state: "Running without power or cooling redundancy", factor: 0.0, note: "No compute lost yet; tracked as Redundancy Exposure (KM-17)."}
  attribution: >-
    Lost capacity is Supplier-attributable from T0 while the next required action
    belongs to the Supplier. Time in an approved pause is attributed to the
    Customer. Time added by TR-1 (early failure) and TR-2 (reopen) is always
    Supplier-attributable.
  rollups:
    - {metric: "CSL-01", scope: "Fleet", description: "Total capacity delivered across all production racks."}
    - {metric: "CSL-12", scope: "Worst rack", description: "The floor: no single rack may fall below it, however good the fleet average looks."}
    - {metric: "KM-16", scope: "Each service unit", description: "Units that keep failing, measured by cumulative downtime in a rolling 30 days."}
    - {metric: "KM-17", scope: "Power and cooling", description: "Total hours running one failure away from an outage."}
    - {metric: "KM-18", scope: "Tickets", description: "How often repairs do not hold (TR-1 and TR-2 reopens)."}

# -----------------------------------------------------------------------------
# CRITICAL SERVICE LEVELS (credit-bearing)
#   direction: higher_is_better -> actual must be >= threshold
#              lower_is_better  -> actual must be <= threshold
# -----------------------------------------------------------------------------
performance_categories:
  - id: "CAT-AVAIL"
    name: "Availability and Restoration"
  - id: "CAT-QUALITY"
    name: "Repair Quality"
  - id: "CAT-DELIVERY"
    name: "Deployment Delivery"
  - id: "CAT-INTEGRITY"
    name: "Workforce and Record Integrity"

critical_service_levels:
  - id: "CSL-01"
    name: "Supplier-Attributable GPU Availability"
    category: "CAT-AVAIL"
    description: >-
      Share of installed production GPU-hours not lost to Supplier-Attributable
      Unavailability, using Capacity-Weighted GPU-Hours so degraded operation and
      reopened repairs count. Racks count as installed from Validated Handoff.
    numerator: "Installed production GPU-hours minus Supplier-attributable capacity-weighted GPU-hours lost"
    denominator: "Installed production GPU-hours"
    unit: "%"
    direction: "higher_is_better"
    expected: 99.5
    minimum: 99.0
    data_sources: ["DS-DCGM", "DS-SCHED", "DS-HEALTH", "DS-UFM", "DS-NMX", "DS-ITSM"]
    credit_allocation_pct: 30
  - id: "CSL-02"
    name: "P1 Engaged On-Site Within 15 Minutes"
    category: "CAT-AVAIL"
    description: "Share of P1 incidents where a qualified technician was Engaged On-Site within the target."
    numerator: "P1 incidents Engaged On-Site within 15 minutes of T0"
    denominator: "All P1 incidents"
    unit: "%"
    direction: "higher_is_better"
    expected: 100.0
    minimum: 95.0
    small_sample_rule:
      below_events: 20
      max_misses_before_minimum_default: 0
    data_sources: ["DS-BADGE", "DS-ITSM", "DS-DCGM", "DS-REDFISH", "DS-BMS"]
    credit_allocation_pct: 20
  - id: "CSL-03"
    name: "P1 Restoration Within 4 Hours"
    category: "CAT-AVAIL"
    description: "Share of P1 incidents reaching Validated RTS within 240 minutes of T0."
    numerator: "P1 incidents reaching Validated RTS within 240 minutes"
    denominator: "All P1 incidents"
    unit: "%"
    direction: "higher_is_better"
    expected: 95.0
    minimum: 90.0
    small_sample_rule:
      below_events: 20
      max_misses_before_minimum_default: 1
    data_sources: ["DS-DCGM", "DS-REDFISH", "DS-NMX", "DS-SCHED", "DS-BMS"]
    credit_allocation_pct: 30
  - id: "CSL-04"
    name: "P2 Restoration Within 8 Hours"
    category: "CAT-AVAIL"
    description: "Share of P2 incidents reaching Validated RTS within 480 minutes of T0."
    numerator: "P2 incidents reaching Validated RTS within 480 minutes"
    denominator: "All P2 incidents"
    unit: "%"
    direction: "higher_is_better"
    expected: 95.0
    minimum: 90.0
    data_sources: ["DS-DCGM", "DS-REDFISH", "DS-UFM", "DS-SCHED"]
    credit_allocation_pct: 15
  - id: "CSL-05"
    name: "P3 Restoration Within 24 Hours"
    category: "CAT-AVAIL"
    description: "Share of P3 incidents reaching Validated RTS within 1,440 minutes of T0."
    numerator: "P3 incidents reaching Validated RTS within 1,440 minutes"
    denominator: "All P3 incidents"
    unit: "%"
    direction: "higher_is_better"
    expected: 95.0
    minimum: 90.0
    data_sources: ["DS-DCGM", "DS-REDFISH", "DS-UFM", "DS-ITSM"]
    credit_allocation_pct: 5
  - id: "CSL-06"
    name: "First-Time Fix Rate"
    category: "CAT-QUALITY"
    description: >-
      Share of repairs that pass validation on the first attempt with no
      Same-Fault Recurrence within 7 days. For repairs late in a month, the
      7-day window closes in the following period and the result is finalized then.
    numerator: "Repairs meeting the First-Time Fix definition"
    denominator: "All repairs reaching Validated RTS in the period"
    unit: "%"
    direction: "higher_is_better"
    expected: 92.0
    minimum: 88.0
    data_sources: ["DS-DCGM", "DS-REDFISH", "DS-UFM", "DS-NMX", "DS-ITSM"]
    credit_allocation_pct: 25
  - id: "CSL-07"
    name: "Validated Return to Service"
    category: "CAT-QUALITY"
    description: "Share of units returned to production with complete Return-to-Service validation evidence."
    numerator: "Units returned to production with all required validation checks passed and recorded"
    denominator: "All units returned to production after Supplier work"
    unit: "%"
    direction: "higher_is_better"
    expected: 100.0
    minimum: 98.0
    data_sources: ["DS-DCGM", "DS-HEALTH", "DS-NMX", "DS-UFM", "DS-REDFISH"]
    credit_allocation_pct: 25
  - id: "CSL-08"
    name: "30-Day Repeat Failure Rate"
    category: "CAT-QUALITY"
    description: "Share of repaired units with any new fault within 30 days of Validated RTS."
    numerator: "Repaired units with a Repeat Failure"
    denominator: "Units reaching Validated RTS in the trailing window"
    unit: "%"
    direction: "lower_is_better"
    expected: 3.0
    minimum: 5.0
    data_sources: ["DS-DCGM", "DS-REDFISH", "DS-UFM", "DS-NMX"]
    credit_allocation_pct: 20
  - id: "CSL-09"
    name: "Deployment Milestone Adherence"
    category: "CAT-DELIVERY"
    description: "Share of racks reaching Validated Handoff by the committed date in the deployment plan."
    numerator: "Racks reaching Validated Handoff on or before the committed date"
    denominator: "Racks with a committed Validated Handoff date in the period"
    unit: "%"
    direction: "higher_is_better"
    expected: 95.0
    minimum: 90.0
    data_sources: ["DS-HEALTH", "DS-SCHED", "DS-REDFISH", "DS-ITSM"]
    credit_allocation_pct: 20
  - id: "CSL-10"
    name: "Qualified Staffing Fill Rate"
    category: "CAT-INTEGRITY"
    description: "Share of committed qualified-technician shift-hours actually staffed, verified by badge data."
    numerator: "Qualified technician hours present on site (badge-verified)"
    denominator: "Committed qualified technician shift-hours"
    unit: "%"
    direction: "higher_is_better"
    expected: 98.0
    minimum: 95.0
    data_sources: ["DS-BADGE", "DS-ITSM"]
    credit_allocation_pct: 20
  - id: "CSL-11"
    name: "Record Integrity"
    category: "CAT-INTEGRITY"
    description: >-
      Share of closed tickets whose recorded actions, parts, and timestamps
      reconcile with the Telemetry of Record (no Record Integrity Finding).
    numerator: "Closed tickets with no Record Integrity Finding"
    denominator: "All tickets closed in the period"
    unit: "%"
    direction: "higher_is_better"
    expected: 99.0
    minimum: 97.0
    data_sources: ["DS-REDFISH", "DS-DCGM", "DS-BADGE", "DS-ITSM", "DS-SPARES"]
    credit_allocation_pct: 20
  - id: "CSL-12"
    name: "Worst-Rack Availability"
    category: "CAT-AVAIL"
    description: >-
      Supplier-attributable availability of the single worst production rack. A
      fleet average can hide one rack that keeps failing, and an NVL72 rack is the
      Customer's large-job scheduling unit, so every rack must meet this floor.
    numerator: "The rack's installed GPU-hours minus its Supplier-attributable capacity-weighted GPU-hours lost"
    denominator: "The rack's installed GPU-hours (the lowest result across all production racks is reported)"
    unit: "%"
    direction: "higher_is_better"
    expected: 99.0
    minimum: 97.5
    data_sources: ["DS-DCGM", "DS-SCHED", "DS-HEALTH", "DS-UFM", "DS-NMX"]
    credit_allocation_pct: 20

