# -----------------------------------------------------------------------------
# RETURN-TO-SERVICE VALIDATION (what "fixed" means, per component class)
# -----------------------------------------------------------------------------
rts_validation:
  principle: >-
    A unit is not returned to production until every check for its component
    class has passed and the evidence is recorded in the ticket. Missing evidence
    counts as a failed validation for CSL-07.
  classes:
    - component: "Compute tray"
      check_ids: ["leak_hold_30m", "dcgm_diag_r3", "nvlink_domain", "nccl_allreduce_rack", "burn_in_1h"]
      checks:
        - "Serial number change recorded in Redfish inventory matches the ticket's parts record."
        - "Quick-disconnects verified seated; zero tray or rack leak alarms during a 30-minute post-insertion hold."
        - "GPU diagnostic (DCGM run level 3 or higher) passes on all 4 GPUs."
        - "NVLink domain healthy for the rack (IMEX domain up; all GPU NVLinks active)."
        - "Rack NCCL all-reduce bandwidth within 5% of the rack's baseline."
        - "1-hour burn-in with zero XID events (DCGM diagnostics cover the deeper stress test)."
    - component: "NVLink switch tray"
      check_ids: ["leak_hold_30m", "nmx_tray_health", "rack_nvlink_acceptance", "nccl_allreduce_rack"]
      checks:
        - "Serial number change recorded in Redfish inventory."
        - "NVLink fabric management reports the tray and all ports healthy."
        - "Full-rack NVLink acceptance and NCCL all-reduce within 5% of baseline."
        - "Zero leak alarms during a 30-minute hold."
    - component: "Optic, cable, or fiber"
      check_ids: ["fiber_inspection", "link_soak_30m"]
      checks:
        - "Fiber end faces inspected and cleaned (inspection record attached)."
        - "Port up with zero symbol errors and zero link-down events over a 30-minute soak."
        - "Pre-FEC bit error rate below the Customer threshold."
        - "Both link ends identified in the ticket (prevents fixing the wrong end)."
    - component: "Power shelf or PSU"
      check_ids: ["psu_redundancy"]
      checks:
        - "Redfish reports PSU health OK and redundancy restored."
        - "Serial number change recorded in inventory."
    - component: "CDU component (pump, filter, sensor)"
      check_ids: ["cdu_flow_baseline", "pump_failover_test"]
      checks:
        - "Flow, supply temperature, and return temperature within baseline."
        - "Pump redundancy confirmed by failover test, coordinated with the Facility Provider."
        - "All leak alarms clear; coolant conductivity and pH within specification after any fluid work."
    - component: "Rack manifold"
      check_ids: ["leak_hold_30m", "rack_nvlink_acceptance", "nccl_allreduce_rack"]
      checks:
        - "Manifold and every quick-disconnect inspected and verified seated; zero leak alarms during a 30-minute hold."
        - "Coolant conductivity and pH within specification after any fluid work."
        - "Full-rack NVLink acceptance and NCCL all-reduce within 5% of baseline."
        - "Every node in the rack returned to service only after the rack checks pass."
    - component: "E1.S drive or other storage media"
      check_ids: ["media_chain_of_custody", "node_health"]
      checks:
        - "Removed media logged into chain of custody (see Security)."
        - "Node health check passes and RAID or volume rebuilt."

# -----------------------------------------------------------------------------
# DEPLOYMENT MILESTONES (measured by CSL-09)
# -----------------------------------------------------------------------------
deployment:
  rack_cycle_target_days: 10
  surge:
    plus_25_pct_notice_hours: 72
    plus_100_pct_notice_business_days: 10
  milestones:
    - id: "M1"
      name: "Received and inspected"
      exit_criteria: "Shock and tilt indicators checked; no shipping damage; asset tags and serials reconciled to the ASN."
      target_days_from_receipt: 1
    - id: "M2"
      name: "Positioned and connected"
      exit_criteria: "Rack set and secured; power whips and manifold connected to the CDU."
      target_days_from_receipt: 3
    - id: "M3"
      name: "Leak test passed"
      exit_criteria: "Pressure hold at the OEM test pressure (typically 1.5x operating) for at least 30 minutes with no decay; zero leak alarms; coolant within specification."
      target_days_from_receipt: 4
    - id: "M4"
      name: "Power-on and firmware baseline"
      exit_criteria: "POST clean on all trays; firmware matches the Customer baseline; BMCs reachable on OOB."
      target_days_from_receipt: 5
    - id: "M5"
      name: "Network cabled and verified"
      exit_criteria: "Every back-end and front-end link up, error-free over soak, and matching the cabling plan."
      target_days_from_receipt: 7
    - id: "M6"
      name: "Burn-in accepted"
      exit_criteria: "GPU diagnostics, NVLink domain acceptance, NCCL benchmarks, and 24-hour burn-in all pass."
      target_days_from_receipt: 9
    - id: "M7"
      name: "Validated Handoff"
      exit_criteria: "Rack released to the Customer scheduler with the full acceptance record. CSL-09 is measured at this milestone."
      target_days_from_receipt: 10

# -----------------------------------------------------------------------------
# CHRONIC FAILURE AND TERMINATION
# -----------------------------------------------------------------------------
chronic_failure:
  triggers:
    - id: "CF-1"
      rule: "A Minimum Service Level Default on the same CSL in 3 consecutive Measurement Periods."
    - id: "CF-2"
      rule: "A Minimum Service Level Default on the same CSL in any 4 of 6 rolling Measurement Periods."
    - id: "CF-3"
      rule: "Total Service Level Credits over 50% of the cumulative At-Risk Amount in any rolling 6 Measurement Periods."
    - id: "CF-4"
      rule: "Any confirmed deliberate falsification of records."
  customer_rights:
    - "Terminate the affected services or the entire Site scope for cause, without termination charges."
    - "Require a Supplier executive-sponsored recovery plan within 10 business days."
    - "Step-in: the Customer or a third party may perform the affected services at the Supplier's cost during recovery."
  termination_assistance: >-
    The Supplier provides up to 6 months of transition assistance at the
    then-current service levels, including full transfer of performance data,
    procedures, and spares records to the successor.

# -----------------------------------------------------------------------------
# EXCUSED EVENTS
# -----------------------------------------------------------------------------
excused_events:
  claim_window_business_days: 5
  evidence_required: true
  events:
    - "Force majeure as defined in the Agreement."
    - "Failures of Facility Provider systems outside Supplier scope (the Supplier must still respond and notify)."
    - "Customer-caused delays, including withheld access or Customer-requested holds recorded in the ticket."
    - "Approved maintenance inside an approved change window, within the approved duration."
    - "OEM part unavailability, ONLY if Customer spares for that FRU class were at or above minimum stock and the Supplier notified the Customer within 4 hours."
  treatment: >-
    The excused occurrence is removed from both the numerator and the
    denominator of the affected service level. The rest of the Measurement
    Period is still measured.
  supplier_duty: "The Supplier must use commercially reasonable efforts to perform despite the Excused Event."

# -----------------------------------------------------------------------------
# ROOT CAUSE ANALYSIS AND CORRECTIVE ACTION
# -----------------------------------------------------------------------------
corrective_action:
  triggers:
    - "Any Expected or Minimum Service Level Default."
    - "Any Key Measurement miss."
    - "Any P1 incident."
    - "Any Lemon Unit."
    - "Any Record Integrity Finding."
    - "Any reopened ticket (TR-1 or TR-2)."
  rca_timelines:
    p1_preliminary_hours: 24
    p1_final_business_days: 5
    other_business_days: 10
  cap_requirements:
    - "Root cause stated in terms of process, people, parts, or tooling; not 'technician error' alone."
    - "Each action has a single named owner, a due date, and an evidence-of-completion definition."
    - "Effectiveness check: the triggering metric is reviewed for 2 Measurement Periods after closure."
  cap_overdue_escalation: "CAPs more than 10 business days overdue escalate to the monthly service review."

# -----------------------------------------------------------------------------
# GOVERNANCE CADENCE
# -----------------------------------------------------------------------------
governance:
  - forum: "Daily operations standup"
    frequency: "Daily, 15 minutes"
    attendees: "Supplier shift leads; Customer site lead"
    inputs: "Open P1 and P2 incidents, today's deployment plan, blockers, spares alerts."
  - forum: "Weekly operations review"
    frequency: "Weekly"
    attendees: "Supplier site manager; Customer site lead"
    inputs: "Automated weekly scorecard, breach severity log, CAP status, staffing, lemon units."
  - forum: "Monthly service review"
    frequency: "Monthly"
    attendees: "Supplier account manager; Customer DCO leadership"
    inputs: "Service Level Report, credits and earnback, chronic-failure watch, trends."
  - forum: "Quarterly business review"
    frequency: "Quarterly"
    attendees: "Supplier executive sponsor; Customer DCO leadership"
    inputs: "Trend analysis, SLA change proposals, roadmap and capacity plan, program-wide lessons learned."

# -----------------------------------------------------------------------------
# STAFFING AND QUALIFICATIONS
# -----------------------------------------------------------------------------
staffing:
  coverage: "24x7x365 on site"
  committed_per_shift:
    - shift: "Day (07:00 to 19:00 local)"
      technicians: 8
      shift_leads: 1
    - shift: "Night (19:00 to 07:00 local)"
      technicians: 5
      shift_leads: 1
  key_personnel:
    - "Site manager (named; replacement requires 30 days notice and Customer approval)"
    - "EHS coordinator"
    - "Spares and logistics coordinator"
  required_qualifications:
    - "OEM-authorized training for GB200 NVL72 field-replaceable unit service"
    - "Liquid-cooling handling, quick-disconnect service, and spill response"
    - "ESD control program training"
    - "Electrical safety training appropriate to the tasks performed"
    - "Lockout/tagout (hazardous energy control) training"
    - "Fiber inspection and cleaning"
    - "Customer site security and chain-of-custody procedures"
  qualification_rule: "Only badge-verified hours by technicians with current qualifications count toward CSL-10."

# -----------------------------------------------------------------------------
# CHANGE MANAGEMENT
# -----------------------------------------------------------------------------
change_management:
  rules:
    - "All non-emergency changes require Customer change approval before work starts."
    - "Standard changes (pre-approved runbook FRU swaps) may proceed under an open incident."
    - "Emergency changes require verbal approval from the Customer Incident Commander, recorded in the ticket within 1 hour."
    - "Work outside the approved window or scope is an unauthorized change and counts against KM-10."
  firmware: "Firmware may only be loaded from the Customer-approved baseline; any deviation is an unauthorized change."

# -----------------------------------------------------------------------------
# SECURITY AND CHAIN OF CUSTODY
# -----------------------------------------------------------------------------
security:
  requirements:
    - "Badge access only for Customer-approved personnel; no tailgating; visitors escorted at all times."
    - "Daily reconciliation of badge records against the shift roster."
    - "Storage media (e.g., E1.S drives) never leave the Site intact; media is sanitized or destroyed on site under the Customer's media sanitization standard, with a certificate per serial number."
    - "Every failed part is logged into chain of custody at removal, with serial, ticket, technician, and timestamp."
    - "Cameras and photography in the data hall are prohibited except for Customer-approved documentation."
  incident_reporting: "Suspected security incidents are reported to the Customer within 1 hour of discovery."

# -----------------------------------------------------------------------------
# ENVIRONMENTAL, HEALTH, AND SAFETY (EHS)
# -----------------------------------------------------------------------------
ehs:
  requirements:
    - "Every technician has stop-work authority and must use it for any unsafe condition."
    - "Hazardous energy control (lockout/tagout) for any work requiring de-energization."
    - "Electrical safety practices appropriate to the task and approach boundaries."
    - "ESD-safe handling for all electronic components."
    - "Spill kits staged at every CDU and at row ends; coolant spills handled per the site spill procedure."
    - "Mechanical lift and team-lift procedures for trays and racks (a fully loaded NVL72 rack weighs well over a metric ton)."
  reporting:
    injury_or_recordable_hours: 1
    near_miss_hours: 24
  treatment: >-
    EHS performance is not credit-bearing; safety must never be traded for
    speed. Any recordable injury or stop-work event triggers an internal S1
    severity and a joint review. Serious or repeated EHS failures are a
    material breach of the Agreement.

# -----------------------------------------------------------------------------
# SPARES AND RMA
# -----------------------------------------------------------------------------
spares:
  ownership: "Spares are Customer-owned and Supplier-managed."
  minimum_stock_per_hall:
    - fru: "Compute tray"
      minimum: 6
    - fru: "NVLink switch tray"
      minimum: 2
    - fru: "Power shelf"
      minimum: 4
    - fru: "PSU (5.5 kW)"
      minimum: 24
    - fru: "800G OSFP optic"
      minimum: 150
    - fru: "Fiber and DAC cable kits"
      minimum: 100
    - fru: "Manifold hose and quick-disconnect kit"
      minimum: 10
    - fru: "E1.S drive"
      minimum: 20
    - fru: "CDU pump assembly"
      minimum: 1
  reorder_rule: "Replenishment requests are raised automatically when stock reaches minimum plus lead-time demand."
  cycle_count: "Weekly cycle count of high-value FRUs; full count monthly."

# -----------------------------------------------------------------------------
# SLA CHANGE CONTROL AND CONTINUOUS IMPROVEMENT
# -----------------------------------------------------------------------------
sla_change_control:
  customer_rights:
    - "Promote a Key Measurement to a Critical Service Level, or demote a CSL, with 90 days notice (maximum 2 changes per contract year)."
    - "Reallocate credit allocation percentages with 90 days notice, within the pool and per-CSL caps."
    - "Add new service levels; targets are set from 6 months of measured baseline, or by mutual agreement."
  continuous_improvement: >-
    At each contract anniversary, the Expected and Minimum levels of each CSL
    tighten by 10% of the remaining gap to perfect performance, using the
    trailing 12 months of results, unless the parties agree otherwise.
  versioning: "Every change to this file is a new SLA version, reviewed through pull request and approved by both parties."

# -----------------------------------------------------------------------------
# INTERNAL BREACH SEVERITY INDEX
# Customer-internal: guides escalation. Not a contractual remedy and not shared
# with the Supplier.
# -----------------------------------------------------------------------------
breach_severity:
  internal_only: true
  purpose: >-
    Translates a breach into a single severity so readers immediately understand
    how serious it was. Severity is the worst level across all dimensions, then
    adjusted by aggravators.
  levels:
    - id: "S1"
      name: "Critical"
      rank: 4
      escalation: "Same-day notification to Customer DCO leadership; Supplier executive engaged within 24 hours; CAP within 5 business days; chronic-failure and contract-remedy review."
    - id: "S2"
      name: "Major"
      rank: 3
      escalation: "Formal CAP within 10 business days; reviewed jointly by Customer site lead and Supplier account manager; tracked to verified closure."
    - id: "S3"
      name: "Minor"
      rank: 2
      escalation: "Supplier RCA within 10 business days; discussed in the weekly operations review."
    - id: "S4"
      name: "Watch"
      rank: 1
      escalation: "Logged and trended in the weekly scorecard; no formal action unless it repeats."
  event_dimensions:
    overrun_pct:
      description: "How far past the target time the event ran: (actual - target) / target."
      bands:
        - {max: 10, level: "S4"}
        - {max: 50, level: "S3"}
        - {max: 200, level: "S2"}
        - {max: null, level: "S1"}
    gpu_hours_beyond_target:
      description: "GPU-hours lost after the target expired (GPUs affected x hours late). 72 GPU-hours = one NVL72 rack-hour."
      bands:
        - {max: 72, level: "S4"}
        - {max: 500, level: "S3"}
        - {max: 5000, level: "S2"}
        - {max: null, level: "S1"}
  period_rules:
    - condition: "met_expected"
      level: null
      description: "Expected level met; no breach."
    - condition: "below_expected"
      level: "S4"
      description: "Below Expected but at or above Minimum."
    - condition: "below_minimum"
      level: "S3"
      description: "Below Minimum (credit-bearing default)."
    - condition: "deep_below_minimum"
      level: "S2"
      description: "Below Minimum by more than the Expected-to-Minimum gap."
    - condition: "chronic"
      level: "S1"
      description: "Minimum default on the same CSL for 3 or more consecutive periods (chronic failure CF-1)."
  finding_types:
    - id: "clock_shift"
      name: "Ticket opened late (clock shift)"
      base_level: "S3"
      aggravators: ["AGG-INTEGRITY"]
      sla_refs: ["CSL-03", "CSL-04", "CSL-05", "CSL-11"]
      action: "Recalculate restoration from telemetry T0. Confirm the alerting integration opened the Ticket of Record at T0 and find out why the vendor ticket started later."
    - id: "ticket_split"
      name: "Ticket split to restart the clock"
      base_level: "S3"
      aggravators: ["AGG-INTEGRITY"]
      sla_refs: ["TR-1", "TR-2", "TR-6", "CSL-11"]
      action: "Merge the tickets under TR-6 and recalculate restoration from the original T0. Require an RCA on why the first repair did not hold."
    - id: "ghost_engagement"
      name: "On-site claim before badge-in"
      base_level: "S3"
      aggravators: ["AGG-INTEGRITY"]
      sla_refs: ["CSL-02", "KM-01", "CSL-11"]
      action: "Correct the engaged time from badge data. Review the record with the vendor site manager and agree on corrective steps for the technician."
    - id: "skipped_validation"
      name: "Returned to service without validation"
      base_level: "S2"
      aggravators: ["AGG-INTEGRITY"]
      sla_refs: ["CSL-07", "CSL-11"]
      action: "Drain the unit and run the full validation checklist now. Audit other returns by the same technician this period."
    - id: "unverified_swap"
      name: "Part swap not confirmed by inventory"
      base_level: "S2"
      aggravators: ["AGG-INTEGRITY"]
      sla_refs: ["CSL-11"]
      action: "Physically verify the serial in the slot. If the part was not replaced, reopen the ticket, replace it, and stop the RMA of the still-installed serial."
    - id: "phantom_fix"
      name: "Same fault recurred after a reseat"
      base_level: "S3"
      aggravators: ["AGG-REPEAT"]
      sla_refs: ["CSL-06", "CSL-08"]
      action: "Replace rather than reseat on any recurrence. Add a one-reseat-maximum rule to the break-fix runbook and require an RCA."
    - id: "wrong_end_optic"
      name: "Link errors continued after optic replacement"
      base_level: "S3"
      aggravators: ["AGG-REPEAT"]
      sla_refs: ["CSL-06", "CSL-08", "TR-2"]
      action: "Require inspection of both link ends before replacing an optic. Merge the follow-up ticket under TR-2."
    - id: "lemon_unit"
      name: "Repeat-failing unit not escalated"
      base_level: "S2"
      aggravators: []
      sla_refs: ["KM-09", "CSL-08"]
      action: "Remove the unit from service and open an OEM RMA. Find out why the lemon rule did not trigger an escalation."
    - id: "staffing_gap"
      name: "Rostered technicians not on site"
      base_level: "S3"
      aggravators: []
      sla_refs: ["CSL-10"]
      action: "Reconcile the roster against badge data with the vendor. Require a written coverage plan for the affected shift pattern."
    - id: "spares_drift"
      name: "Part used but not issued from spares"
      base_level: "S3"
      aggravators: []
      sla_refs: ["KM-06", "KM-07"]
      action: "Correct the ledger and recount the affected spares class. Enforce scan-to-issue before any part leaves the cage."
    - id: "unauthorized_change"
      name: "Change without an approved change record"
      base_level: "S2"
      aggravators: ["AGG-RACKWIDE"]
      sla_refs: ["KM-10"]
      action: "Verify firmware against the approved baseline and roll back if needed. Require a vendor RCA on the change-control breach."
  aggravators:
    - id: "AGG-REPEAT"
      description: "Same CSL or same Service Unit breached within the previous 30 days."
      effect: "bump"
      amount: 1
    - id: "AGG-RACKWIDE"
      description: "Breach affected an entire NVL72 rack or a CDU loop."
      effect: "floor"
      level: "S2"
    - id: "AGG-INTEGRITY"
      description: "Breach involved a Record Integrity Finding (vendor record contradicted by telemetry)."
      effect: "floor"
      level: "S1"
    - id: "AGG-EHS"
      description: "Breach involved an EHS recordable, stop-work event, or uncontained leak."
      effect: "floor"
      level: "S1"
    - id: "AGG-SECURITY"
      description: "Breach involved a security or chain-of-custody failure."
      effect: "floor"
      level: "S1"
