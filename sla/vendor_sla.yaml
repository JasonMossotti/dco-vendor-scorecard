# =============================================================================
# Partner-Operated Site Services: Service Level Agreement (SLA as Code)
# -----------------------------------------------------------------------------
# This file is the SINGLE SOURCE OF TRUTH for every service level, threshold,
# credit rule, and severity band used by the scorecard. The human-readable SLA
# document (docs/SLA.md) is GENERATED from this file by scripts/render_sla.py,
# so the contract text and the scoring engine can never disagree.
#
# MOCK DOCUMENT FOR PORTFOLIO DEMONSTRATION ONLY. All parties, sites, figures,
# and commercial terms are fictional and illustrative. Not legal advice. Not
# based on any real company's internal information or agreements.
# =============================================================================

