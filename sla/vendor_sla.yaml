    - id: "SU-SWITCH"
      name: "NVLink switch tray"
      gpus: 72
      note: "Treated as a rack-wide event until degraded operation is proven safe."
    - id: "SU-RACK"
      name: "NVL72 rack"
      gpus: 72
      note: "One NVLink domain; the Customer's smallest large-job scheduling unit."
    - id: "SU-CDU"
      name: "CDU loop"
      gpus: 576
      note: "Each CDU is the primary for one row of 8 racks on a shared N+1 secondary header; a loss of cooling can affect all of them."

commercial:
  currency: "USD"
  monthly_charges: 1850000
  at_risk_pct: 12
  pool_pct: 250
  max_allocation_per_csl_pct: 40
  measurement_period: "calendar month"
  scorecard_period: "ISO week (Monday 00:00 UTC to Sunday 23:59 UTC)"
  credit_application: "Credits appear on the invoice following the Measurement Period."
  doubling:
    consecutive_minimum_defaults: 3
    multiplier: 2
    note: "Doubled credits are not eligible for Earnback."
  earnback:
    enabled: true
    rule: >-
      Supplier earns back a Service Level Credit for a Critical Service Level if
      it meets or exceeds the Expected Service Level for that same Critical
      Service Level in each of the 3 Measurement Periods immediately following
      the default.
    following_periods_required: 3
    ineligible_when:
      - "The credit was doubled under the repeat-default rule."
      - "The default involved a confirmed Record Integrity finding (AGG-INTEGRITY)."
      - "The default involved an EHS or security event (AGG-EHS, AGG-SECURITY)."
  credits_sole_remedy: false
  credits_note: >-
    Service Level Credits are a price adjustment reflecting reduced service
    value. They are not a penalty and do not limit the Customer's other rights
    under the Agreement, including chronic failure termination rights.

# -----------------------------------------------------------------------------
# DEFINITIONS: precise terms prevent most SLA disputes.
# -----------------------------------------------------------------------------
definitions:
  - term: "Fault Detection Time (T0)"
    definition: >-
      The earliest timestamp at which a fault is evidenced by any Telemetry of
      Record source, a Supplier ticket, or a Customer notification, whichever is
      earliest. All restoration clocks start at T0.
  - term: "Acknowledge"
    definition: >-
      A qualified Supplier person has accepted the incident in the ticketing
      system and posted an initial assessment. Automated acknowledgments do not count.
  - term: "Engaged On-Site"
    definition: >-
      A qualified Supplier technician is physically at the affected equipment,
      as evidenced by badge access to the relevant data hall and a ticket work note.
  - term: "Containment"
    definition: >-
      For leak or safety incidents, the hazard is isolated and no longer
      spreading (e.g., affected loop isolated, fluid contained, area secured).
  - term: "Restore"
    definition: >-
      The affected Service Unit is returned to production, or an approved
      workaround returns the affected capacity to the Customer scheduler.
  - term: "Validated Return to Service (Validated RTS)"
    definition: >-
      Restore, plus complete evidence that every check in the Return-to-Service
      Validation Requirements for that component class passed. The restoration
      clock stops only at Validated RTS.
  - term: "Telemetry of Record"
    definition: >-
      The Customer-operated monitoring and inventory systems listed in the
      Measurement section. They are authoritative for all timing, inventory,
      and health measurements under this SLA.
  - term: "Supplier-Attributable Unavailability"
    definition: >-
      Time during which installed GPU capacity is unavailable and the next
      required action belongs to the Supplier (dispatch, diagnosis, repair,
      validation, or documentation).
  - term: "First-Time Fix"
    definition: >-
      A repair that reaches Validated RTS on the first attempt and does not
      experience a Same-Fault Recurrence within 7 days.
  - term: "Same-Fault Recurrence"
    definition: >-
      A new fault on the same Service Unit serial number in the same fault
      class (e.g., the same XID family, the same port, the same leak location).
  - term: "Repeat Failure"
    definition: >-
      Any fault on a Service Unit serial number within 30 days after it reached
      Validated RTS, regardless of fault class.
  - term: "Lemon Unit"
    definition: >-
      A Service Unit with 3 or more repair events within any rolling 30 days.
  - term: "Record Integrity Finding"
    definition: >-
      A closed ticket whose recorded actions or timestamps do not reconcile with
      the Telemetry of Record (e.g., a part swap claimed with no serial change in
      inventory, or a repair time that disagrees with telemetry by more than 15 minutes).
  - term: "GPU-Hours Lost"
    definition: >-
      The number of GPUs in the affected Service Unit multiplied by the hours of
      unavailability. Used for impact scoring; one NVL72 rack-hour equals 72 GPU-hours.
  - term: "Measurement Period"
    definition: "One calendar month. Performance is also tracked weekly for the operating scorecard."
  - term: "Expected Service Level"
    definition: >-
      The level of performance the Supplier is expected to deliver. Missing it
      triggers a root cause analysis but no credit.
  - term: "Minimum Service Level"
    definition: >-
      The floor of acceptable performance. Missing it is a Minimum Service Level
      Default and triggers a Service Level Credit.
  - term: "Excused Event"
    definition: >-
      An event listed in the Excused Events section, claimed by the Supplier on
      time and approved by the Customer, that removes the affected occurrence
      from the calculation of a service level.

  - term: "Ticket of Record"
    definition: >-
      The single ticket used to measure a fault on a Service Unit. It is opened
      automatically from telemetry, carries the original T0, and absorbs any early
      failure or reopen on the same unit (see Ticket Handling Rules).
  - term: "Service Unit Key"
    definition: >-
      The identifier that decides whether two faults hit the same thing: the host
      for a compute tray, the link (both ends) for a back-end link, the rack for an
      NVLink switch tray, the slot for a PSU or power shelf, the pump for a CDU, and
      the location for a leak.
  - term: "Stability Window"
    definition: >-
      The period after Validated RTS during which the repaired unit must run in
      production without a fault before its ticket can close. Set per fault class.
  - term: "Early Failure"
    definition: >-
      A fault on the same Service Unit Key within 60 minutes of Validated RTS. The
      earlier restore is treated as if it never happened.
  - term: "Capacity-Weighted GPU-Hours"
    definition: >-
      GPU-hours lost, weighted by how much of each GPU's capacity was unusable: 1.0
      when drained or down, a partial factor when running degraded (see Capacity
      and Downtime Accounting).
  - term: "Redundancy Exposure"
    definition: >-
      Time a power or cooling system runs without its designed redundancy. No
      compute is lost yet, but the next failure would cause an outage.

# -----------------------------------------------------------------------------
# SCOPE AND RESPONSIBILITY (break-fix ownership matrix)
# -----------------------------------------------------------------------------
scope:
  in_scope:
    - id: "SVC-BF"
      name: "Break-fix"
      description: >-
        Triage, diagnosis, and replacement of field-replaceable units (compute
        trays, NVLink switch trays, power shelves and PSUs, optics, cables, E1.S
        drives, fans, management components) using Customer-owned spares.
    - id: "SVC-DEP"
      name: "Deployment"
      description: >-
        Rack receiving, inspection, placement, power and liquid connection,
        leak testing, cabling, power-on, firmware baselining, and burn-in through
        Validated Handoff.
    - id: "SVC-LC"
      name: "Liquid-cooling operations (rack side)"
      description: >-
        Rack manifolds, quick-disconnects, tray-level leak response, and
        secondary-loop CDU monitoring and first response, in coordination with
        the Facility Provider.
    - id: "SVC-NET"
      name: "Physical network operations"
      description: >-
        Optic and cable replacement, fiber cleaning and inspection, port
        troubleshooting, and labeling for back-end, front-end, and OOB networks.
    - id: "SVC-RMA"
      name: "Spares and RMA logistics"
      description: >-
        Spares cage management, cycle counts, failed-part handling, chain of
        custody, and RMA shipment to the OEM.
    - id: "SVC-IR"
      name: "Incident response support"
      description: >-
        24x7 on-site response under the direction of the Customer Incident
        Commander, including post-incident data collection.
  out_of_scope:
    - "Building power, generators, UPS, and switchgear (Facility Provider)."
    - "Facility water plant and primary-side cooling (Facility Provider)."
    - "Logical configuration of Customer networks and workloads (Customer)."
    - "Board-level repair and OEM warranty adjudication (OEM)."
  raci_legend:
    R: "Responsible: performs the work"
    A: "Accountable: owns the outcome and approves"
    C: "Consulted"
    I: "Informed"
  raci_parties: ["Supplier", "Customer", "Facility Provider", "OEM"]
  raci:
    - component: "Compute tray (GPU, CPU, memory, cold plate)"
      Supplier: "R"
      Customer: "A"
      Facility Provider: "I"
      OEM: "C"
    - component: "NVLink switch tray and NVLink backplane"
      Supplier: "R"
      Customer: "A"
      Facility Provider: "I"
      OEM: "C"
    - component: "Power shelves and PSUs (in-rack)"
      Supplier: "R"
      Customer: "A"
      Facility Provider: "C"
      OEM: "C"
    - component: "Rack busbar, whips, and upstream PDUs and busway"
      Supplier: "C"
      Customer: "A"
